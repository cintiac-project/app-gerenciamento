        <div class="card-head"><h3>🎯 Objetivo da reunião</h3></div>
        <div class="card-pad">
          <textarea id="reu-obj" placeholder="Qual era o propósito desta reunião?"
            style="width:100%;min-height:64px;padding:10px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:13px">${esc(r.ata.objetivo||"")}</textarea>
        </div>
      </div>

      <div class="card" style="margin-bottom:14px">
        <div class="card-head"><h3>💬 Tópicos de discussão</h3>
          <button class="btn ghost sm" id="add-topico">+ Tópico</button></div>
        <div class="card-pad" id="topicos-list">${topicosHtml}</div>
      </div>
    </div>
  </div>

  <div style="height:18px"></div>
  <div class="card">
    <div class="card-head"><h3>📤 Saídas e entregas</h3>
      <button class="btn ghost sm" id="add-saida">+ Entrega</button></div>
    <datalist id="pessoas-saida">${pessoasSaidaDatalist.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
    <div class="table-wrap"><table><thead><tr>
      <th style="min-width:320px">Descrição da entrega</th><th style="width:170px">Responsável</th><th style="width:150px">Data prevista</th><th style="width:170px"></th>
    </tr></thead><tbody id="saidas-tbody">${saidasHtml}</tbody></table></div>
  </div>`;

  /* helpers para coletar e salvar */
  function coletarBasico(){
    r.data=$("#reu-data").value||null;
    r.hora=$("#reu-hora").value;
    r.titulo=$("#reu-titulo").value.trim();
    r.participantes=$("#reu-parts").value.split(/[,\n;]/).map(s=>s.trim()).filter(Boolean);
    r.transcricao=$("#reu-transc").value;
    r.anotacoes=$("#reu-anotacoes")? $("#reu-anotacoes").value : r.anotacoes;
    r.ata.objetivo=$("#reu-obj").value;
    // resumo automático (editável)
    c.querySelectorAll(".res-real").forEach(t=>{ const i=+t.dataset.i; if(r.resumoRealizadas[i]!==undefined) r.resumoRealizadas[i]=t.value; });
    c.querySelectorAll(".res-prox").forEach(t=>{ const i=+t.dataset.i; if(r.resumoProximas[i]!==undefined) r.resumoProximas[i]=t.value; });
    // tópicos
    c.querySelectorAll(".reu-tema").forEach(inp=>{
      const i=+inp.dataset.i; if(r.ata.topicos[i]) r.ata.topicos[i].tema=inp.value;
    });
    c.querySelectorAll(".reu-notas").forEach(t=>{
      const i=+t.dataset.i; if(r.ata.topicos[i]) r.ata.topicos[i].notas=t.value;
    });
    // saidas
    c.querySelectorAll(".sai-desc").forEach(inp=>{
      const i=+inp.dataset.i; if(r.ata.saidas[i]) r.ata.saidas[i].descricao=inp.value;
    });
    c.querySelectorAll(".sai-resp").forEach(inp=>{
      const i=+inp.dataset.i; if(r.ata.saidas[i]) r.ata.saidas[i].responsavel=inp.value;
    });
    c.querySelectorAll(".sai-data").forEach(inp=>{
      const i=+inp.dataset.i; if(r.ata.saidas[i]) r.ata.saidas[i].dataEntrega=inp.value;
    });
  }

  /* ressincroniza o responsável das atividades do cronograma já criadas a
     partir de uma saída/entrega, sempre que a reunião é salva — assim, se o
     nome em "Responsável" na Ata for corrigido/preenchido depois de a
     atividade já existir no cronograma, o campo é atualizado automaticamente
     sem precisar editar a atividade manualmente.
     Só faz isso em projetos SEM Matriz RACI (ex.: Rotinas): é lá que o campo
     "responsaveisIds" é o responsável oficial da atividade. Em projetos COM
     RACI, esse campo não aparece na tela "Editar atividade" — gravá-lo aqui
     deixava um valor "grudado" e invisível, que nunca era atualizado quando o
     usuário trocava o responsável em "Horas previstas por colaborador" ou na
     própria Matriz RACI. Em projetos com RACI, o responsável correto deve ser
     ajustado na aba RACI (marcando "R" na pessoa certa). */
  async function ressincronizarResponsaveis(){
    const semRaciProjeto = !!(cfgSessao(p.sessaoId).abasOcultas||[]).includes("raci");
    if(!semRaciProjeto) return;
    if(!editaAtividadeCompleta()) return;   // Equipe não troca o responsável de outras pessoas
    for(const s of r.ata.saidas){
      if(!s.atividadeId) continue;
      const ativ=DB.data.atividades.find(x=>x.id===s.atividadeId);
      if(!ativ) continue;
      const idsResp=matchPessoasPorNomes(s.responsavel,p);
      const atual=Array.isArray(ativ.responsaveisIds)?ativ.responsaveisIds:[];
      const mudou=idsResp.length!==atual.length || idsResp.some(id=>!atual.includes(id));
      if(mudou && idsResp.length){
        ativ.responsaveisIds=idsResp;
        await sbUpdate("atividades", ativ.id, toSnake({responsaveisIds:idsResp}));
      }
    }
  }

  /* salva a reunião inteira (ata é jsonb, então um update já basta) */
  async function persistirReuniao(){
    // se a data mudou depois que a reunião foi marcada com "OK", reativa o
    // alerta — presume-se que uma reunião reagendada precisa aparecer de novo
    if(r.data!==dataAoAbrir && r.alertaDispensado) r.alertaDispensado=false;
    await sbUpdate("reunioes", r.id, toSnake({
      data: r.data, hora: r.hora, titulo: r.titulo,
      participantes: r.participantes, transcricao: r.transcricao, ata: r.ata,
      anotacoes: r.anotacoes, resumoRealizadas: r.resumoRealizadas, resumoProximas: r.resumoProximas,
      resumoDe: r.resumoDe, resumoAte: r.resumoAte, alertaDispensado: r.alertaDispensado||false
    }));
    await ressincronizarResponsaveis();
  }

  $("#reu-del").onclick=()=>excluirReuniao(p,r.id);
  if(!podeExcluirDados()) $("#reu-del").style.display="none";
  $("#reu-back").onclick=async()=>{ coletarBasico(); await persistirReuniao(); ST.reuniaoId=null; render(); };
  $("#reu-save").onclick=async()=>{ coletarBasico(); await persistirReuniao(); toast("Reunião salva."); reuniaoDetalhe(c,p,r); };
  $("#reu-export").onclick=async()=>{ coletarBasico(); await persistirReuniao(); exportarAta(p,r); };
  $("#add-topico").onclick=async()=>{ coletarBasico(); r.ata.topicos.push({tema:"",notas:""}); await persistirReuniao(); reuniaoDetalhe(c,p,r); };
  $("#add-saida").onclick=async()=>{ coletarBasico(); r.ata.saidas.push({descricao:"",responsavel:"",dataEntrega:""}); await persistirReuniao(); reuniaoDetalhe(c,p,r); };
  $("#reu-ia").onclick=async()=>{ coletarBasico(); await persistirReuniao(); gerarAtaIA(p,r); };
  $("#add-res-real").onclick=async()=>{ coletarBasico(); r.resumoRealizadas.push(""); await persistirReuniao(); reuniaoDetalhe(c,p,r); };
  $("#add-res-prox").onclick=async()=>{ coletarBasico(); r.resumoProximas.push(""); await persistirReuniao(); reuniaoDetalhe(c,p,r); };
  c.querySelectorAll(".res-real-rm").forEach(b=>b.onclick=async()=>{
    coletarBasico(); r.resumoRealizadas.splice(+b.dataset.i,1); await persistirReuniao(); reuniaoDetalhe(c,p,r);
  });
  c.querySelectorAll(".res-prox-rm").forEach(b=>b.onclick=async()=>{
    coletarBasico(); r.resumoProximas.splice(+b.dataset.i,1); await persistirReuniao(); reuniaoDetalhe(c,p,r);
  });
  $("#reu-resumo-regenerar").onclick=async()=>{
    coletarBasico();
    const resumo=gerarResumoAutomatico(p, r.data||todayStr());
    r.resumoRealizadas=resumo.realizadas; r.resumoProximas=resumo.proximas;
    r.resumoDe=resumo.de; r.resumoAte=resumo.ate;
    await persistirReuniao();
    toast("Resumo recalculado a partir dos dados atuais.");
    reuniaoDetalhe(c,p,r);
  };
  $("#reu-resumo-ppt").onclick=async()=>{
    coletarBasico();
    await persistirReuniao();
    exportarChecklistPPT(p,r);
  };
  c.querySelectorAll("[data-rmtop]").forEach(b=>b.onclick=async()=>{
    coletarBasico(); r.ata.topicos.splice(+b.dataset.rmtop,1); await persistirReuniao(); reuniaoDetalhe(c,p,r);
  });
  c.querySelectorAll("[data-rmsai]").forEach(b=>b.onclick=async()=>{
    coletarBasico(); r.ata.saidas.splice(+b.dataset.rmsai,1); await persistirReuniao(); reuniaoDetalhe(c,p,r);
  });
  // criar atividade no cronograma a partir da saída
  c.querySelectorAll("[data-mksai]").forEach(b=>b.onclick=async()=>{
    coletarBasico();
    const i=+b.dataset.mksai;
    const s=r.ata.saidas[i];
    if(!s.descricao){ toast("Preencha a descrição antes de criar a atividade."); return; }
    const cat=DB.data.categorias[0];
    const novaAtiv={
      id:uid(), projetoId:p.id, nome:s.descricao,
      categoriaId:cat?cat.id:null,
      dataInicioPrev:r.data||todayStr(),
      dataFimPrev:s.dataEntrega||null,
      progresso:0, status:"Não iniciada"
    };
    // mapeia o(s) nome(s) digitado(s) em "Responsável" (pode ter mais de uma
    // pessoa, separadas por vírgula) para pessoas cadastradas. Isso só é
    // gravado em "responsaveisIds" para projetos SEM Matriz RACI (ex.:
    // Rotinas) — é esse campo que essas sessões usam para exibir e calcular
    // o responsável de uma atividade. Em projetos COM RACI, esse campo fica
    // oculto na tela "Editar atividade", então gravá-lo aqui deixaria um
    // responsável "grudado" e impossível de corrigir por lá; nesses projetos
    // o responsável deve ser ajustado na aba RACI (marcando "R").
    const semRaciProjeto = !!(cfgSessao(p.sessaoId).abasOcultas||[]).includes("raci");
    if(semRaciProjeto){
      const idsResp=pessoasQueEuPossoAtribuir(matchPessoasPorNomes(s.responsavel,p));
      if(idsResp.length) novaAtiv.responsaveisIds=idsResp;
    }
    DB.data.atividades.push(novaAtiv);
    s.atividadeId=novaAtiv.id;
    await sbInsert("atividades", toSnake(novaAtiv));
    await persistirReuniao();
    toast("Atividade criada no cronograma."); reuniaoDetalhe(c,p,r);
  });
  if(!podeEditarDados()) reuniaoSomenteLeitura(c,p,r);
}

/* Reunião aberta por quem não edita (perfil Colaborador): tudo só para leitura,
   sem gravar nada ao voltar ou exportar. */
function reuniaoSomenteLeitura(c,p,r){
  ["reu-save","reu-ia","reu-del","add-topico","add-saida","add-res-real","add-res-prox","reu-resumo-regenerar"]
    .forEach(id=>{ const b=document.getElementById(id); if(b) b.style.display="none"; });
  c.querySelectorAll("[data-rmtop],[data-rmsai],[data-mksai],.res-real-rm,.res-prox-rm").forEach(b=>b.style.display="none");
  c.querySelectorAll("input,textarea,select").forEach(el=>{ el.readOnly=true; if(el.tagName==="SELECT"||el.type==="checkbox") el.disabled=true; });
  const back=document.getElementById("reu-back"); if(back) back.onclick=()=>{ ST.reuniaoId=null; render(); };
  const exp=document.getElementById("reu-export"); if(exp) exp.onclick=()=>exportarAta(p,r);
  const ppt=document.getElementById("reu-resumo-ppt"); if(ppt) ppt.onclick=()=>exportarChecklistPPT(p,r);
}

/* ---- GERAR ATA COM IA (via prompt copiável) ---- */
function gerarAtaIA(p,r){
  const transc=(r.transcricao||"").trim();
  const anotacoes=(r.anotacoes||"").trim();
  const realizadas=(r.resumoRealizadas||[]).filter(Boolean);
  const proximas=(r.resumoProximas||[]).filter(Boolean);
  const contextoResumo=(realizadas.length||proximas.length)? `
CONTEXTO — RESUMO DO PERÍODO (gerado automaticamente pelo sistema, use como pano de fundo, não copie literalmente):
Atividades realizadas desde a última reunião:
${realizadas.length? realizadas.map(x=>"- "+x).join("\n") : "- (nenhuma registrada)"}
Próximas atividades previstas até esta reunião:
${proximas.length? proximas.map(x=>"- "+x).join("\n") : "- (nenhuma registrada)"}
` : "";
  const contextoAnotacoes=anotacoes? `
CONTEXTO — ANOTAÇÕES FEITAS DURANTE A REUNIÃO (use como fonte adicional de informação, com a mesma prioridade da transcrição):
"""
${anotacoes}
"""
` : "";
  // monta o prompt a partir de um texto de transcrição informado — permite
  // recalcular o prompt ao vivo quando a transcrição é colada/editada
  // diretamente aqui no modal, sem precisar fechar e editar a reunião.
  function montarPrompt(textoTranscricao){
    const t=(textoTranscricao||"").trim();
    return `Você é um assistente de gestão de projetos. Receberá a TRANSCRIÇÃO de uma reunião (e, quando disponível, anotações feitas ao vivo e um resumo automático do período) e deve produzir uma ata estruturada em JSON.

Retorne APENAS um objeto JSON válido, sem comentários, sem texto antes ou depois, sem markdown ou cercas de código. O JSON deve seguir EXATAMENTE este formato:

{
  "objetivo": "frase curta descrevendo o objetivo da reunião",
  "topicos": [
    { "tema": "título curto do tópico", "notas": "resumo das discussões e decisões sobre este tópico" }
  ],
  "saidas": [
    { "descricao": "atividade ou entrega acordada", "responsavel": "nome do responsável", "dataEntrega": "AAAA-MM-DD ou string vazia se não definida" }
  ]
}

Regras:
- Identifique de 3 a 8 tópicos relevantes discutidos.
- Liste TODAS as entregas/ações acordadas na reunião, com responsável (se mencionado) e data (se mencionada).
- Use o formato AAAA-MM-DD para datas. Se não houver data definida, use "".
- Seja objetivo e fiel ao conteúdo da transcrição e das anotações. Não invente informações.
- Idioma: português do Brasil.
${contextoResumo}${contextoAnotacoes}
TRANSCRIÇÃO:
"""
${t||"(cole a transcrição da reunião no campo acima)"}
"""`;
  }
  const prompt=montarPrompt(transc);

  $("#modal-root").innerHTML=`
  <div class="overlay"><div class="modal wide">
    <div class="modal-head"><h3>✨ Gerar ata com IA</h3>
      <button class="btn-icon" id="ia-x">✕</button></div>
    <div class="modal-body">
      <div class="help-banner" style="margin-bottom:14px"><span>ℹ️</span><span><b>Como funciona:</b> 1) Cole a transcrição da reunião abaixo (ou edite a que já estava salva). 2) Copie o prompt, já atualizado com ela. 3) Cole em qualquer ferramenta de IA (Claude, ChatGPT, Gemini…). 4) Copie a resposta JSON e cole no campo indicado. 5) Clique em <b>Aplicar ata</b>.</span></div>

      <div class="fld full" style="margin-bottom:14px">
        <label>1️⃣ Transcrição da reunião</label>
        <textarea id="ia-transc" placeholder="Cole aqui o texto da transcrição (ou notas brutas) da reunião…"
          style="width:100%;min-height:140px;padding:11px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;line-height:1.5">${esc(transc)}</textarea>
        <span class="help">Colar aqui atualiza automaticamente o prompt abaixo. Ao aplicar a ata, este texto também é salvo como a transcrição da reunião.</span>
      </div>

      <div class="fld full" style="margin-bottom:14px">
        <label>2️⃣ Prompt para a IA <button class="btn ghost sm" id="ia-copy" style="margin-left:10px">📋 Copiar prompt</button></label>
        <textarea id="ia-prompt" readonly style="width:100%;min-height:160px;padding:11px;border:1px solid var(--line);border-radius:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#f8fafb">${esc(prompt)}</textarea>
      </div>

      <div class="fld full">
        <label>3️⃣ Cole aqui a resposta JSON da IA</label>
        <textarea id="ia-resp" placeholder='Cole aqui o JSON retornado pela IA. Ex.: {"objetivo":"…","topicos":[…],"saidas":[…] }'
          style="width:100%;min-height:170px;padding:11px;border:1px solid var(--line);border-radius:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px"></textarea>
        <span class="help">A ata atual (se houver) será substituída pela nova. Você poderá editar tudo depois.</span>
        <div id="ia-err" style="display:none;color:var(--danger);font-size:12px;margin-top:6px;font-weight:600"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="ia-cancel">Cancelar</button>
      <button class="btn" id="ia-apply">Aplicar ata</button>
    </div></div></div>`;

  $("#ia-x").onclick=closeModal;
  $("#ia-cancel").onclick=closeModal;
  $("#ia-transc").oninput=e=>{ $("#ia-prompt").value=montarPrompt(e.target.value); };
  $("#ia-copy").onclick=()=>{
    const ta=$("#ia-prompt"); ta.select();
    try{ document.execCommand("copy"); toast("Prompt copiado para a área de transferência."); }
    catch(e){
      if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(()=>toast("Prompt copiado."));
      else toast("Selecione manualmente e copie (Ctrl+C).");
    }
    window.getSelection().removeAllRanges();
  };
  $("#ia-apply").onclick=async()=>{
    const raw=$("#ia-resp").value.trim();
    const err=$("#ia-err"); err.style.display="none";
    if(!raw){ err.textContent="Cole a resposta JSON da IA antes de aplicar."; err.style.display="block"; return; }
    // tenta extrair JSON mesmo com texto extra
    let jsonStr=raw;
    const m=raw.match(/\{[\s\S]*\}/);
    if(m) jsonStr=m[0];
    let parsed;
    try{ parsed=JSON.parse(jsonStr); }
    catch(e){ err.textContent="Não foi possível interpretar o JSON. Verifique se está no formato correto."; err.style.display="block"; return; }
    // valida e aplica
    // preserva o vínculo com atividades do cronograma já criadas a partir de
    // uma saída anterior (mesma descrição), para que reaplicar a ata (ex.:
    // depois de editar a transcrição) não "perca" a atividade já existente
    // nem crie uma atividade duplicada no cronograma.
    const saidasAnteriores=(r.ata&&Array.isArray(r.ata.saidas))?r.ata.saidas:[];
    const ata={
      objetivo: typeof parsed.objetivo==="string"?parsed.objetivo:"",
      topicos: Array.isArray(parsed.topicos)? parsed.topicos.map(t=>({tema:String(t.tema||""),notas:String(t.notas||"")})):[],
      saidas: Array.isArray(parsed.saidas)? parsed.saidas.map(s=>{
        const descricao=String(s.descricao||"");
        const anterior=saidasAnteriores.find(x=>x.atividadeId && normTxt(x.descricao)===normTxt(descricao));
        return {
          descricao,
          responsavel:String(s.responsavel||""),
          dataEntrega:String(s.dataEntrega||""),
          ...(anterior?{atividadeId:anterior.atividadeId}:{})
        };
      }):[],
      // atribui à ata, no momento em que é gerada por IA, as anotações feitas
      // ao vivo e o resumo do período usado como contexto — fica registrado
      // permanentemente junto da ata, mesmo que o campo de anotações mude depois.
      anotacoes: r.anotacoes||"",
      resumoRealizadas: (r.resumoRealizadas||[]).filter(Boolean),
      resumoProximas: (r.resumoProximas||[]).filter(Boolean)
    };
    r.ata=ata;
    r.transcricao=$("#ia-transc").value; // salva também a transcrição colada/editada aqui no modal
    await sbUpdate("reunioes", r.id, { ata, transcricao:r.transcricao });
    closeModal();
    toast("Ata aplicada com sucesso. Edite os campos conforme necessário.");
    render();
  };
}

/* ============================================================
   VIEW: FINANCEIRO (GLOBAL)
   ============================================================ */
function viewFinanceiro(v){
  setTopAction(`<button class="btn">+ Novo lançamento</button>`,()=>formFinanceiro());
  if(!DB.data.projetos.length){
    v.innerHTML=`<div class="card"><div class="empty"><span class="ic">₿</span>
      <h3>Cadastre um projeto</h3><p>Os lançamentos financeiros são vinculados a projetos.</p></div></div>`;
    return;
  }
  ST.search.fin=ST.search.fin||{proj:"",tipo:"",status:""};
  const f=ST.search.fin;
  let lista=DB.data.financeiro.slice();
  if(f.proj) lista=lista.filter(x=>x.projetoId===f.proj);
  if(f.tipo) lista=lista.filter(x=>x.tipo===f.tipo);
  if(f.status) lista=lista.filter(x=>x.status===f.status);
  lista.sort((a,b)=>(b.data||"").localeCompare(a.data||""));

  const receitas=lista.filter(x=>x.tipo==="receita").reduce((s,x)=>s+(+x.valor||0),0);
  const despesas=lista.filter(x=>x.tipo==="despesa").reduce((s,x)=>s+(+x.valor||0),0);

  const rows=lista.map(x=>{
    const venc=x.status==="previsto"&&x.data&&daysBetween(todayStr(),x.data)<0;
    return `<tr>
    <td style="font-size:12px">${fmtDate(x.data)}</td>
    <td>${esc(nomeProjeto(x.projetoId))}</td>
    <td><span class="badge ${x.tipo==="receita"?"b-ok":"b-danger"}">${x.tipo==="receita"?"Receita":"Despesa"}</span></td>
    <td>${esc(x.descricao||"—")}<div style="font-size:11px;color:var(--ink-faint)">${esc(nomeRubrica(x.rubricaId))}</div></td>
    <td>${venc?'<span class="badge b-danger">Vencido</span>':statusBadge(x.status==="realizado"?"Realizado":"Previsto")}</td>
    <td class="num" style="color:${x.tipo==="receita"?"var(--ok)":"var(--danger)"};font-weight:600">${x.tipo==="receita"?"+":"−"}${fmtBRL(x.valor)}${detalheQtdValor(x)}</td>
    <td class="actions"><button class="btn-icon" data-edf="${x.id}">✎</button>
      ${podeExcluirDados()?`<button class="btn-icon del" data-dlf="${x.id}">🗑</button>`:""}</td></tr>`;
  }).join("");

  v.innerHTML=`

function viewEquipe(v){
  // Liderança e Equipe com a área Equipe veem as pessoas e incluem/editam
  // parceiros externos; pessoas internas e perfis, só o Gestor. Custo/hora,
  // só para quem tem Financeiro.
  const gestor=isGestor(), verCusto=temArea("financeiro");
  if(podeEditarDados()) setTopAction(`<button class="btn">+ Nova pessoa</button>`,()=>formColab());
  if(!gestor){
    rowsForPerfil(v, verCusto);
    return;
  }
  // botão secundário para sincronizar usuários que entraram sem profile
  // (usa insertAdjacentHTML, não innerHTML+=, para não recriar o botão
  // "+ Nova pessoa" já existente e destruir o onclick que acabou de ser
  // atribuído a ele em setTopAction acima)
  const topbar=document.getElementById("topbar-actions");
  if(topbar) topbar.insertAdjacentHTML("beforeend",`<button class="btn ghost" id="btn-sync-users" style="margin-left:6px">↻ Sincronizar usuários</button>`);
  const internos=getInternos();
  const parceiros=getParceiros();
  function nomesProjetosVinculados(c){
    const diretos=DB.data.projetos.filter(p=>(c.projetosIds||[]).includes(p.id));
    const viaStakeholder=DB.data.projetos.filter(p=>
      !((c.projetosIds||[]).includes(p.id)) &&
      (p.stakeholders||[]).some(s=>s.classificacao==="Primário" && s.colaboradorVinculadoId===c.id));
    const todos=[...diretos,...viaStakeholder];
    return todos.length ? todos.map(p=>esc(p.nome)).join(", ") : '<span style="color:var(--ink-faint)">nenhum</span>';
  }
  function rowsFor(list, showProjetos){
    return list.map(c=>{
      const h=horasConsolidadas().filter(x=>x.colaboradorId===c.id).reduce((s,x)=>s+(+x.horas||0),0);
      return `<tr>
        <td style="font-weight:600">${esc(c.nome)}${c.tipo!=="parceiro"?`<div style="font-size:11px;color:var(--ink-faint);font-weight:400">${esc(rotuloPerfil(c.papel))}</div>`:""}</td>
        <td>${esc(c.cargo||"—")}</td>
        <td style="font-size:12px;color:var(--ink-soft)">${esc(c.organizacao||"—")}</td>
        <td style="font-size:12px;color:var(--ink-soft)">${esc(c.email||"—")}</td>
        <td class="num">${c.custoHora?fmtBRL(c.custoHora):"—"}</td>
        <td class="num">${c.tipo==="parceiro"?'<span style="color:var(--ink-faint)">n/a</span>':fmtH(h)}</td>
        ${showProjetos?`<td style="font-size:12px;color:var(--ink-soft);max-width:220px">${nomesProjetosVinculados(c)}</td>`:""}
        <td class="actions"><button class="btn-icon" data-edc="${c.id}">✎</button>
          <button class="btn-icon del" data-dlc="${c.id}">🗑</button></td></tr>`;
    }).join("");
  }
  const headers=`<tr><th>Nome</th><th>Cargo</th><th>Organização</th><th>E-mail</th>
    <th class="num">Custo/hora</th><th class="num">Horas totais</th><th></th></tr>`;
  const headersParceiros=`<tr><th>Nome</th><th>Cargo</th><th>Organização</th><th>E-mail</th>
    <th class="num">Custo/hora</th><th class="num">Horas totais</th><th>Projetos vinculados (RACI)</th><th></th></tr>`;

  let html="";
  if(!internos.length && !parceiros.length){
    html=`<div class="card"><div class="empty"><span class="ic">◍</span><h3>Nenhuma pessoa cadastrada</h3>
     <p>Cadastre <b>colaboradores internos</b> (sua equipe) e <b>parceiros externos</b> (que participam mas não recebem nem acessam o app).</p>
     <button class="btn" id="nc2">+ Adicionar pessoa</button></div></div>`;
  }else{
    html=`
    <div class="card" style="margin-bottom:18px">
      <div class="card-head"><h3>Equipe interna <span class="tag" style="margin-left:6px">${internos.length}</span></h3>
        <span class="hint">Apontam horas, têm custo e podem acessar o app</span></div>
      ${internos.length?`<div class="table-wrap"><table><thead>${headers}</thead>
        <tbody>${rowsFor(internos)}</tbody></table></div>`
        :`<div style="padding:24px;color:var(--ink-faint);font-size:13px;text-align:center">Nenhum colaborador interno.</div>`}
    </div>
    <div class="card">
      <div class="card-head"><h3>Parceiros externos <span class="tag" style="margin-left:6px;background:#fff1cf;color:#9a5b00">${parceiros.length}</span></h3>
        <span class="hint">Participam da RACI · sem remuneração · sem acesso ao app</span></div>
      ${parceiros.length?`<div class="table-wrap"><table><thead>${headersParceiros}</thead>
        <tbody>${rowsFor(parceiros, true)}</tbody></table></div>`
        :`<div style="padding:24px;color:var(--ink-faint);font-size:13px;text-align:center">Nenhum parceiro cadastrado.</div>`}
    </div>`;
  }
  v.innerHTML=html;
  if($("#nc2")) $("#nc2").onclick=()=>formColab();
  v.querySelectorAll("[data-edc]").forEach(b=>b.onclick=()=>formColab(getColab(b.dataset.edc)));
  // sincronizar usuários sem profile
  const btnSync=$("#btn-sync-users");
  if(btnSync) btnSync.onclick=async()=>{
    btnSync.disabled=true; btnSync.textContent="Verificando...";
    try{
      // busca todos os profiles existentes
      const profiles = await sbFetch("profiles?select=id");
      const idsComProfile=new Set((profiles||[]).map(p=>p.id));
      // busca a sessão atual para saber o id do próprio usuário
      const { data:{ session } } = await sb.auth.getSession();
      // se o próprio usuário logado não tem profile, cria
      if(session && !idsComProfile.has(session.user.id)){
        const nome=session.user.user_metadata?.nome||session.user.email?.split("@")[0]||"Usuário";
        await sbInsert("profiles", {
          id:session.user.id, nome, papel:"gestor", tipo_pessoa:"interno"
        });
        toast("Seu perfil foi criado. Recarregando...");
        await DB.load(); render(); return;
      }
      toast("Todos os usuários conectados já possuem perfil. Se ainda falta alguém, peça que essa pessoa faça login — o perfil será criado automaticamente.");
    }catch(e){
      toast("Erro ao sincronizar: "+(e.message||e));
    }
    btnSync.disabled=false; btnSync.textContent="↻ Sincronizar usuários";
  };
  v.querySelectorAll("[data-dlc]").forEach(b=>b.onclick=()=>{
    const c=getColab(b.dataset.dlc);
    const ehInterno = c.tipo!=="parceiro";
    if(ehInterno){
      confirmar(`Remover "${c.nome}"?`,
        "Isto remove o acesso da pessoa ao app por completo (login revogado). Apontamentos de horas já feitos serão mantidos.",
        async()=>{
          const ok = await removerUsuarioCompleto(c.id);
          if(!ok) return; // erro já avisado dentro da função
          DB.data.colaboradores=DB.data.colaboradores.filter(x=>x.id!==c.id);
          toast("Removido."); render();
        });
      return;
    }
    // parceiro externo: sempre pergunta se também deve remover apontamentos
    // de horas e referências na Matriz RACI vinculados a ele.
    confirmarComOpcao(
      `Remover "${c.nome}"?`,
      "Este parceiro externo será removido do cadastro de equipe.",
      "Também excluir os apontamentos de horas e as referências deste parceiro na Matriz RACI de todos os projetos",
      async(removerTudo)=>{
        await sbDelete("profiles", c.id);
        if(removerTudo){
          // remove apontamentos de horas deste parceiro
          const horasDoParceiro = DB.data.horas.filter(h=>h.colaboradorId===c.id);
          for(const h of horasDoParceiro){
            await sbDelete("horas", h.id);
          }
          DB.data.horas = DB.data.horas.filter(h=>h.colaboradorId!==c.id);
          // remove as referências dele na Matriz RACI, em todos os projetos
          for(const p of DB.data.projetos){
            const atividadesComEsseParceiro = Object.keys(p.raci||{}).filter(aid=>p.raci[aid] && p.raci[aid][c.id]);
            for(const aid of atividadesComEsseParceiro){
              await sbDeleteWhere("raci", qsEq("atividade_id",aid)+"&"+qsEq("pessoa_id",c.id));
              delete p.raci[aid][c.id];
            }
          }
          toast("Parceiro removido, junto com horas e referências na RACI.");
        } else {
          toast("Parceiro removido. Horas e referências na RACI foram mantidas.");
        }
        DB.data.colaboradores=DB.data.colaboradores.filter(x=>x.id!==c.id);
        render();
      }
    );
  });
}

/* Chama a Edge Function que revoga o login (auth.users) de verdade,
   além de apagar o perfil. Retorna true se deu certo. */
async function removerUsuarioCompleto(userId){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/delete-user`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${session.access_token}`
      },
      body: JSON.stringify({ userId })
    });
    const body = await resp.json();
    if(!resp.ok){
      toast("Erro ao remover: " + (body.error||"falha desconhecida"));
      return false;
    }
    return true;
  }catch(e){
    toast("Não foi possível contatar o servidor para remover o acesso.");
    return false;
  }
}

/* Detecta registros "órfãos": linhas que referenciam um projeto, atividade
   ou pessoa que não existe mais. Isso não deveria acontecer em uso normal
   (o banco tem ON DELETE CASCADE/SET NULL para isso), mas pode sobrar lixo
   de importações de backup antigas ou de uma falha pontual no passado. */
function detectarOrfaos(){
  const atividadeIds=new Set(DB.data.atividades.map(a=>a.id));
  const projetoIds=new Set(DB.data.projetos.map(p=>p.id));
  const colabIds=new Set(DB.data.colaboradores.map(c=>c.id));

  const horasSemProjeto=DB.data.horas.filter(h=>h.projetoId && !projetoIds.has(h.projetoId));
  const horasAtividadeInvalida=DB.data.horas.filter(h=>h.atividadeId && !atividadeIds.has(h.atividadeId) && !horasSemProjeto.includes(h));
  const financeiroSemProjeto=DB.data.financeiro.filter(f=>f.projetoId && !projetoIds.has(f.projetoId));

  const raciOrfaos=[];
  DB.data.projetos.forEach(p=>{
    Object.entries(p.raci||{}).forEach(([atividadeId,pessoas])=>{
      Object.keys(pessoas||{}).forEach(pessoaId=>{
        if(!atividadeIds.has(atividadeId)||!colabIds.has(pessoaId)){
          raciOrfaos.push({projetoId:p.id, atividadeId, pessoaId});
        }
      });
    });
  });

  const total=horasSemProjeto.length+horasAtividadeInvalida.length+financeiroSemProjeto.length+raciOrfaos.length;
  return {horasSemProjeto,horasAtividadeInvalida,financeiroSemProjeto,raciOrfaos,total};
}

async function excluirOrfaosDetectados(rel){
  for(const h of rel.horasSemProjeto){
    await sbDelete("horas", h.id);
    DB.data.horas=DB.data.horas.filter(x=>x.id!==h.id);
  }
  for(const h of rel.horasAtividadeInvalida){
    await sbUpdate("horas", h.id, {atividade_id:null}); // mantém a hora, só remove o vínculo quebrado
    const local=DB.data.horas.find(x=>x.id===h.id);
    if(local) local.atividadeId=null;
  }
  for(const f of rel.financeiroSemProjeto){
    await sbDelete("financeiro", f.id);
    DB.data.financeiro=DB.data.financeiro.filter(x=>x.id!==f.id);
  }
  for(const r of rel.raciOrfaos){
    await sbDeleteWhere("raci", qsEq("atividade_id",r.atividadeId)+"&"+qsEq("pessoa_id",r.pessoaId));
    const p=getProjeto(r.projetoId);
    if(p && p.raci && p.raci[r.atividadeId]) delete p.raci[r.atividadeId][r.pessoaId];
  }
  return rel.total;
}

function abrirModalManutencao(){
  const rel=detectarOrfaos();
  const linhas=[
    ["Apontamentos de horas apontando para um projeto que não existe mais", rel.horasSemProjeto.length, "excluídos"],
    ["Apontamentos de horas com vínculo de atividade quebrado", rel.horasAtividadeInvalida.length, "vínculo removido (a hora em si é mantida)"],
    ["Lançamentos financeiros apontando para um projeto que não existe mais", rel.financeiroSemProjeto.length, "excluídos"],
    ["Atribuições da matriz RACI apontando para atividade/pessoa inexistente", rel.raciOrfaos.length, "excluídas"]
  ];
  const corpo=rel.total===0
    ? `<div class="empty" style="padding:20px"><span class="ic">✓</span><p>Nenhum dado órfão encontrado. Seu banco só tem registros realmente em uso.</p></div>`
    : `<table style="width:100%;border-collapse:collapse;font-size:12.5px">
        <thead><tr style="background:#f4f6fb">
          <th style="text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)">O que foi encontrado</th>
          <th style="text-align:right;padding:7px 9px;border-bottom:1px solid var(--line)">Qtde.</th>
        </tr></thead>
        <tbody>${linhas.filter(l=>l[1]>0).map(l=>`<tr>
          <td style="padding:7px 9px;border-bottom:1px solid var(--line-soft)">${esc(l[0])}<div style="color:var(--ink-faint);font-size:11px">Ação: ${esc(l[2])}</div></td>
          <td style="padding:7px 9px;text-align:right;border-bottom:1px solid var(--line-soft);font-weight:700">${l[1]}</td>
        </tr>`).join("")}</tbody>
      </table>`;
  $("#modal-root").innerHTML=`
  <div class="overlay"><div class="modal">
    <div class="modal-head"><h3>🧹 Manutenção do banco de dados</h3>
      <button class="btn-icon" id="mm-x">✕</button></div>
    <div class="modal-body">${corpo}</div>
    <div class="modal-foot">
      <button class="btn ghost" id="mm-cancel">Fechar</button>
      ${rel.total>0?'<button class="btn danger" id="mm-purge">🗑 Excluir órfãos definitivamente</button>':""}
    </div></div></div>`;
  $("#mm-x").onclick=closeModal;
  $("#mm-cancel").onclick=closeModal;
  if($("#mm-purge")) $("#mm-purge").onclick=async()=>{
    const btn=$("#mm-purge");
    btn.disabled=true; btn.textContent="Excluindo...";
    try{
      const n=await excluirOrfaosDetectados(rel);
      closeModal();
      toast(`${n} registro(s) órfão(s) tratado(s) — banco limpo.`);
      render();
    }catch(e){
      console.error(e);
      toast("Erro ao limpar: "+(e.message||e));
      btn.disabled=false; btn.textContent="🗑 Excluir órfãos definitivamente";
    }
  };
}

function acessosDaPessoa(pessoaId){ return ACESSOS.todos.filter(a=>String(a.pessoaId)===String(pessoaId)); }
function resumoAcessosHtml(c){
  if(c.papel==="gestor") return `<span style="color:var(--ok);font-weight:600">Acesso total</span>`;
  const lst=acessosDaPessoa(c.id);
  const ses=lst.filter(a=>a.tipo==="sessao").map(a=>nomeSessao(a.valor));
  const nProj=lst.filter(a=>a.tipo==="projeto" && getProjeto(a.valor)).length;
  const areas=(c.papel==="lideranca"||c.papel==="equipe")
    ? lst.filter(a=>a.tipo==="area").map(a=>(AREAS_OPERACAO.find(x=>x.id===a.valor)||{label:a.valor}).label) : [];
  const partes=[
    ...ses.map(n=>`${esc(n)} <span style="color:var(--ink-faint)">(sessão)</span>`),
    ...(nProj?[`${nProj} projeto(s)`]:[]),
    ...(areas.length?[`Operação: ${esc(areas.join(", "))}`]:[])
  ];
  return partes.length ? partes.join(" · ") : `<span style="color:var(--warn);font-weight:600">Nada liberado ainda</span>`;
}

function wirePerfisAcessos(v){
  const me=USER.current&&USER.current.colabId;
  v.querySelectorAll("[data-perfil]").forEach(sel=>{
    sel.onchange=()=>{
      const c=getColab(sel.dataset.perfil); if(!c) return;
      const antes=c.papel||"colaborador", novo=sel.value;
      const salvar=async()=>{
        try{
          await sbUpdate("profiles", c.id, {papel:novo});
          c.papel=novo;
          if(c.id===me){ USER.current.tipo=novo; }
          toast(`${c.nome}: perfil ${rotuloPerfil(novo)}.`);
          if(c.id===me && novo!=="gestor"){ ST.view="painel"; await DB.load(); }
        }catch(e){ sel.value=antes; toast("Erro ao mudar o perfil: "+e.message); }
        render();
      };
      if(c.id===me && antes==="gestor" && novo!=="gestor"){
        sel.value=antes;
        confirmar("Deixar de ser Gestor?","Você vai perder o acesso a Configurações e passará a ver só o que estiver liberado para você. Só outro Gestor consegue desfazer.",()=>{ sel.value=novo; salvar(); });
        return;
      }
      salvar();
    };
  });
  v.querySelectorAll("[data-acessos]").forEach(b=>b.onclick=()=>abrirAcessosPessoa(getColab(b.dataset.acessos)));
}
function abrirAcessosPessoa(c){
  if(!c) return;
  const papel=c.papel||"colaborador";
  const atuais=acessosDaPessoa(c.id);
  const tem=(tipo,valor)=>atuais.some(a=>a.tipo===tipo && String(a.valor)===String(valor));
  const grupos=[...SESSOES.map(s=>({id:s.id,label:s.label})),{id:"",label:"Não classificados"}]
    .map(g=>({...g, projetos:DB.data.projetos.filter(p=>g.id?p.sessaoId===g.id:!projetoSessaoValida(p))
      .sort((a,b)=>rotuloProjeto(a).localeCompare(rotuloProjeto(b),"pt-BR",{numeric:true}))}))
    .filter(g=>g.projetos.length || g.id);
  const areasLiberadas=papel==="lideranca"||papel==="equipe";
  const chk=(attrs,marcado,label,extra="")=>`<label style="display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:4px 0;cursor:pointer">
      <input type="checkbox" ${attrs} ${marcado?"checked":""} style="width:auto;margin:2px 0 0"> <span>${label}${extra}</span></label>`;
  $("#modal-root").innerHTML=`
  <div class="overlay"><div class="modal wide">
    <div class="modal-head"><h3>Acessos de ${esc(c.nome)}</h3><button class="btn-icon" id="ac-x">✕</button></div>
    <div class="modal-body" style="max-height:66vh;overflow:auto">
      <div class="help-banner" style="margin-bottom:14px"><span>👤</span><span>Perfil <b>${esc(rotuloPerfil(papel))}</b>: ${esc((PERFIS.find(x=>x.id===papel)||{}).desc||"")}</span></div>
      <h4 style="font-size:13.5px;margin-bottom:2px">Sessões do portfólio</h4>
      <div class="hint" style="margin-bottom:6px">Marcar a sessão libera todos os projetos dela, inclusive os criados depois.</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px;margin-bottom:14px">
        ${SESSOES.map(s=>chk(`data-ac-sessao="${s.id}"`, tem("sessao",s.id), esc(s.label))).join("")}
      </div>
      <h4 style="font-size:13.5px;margin-bottom:2px">Projetos específicos</h4>
      <div class="hint" style="margin-bottom:6px">Para liberar só alguns projetos de uma sessão. Quem cria um projeto (Liderança) recebe o acesso a ele automaticamente.</div>
      <input class="search" id="ac-busca" placeholder="Buscar projeto…" style="width:100%;margin-bottom:8px">
      <div id="ac-projetos">
        ${grupos.map(g=>`<details class="ac-grupo" data-grupo="${g.id}" ${g.projetos.some(p=>tem("projeto",p.id))?"open":""}
            style="border:1px solid var(--line-soft);border-radius:8px;padding:6px 10px;margin-bottom:6px">
          <summary style="cursor:pointer;font-weight:600;font-size:12.5px">${esc(g.label)} <span class="hint">(${g.projetos.length})</span></summary>
          <div style="margin-top:4px">${g.projetos.length?g.projetos.map(p=>`<div class="ac-proj" data-busca="${esc(normTxt(rotuloProjeto(p)))}">
              ${chk(`data-ac-projeto="${p.id}" data-ac-grupo="${g.id}"`, tem("projeto",p.id), esc(rotuloProjeto(p)), `<span class="ac-pela-sessao hint" style="display:none"> · liberado pela sessão</span>`)}
            </div>`).join(""):`<div class="hint">Nenhum projeto nesta sessão.</div>`}</div>
        </details>`).join("")}
      </div>
      <h4 style="font-size:13.5px;margin:14px 0 2px">Operação</h4>
      <div class="hint" style="margin-bottom:6px">${areasLiberadas?"Áreas da Operação que esta pessoa abre.":"O perfil Colaborador não acessa a Operação. Mude o perfil para Liderança ou Equipe para liberar."}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px">
        ${AREAS_OPERACAO.map(a=>chk(`data-ac-area="${a.id}" ${areasLiberadas?"":"disabled"}`, tem("area",a.id), esc(a.label), a.desc?`<span class="hint"> · ${esc(a.desc)}</span>`:"")).join("")}
      </div>
      <div class="form-err" id="ac-err"></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="ac-cancel">Cancelar</button>
      <button class="btn" id="ac-save">Salvar acessos</button>
    </div></div></div>`;
  const raiz=$("#modal-root");
  // projeto de uma sessão marcada: fica marcado e travado ("liberado pela sessão")
  const atualizarPelaSessao=()=>{
    const sesMarcadas=new Set([...raiz.querySelectorAll("[data-ac-sessao]:checked")].map(x=>x.dataset.acSessao));
    raiz.querySelectorAll("[data-ac-projeto]").forEach(cb=>{
      const pela=!!cb.dataset.acGrupo && sesMarcadas.has(cb.dataset.acGrupo);
      cb.disabled=pela;
      cb.checked=pela || cb.dataset.marcado==="1";
      const aviso=cb.closest("label").querySelector(".ac-pela-sessao"); if(aviso) aviso.style.display=pela?"inline":"none";
    });
  };
  raiz.querySelectorAll("[data-ac-projeto]").forEach(cb=>cb.addEventListener("change",()=>{ cb.dataset.marcado=cb.checked?"1":"0"; }));
  raiz.querySelectorAll("[data-ac-projeto]").forEach(cb=>{ cb.dataset.marcado=tem("projeto",cb.dataset.acProjeto)?"1":"0"; });
  raiz.querySelectorAll("[data-ac-sessao]").forEach(cb=>cb.onchange=atualizarPelaSessao);
  atualizarPelaSessao();
  $("#ac-busca").oninput=e=>{
    const q=normTxt(e.target.value);
    raiz.querySelectorAll(".ac-proj").forEach(el=>{ el.style.display=!q||el.dataset.busca.includes(q)?"":"none"; });
    if(q) raiz.querySelectorAll(".ac-grupo").forEach(d=>{ d.open=true; });
  };
  $("#ac-x").onclick=closeModal; $("#ac-cancel").onclick=closeModal;
  $("#ac-save").onclick=async()=>{
    const desejados=new Set();
    raiz.querySelectorAll("[data-ac-sessao]:checked").forEach(x=>desejados.add("sessao|"+x.dataset.acSessao));
    raiz.querySelectorAll("[data-ac-projeto]").forEach(x=>{
      // travado pela sessão: mantém como estava; senão vale o que está marcado
      if(x.disabled){ if(tem("projeto",x.dataset.acProjeto)) desejados.add("projeto|"+x.dataset.acProjeto); }
      else if(x.checked) desejados.add("projeto|"+x.dataset.acProjeto);
    });
    raiz.querySelectorAll("[data-ac-area]").forEach(x=>{
      if(x.disabled){ if(tem("area",x.dataset.acArea)) desejados.add("area|"+x.dataset.acArea); }
      else if(x.checked) desejados.add("area|"+x.dataset.acArea);
    });
    const chaveDe=a=>a.tipo+"|"+a.valor;
    const remover=atuais.filter(a=>!desejados.has(chaveDe(a)));
    const existentes=new Set(atuais.map(chaveDe));
    const incluir=[...desejados].filter(k=>!existentes.has(k)).map(k=>{ const [tipo,...r]=k.split("|"); return {pessoa_id:String(c.id), tipo, valor:r.join("|")}; });
    const btn=$("#ac-save"); btn.disabled=true; btn.textContent="Salvando...";
    try{
      if(incluir.length) await sbInsert("acessos", incluir, {onConflict:"pessoa_id,tipo,valor", prefer:"resolution=ignore-duplicates,return=representation"});
      for(const a of remover) await sbDelete("acessos", a.id);
      await carregarAcessos();
      closeModal();
      toast(`Acessos de ${c.nome} salvos.`);
      render();
    }catch(e){
      const err=$("#ac-err"); err.textContent="Erro ao salvar: "+(e.message||e); err.style.display="block";
      btn.disabled=false; btn.textContent="Salvar acessos";
    }
  };
}

.rp ul{margin:4px 0;padding-left:18px}.rp li{margin:3px 0}.rp-f{margin:0 30px;padding:9px 0 14px;border-top:1px solid #dde3ee;font-size:10.5px;color:#5a6a8a}
.rp-A .rp-h td{background:#164194;color:#fff;border-bottom:4px solid #e84910}.rp-A .eb{color:#a9c4f2}.rp-A .sb{color:#d6e2fa}
.rp-A h3{color:#164194;border-left:4px solid #e84910;padding-left:8px}.rp-A .rp-k td{background:#f4f6fa;border-top:3px solid #164194}.rp-A .rp-t th{background:#164194;color:#fff}
.rp-B .rp-h td{background:#eef2fa;border-left:8px solid #164194;border-bottom:1px solid #dde3ee}.rp-B .eb{color:#164194}
.rp-B h3{background:#dfe8f8;color:#0f2f6e;padding:6px 10px;border-left:4px solid #164194}.rp-B .rp-k td{background:#fff;border:1px solid #dde3ee}.rp-B .rp-k .v{color:#164194}.rp-B .rp-t th{background:#dfe8f8;color:#0f2f6e}`;
function relTab(cols,rows){
  const txt=c=>String(c).replace(/<[^>]*>/g,"").trim();
  const curto=c=>txt(c).length<=26;
  const numerico=c=>/^(R\$\s?)?[\d.,]+%?$|^\d{1,2}\/\d{2}(\/\d{4})?(\s*[→-]\s*\d{1,2}\/\d{2}(\/\d{4})?)?$/.test(txt(c));
  const td=(c,k)=>{
    const nw=k>0&&curto(c), num=numerico(c);
    return `<td${nw?' nowrap':''} style="${nw?'white-space:nowrap;':''}${num?"font-family:'Inter','Segoe UI',Arial,sans-serif;":''}">${c}</td>`;
  };
  return `<table class="rp-t"><thead><tr>${cols.map((c,k)=>`<th${k>0?' nowrap style="white-space:nowrap"':''}>${c}</th>`).join("")}</tr></thead><tbody>${
    rows.length?rows.map(r=>`<tr>${r.map(td).join("")}</tr>`).join(""):`<tr><td colspan="${cols.length}" class="rp-v">Nenhum registro.</td></tr>`}</tbody></table>`;
}
function relKpis(it){ return `<table class="rp-k"><tr>${it.map(i=>`<td><div class="l">${i[0]}</div><div class="v">${i[1]}</div><div class="s">${i[2]||""}</div></td>`).join("")}</tr></table>`; }
function relSec(t,h){ return `<div class="rp-s"><h3>${t}</h3>${h}</div>`; }
function relLista(it){ return it.length?`<ul>${it.map(x=>`<li>${x}</li>`).join("")}</ul>`:`<p class="rp-v">Nenhum registro.</p>`; }
function relCor(t,c){ return `<b style="color:${c}">${t}</b>`; }
function relDoc(lay,eb,ti,sb,corpo){
  return `<style>${REL_CSS}</style><div class="rp rp-${lay}"><table class="rp-h" width="100%"><tr><td><div class="eb">${eb}</div><div class="ti">${ti}</div><div class="sb">${sb}</div></td><td align="right" valign="middle" style="width:150px">${logoImg(lay==="A"?"branco":"azul",130)}</td></tr></table><div class="rp-b">${corpo}</div><div class="rp-f">Gestão de Portfólio · Gerado em ${fmtDate(todayStr())}</div></div>`;
}
function relMes(d){ return d?d.slice(5,7)+"/"+d.slice(0,4):"—"; }
function relDados(o){
  const ps=o.proj?[getProjeto(o.proj)].filter(Boolean):DB.data.projetos.slice();
  const ids=new Set(ps.map(p=>p.id)), hoje=todayStr();
  const ats=DB.data.atividades.filter(a=>ids.has(a.projetoId));
  const fim=a=>a.dataFimPrev||"", ini=a=>a.dataInicioPrev||a.dataFimPrev||"";
  const atrasada=a=>a.status!=="Concluída"&&a.status!=="Cancelada"&&fim(a)&&fim(a)<hoje;
  const noPer=a=>(!o.de||!fim(a)||fim(a)>=o.de)&&(!o.ate||!ini(a)||ini(a)<=o.ate);
  const fin=DB.data.financeiro.filter(f=>ids.has(f.projetoId));
  const finPer=fin.filter(f=>(!o.de||!f.data||f.data>=o.de)&&(!o.ate||!f.data||f.data<=o.ate));
  const nomeP=id=>{const p=getProjeto(id);return p?esc(p.nome):"—";};
  const nomesAt=a=>(a.responsaveisIds||[]).map(getColab).filter(Boolean).map(c=>esc(c.nome)).join(", ")||"—";
  const preds=a=>(Array.isArray(a.predecessorasIds)?a.predecessorasIds:[]).map(id=>DB.data.atividades.find(x=>x.id===id)).filter(Boolean);
  const sit=a=>a.status==="Concluída"?relCor("Concluída","#1f7a4d"):atrasada(a)?relCor("Atrasada","#b83232"):esc(a.status||"—");
  const bloq=a=>preds(a).filter(x=>atrasada(x));
  const sem=p=>{const n=ats.filter(a=>a.projetoId===p.id&&atrasada(a)).length,st=statusCalculado(p);
    if(st==="Concluído") return relCor("● Concluído","#1f7a4d");
    return n>=3?relCor("● Crítico","#b83232"):(n>0||st==="Em risco")?relCor("● Atenção","#b7791f"):relCor("● No prazo","#1f7a4d");};
  const orc=p=>despesasProjeto(p.id), real=p=>despesasProjeto(p.id,"realizado"), prev=p=>despesasProjeto(p.id,"previsto");
  const pct=(a,b)=>b>0?Math.round(a/b*100)+"%":"—";
  const riscos=ps.flatMap(p=>(p.riscos||[]).map(r=>Object.assign({_p:p},r)));
  const superado=r=>r.status==="Mitigado"||r.status==="Encerrado";
  const meses=()=>{const m={};finPer.forEach(f=>{const k=(f.data||"").slice(0,7); if(!k) return; m[k]=m[k]||{ap:0,dp:0,dr:0};
    if(f.tipo==="receita") m[k].ap+=+f.valor||0; else if(f.status==="realizado") m[k].dr+=+f.valor||0; else m[k].dp+=+f.valor||0;});
    return Object.keys(m).sort().map(k=>[relMes(k+"-01"),m[k]]);};
  return {ps,ids,ats,hoje,atrasada,noPer,fin,finPer,nomeP,nomesAt,preds,sit,bloq,sem,orc,real,prev,pct,riscos,superado,meses,
    prog:p=>progressoProjeto(p.id),gest:temArea("financeiro")};
}
function relSemFin(){ return `<p class="rp-v">Informações financeiras disponíveis apenas para quem tem acesso ao Financeiro.</p>`; }
function relTabMeses(d,modo){
  const m=d.meses();
  if(modo==="ope") return relTab(["Mês","Desembolso previsto","Desembolso realizado","A desembolsar"],
    m.map(([k,x])=>[k,fmtBRL(x.dp+x.dr),fmtBRL(x.dr),fmtBRL(x.dp)]));
  return relTab(["Mês","Aporte (receita)","Desembolso previsto","Desembolso realizado"],
    m.map(([k,x])=>[k,fmtBRL(x.ap),fmtBRL(x.dp),fmtBRL(x.dr)]));
}
function relRubricas(d){
  const m={}; d.fin.filter(f=>f.tipo==="despesa").forEach(f=>{const k=f.rubricaId||"-"; m[k]=m[k]||{p:0,r:0};
    if(f.status==="realizado") m[k].r+=+f.valor||0; else m[k].p+=+f.valor||0;});
  return relTab(["Rubrica","Previsto","Realizado","Execução"],Object.keys(m).map(k=>[esc(nomeRubrica(k)),fmtBRL(m[k].p+m[k].r),fmtBRL(m[k].r),d.pct(m[k].r,m[k].p+m[k].r)]));
}
function gerarRelatorio(o){
  const M=REL_MODELOS[o.modelo]; if(!M) return "";
  if(o.modelo==="ata"){
    const p=getProjeto(o.proj), r=p&&(p.reunioes||[]).find(x=>x.id===o.reuniao);
    return r?gerarHtmlAta(p,r):"";
  }
  const d=relDados(o), P=o.proj?getProjeto(o.proj):null;
  const escopo=P?esc(P.nome):"Portfólio completo";
  const sub=`${escopo} · Período: ${fmtDate(o.de)} a ${fmtDate(o.ate)}`;
  const marcos=d.ats.filter(a=>a.marco&&d.noPer(a)).sort((a,b)=>(a.dataFimPrev||"").localeCompare(b.dataFimPrev||""));
  const nAtr=d.ats.filter(d.atrasada).length;
  const progM=d.ps.length?Math.round(d.ps.reduce((s,p)=>s+d.prog(p),0)/d.ps.length):0;
  const totO=d.ps.reduce((s,p)=>s+d.orc(p),0), totR=d.ps.reduce((s,p)=>s+d.real(p),0);
  const linhaMarco=a=>[d.nomeP(a.projetoId),"🚩 "+esc(a.nome),fmtDate(a.dataFimPrev),d.sit(a)];
  const ativosR=d.riscos.filter(r=>!d.superado(r)&&r.status!=="Materializado");
  const liRisco=r=>`<b>${esc(r._p.nome)}:</b> ${esc(r.descricao)}${r.mitigacao?` — <i>${esc(r.mitigacao)}</i>`:""}`;
  let c="";
  if(o.modelo==="exec"){
    c=relSec("Indicadores",relKpis([["Projetos",d.ps.length,d.ps.filter(p=>["Em andamento","Em risco"].includes(statusCalculado(p))).length+" em andamento"],
        ["Progresso médio",progM+"%",""],["Atividades atrasadas",nAtr,""],
        d.gest?["Execução financeira",d.pct(totR,totO),fmtBRL(totR)+" de "+fmtBRL(totO)]:["Marcos",marcos.length,"no período"]]))
      +relSec("Situação por projeto",relTab(["Projeto","Situação","Progresso"],d.ps.map(p=>[esc(p.nome),d.sem(p),d.prog(p)+"%"])))
      +relSec("Marcos do período",relTab(["Projeto","Marco","Término previsto","Situação"],marcos.map(linhaMarco)))
      +relSec("Stakeholders envolvidos",relTab(["Stakeholder","Organização","Papel","Projeto"],
        d.ps.flatMap(p=>(p.stakeholders||[]).map(s=>[esc(s.nome),esc(s.organizacao||"—"),esc(s.papel||"—"),esc(p.nome)]))))
      +relSec("Riscos superados",relLista(d.riscos.filter(d.superado).map(liRisco)))
      +relSec("Riscos em atenção",relLista(ativosR.filter(r=>severidadeRisco(r)==="Alta").map(liRisco)));
  } else if(o.modelo==="gov"){
    c=relSec("Resumo do portfólio",relKpis([["Projetos",d.ps.length,""],["Progresso médio",progM+"%",""],["Atividades atrasadas",nAtr,""],
        d.gest?["Orçamento",fmtBRL(totO),"realizado "+d.pct(totR,totO)]:["Riscos ativos",ativosR.length,""]]))
      +relSec("Portfólio por projeto",relTab(d.gest?["Projeto","Término","Progresso","Orçamento","Saúde"]:["Projeto","Término","Progresso","Saúde"],
        d.ps.map(p=>[esc(p.nome),fmtDate(p.dataFim),d.prog(p)+"%"].concat(d.gest?[fmtBRL(d.orc(p))]:[]).concat([d.sem(p)]))))
      +relSec("Riscos críticos",relTab(["Projeto","Risco","Severidade","Responsável","Mitigação"],
        ativosR.filter(r=>severidadeRisco(r)!=="Baixa").map(r=>[esc(r._p.nome),esc(r.descricao),severidadeRisco(r),esc(r.responsavel||"—"),esc(r.mitigacao||"—")])))
      +relSec("Dependências críticas (bloqueadas por predecessora atrasada)",relTab(["Projeto","Atividade","Aguardando"],
        d.ats.filter(a=>d.bloq(a).length&&a.status!=="Concluída").map(a=>[d.nomeP(a.projetoId),esc(a.nome),d.bloq(a).map(x=>esc(x.nome)).join("; ")])))
      +relSec("Reuniões no período",relLista(d.ps.flatMap(p=>(p.reunioes||[]).filter(r=>r.data&&(!o.de||r.data>=o.de)&&(!o.ate||r.data<=o.ate)).map(r=>`${fmtDate(r.data)} — ${esc(r.titulo||"Reunião")} <i>(${esc(p.nome)})</i>`))));
  } else if(o.modelo==="ger"){
    const at=d.ats.filter(d.noPer).sort((a,b)=>(a.dataInicioPrev||"").localeCompare(b.dataInicioPrev||""));
    c=relSec("Andamento",relKpis([["Progresso",progM+"%",""],["Atividades",d.ats.length,d.ats.filter(a=>a.status==="Concluída").length+" concluídas"],
        ["Atrasadas",nAtr,""],d.gest?["Orçamento",fmtBRL(totO),"realizado "+d.pct(totR,totO)]:["Marcos",marcos.length,""]]))
      +relSec("Cronograma e dependências",relTab(["Projeto","Atividade","Depende de","Prazo","Prog.","Situação"],
        at.map(a=>[d.nomeP(a.projetoId),(a.marco?"🚩 ":"")+esc(a.nome),d.preds(a).map(x=>esc(x.nome)).join("; ")||"—",fmtDate(a.dataInicioPrev)+" → "+fmtDate(a.dataFimPrev),(+a.progresso||0)+"%",d.sit(a)])))
      +relSec("Pontos de atenção",relLista(d.ats.filter(d.atrasada).map(a=>`Atrasada: ${esc(a.nome)} (${fmtDate(a.dataFimPrev)})`).concat(ativosR.map(liRisco))))
      +(d.gest?relSec("Execução por rubrica",relRubricas(d)):"");
  } else if(o.modelo==="fin"){
    c=relSec("Execução",relKpis([["Meta física",progM+"%",""],
        ...(d.gest?[["Execução financeira",d.pct(totR,totO),fmtBRL(totR)],["Receita/aportes",fmtBRL(d.fin.filter(f=>f.tipo==="receita").reduce((s,f)=>s+(+f.valor||0),0)),""]]:[]),
        ["Marcos",marcos.length,marcos.filter(a=>a.status==="Concluída").length+" concluídos"]]))
      +relSec("Metas e entregas",relTab(["Projeto","Meta / entrega","Prazo","Situação"],marcos.map(linhaMarco)))
      +(d.gest?relSec("Execução financeira por rubrica",relRubricas(d))+relSec("Cronograma de aportes e desembolsos (por mês)",relTabMeses(d,"fin")):relSec("Execução financeira",relSemFin()))
      +relSec("Justificativas e ajustes",relLista(d.ats.filter(d.atrasada).map(a=>`${esc(a.nome)} — previsto para ${fmtDate(a.dataFimPrev)}`)));
  } else if(o.modelo==="ope"){
    c=relSec("Em números",relKpis([["No período",d.ats.filter(d.noPer).length,"atividades"],["Atrasadas",nAtr,"prioridade"],
        ["Concluídas",d.ats.filter(a=>a.status==="Concluída"&&d.noPer(a)).length,""],
        d.gest?["Orçamento",fmtBRL(totO),"realizado "+fmtBRL(totR)]:["Bloqueadas",d.ats.filter(a=>d.bloq(a).length).length,""]]))
      +relSec("Atividades",relTab(["Projeto","Atividade","Responsável","Prazo","Situação"],
        d.ats.filter(a=>d.noPer(a)&&a.status!=="Concluída").sort((a,b)=>(a.dataFimPrev||"").localeCompare(b.dataFimPrev||""))
          .map(a=>[d.nomeP(a.projetoId),esc(a.nome),d.nomesAt(a),fmtDate(a.dataFimPrev),d.sit(a)])))
      +(d.gest?relSec("Orçamento previsto × realizado",relTab(["Projeto","Previsto","Realizado","A desembolsar"],
          d.ps.map(p=>[esc(p.nome),fmtBRL(d.orc(p)),fmtBRL(d.real(p)),fmtBRL(d.prev(p))])))
        +relSec("Cronograma de desembolso (por mês)",relTabMeses(d,"ope")):"")
      +relSec("Bloqueios",relLista(d.ats.filter(a=>d.bloq(a).length&&a.status!=="Concluída").map(a=>`${esc(a.nome)} — aguardando ${d.bloq(a).map(x=>esc(x.nome)).join("; ")}`)));
  }
  return relDoc(M.lay,M.eb,P?esc(P.nome):"Portfólio de projetos",sub,c);
}
function relParaTexto(html){
  const t=document.createElement("textarea");
  t.innerHTML=html.replace(/<style[\s\S]*?<\/style>/gi,"").replace(/<\/(tr|li|div|h3|p)>/gi,"\n").replace(/<\/t[dh]>/gi," | ").replace(/<[^>]+>/g,"");
  return t.value.replace(/\n{3,}/g,"\n\n").trim();
}
function viewRelatorios(v){
  const hj=todayStr(), y=+hj.slice(0,4), m=+hj.slice(5,7);
  ST.rel=ST.rel||{modelo:"exec",proj:"",reuniao:"",de:`${y}-${pad(m)}-01`,ate:`${y}-${pad(m)}-${pad(new Date(y,m,0).getDate())}`};
  const R=ST.rel;
  const opt=(val,lab,sel)=>`<option value="${esc(val)}" ${sel?"selected":""}>${esc(lab)}</option>`;
  const p=R.proj?getProjeto(R.proj):null;
  const reunioes=p?(p.reunioes||[]).slice().sort((a,b)=>(b.data||"").localeCompare(a.data||"")):[];
  if(R.modelo==="ata" && !reunioes.find(r=>r.id===R.reuniao)) R.reuniao=reunioes[0]?reunioes[0].id:"";
  setTopAction(`<button class="btn">📤 Exportar (Word · PDF · HTML)</button>`,()=>{
    const html=gerarRelatorio(R);
    if(!html){ toast("Escolha um projeto e uma reunião para gerar a ata."); return; }
    const nome=("relatorio-"+R.modelo+(p?"-"+p.nome:"")+"-"+hj).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
    modalExportar("📤 Exportar "+REL_MODELOS[R.modelo].n,html,relParaTexto(html),nome);
  });
  const lb='style="display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:var(--ink-soft)"';
  v.innerHTML=`<div class="card" style="margin-bottom:16px"><div class="card-pad"><div class="rl-grid">
    <div class="rl-f"><label ${lb}>Modelo (público)</label><select id="rl-mod">${Object.keys(REL_MODELOS).map(k=>opt(k,REL_MODELOS[k].n,k===R.modelo)).join("")}</select></div>
    <div class="rl-f"><label ${lb}>Escopo</label><select id="rl-proj">${opt("","Portfólio completo",!R.proj)}${DB.data.projetos.map(x=>opt(x.id,x.nome,x.id===R.proj)).join("")}</select></div>
    ${R.modelo==="ata"?`<div class="rl-f" style="grid-column:span 2"><label ${lb}>Reunião</label><select id="rl-reu">${reunioes.length?reunioes.map(r=>opt(r.id,fmtDate(r.data)+" — "+(r.titulo||"Reunião"),r.id===R.reuniao)).join(""):opt("","Escolha um projeto com reuniões",true)}</select></div>`
    :`<div class="rl-f"><label ${lb}>De</label><input type="date" id="rl-de" value="${R.de||""}"></div><div class="rl-f"><label ${lb}>Até</label><input type="date" id="rl-ate" value="${R.ate||""}"></div>`}
  </div></div></div>
  <div id="rl-prev" style="overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px">${gerarRelatorio(R)||`<div class="empty"><h3>Selecione um projeto e uma reunião</h3><p>A ata é gerada a partir de uma reunião registrada no projeto.</p></div>`}</div>`;
  const on=(id,k,fn)=>{ const e=$(id); if(e) e.onchange=ev=>{ R[k]=ev.target.value; if(fn) fn(); viewRelatorios(v); }; };
  on("#rl-mod","modelo"); on("#rl-proj","proj",()=>{R.reuniao="";}); on("#rl-reu","reuniao"); on("#rl-de","de"); on("#rl-ate","ate");
}

function exportarAta(p,r){
  const html=gerarHtmlAta(p,r);
  const texto=gerarTextoAta(p,r);
  const base=(r.titulo||"reuniao").toLowerCase()
    .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
  const nome="ata-"+(r.data||todayStr()).replace(/-/g,"")+"-"+(base||"reuniao");
  modalExportar("📤 Exportar ata da reunião", html, texto, nome);
}

function exportarRelatorioProjeto(p){
  const html=gerarHtmlRelatorioProjeto(p);
  const texto=gerarTextoRelatorioProjeto(p);
  const base=(p.nome||"projeto").toLowerCase()
    .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
  const nome="relatorio-"+base+"-"+todayStr().replace(/-/g,"");
  modalExportar("📤 Exportar relatório do projeto", html, texto, nome);
}

/* ============================================================
   CHECKLIST EXECUTIVO EM PPT (tema CCS — azul/verde, layout clean)
   Gera um .pptx com: slide de capa + slides de "Atividades realizadas"
   + slides de "Próximas atividades", prontos para colar na apresentação
   executiva da reunião. Usa a biblioteca PptxGenJS (carregada via CDN).
   ============================================================ */
function exportarChecklistPPT(p,r){
  if(typeof PptxGenJS==="undefined"){
    toast("Não foi possível carregar o gerador de PPT. Verifique sua conexão e tente novamente.");
    return;
  }
  // paleta discreta em azul e verde, alinhada ao tema do app
  const COR={
    navy:"164194", navy2:"123478", navy3:"0F2C66",
    azul:"164194", azulClaro:"E8EEF9",
    verde:"164194", verdeClaro:"A9C4F2", verdeBg:"E3EBF8",
    dourado:"E84910", douradoEsc:"C93C08",
    branco:"FFFFFF", cinzaBg:"F4F6FA", linha:"DDE3EE",
    tinta:"0F1F3D", tintaSuave:"34507F", tintaFraca:"5A6A8A"
  };
  const FONTE="Segoe UI", FONTE_T="Segoe UI"; // fonte Microsoft Office da identidade SENAI (padrão Windows)
  const pptx=new PptxGenJS();
  pptx.defineLayout({name:"CCS_WIDE",width:13.33,height:7.5});
  pptx.layout="CCS_WIDE";
  pptx.author="Gestão de Portfólio"; pptx.company=p.nome||"";
  pptx.title="Checklist executivo — "+(r.titulo||"Reunião");

  const periodo=r.resumoDe?`${fmtDate(r.resumoDe)} — ${fmtDate(r.resumoAte||r.data)}`:fmtDate(r.data);
  const dataGeracao=fmtDate(todayStr());

  /* ---- rodapé padrão de cada slide de conteúdo ---- */
  function rodape(slide,paginaTxt){
    slide.addShape("rect",{x:0,y:7.14,w:13.33,h:0.02,fill:{color:COR.linha}});
    slide.addText((p.nome||"").toUpperCase(),{
      x:0.5,y:7.2,w:6,h:0.28,fontFace:FONTE_T,fontSize:8.5,color:COR.tintaFraca,
      charSpacing:1,bold:true
    });
    slide.addText(paginaTxt||"",{
      x:8.4,y:7.2,w:3.2,h:0.28,fontFace:FONTE,fontSize:8.5,color:COR.tintaFraca,
      align:"right"
    });
    slide.addImage({data:"image/png;base64,"+LOGO_SENAI_AZUL_B64,x:11.75,y:7.19,w:1.08,h:0.288});
  }

  /* ---- slide de capa ---- */
  const capa=pptx.addSlide();
  capa.background={color:COR.navy};
  capa.addImage({data:"image/png;base64,"+LOGO_SENAI_BRANCO_B64,x:0.9,y:0.7,w:2.8,h:0.748});
  capa.addShape("rect",{x:0,y:0,w:0.28,h:7.5,fill:{color:COR.dourado}});
  // barra decorativa azul→verde no rodapé da capa
  capa.addShape("rect",{x:0,y:7.36,w:13.33,h:0.14,fill:{type:"gradient",stops:[
    {color:COR.verde,position:0},{color:COR.dourado,position:100}
  ],angle:0}});
  capa.addText("CHECKLIST EXECUTIVO",{
    x:0.9,y:2.15,w:11.5,h:0.4,fontFace:FONTE_T,fontSize:13,color:COR.verdeClaro,
    bold:true,charSpacing:3
  });
  capa.addText(r.titulo||"Reunião",{
    x:0.9,y:2.6,w:11.5,h:1.1,fontFace:FONTE_T,fontSize:34,color:COR.branco,bold:true
  });
  capa.addText(p.nome||"",{
    x:0.9,y:3.65,w:11.5,h:0.5,fontFace:FONTE,fontSize:17,color:"D6E2FA"
  });
  capa.addShape("rect",{x:0.92,y:4.35,w:0.55,h:0.045,fill:{color:COR.dourado}});
  capa.addText([
    {text:"Período do resumo:  ",options:{color:"A9C4F2",bold:false}},
    {text:periodo,options:{color:COR.branco,bold:true}}
  ],{x:0.9,y:4.55,w:11.5,h:0.4,fontFace:FONTE,fontSize:13}); 
  capa.addText("Gerado em "+dataGeracao,{
    x:0.9,y:6.85,w:11.5,h:0.3,fontFace:FONTE,fontSize:10,color:"A9C4F2"
  });

  /* ---- monta slides de checklist em blocos (paginação) ---- */
  function slidesChecklist(itens,titulo,iconeTxt,corFaixa,corFaixaBg,marcador){
    const ITENS_POR_SLIDE=7;
    const blocos=[];
    const lista=itens&&itens.length?itens:["Nenhum item encontrado para o período."];
    for(let i=0;i<lista.length;i+=ITENS_POR_SLIDE) blocos.push(lista.slice(i,i+ITENS_POR_SLIDE));

    blocos.forEach((bloco,bi)=>{
      const slide=pptx.addSlide();
      slide.background={color:"FFFFFF"};
      // faixa superior colorida
      slide.addShape("rect",{x:0,y:0,w:13.33,h:1.15,fill:{color:corFaixa}});
      slide.addShape("rect",{x:0,y:1.15,w:13.33,h:0.06,fill:{color:COR.dourado}});
      slide.addText(iconeTxt+"  "+titulo,{
        x:0.6,y:0.28,w:9,h:0.6,fontFace:FONTE_T,fontSize:22,color:COR.branco,bold:true
      });
      slide.addText(periodo+(blocos.length>1?`   ·   parte ${bi+1}/${blocos.length}`:""),{
        x:0.6,y:0.75,w:12,h:0.3,fontFace:FONTE,fontSize:10.5,color:COR.branco,transparency:15
      });

      let y=1.55;
      const rowH=0.68;
      bloco.forEach((txt,i)=>{
        const striped=i%2===1;
        if(striped){
          slide.addShape("rect",{x:0.6,y:y-0.06,w:12.1,h:rowH,fill:{color:corFaixaBg},line:{color:corFaixaBg}});
        }
        slide.addText(marcador,{
          x:0.75,y:y-0.02,w:0.5,h:rowH-0.1,fontFace:FONTE,fontSize:14,color:corFaixa,bold:true,valign:"top"
        });
        slide.addText(String(txt),{
          x:1.25,y:y-0.02,w:11.2,h:rowH-0.1,fontFace:FONTE,fontSize:13.5,color:COR.tinta,
          valign:"top",lineSpacingMultiple:1.12
        });
        y+=rowH;
      });
      rodape(slide,`${p.nome||""} · ${titulo}`);
    });
  }

  slidesChecklist(r.resumoRealizadas,"Atividades realizadas","✓",COR.verde,COR.verdeBg,"✓");
  slidesChecklist(r.resumoProximas,"Próximas atividades","→",COR.azul,COR.azulClaro,"▢");

  const base=(r.titulo||"reuniao").toLowerCase()
    .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
  const nomeArquivo="checklist-"+(r.data||todayStr()).replace(/-/g,"")+"-"+(base||"reuniao")+".pptx";
  pptx.writeFile({fileName:nomeArquivo}).then(()=>{
    toast("Checklist em PPT baixado — pronto para colar na apresentação.");
  }).catch(err=>{
    console.error("[PMO] erro ao gerar PPT:",err);
    toast("Erro ao gerar o PPT: "+(err.message||err));
  });
}

function modalExportar(titulo,htmlConteudo,textoConteudo,nomeArquivo){
  $("#modal-root").innerHTML=`
  <div class="overlay"><div class="modal wide">
    <div class="modal-head"><h3>${esc(titulo)}</h3>
      <button class="btn-icon" id="mx-x">✕</button></div>
    <div class="modal-body">
      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
        <button class="btn" id="mx-doc">📝 Baixar arquivo (.doc)</button>
        <button class="btn ghost" id="mx-html">💾 Baixar arquivo (.html)</button>
        <button class="btn ghost" id="mx-open">🖨️ Abrir em nova aba (imprimir / salvar PDF)</button>
        <button class="btn ghost" id="mx-text">📋 Copiar como texto</button>
      </div>
      <div class="help-banner" style="margin-bottom:14px"><span>💡</span><span>O arquivo <b>.doc</b> abre direto no Word (ou Google Docs/LibreOffice) já formatado e pronto para editar. O HTML pode ser anexado a e-mails ou aberto direto no navegador. Para virar PDF, clique em "Abrir em nova aba" e use <b>Ctrl+P → Salvar como PDF</b>.</span></div>
      <div style="max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fafbfc">
        ${htmlConteudo}
      </div>
    </div>
  </div></div>`;
  function montarStandalone(){
    return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(titulo)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></head><body style="background:#fff;margin:0;padding:18px 0">${htmlConteudo}</body></html>`;
  }
  // .doc compatível com Word: envelope HTML com os namespaces e comentários
  // condicionais "mso" que o Word reconhece para abrir como documento nativo
  // (com régua, páginas A4 e formatação preservada), continuando 100% editável
  // depois de aberto — sem depender de nenhuma biblioteca externa.
  function montarWord(){
    // .doc no formato MHTML (HTML + imagens anexadas no mesmo arquivo): o Word abre como documento
    // editável e exibe o logo, o que não acontece com imagens "data:" soltas dentro do HTML.
    const logos={azul:LOGO_SENAI_AZUL_B64,branco:LOGO_SENAI_BRANCO_B64}, usados=new Set();
    // O Word ignora "height:auto": largura E altura precisam ir explícitas (logo = 480×128 px, proporção 3,75:1)
    const corpo=htmlConteudo.replace(/<img[^>]*data-logo="(azul|branco)"[^>]*>/g,(m,t)=>{
      usados.add(t);
      const wm=m.match(/width="(\d+)"/), w=wm?+wm[1]:130, h=Math.round(w*128/480);
      return `<img src="logo_${t}.png" alt="SENAI" width="${w}" height="${h}" style="width:${w}px;height:${h}px">`;
    });
    const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="utf-8">
<title>${esc(titulo)}</title>
<!--[if gte mso 9]><xml>
 <w:WordDocument>
  <w:View>Print</w:View>
  <w:Zoom>100</w:Zoom>
  <w:DoNotOptimizeForBrowser/>
 </w:WordDocument>
</xml><![endif]-->
<style>
@page{ size:21cm 29.7cm; margin:2.4cm 2.2cm 2.2cm 2.2cm; }
body{ font-family:'Segoe UI',Calibri,Arial,sans-serif; }
</style>
</head>
<body>${corpo}</body>
</html>`;
    const b64=txt=>{ const by=new TextEncoder().encode(txt); let bin="";
      for(let k=0;k<by.length;k+=0x8000) bin+=String.fromCharCode.apply(null,by.subarray(k,k+0x8000)); return btoa(bin); };
    const quebra=t=>t.replace(/(.{76})/g,"$1\r\n");
    const B="----=_NextPart_senai_"+Date.now();
    const partes=[
      `MIME-Version: 1.0\r\nContent-Type: multipart/related; type="text/html"; boundary="${B}"\r\n\r\n`,
      `--${B}\r\nContent-Type: text/html; charset="utf-8"\r\nContent-Transfer-Encoding: base64\r\nContent-Location: http://documento.local/documento.htm\r\n\r\n${quebra(b64(html))}\r\n\r\n`
    ];
    usados.forEach(t=>partes.push(`--${B}\r\nContent-Type: image/png\r\nContent-Transfer-Encoding: base64\r\nContent-Location: http://documento.local/logo_${t}.png\r\n\r\n${quebra(logos[t])}\r\n\r\n`));
    partes.push(`--${B}--\r\n`);
    return partes.join("");
  }
  $("#mx-x").onclick=closeModal;
  $("#mx-doc").onclick=()=>{
    const blob=new Blob([montarWord()],{type:"application/msword"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=nomeArquivo+".doc";
    a.click(); URL.revokeObjectURL(a.href);
    toast("Arquivo .doc baixado — abra no Word para editar.");
  };
  $("#mx-html").onclick=()=>{
    const blob=new Blob([montarStandalone()],{type:"text/html;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=nomeArquivo+".html";
    a.click(); URL.revokeObjectURL(a.href);
    toast("Arquivo baixado.");
  };
  $("#mx-open").onclick=()=>{
    const w=window.open("","_blank");
    if(!w){ toast("Permita pop-ups neste site para abrir em nova aba."); return; }
    w.document.write(montarStandalone()); w.document.close();
  };
  $("#mx-text").onclick=()=>{
    function copiarFallback(){
      const ta=document.createElement("textarea");
      ta.value=textoConteudo;
      ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); toast("Texto copiado."); }
      catch(e){ toast("Use Ctrl+C para copiar."); }
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(textoConteudo)
        .then(()=>toast("Texto copiado para a área de transferência."), copiarFallback);
    } else copiarFallback();
  };
}

function gerarTextoAta(p,r){
  const ata=r.ata||{};
  if(ata.saidas) ordenarSaidasPorData(ata.saidas);
  const parts=(r.participantes||[]).filter(Boolean);
  let out="ATA DE REUNIÃO\n";
  out+="Projeto: "+p.nome+"\n";
  out+="=".repeat(50)+"\n\n";
  out+="Data: "+fmtDate(r.data)+(r.hora?" · "+r.hora:"")+"\n";
  out+="Assunto: "+(r.titulo||"(sem título)")+"\n";
  out+="Participantes: "+(parts.join(", ")||"—")+"\n\n";
  out+="OBJETIVO\n"+"-".repeat(8)+"\n"+(ata.objetivo||"—")+"\n\n";
  // Próximas atividades NÃO entra na ata exportada (a pedido: a ata deve trazer
  // apenas o que já foi realizado no período, não o planejamento futuro).
  if((ata.resumoRealizadas||[]).length){
    out+="RESUMO DO PERÍODO\n"+"-".repeat(18)+"\n";
    out+="Atividades realizadas:\n";
    ata.resumoRealizadas.forEach(x=>out+="• "+x+"\n");
    out+="\n";
  }
  out+="TÓPICOS DE DISCUSSÃO\n"+"-".repeat(20)+"\n";
  if((ata.topicos||[]).length){
    ata.topicos.forEach((t,i)=>{
      out+=(i+1)+". "+(t.tema||"(sem tema)")+"\n";
      if(t.notas) out+="   "+String(t.notas).replace(/\n/g,"\n   ")+"\n";
      out+="\n";
    });
  } else out+="Nenhum tópico registrado.\n\n";
  out+="SAÍDAS E ENTREGAS ACORDADAS\n"+"-".repeat(27)+"\n";
  if((ata.saidas||[]).length){
    ata.saidas.forEach(s=>{
      out+="• "+(s.descricao||"—")+"\n";
      out+="  Responsável: "+(s.responsavel||"—")+"\n";
      out+="  Data prevista: "+(s.dataEntrega?fmtDate(s.dataEntrega):"—")+"\n\n";
    });
  } else out+="Nenhuma entrega registrada.\n\n";
  if(ata.anotacoes){
    out+="ANOTAÇÕES DA REUNIÃO\n"+"-".repeat(21)+"\n"+ata.anotacoes+"\n\n";
  }
  out+="—\nGerado em "+fmtDate(todayStr())+" pelo aplicativo de Gestão de Portfólio.";
  return out;
}

function gerarHtmlRelatorioProjeto(p){
  const prog=progressoProjeto(p.id);
  const horas=horasProjeto(p.id);
  const despPrev=despesasProjeto(p.id,"previsto");
  const despReal=despesasProjeto(p.id,"realizado");
  const margem=margemProjeto(p);
  const ats=DB.data.atividades.filter(a=>a.projetoId===p.id);
  const reuns=(p.reunioes||[]).slice().sort((a,b)=>(a.data||"").localeCompare(b.data||""));
  const showFin=temArea("financeiro");

  // pessoas envolvidas: horas + responsáveis de atividades (RACI) + RACI
  const envolvidos=new Set();
  DB.data.horas.filter(h=>h.projetoId===p.id).forEach(h=>envolvidos.add(h.colaboradorId));
  ats.forEach(a=>{ if(p.raci&&p.raci[a.id]){
    Object.keys(p.raci[a.id]).forEach(id=>envolvidos.add(id));
  }});
  const envInt=[...envolvidos].map(id=>getColab(id)).filter(c=>c&&c.tipo!=="parceiro");
  const envPar=[...envolvidos].map(id=>getColab(id)).filter(c=>c&&c.tipo==="parceiro");
  const equipeHtml=(envInt.length||envPar.length)?`
    ${envInt.length?`<p style="margin:6px 0 4px"><b>Equipe interna</b></p>
      <ul>${envInt.map(c=>`<li>${esc(c.nome)}${c.cargo?` — ${esc(c.cargo)}`:""}</li>`).join("")}</ul>`:""}
    ${envPar.length?`<p style="margin:14px 0 4px"><b>Parceiros externos</b></p>
      <ul>${envPar.map(c=>`<li>${esc(c.nome)}${c.organizacao?` <span style="color:#5a6a8a">(${esc(c.organizacao)})</span>`:""}${c.cargo?` — ${esc(c.cargo)}`:""}</li>`).join("")}</ul>`:""}`
    :"<p style='color:#5a6a8a'>Nenhuma pessoa registrada com participação no projeto.</p>";

  const atsHtml=ats.length?`<table>
    <thead><tr><th>#</th><th>Atividade</th><th>Categoria</th><th>Responsável</th>
      <th>Início prev.</th><th>Término prev.</th><th>%</th><th>Situação</th></tr></thead>
    <tbody>${ats.map((a,i)=>{
      const respRaci=nomesResponsaveisAtividade(a,p);
      return `<tr>
      <td>${i+1}</td><td>${esc(a.nome)}</td><td>${esc(nomeCategoria(a.categoriaId))}</td>
      <td>${respRaci.length?respRaci.join(", "):"—"}</td>

function gerarTextoRelatorioProjeto(p){
  let out="RELATÓRIO DO PROJETO\n"+"=".repeat(50)+"\n";
  out+=p.nome+"\n\n";
  out+=campoOcultoSessao(p,"cliente")?"":"Cliente: "+(p.cliente||"—")+"\n";
  out+="Gerente: "+(p.gerente||"—")+"\n";
  out+="Status: "+statusCalculado(p)+"\n";
  out+="Período: "+(p.dataInicio?fmtDate(p.dataInicio):"—")+" a "+(p.dataFim?fmtDate(p.dataFim):"—")+"\n\n";
  out+="INDICADORES\n"+"-".repeat(11)+"\n";
  out+="Progresso físico: "+progressoProjeto(p.id)+"%\n";
  out+="Horas executadas: "+fmtNum(horasProjeto(p.id),1)+" h\n";
  if(temArea("financeiro")){
    out+="Despesas realizadas: "+fmtBRL(despesasProjeto(p.id,"realizado"))+"\n";
    out+="Margem prevista: "+fmtNum(margemProjeto(p),1)+"%\n";
  }
  out+="\n";
  const ats=DB.data.atividades.filter(a=>a.projetoId===p.id);
  out+="CRONOGRAMA ("+ats.length+" atividade"+(ats.length!==1?"s":"")+")\n"+"-".repeat(20)+"\n";
  if(ats.length){
    ats.forEach((a,i)=>{
      const respRaci=nomesResponsaveisAtividade(a,p);
      out+=(i+1)+". "+a.nome+" — "+(a.progresso||0)+"% — "+(a.status||"—")+"\n";
      if(a.dataFimPrev) out+="   Término previsto: "+fmtDate(a.dataFimPrev)+"\n";
      if(respRaci.length) out+="   Responsável: "+respRaci.join(", ")+"\n";
    });
  } else out+="Sem atividades cadastradas.\n";
  out+="\n";
  const reuns=(p.reunioes||[]).slice().sort((a,b)=>(a.data||"").localeCompare(b.data||""));
  if(reuns.length){
    out+="REUNIÕES REGISTRADAS\n"+"-".repeat(20)+"\n";
    reuns.forEach(r=>{
      const ns=(r.ata&&r.ata.saidas||[]).length;
      out+="• "+fmtDate(r.data)+(r.hora?" "+r.hora:"")+" — "+(r.titulo||"(sem título)")+(ns?" ["+ns+" entrega"+(ns>1?"s":"")+"]":"")+"\n";
    });
    out+="\n";
  }
  if((p.riscos||[]).length){
    out+="RISCOS\n"+"-".repeat(6)+"\n";
    p.riscos.forEach(r=>{
      out+="• "+(r.descricao||"—")+" — Severidade: "+severidadeRisco(r)+"\n";
    });
    out+="\n";
  }
  out+="—\nRelatório gerado em "+fmtDate(todayStr())+" por "+nomeUsuarioAtual();
  return out;
}

function decodeCsvBuffer(buffer){
  // O Excel, no Brasil, ao salvar como "CSV (separado por vírgulas)" comum
  // (em vez de "CSV UTF-8"), grava o arquivo em Windows-1252/ANSI, não em
  // UTF-8. Se a gente sempre ler como UTF-8, todo caractere acentuado
  // (á,ã,ç,é...) vira lixo ou é corrompido silenciosamente, e as
  // comparações de nome/categoria passam a falhar mesmo com o cadastro
  // certo. Aqui a gente tenta decodificar como UTF-8 estrito primeiro; se
  // falhar (sequência de bytes inválida para UTF-8), cai para Windows-1252.
  try{
    const decoderUtf8=new TextDecoder("utf-8",{fatal:true});
    return { texto: decoderUtf8.decode(buffer), encoding:"utf-8" };
  }catch(e){
    const decoderAnsi=new TextDecoder("windows-1252");
    return { texto: decoderAnsi.decode(buffer), encoding:"windows-1252" };
  }
}

function parseCSVLine(linha, sep){
  // parser simples: respeita aspas duplas
  const out=[]; let buf=""; let dentroAspas=false;
  for(let i=0;i<linha.length;i++){
    const ch=linha[i];
    if(ch==='"'){
      if(dentroAspas && linha[i+1]==='"'){ buf+='"'; i++; }
      else dentroAspas=!dentroAspas;
    } else if(ch===sep && !dentroAspas){
      out.push(buf); buf="";
    } else { buf+=ch; }
  }
  out.push(buf);
  return out;
}

/* ---------- EXPORTAR CRONOGRAMA PARA EXCEL (.xlsx) ----------
   Usa ExcelJS (carregada sob demanda) para manter as cores e fontes do app. */
function carregarExcelJS(){
  if(window.ExcelJS) return Promise.resolve();
  return new Promise((ok,err)=>{
    const sc=document.createElement("script");
    sc.src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
    sc.onload=ok; sc.onerror=()=>err(new Error("Não foi possível carregar a biblioteca do Excel. Verifique a conexão com a internet."));
    document.head.appendChild(sc);
  });
}
