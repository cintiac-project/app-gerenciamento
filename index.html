    +(orfa?`<option value="${esc(atual)}" selected>(projeto excluído)</option>`:"")
    +grupos.map(g=>`<optgroup label="${esc(g.label)}">${g.itens.map(p=>
      `<option value="${esc(p.id)}" ${String(p.id)===String(atual||"")?"selected":""}>${esc(p.codigo?`${String(p.codigo).trim()} — ${p.nome}`:p.nome)}</option>`).join("")}</optgroup>`).join("");
}
/* ordem = prioridade definida arrastando (1 = mais importante). Metas antigas,
   ainda sem ordem, vêm depois, por mês/semana — até a primeira vez que a lista
   for reordenada. */
function metasMensaisAtivas(){
  return metasMensaisVisiveis().filter(m=>!m.concluido).sort((a,b)=>{
    const oa=a.ordem==null?1e9:+a.ordem, ob=b.ordem==null?1e9:+b.ordem;
    if(oa!==ob) return oa-ob;
    const ma=a.mes||"9999-99", mb=b.mes||"9999-99";
    return ma.localeCompare(mb) || (+a.semana||9)-(+b.semana||9) || (a.criadoEm||"").localeCompare(b.criadoEm||"");
  });
}
function metasMensaisHistorico(){
  return metasMensaisVisiveis().filter(m=>m.concluido)
    .sort((a,b)=>(b.concluidoEm||"").localeCompare(a.concluidoEm||"") || (b.mes||"").localeCompare(a.mes||""));
}

/* grava a prioridade (ordem = posição 1, 2, 3…) das metas ativas, na ordem de ids recebida */
async function salvarOrdemMetasMensais(ids){
  const achar=id=>(DB.data.metasMensais||[]).find(m=>m.id===id);
  const mudancas=[];
  ids.forEach((id,i)=>{ const m=achar(id); if(m && +m.ordem!==i+1){ m.ordem=i+1; mudancas.push([id,i+1]); } });
  render();
  if(!mudancas.length) return;
  try{ await Promise.all(mudancas.map(([id,o])=>sbUpdate("metas_mensais",id,{ordem:o}))); }
  catch(e){ toast("Erro ao salvar a prioridade das metas: "+e.message); await carregarMetasMensais(); render(); }
}
/* arrastar pela alça ⠿ (mouse ou toque) e setas ↑ ↓ pelo teclado */
function wireArrasteMetasMensais(v){
  const lista=v.querySelector("#mm-lista"); if(!lista) return;
  const idsNaTela=()=>[...lista.querySelectorAll(".mm-row")].map(r=>r.dataset.id);
  lista.querySelectorAll(".mm-handle").forEach(h=>{
    h.addEventListener("pointerdown",ev=>{
      if(ev.button!==0) return;
      ev.preventDefault();
      const row=h.closest(".mm-row"), antes=idsNaTela().join();
      // tira o foco de um campo em edição: o blur grava o texto antes de reordenar
      if(document.activeElement && document.activeElement!==h) document.activeElement.blur();
      // os eventos seguintes são ouvidos no document: ao reposicionar a linha no
      // DOM o navegador solta a "captura" do ponteiro, e a alça deixaria de recebê-los
      row.classList.add("arrastando"); document.body.classList.add("mm-arrastando");
      const mover=e=>{
        const y=e.clientY;
        if(y<70) window.scrollBy(0,-12); else if(y>window.innerHeight-70) window.scrollBy(0,12);
        const outras=[...lista.querySelectorAll(".mm-row")].filter(r=>r!==row);
        const alvo=outras.find(r=>{ const b=r.getBoundingClientRect(); return y<b.top+b.height/2; });
        if(alvo){ if(row.nextElementSibling!==alvo) lista.insertBefore(row,alvo); }
        else if(lista.lastElementChild!==row) lista.appendChild(row);
      };
      const soltar=()=>{
        document.removeEventListener("pointermove",mover); document.removeEventListener("pointerup",soltar); document.removeEventListener("pointercancel",soltar);
        row.classList.remove("arrastando"); document.body.classList.remove("mm-arrastando");
        const ids=idsNaTela();
        if(ids.join()!==antes) salvarOrdemMetasMensais(ids);
      };
      document.addEventListener("pointermove",mover); document.addEventListener("pointerup",soltar); document.addEventListener("pointercancel",soltar);
    });
    h.addEventListener("keydown",ev=>{
      if(ev.key!=="ArrowUp" && ev.key!=="ArrowDown") return;
      ev.preventDefault();
      const ids=idsNaTela(), i=ids.indexOf(h.dataset.id), j=ev.key==="ArrowUp"?i-1:i+1;
      if(i<0 || j<0 || j>=ids.length) return;
      [ids[i],ids[j]]=[ids[j],ids[i]];
      salvarOrdemMetasMensais(ids).then(()=>{ const nh=document.querySelector(`.mm-handle[data-id="${h.dataset.id}"]`); if(nh) nh.focus(); });
      const nh=document.querySelector(`.mm-handle[data-id="${h.dataset.id}"]`); if(nh) nh.focus();
    });
  });
}
function wireMetasMensais(v){
  if(!isGestor()){ if($("#mm-hist")) $("#mm-hist").onclick=abrirHistoricoMetasMensais; return; }
  const achar=id=>(DB.data.metasMensais||[]).find(m=>m.id===id);
  const salvar=async(id,patch)=>{
    try{ await sbUpdate("metas_mensais", id, patch); return true; }
    catch(e){ toast("Erro ao salvar meta mensal: "+e.message); return false; }
  };
  if($("#mm-add")) $("#mm-add").onclick=async()=>{
    const novo={id:uid(), mes:todayStr().slice(0,7), texto:"", concluido:false, concluidoEm:null, criadoEm:todayStr()};
    if(METAS_PROJETO_OK===true) novo.projetoId=null;
    if(PAINEL_MIGRACAO_OK===true){
      // a nova meta entra no fim da fila de prioridades; metas antigas ainda
      // sem ordem recebem a posição em que já aparecem na tela
      const ativas=metasMensaisAtivas();
      if(ativas.some(m=>m.ordem==null)) await salvarOrdemMetasMensais(ativas.map(m=>m.id));
      novo.ordem=ativas.length+1; novo.semana=null; novo.tags=[];
    }
    DB.data.metasMensais=DB.data.metasMensais||[];
    DB.data.metasMensais.push(novo);
    try{ await sbInsert("metas_mensais", toSnake(novo)); }
    catch(e){
      DB.data.metasMensais=DB.data.metasMensais.filter(x=>x.id!==novo.id);
      toast("Erro ao criar meta mensal: "+e.message);
    }
    render();
    const ta=document.querySelector(`.mm-meta[data-id="${novo.id}"]`); if(ta) ta.focus();
  };
  if($("#mm-hist")) $("#mm-hist").onclick=abrirHistoricoMetasMensais;
  v.querySelectorAll(".mm-meta").forEach(ta=>{
    ta.onblur=async()=>{
      const m=achar(ta.dataset.id), txt=ta.value;
      if(m && (m.texto||"")===txt) return;
      if(m) m.texto=txt;
      await salvar(ta.dataset.id,{texto:txt});
    };
  });
  v.querySelectorAll(".mm-mes").forEach(inp=>{
    inp.onchange=async()=>{
      const m=achar(inp.dataset.id); if(m) m.mes=inp.value||null;
      await salvar(inp.dataset.id,{mes:inp.value||null});
      if(PAINEL_MIGRACAO_OK!==true) render();   // sem prioridade manual, reordena por mês
    };
  });
  v.querySelectorAll(".mm-proj").forEach(sel=>{
    sel.onchange=async()=>{
      const m=achar(sel.dataset.id), pid=sel.value||null, antes=m?m.projetoId:null;
      if(m) m.projetoId=pid;
      sel.classList.toggle("vazio",!pid);
      if(!(await salvar(sel.dataset.id,{projeto_id:pid})) && m){ m.projetoId=antes; render(); }
    };
  });
  v.querySelectorAll(".mm-sem").forEach(sel=>{
    sel.onchange=async()=>{
      const m=achar(sel.dataset.id), sem=sel.value?+sel.value:null, antes=m?m.semana:null;

function mcsAtividadeConcluida(m){

  return (DB.data.mds||[]).filter(m=>m.concluido || mcsAtividadeConcluida(m))
    .map(m=>m.concluidoEm?m:Object.assign({},m,{concluidoEm:dataConc(m)}))
    .sort((a,b)=>(b.concluidoEm||"").localeCompare(a.concluidoEm||""));
}

/* texto em negrito Unicode (𝗔𝗕𝗖…): único jeito de destacar parte do texto de uma
   opção de lista suspensa (<option> não aceita HTML). Acentos são preservados. */
function negritoUnicode(str){
  return String(str||"").normalize("NFD").replace(/[A-Za-z0-9]/g,ch=>{
    const c=ch.charCodeAt(0);
    if(c>=65&&c<=90) return String.fromCodePoint(0x1D5D4+c-65);
    if(c>=97&&c<=122) return String.fromCodePoint(0x1D5EE+c-97);
    return String.fromCodePoint(0x1D7EC+c-48);
  }).normalize("NFC");
}

/* ============================================================
   CÁLCULOS DE NEGÓCIO
   ============================================================ */
/* LOG DAS HORAS EXECUTADAS (por colaborador, dentro da atividade)
   Cada item de estimativasPessoas guarda "horasExecutadas" (total) e agora também
   "horasExecLog": [{data, horas}] — a cada aumento do total, a diferença é
   registrada com a data de HOJE; assim as horas ficam na semana em que foram
   atribuídas (e não espalhadas pelo período da atividade). Reduzir o total
   desfaz as entradas mais recentes. O que já existia antes do log ("legado")
   continua distribuído pelos dias úteis da atividade, como antes.
   opts.semData: o aumento entra SEM data (com opts.nota), e por isso é
   distribuído pelos dias úteis entre o Início real e o Término real da
   atividade — usado ao concluir/importar horas de trabalho já feito, para
   não empilhar tudo na semana em que a conclusão foi registrada. */
/* anotações de progresso sempre em ordem cronológica (mais antiga → mais
   nova); lançamentos sem data ficam no topo. Ordenação estável: no mesmo dia,
   mantém a ordem em que foram lançados. */
function ordenarLogExecucao(log){
  return (log||[]).map((e,i)=>({e,i})).sort((a,b)=>(a.e.data||"").localeCompare(b.e.data||"")||a.i-b.i).map(x=>x.e);
}
function atualizarLogExecucao(itemAnterior,novoTotal,opts){
  opts=opts||{};
  const log=ordenarLogExecucao((itemAnterior&&Array.isArray(itemAnterior.horasExecLog)?itemAnterior.horasExecLog:[])
    .filter(e=>e).map(e=>({data:e.data||"",horas:+e.horas||0,nota:e.nota||""})));
  const a0=itemAnterior?parseFloat(itemAnterior.horasExecutadas):0;
  const antes=a0>0?a0:0;
  const n0=parseFloat(novoTotal);
  const depois=n0>0?n0:0;
  const delta=depois-antes;
  if(delta>0.0001){
    if(opts.semData) log.push({data:"",horas:delta,nota:opts.nota||""});
    else {
      const hoje=todayStr(), ult=log.find(e=>e.data===hoje && !e.nota);
      if(ult) ult.horas+=delta; else log.push({data:hoje,horas:delta,nota:""});
    }
  } else if(delta<-0.0001){
    let resta=-delta;
    for(let i=log.length-1;i>=0&&resta>0.0001;i--){ const t=Math.min(log[i].horas,resta); log[i].horas-=t; resta-=t; }
  }
  return log.filter(e=>e.horas>0.0001 || e.nota);
}
/* texto curto com as anotações de progresso lançadas pelos colaboradores
   (as 3 mais recentes) + o texto único antigo, se ainda existir — usado no
   alerta do Painel Geral e nos relatórios */
function textoAnotacoesAtividade(a){
  const partes=[];
  if(a.notasProgresso && String(a.notasProgresso).trim()) partes.push(String(a.notasProgresso).trim());
  const reg=[];
  (a.estimativasPessoas||[]).forEach(x=>{
    const c=getColab(x.colaboradorId);
    (Array.isArray(x.horasExecLog)?x.horasExecLog:[]).forEach(e=>{
      if(e && e.nota && String(e.nota).trim()) reg.push({data:e.data||"",nome:c?String(c.nome).split(" ")[0]:"",nota:String(e.nota).trim(),horas:+e.horas||0});
    });
  });
  reg.sort((p,q)=>(q.data||"").localeCompare(p.data||""));
  reg.slice(0,3).reverse().forEach(r=>{
    const d=r.data?r.data.slice(8,10)+"/"+r.data.slice(5,7)+" · ":"";
    partes.push(`${d}${r.nome?r.nome+": ":""}${r.nota}${r.horas>0?` (${fmtNum(r.horas,1)}h)`:""}`);
  });
  return partes.join("\n");
}
/* separa o total executado de um item em {log:[{data,horas}], legado:horas sem data} */
function partesExecucaoItem(x){
  const total=parseFloat(x.horasExecutadas);
  if(!(total>0)) return {log:[],legado:0};
  let log=(Array.isArray(x.horasExecLog)?x.horasExecLog:[]).filter(e=>e&&e.data&&+e.horas>0).map(e=>({data:e.data,horas:+e.horas,nota:e.nota||""}));
  const soma=log.reduce((t,e)=>t+e.horas,0);
  if(soma>total+0.0001){ const f=total/soma; log=log.map(e=>({data:e.data,horas:e.horas*f,nota:e.nota})); return {log,legado:0}; }
  return {log,legado:Math.max(0,total-soma)};
}

/* HORAS EXECUTADAS DAS ATIVIDADES → ENTRAM NOS DASHBOARDS
   O campo "Executada" (Horas previstas por colaborador, dentro da atividade)
   fica em atividades.estimativasPessoas[].horasExecutadas e antes NÃO era
   somado nos gráficos/totais, que só liam os apontamentos (DB.data.horas).
   Aqui essas horas viram registros "sintéticos" no mesmo formato dos
   apontamentos, para entrarem em gráficos e totais sem mexer no banco:
   - o período é o Início real → Término real (se faltar, usa o previsto) e
     as horas são distribuídas pelos dias úteis, indo para o mês de cada dia;
   - sem dupla contagem: se a pessoa JÁ tem apontamento nessa atividade, o
     apontamento prevalece e a horasExecutadas dela é ignorada. */
/* Quando a pessoa tem apontamentos antigos (tabela horas) E "Executada" na
   atividade, vale o MAIOR dos dois, sem somar (evita dupla contagem):
   - Executada > apontado  → a Executada substitui os apontamentos
     (ex.: 1 h apontada e 12 h executadas → 12 h);
   - Executada ≤ apontado  → os apontamentos continuam valendo.
   Devolve as chaves "atividadeId|colaboradorId" cujos apontamentos são substituídos. */
function chavesApontamentoSubstituidas(){
  const apontado={};
  DB.data.horas.forEach(h=>{ if(h.atividadeId && h.colaboradorId){ const k=h.atividadeId+"|"+h.colaboradorId; apontado[k]=(apontado[k]||0)+(+h.horas||0); } });
  const subst=new Set();
  DB.data.atividades.forEach(a=>{
    (Array.isArray(a.estimativasPessoas)?a.estimativasPessoas:[]).forEach(x=>{
      const k=a.id+"|"+x.colaboradorId;
      if(x.colaboradorId && k in apontado && (parseFloat(x.horasExecutadas)||0) > apontado[k]+0.0001) subst.add(k);
    });
  });
  return subst;
}
/* período em que as horas executadas SEM data de uma atividade são
   distribuídas: Início real → Término real (na falta, os previstos). Hora
   executada não pode estar no futuro: sem Término real, o período é cortado
   em HOJE (e, se a atividade ainda nem começou, tudo cai em hoje). */
function periodoExecDistribuida(a){
  let ini=a.dataInicioReal||a.dataInicioPrev||a.dataFimReal||a.dataFimPrev;
  let fim=a.dataFimReal||a.dataFimPrev||ini;
  if(!ini) return null;
  if(fim<ini) fim=ini;
  const hoje=todayStr();
  if(!a.dataFimReal && fim>hoje) fim=hoje;
  if(ini>fim) ini=fim;
  return {ini,fim};
}
function horasExecutadasAtividades(projetoId){
  const apont=new Set(), subst=chavesApontamentoSubstituidas();
  DB.data.horas.forEach(h=>{ if(h.atividadeId && h.colaboradorId) apont.add(h.atividadeId+"|"+h.colaboradorId); });
  const out=[];
  DB.data.atividades.forEach(a=>{
    if(projetoId && a.projetoId!==projetoId) return;
    (Array.isArray(a.estimativasPessoas)?a.estimativasPessoas:[]).forEach(x=>{
      if(!x.colaboradorId || !(parseFloat(x.horasExecutadas)>0)) return;
      if(apont.has(a.id+"|"+x.colaboradorId) && !subst.has(a.id+"|"+x.colaboradorId)) return;
      const partes=partesExecucaoItem(x);
      partes.log.forEach((e,i)=>out.push({id:"execlog-"+a.id+"-"+x.colaboradorId+"-"+i, projetoId:a.projetoId, atividadeId:a.id,
        colaboradorId:x.colaboradorId, categoriaId:a.categoriaId||"", data:e.data, horas:e.horas, sintetico:true, origem:"anotacao", nota:e.nota||""}));
      const total=partes.legado;
      if(!(total>0.0001)) return;
      const per=periodoExecDistribuida(a);
      if(!per) return;
      const {ini,fim}=per;
      let dias=diasUteisEntre(ini,fim);
      if(!dias.length) dias=[fim];
      const porMes={};
      dias.forEach(d=>{ const ym=d.slice(0,7); (porMes[ym]=porMes[ym]||[]).push(d); });
      Object.keys(porMes).forEach(ym=>{
        const ds=porMes[ym];
        out.push({id:"exec-"+a.id+"-"+x.colaboradorId+"-"+ym, projetoId:a.projetoId, atividadeId:a.id,
          colaboradorId:x.colaboradorId, categoriaId:a.categoriaId||"", data:ds[ds.length-1],
          horas:total*ds.length/dias.length, sintetico:true, origem:"distribuida",
          periodo:fmtDate(dias[0])+" a "+fmtDate(dias[dias.length-1])});
      });
    });
  });
  return out;
}
/* apontamentos + horas executadas das atividades (use em totais e gráficos) */
function horasConsolidadas(projetoId){
  const subst=chavesApontamentoSubstituidas();
  let base=projetoId?DB.data.horas.filter(h=>h.projetoId===projetoId):DB.data.horas;
  if(subst.size) base=base.filter(h=>!(h.atividadeId && h.colaboradorId && subst.has(h.atividadeId+"|"+h.colaboradorId)));
  return base.concat(horasExecutadasAtividades(projetoId));
}
function horasAtividade(a){
  return horasConsolidadas(a.projetoId).filter(h=>h.atividadeId===a.id).reduce((t,h)=>t+(+h.horas||0),0);
}
function horasProjeto(pid){ return horasConsolidadas(pid).reduce((s,h)=>s+(+h.horas||0),0); }
function despesasProjeto(pid,statusFiltro){
  return DB.data.financeiro
    .filter(f=>f.projetoId===pid && f.tipo==="despesa" && (!statusFiltro||f.status===statusFiltro))
    .reduce((s,f)=>s+(+f.valor||0),0);

function receitaRealizadaProjeto(pid){

    .filter(f=>f.projetoId===pid && f.tipo==="receita" && f.status==="realizado")
    .reduce((s,f)=>s+(+f.valor||0),0);

function progressoProjeto(pid){
  // atividades canceladas não contam no andamento físico
  const ats=DB.data.atividades.filter(a=>a.projetoId===pid && a.status!=="Cancelada");
  if(!ats.length) return 0;

function margemProjeto(p){

/* ============================================================
   STATUS DO PROJETO — calculado automaticamente a partir dos dados reais.
   "Cancelado" vem de uma ação explícita do gestor (✕ no Resumo) OU é
   deduzido quando o Status da captação é "11 - Projeto Cancelado" ou
   quando TODAS as atividades do cronograma foram canceladas.
   Atividades canceladas não contam para os demais estados.
   Todos os demais estados (Planejado, Em andamento, Em risco, Concluído)
   são recalculados sempre que os dados mudam — nunca ficam desatualizados.
   ============================================================ */
/* motivo do cancelamento AUTOMÁTICO ("" quando não se aplica) */
function motivoCancelamentoAuto(p){
  if(p.statusCaptacao===STATUS_CAPTACAO_CANCELADO) return "Status da captação: "+STATUS_CAPTACAO_CANCELADO+".";
  const todas=DB.data.atividades.filter(a=>a.projetoId===p.id);
  if(todas.length && todas.every(a=>a.status==="Cancelada")) return "Todas as atividades do cronograma foram canceladas.";
  return "";
}
function statusCalculado(p){
  // Cancelado manualmente prevalece
  if(p.status==="Cancelado") return "Cancelado";
  if(motivoCancelamentoAuto(p)) return "Cancelado";

  const hoje=todayStr();
  // atividades canceladas não pesam no status (nem atraso, nem conclusão)
  const ats=DB.data.atividades.filter(a=>a.projetoId===p.id && a.status!=="Cancelada");
  const fin=DB.data.financeiro.filter(f=>f.projetoId===p.id);

  // 1) Concluído: existem atividades e todas estão concluídas (status ou 100%)
  if(ats.length && ats.every(a=>a.status==="Concluída" || (+a.progresso||0)>=100)){
    return "Concluído";
  }

  // 2) Em risco: qualquer sinal real de atraso
  const atividadeAtrasada=ats.some(a=>{
    if(!a.dataFimPrev || a.status==="Concluída" || (+a.progresso||0)>=100) return false;
    return daysBetween(hoje,a.dataFimPrev)<0;
  });
  const financeiroVencido=fin.some(f=>
    f.status==="previsto" && f.data && daysBetween(hoje,f.data)<0
  );
  const prazoGeralVencido=p.dataFim && daysBetween(hoje,p.dataFim)<0;

  if(atividadeAtrasada || financeiroVencido || prazoGeralVencido){
    return "Em risco";
  }

  // 3) Em andamento: já tem atividade avançando, horas apontadas, ou já passou do início
  const horasDoProjeto=DB.data.horas.some(h=>h.projetoId===p.id);
  const temAtividadeEmAndamento=ats.some(a=>a.status==="Em andamento" || (+a.progresso||0)>0);
  const jaComecou=p.dataInicio && daysBetween(hoje,p.dataInicio)<=0;

  if(temAtividadeEmAndamento || horasDoProjeto || jaComecou){
    return "Em andamento";
  }

  // 4) Ainda não começou
  return "Planejado";
}

/* motivo do status calculado, usado como tooltip/explicação na UI */
function motivoStatusCalculado(p){
  const s=statusCalculado(p);
  const hoje=todayStr();
  const ats=DB.data.atividades.filter(a=>a.projetoId===p.id && a.status!=="Cancelada");
  const fin=DB.data.financeiro.filter(f=>f.projetoId===p.id);
  if(s==="Cancelado") return p.status==="Cancelado"?"Marcado manualmente como cancelado.":motivoCancelamentoAuto(p);
  if(s==="Concluído") return "Todas as atividades do cronograma estão concluídas.";
  if(s==="Em risco"){
    const motivos=[];
    const atrasadas=ats.filter(a=>a.dataFimPrev && a.status!=="Concluída" && (+a.progresso||0)<100 && daysBetween(hoje,a.dataFimPrev)<0);
    if(atrasadas.length) motivos.push(`${atrasadas.length} atividade(s) atrasada(s)`);
    const finVencido=fin.filter(f=>f.status==="previsto" && f.data && daysBetween(hoje,f.data)<0);
    if(finVencido.length) motivos.push(`${finVencido.length} lançamento(s) financeiro(s) vencido(s)`);
    if(p.dataFim && daysBetween(hoje,p.dataFim)<0) motivos.push("prazo geral do projeto vencido");
    return motivos.length? motivos.join(", ")+"." : "Sinal de atraso detectado.";
  }
  if(s==="Em andamento") return "Atividades em progresso ou horas já executadas no projeto.";
  return "Ainda não há atividades, horas ou datas indicando início dos trabalhos.";
}
/* semana (segunda a domingo) em que uma data cai — usada na "semana de referência" das MDS */
function semanaDaData(d){
  const dow=new Date(d+"T00:00:00").getDay();           // 0=dom ... 6=sáb
  const ini=addDays(d,-(dow===0?6:dow-1));
  return {ini, fim:addDays(ini,6)};
}
/* semana corrente (segunda a domingo) usada pela sessão SPRINT do Painel Geral */
function limitesSemanaCorrente(){
  const hoje=todayStr();
  const dow=new Date(hoje+"T00:00:00").getDay();      // 0=dom ... 6=sáb
  const diasDesdeSegunda=dow===0?6:dow-1;
  const diasAteFim=(7-dow)%7;                          // até o domingo
  return {ini:addDays(hoje,-diasDesdeSegunda), fim:addDays(hoje,diasAteFim), diasAteFim};
}

/* ============================================================
   OCUPAÇÃO SEMANAL (gráfico da sessão SPRINT do Painel Geral)
   - horas planejadas: horas previstas de cada pessoa nas atividades,
     distribuídas pelos dias úteis (mesma regra da aba Ocupação), somando
     apenas os dias úteis (seg-sex) da semana exibida, em TODOS os projetos.
   - capacidade: 40h por semana (padrão), editável por pessoa e por semana
     (feriado, licença, férias...). Gravada na tabela capacidade_semanal do
     Supabase; se a tabela ainda não existir, usa o localStorage do navegador.
   ============================================================ */
const CAPACIDADE_SEMANAL_PADRAO=40;
const CAPSEM={ mapa:{}, remoto:false };   // mapa: {"colaboradorId|AAAA-MM-DD(segunda)": horas}
const CAPSEM_LS="pmo_capacidade_semanal";
const capSemKey=(colabId,semanaIni)=>colabId+"|"+semanaIni;
async function carregarCapacidadeSemanal(){
  try{
    const rows=toCamel(await sbFetch("capacidade_semanal?select=*"))||[];
    CAPSEM.mapa={}; rows.forEach(r=>{ CAPSEM.mapa[capSemKey(r.colaboradorId,r.semanaInicio)]=+r.horas; });
    CAPSEM.remoto=true;
  }catch(e){
    console.warn("[PMO] tabela capacidade_semanal indisponível — usando localStorage:",e.message||e);
    CAPSEM.remoto=false;
    try{ CAPSEM.mapa=JSON.parse(localStorage.getItem(CAPSEM_LS)||"{}")||{}; }catch(_){ CAPSEM.mapa={}; }
  }
}
function capacidadeSemanalPessoa(colabId,semanaIni){
  const v=CAPSEM.mapa[capSemKey(colabId,semanaIni)];
  return (v===undefined||v===null||isNaN(v)) ? CAPACIDADE_SEMANAL_PADRAO : +v;
}
async function salvarCapacidadeSemanal(colabId,semanaIni,horas){
  const k=capSemKey(colabId,semanaIni), anterior=CAPSEM.mapa[k];
  const volta=(horas===null||horas===""||isNaN(horas)||+horas===CAPACIDADE_SEMANAL_PADRAO); // = padrão → remove o ajuste
  if(volta) delete CAPSEM.mapa[k]; else CAPSEM.mapa[k]=+horas;
  try{
    if(CAPSEM.remoto){
      if(volta) await sbDeleteWhere("capacidade_semanal", qsEq("colaborador_id",colabId)+"&"+qsEq("semana_inicio",semanaIni));
      else await sbUpsert("capacidade_semanal",{colaborador_id:colabId,semana_inicio:semanaIni,horas:+horas},{onConflict:"colaborador_id,semana_inicio"});
    } else {
      localStorage.setItem(CAPSEM_LS,JSON.stringify(CAPSEM.mapa));
    }
  }catch(e){
    if(anterior===undefined) delete CAPSEM.mapa[k]; else CAPSEM.mapa[k]=anterior;
    toast("Erro ao salvar a carga horária: "+(e.message||e));
  }
}
/* horas planejadas por pessoa na semana (sem distribuir pelos dias úteis):
   - usa as horas RESTANTES de cada pessoa na atividade = horas previstas ×
     (100% − % concluído), contadas inteiras na semana do prazo final
     (dataFimPrev). Atividade concluída não pesa.
   - atividades ATRASADAS (prazo já passou e ainda não concluídas) são puxadas
     para a semana corrente do SPRINT, pois ou serão feitas agora ou precisarão
     ser repactuadas se estourarem o limite de horas.
   Só aparece quem tem horas restantes na semana. */
/* horas EXECUTADAS por pessoa dentro de uma semana: apontamentos com data na
   semana + horas "Executada" das atividades (sem apontamento da pessoa),
   distribuídas pelos dias úteis do período real/previsto da atividade. */
function horasExecutadasSemanaPorPessoa(semanaIni){
  const semanaFim=addDays(semanaIni,6), out={};
  const add=(cid,pid,h)=>{ if(!cid||!(h>0)) return;
    const p=out[cid]||(out[cid]={h:0,porProjeto:{}}); p.h+=h; p.porProjeto[pid]=(p.porProjeto[pid]||0)+h; };
  const apont=new Set(), subst=chavesApontamentoSubstituidas();
  DB.data.horas.forEach(h=>{
    if(h.atividadeId && h.colaboradorId) apont.add(h.atividadeId+"|"+h.colaboradorId);
    if(h.atividadeId && h.colaboradorId && subst.has(h.atividadeId+"|"+h.colaboradorId)) return; // substituído pela "Executada"
    if(h.data>=semanaIni && h.data<=semanaFim) add(h.colaboradorId,h.projetoId,+h.horas||0);
  });
  DB.data.atividades.forEach(a=>{
    (Array.isArray(a.estimativasPessoas)?a.estimativasPessoas:[]).forEach(x=>{
      if(!x.colaboradorId || !(parseFloat(x.horasExecutadas)>0) || (apont.has(a.id+"|"+x.colaboradorId) && !subst.has(a.id+"|"+x.colaboradorId))) return;
      const partes=partesExecucaoItem(x);
      partes.log.forEach(e=>{ if(e.data>=semanaIni && e.data<=semanaFim) add(x.colaboradorId,a.projetoId,e.horas); });
      const total=partes.legado;
      if(!(total>0.0001)) return;
      const per=periodoExecDistribuida(a);
      if(!per) return;
      const {ini,fim}=per;
      let dias=diasUteisEntre(ini,fim); if(!dias.length) dias=[fim];
      const naSemana=dias.filter(d=>d>=semanaIni && d<=semanaFim).length;
      if(naSemana) add(x.colaboradorId,a.projetoId,total*naSemana/dias.length);
    });
  });
  return out;
}
/* Ocupação semanal por pessoa. Liderança e Equipe veem o total de cada pessoa,
   inclusive as horas em projetos que não enxergam ("Outros projetos", sem
   nomes); o Colaborador vê só a própria linha. */
function ocupacaoSemanalPessoas(semanaIni){
  let lista=comOutrosProjetos(()=>ocupacaoSemanalPessoasBase(semanaIni));
  if(ehPerfilColaborador()) lista=lista.filter(p=>p.id===(USER.current&&USER.current.colabId));
  return lista;
}
function ocupacaoSemanalPessoasBase(semanaIni){
  const semanaFim=addDays(semanaIni,6);
  const hoje=todayStr();
  const ehSemanaCorrente=(semanaIni===limitesSemanaCorrente().ini);
  const pessoas={};
  DB.data.atividades.forEach(a=>{
    if(a.status==="Cancelada" || a.status==="Concluída") return;
    const prog=Math.min(100,Math.max(0,+a.progresso||0));
    if(prog>=100) return;
    const atrasada=!!a.dataFimPrev && a.dataFimPrev<hoje;
    // atrasada que NÃO está na sprint (não foi retornada para a sprint desta
    // semana e o prazo venceu antes da semana corrente): o saldo dela não entra
    // na carga da semana — aparece à parte, como "atrasadas fora da sprint".
    const foraSprint=atrasada && !atividadeNaSprint(a) && a.dataFimPrev<limitesSemanaCorrente().ini;
    const fator=(100-prog)/100;
    // SALDO (horas ainda não executadas) dividido igualmente pelos dias úteis
    // de hoje (ou do início previsto, se for futuro) até o término previsto;
    // cada semana mostra só a fatia dos seus dias úteis. Sem prazo, ou já
    // atrasada, o saldo todo fica na semana corrente.
    let fracaoSemana=0;
    if(!a.dataFimPrev || atrasada){
      fracaoSemana=ehSemanaCorrente?1:0;
    } else {
      let ini=(a.dataInicioPrev && a.dataInicioPrev>hoje)?a.dataInicioPrev:hoje;
      if(ini>a.dataFimPrev) ini=a.dataFimPrev;
      const dias=diasUteisEntre(ini,a.dataFimPrev);
      if(dias.length){
        fracaoSemana=dias.filter(d=>d>=semanaIni&&d<=semanaFim).length/dias.length;
      } else {
        // intervalo sem dia útil (ex.: só fim de semana): tudo na semana do término
        fracaoSemana=(a.dataFimPrev>=semanaIni&&a.dataFimPrev<=semanaFim)?1:0;
      }
    }
    if(fracaoSemana<=0) return;
    (a.estimativasPessoas||[]).forEach(e=>{
      // as horas já executadas ficam na semana em que foram lançadas (ver
      // horasExecutadasSemanaPorPessoa); aqui entra só o que falta executar.
      const execTotal=parseFloat(e.horasExecutadas)||0;
      const temExec=execTotal>0;
      if(!a.dataFimPrev && !temExec) return; // sem prazo e sem execução: nada a distribuir
      const restante=temExec?Math.max(0,(+e.horas||0)-execTotal):(+e.horas||0)*fator;
      const h=restante*fracaoSemana;
      if(!e.colaboradorId||h<=0) return;
      const p=pessoas[e.colaboradorId]||(pessoas[e.colaboradorId]={id:e.colaboradorId,planejado:0,atrasado:0,foraSprint:0,porProjeto:{},porAtividade:[]});
      p.porAtividade.push({atividadeId:a.id,projetoId:a.projetoId,horas:h,atrasada,foraSprint});
      if(foraSprint){ p.foraSprint+=h; return; }
      p.planejado+=h; if(atrasada) p.atrasado+=h;
      p.porProjeto[a.projetoId]=(p.porProjeto[a.projetoId]||0)+h;
    });
  });
  // acrescenta as horas já executadas na semana (inclui quem só tem executadas)
  const exec=horasExecutadasSemanaPorPessoa(semanaIni);
  Object.keys(exec).forEach(cid=>{
    const p=pessoas[cid]||(pessoas[cid]={id:cid,planejado:0,atrasado:0,foraSprint:0,porProjeto:{},porAtividade:[]});
    p.executado=exec[cid].h; p.execPorProjeto=exec[cid].porProjeto;
  });
  return Object.values(pessoas).filter(p=>p.planejado>0.0001||p.executado>0.0001||p.foraSprint>0.0001).map(p=>({executado:0,execPorProjeto:{},...p,nome:nomeColab(p.id),capacidade:capacidadeSemanalPessoa(p.id,semanaIni)}))
    .sort((a,b)=>((b.planejado+b.executado)-b.capacidade*OCUP_LIMITE)-((a.planejado+a.executado)-a.capacidade*OCUP_LIMITE)||a.nome.localeCompare(b.nome,"pt-BR"));
}
/* Faixas da ocupação semanal, em % da carga semanal da pessoa (padrão 40 h):
   até 70% = verde · 70% a 80% = laranja (chegando ao limite) ·
   80% em diante = vermelho (acima do limite). O marcador │ fica nos 80%. */
const OCUP_ALERTA=0.70, OCUP_LIMITE=0.80;
/* HTML do gráfico (barras horizontais: executado + planejado por faixa + em aberto + marcador do limite de 80%) */
function ocupacaoSemanalHtml(semanaIni){
  const lista=ocupacaoSemanalPessoas(semanaIni);
  if(!lista.length) return `<div class="empty" style="padding:22px"><span class="ic">✓</span><p>Ninguém com horas previstas para esta semana.</p></div>`;
  const escala=Math.max(CAPACIDADE_SEMANAL_PADRAO,...lista.map(p=>Math.max(p.capacidade,p.planejado+p.executado)));
  const pct=h=>Math.max(0,Math.min(100,h/escala*100));
  const podeEditar=isGestor();
  return lista.map(p=>{
    const carga=p.executado+p.planejado;   // executadas + restantes da semana
    const lim=p.capacidade*OCUP_LIMITE, alerta=p.capacidade*OCUP_ALERTA;   // 80% e 70% da carga semanal
    const aberto=Math.max(0,lim-carga), exc=Math.max(0,carga-lim);
    const ratio=p.capacidade>0? carga/p.capacidade : (carga>0?9:0);
    const pctOcup=p.capacidade>0? Math.round(ratio*100) : null;
    const nivel=carga<=0.0001?"ok":ratio>=OCUP_LIMITE-0.0001?"danger":ratio>=OCUP_ALERTA-0.0001?"warn":"ok";
    // a parte PLANEJADA da barra (depois do executado) é pintada pela faixa em que
    // cai na carga total: o que fica abaixo de 70% é verde, entre 70% e 80% é
    // laranja e de 80% em diante é vermelho
    const faixa=(a,b)=>Math.max(0,Math.min(carga,b)-Math.max(p.executado,a));
    const plVerde=faixa(0,alerta), plLaranja=faixa(alerta,lim), plVermelho=faixa(lim,Infinity);
    const ajustada=Math.abs(p.capacidade-CAPACIDADE_SEMANAL_PADRAO)>0.001;
    // saldo detalhado por atividade (para conferir de onde vem cada hora)
    const linhaAtiv=x=>"• "+nomeAtividade(x.atividadeId)+" ("+((getProjeto(x.projetoId)||{}).codigo||nomeProjeto(x.projetoId))+"): "+fmtNum(x.horas,1)+" h"+(x.atrasada?" — atrasada":"");
    // horas em projetos sem acesso viram uma linha só, sem nomes
    const ehOutro=x=>x.projetoId===PROJETO_OUTROS;
    const linhaOutros=lst=>{ const h=lst.filter(ehOutro).reduce((t,x)=>t+x.horas,0); return h>0.04?["• Outros projetos (sem acesso): "+fmtNum(h,1)+" h"]:[]; };
    const naCarga=p.porAtividade.filter(x=>!x.foraSprint).sort((a,b)=>b.horas-a.horas);
    const fora=p.porAtividade.filter(x=>x.foraSprint).sort((a,b)=>b.horas-a.horas);
    const tip=([...naCarga.filter(x=>!ehOutro(x)).map(linhaAtiv),...linhaOutros(naCarga)].join("\n")||"Sem horas previstas")
      +(fora.length?"\n\nATRASADAS FORA DA SPRINT (não somadas na carga):\n"+[...fora.filter(x=>!ehOutro(x)).map(linhaAtiv),...linhaOutros(fora)].join("\n"):"");
    const nItensSaldo=p.porAtividade.filter(x=>!ehOutro(x)).length+(p.porAtividade.some(ehOutro)?1:0);
    const tipExec=Object.entries(p.execPorProjeto).sort((a,b)=>b[1]-a[1]).map(([pid,h])=>(pid===PROJETO_OUTROS?"Outros projetos (sem acesso)":nomeProjetoCod(pid))+": "+fmtNum(h,1)+" h").join("\n");
    const tipFull=(tipExec?"EXECUTADAS na semana:\n"+tipExec+"\n\nPLANEJADAS (restantes):\n":"")+tip+(p.atrasado>0.04?"\n— inclui "+fmtNum(p.atrasado,1)+" h de atividades atrasadas":"");
    const atrasTxt=(p.atrasado>0.04?` <span style="color:var(--danger)">(inclui ${fmtNum(p.atrasado,1)} h de atividades atrasadas)</span>`:"")
      +(p.foraSprint>0.04?` <span style="color:var(--ink-faint)">· + ${fmtNum(p.foraSprint,1)} h atrasadas fora da sprint (não somadas)</span>`:"");
    const execTxt=p.executado>0.04?`<b style="color:var(--info)">${fmtNum(p.executado,1)} h</b> executadas · `:"";
    const corNivel=nivel==="danger"?"var(--danger)":nivel==="warn"?"var(--warn)":"var(--ok)";
    const ocupTxt=pctOcup!=null?`<b style="color:${corNivel}">${pctOcup}%</b> da semana · `:"";
    const limTxt=`${fmtNum(lim,1)} h`;
    const txt=ocupTxt+execTxt+(nivel==="danger"
      ? `<b style="color:var(--danger)">${fmtNum(p.planejado,1)} h</b> planejadas · <b style="color:var(--danger)">${exc>0.04?fmtNum(exc,1)+" h acima do limite":"no limite"} de 80% (${limTxt})</b>`
      : `<b>${fmtNum(p.planejado,1)} h</b> planejadas · ${nivel==="warn"?`<b style="color:var(--warn)">chegando ao limite</b> · `:""}<b>${fmtNum(aberto,1)} h</b> em aberto até o limite de 80% (${limTxt})`)+atrasTxt;
    const campo=podeEditar
      ? `<input type="number" min="0" max="80" step="0.5" value="${p.capacidade}" data-capsem-colab="${p.id}" data-capsem-semana="${semanaIni}"
           style="width:68px;padding:4px 6px;border:1px solid ${ajustada?"var(--warn)":"var(--line)"};border-radius:6px;background:${ajustada?"var(--warn-bg)":"var(--surface)"}" title="Carga semanal desta pessoa nesta semana (padrão ${CAPACIDADE_SEMANAL_PADRAO}h). O limite de ocupação é 80% dela. Reduza em caso de feriado, licença ou férias.">
         <span style="font-size:11.5px;color:var(--ink-faint)">h</span>
         ${ajustada?`<button class="btn-icon" data-capsem-reset="${p.id}" data-capsem-semana="${semanaIni}" title="Voltar para ${CAPACIDADE_SEMANAL_PADRAO}h">↺</button>`:""}`
      : `<span style="font-size:12px;color:var(--ink-soft)">${fmtNum(p.capacidade,1)} h${ajustada?" (ajustada)":""}</span>`;
    return `<div style="display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:6px 14px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line-soft)">
      <div style="font-weight:600;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(p.nome)}">${esc(p.nome)}</div>
      <div>
        <div title="${esc(tipFull)}" style="position:relative;height:16px;border-radius:5px;background:var(--line-soft);overflow:hidden;display:flex">
          <div style="width:${pct(p.executado)}%;background:var(--info)" title="Executadas na semana"></div>
          <div style="width:${pct(plVerde)}%;background:var(--ok)" title="Planejado até 70%"></div>
          <div style="width:${pct(plLaranja)}%;background:var(--warn)" title="Planejado entre 70% e 80% (chegando ao limite)"></div>
          <div style="width:${pct(plVermelho)}%;background:var(--danger)" title="Planejado acima do limite (80% em diante)"></div>
          <div style="width:${pct(aberto)}%;background:repeating-linear-gradient(45deg,var(--accent-soft),var(--accent-soft) 4px,#ffffff 4px,#ffffff 8px)" title="Em aberto até o limite de 80%"></div>
          <div style="position:absolute;top:0;bottom:0;left:calc(${pct(lim)}% - 1px);width:2px;background:var(--ink)" title="Limite: 80% da carga semanal (${limTxt})"></div>
        </div>
        <div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px">${txt}</div>
        ${p.porAtividade.length?`<details style="font-size:11.5px;color:var(--ink-soft);margin-top:2px">
          <summary style="cursor:pointer;color:var(--ink-faint)">ver saldo por atividade (${nItensSaldo})</summary>
          <div style="white-space:pre-line;margin-top:3px">${esc(tip)}</div></details>`:""}
      </div>
      <div style="display:flex;align-items:center;gap:4px;justify-content:flex-end">${campo}</div>
    </div>`;
  }).join("")
  + `<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-faint);margin-top:10px">
      <span><i style="display:inline-block;width:10px;height:10px;background:var(--info);border-radius:2px"></i> executado</span>
      <span><i style="display:inline-block;width:10px;height:10px;background:var(--ok);border-radius:2px"></i> planejado (até 70%)</span>
      <span><i style="display:inline-block;width:10px;height:10px;background:var(--warn);border-radius:2px"></i> chegando ao limite (70–80%)</span>
      <span><i style="display:inline-block;width:10px;height:10px;background:var(--danger);border-radius:2px"></i> acima do limite (80% em diante)</span>
      <span><i style="display:inline-block;width:10px;height:10px;background:var(--accent-soft);border:1px solid var(--line);border-radius:2px"></i> em aberto (até 80%)</span>
      <span>│ limite: 80% da carga semanal da pessoa</span></div>`;
}

/* alertas: retorna lista de {tipo,secao,sev,titulo,desc,dias}
   secao: "vencidos" | "sprint" | "reunioes" | "duplicidades" (usado pelo Painel Geral) */
function calcularAlertas(){
  const hoje=todayStr(); const out=[];
  const diasAteFimSemana=limitesSemanaCorrente().diasAteFim;
  DB.data.atividades.forEach(a=>{
    if(!a.dataFimPrev || a.status==="Concluída" || a.status==="Cancelada" || (+a.progresso||0)>=100) return;
    const d=daysBetween(hoje,a.dataFimPrev);
    // fonte principal de atribuição: estimativasPessoas (o jeito real de alocar
    // gente numa atividade hoje). RACI "R" só como fallback, caso a atividade
    // não tenha estimativas de horas por pessoa preenchidas.
    const proj=getProjeto(a.projetoId);
    const resp=nomesResponsaveisAtividade(a,proj).join(", ");
    // atrasada, mas com prazo DENTRO da semana corrente: permanece na SPRINT
    // (ainda dá tempo de entregar). Só vai para "vencidos" quando a semana virar.
    // Atrasada e RETORNADA para a sprint desta semana (sprintSemana): também
    // fica na SPRINT, com o prazo previsto original preservado.
    const naSprint=atividadeNaSprint(a);
    if(d<0) out.push({tipo:"fisico",secao:(a.dataFimPrev>=limitesSemanaCorrente().ini||naSprint?"sprint":"vencidos"),sev:"danger",dias:d,
      rotulo:naSprint?"Atrasada · retornada à sprint":"Atividade atrasada", titulo:`Atividade atrasada: ${a.nome}`,
      desc:nomeProjetoCod(a.projetoId), descHtml:rotuloProjetoHtml(proj),
      meta:`venceu há ${Math.abs(d)} dia(s)${naSprint?" (prazo previsto mantido)":""} · ${a.progresso||0}% concluído`,
      responsavel:resp, projetoId:a.projetoId, atividadeId:a.id, notasProgresso:textoAnotacoesAtividade(a)});
    else if(d<=diasAteFimSemana) out.push({tipo:"fisico",secao:"sprint",sev:"warn",dias:d,
      rotulo:"Prazo próximo", titulo:`Prazo próximo: ${a.nome}`,
      desc:nomeProjetoCod(a.projetoId), descHtml:rotuloProjetoHtml(proj),
      meta:`vence em ${d} dia(s) · ${a.progresso||0}% concluído`,
      responsavel:resp, projetoId:a.projetoId, atividadeId:a.id, notasProgresso:textoAnotacoesAtividade(a)});
  });
  DB.data.financeiro.forEach(f=>{
    if(f.status!=="previsto" || !f.data) return;
    const d=daysBetween(hoje,f.data);
    const lbl=f.tipo==="receita"?"Receita a receber":"Despesa a pagar";
    const proj=getProjeto(f.projetoId);
    const resp=proj && proj.gerente ? proj.gerente : null;
    if(d<0) out.push({tipo:"financeiro",secao:"vencidos",sev:"danger",dias:d,
      rotulo:`${lbl} vencida`, titulo:`${lbl} vencida: ${f.descricao||nomeRubrica(f.rubricaId)}`,
      desc:nomeProjetoCod(f.projetoId), descHtml:rotuloProjetoHtml(proj),
      meta:`${fmtBRL(f.valor)} · venceu há ${Math.abs(d)} dia(s)`,
      responsavel:resp, projetoId:f.projetoId, financeiroId:f.id});
    else if(d<=diasAteFimSemana) out.push({tipo:"financeiro",secao:"sprint",sev:"warn",dias:d,
      rotulo:`${lbl} próxima`, titulo:`${lbl} próxima: ${f.descricao||nomeRubrica(f.rubricaId)}`,
      desc:nomeProjetoCod(f.projetoId), descHtml:rotuloProjetoHtml(proj),
      meta:`${fmtBRL(f.valor)} · vence em ${d} dia(s)`,
      responsavel:resp, projetoId:f.projetoId, financeiroId:f.id});
  });
  // reuniões: futuras (até 7 dias à frente, para preparar pauta/providências)
  // e passadas (sem limite de tempo) que ainda não receberam "OK" — a única
  // forma de uma reunião sair deste painel é o botão "OK" (marcarReuniaoOkRapido),
  // nunca pelo simples fato da data já ter passado.
  DB.data.projetos.forEach(p=>{
    (p.reunioes||[]).forEach(r=>{
      if(!r.data || r.alertaDispensado) return;
      const d=daysBetween(hoje,r.data);
      if(d>7) return;
      const parts=(r.participantes||[]).filter(Boolean).join(", ");
      const quando=d===0?"hoje":d===1?"amanhã":d>1?`em ${d} dia(s)`:d===-1?"ontem":`há ${Math.abs(d)} dia(s)`;
      // dados que ainda faltam preencher (aparecem na sessão de reuniões)
      const ata=r.ata||{}, faltando=[];
      if(!parts) faltando.push("participantes");
      if(d<0){
        if(!String(ata.objetivo||"").trim()) faltando.push("objetivo da ata");
        if(!(ata.topicos||[]).some(t=>t&&(t.tema||t.notas))) faltando.push("tópicos discutidos");
        if(!(ata.saidas||[]).some(x=>x&&x.descricao)) faltando.push("encaminhamentos");
      } else if(!r.hora) faltando.push("horário");
      out.push({tipo:"reuniao",secao:"reunioes",faltando,sev:d<0?"danger":d<=2?"warn":"info",dias:d,
        rotulo:"Reunião", titulo:`Reunião: ${r.titulo||"(sem título)"}`,
        desc:`${rotuloProjeto(p)}${parts?" · Participantes: "+parts:""}`,
        descHtml:`${rotuloProjetoHtml(p)}${parts?" · Participantes: "+esc(parts):""}`,
        meta:`${quando}${r.hora?" às "+r.hora:""}`,
        responsavel:null, projetoId:p.id, reuniaoId:r.id});
    });
  });
  // atividades duplicadas: mesmo nome (ignorando acentos/maiúsculas) repetido
  // no cronograma de um mesmo projeto ou em mais de um projeto — geralmente
  // sinal de cadastro em duplicidade. A sessão Rotinas fica de fora dessa
  // checagem: nela é normal e esperado repetir nomes de atividade entre
  // diferentes rotinas/projetos (ex.: "Reunião semanal" em vários rotineiros).
  const gruposDuplicados={};
  DB.data.atividades.forEach(a=>{
    if(a.duplicataIgnorada) return;
    const proj=getProjeto(a.projetoId);
    if(!proj || proj.sessaoId==="rotinas" || proj.sessaoId==="articulacao") return;
    const chave=normTxt(a.nome);
    if(!chave) return;
    (gruposDuplicados[chave]=gruposDuplicados[chave]||[]).push(a);
  });
  Object.values(gruposDuplicados).forEach(grupo=>{
    if(grupo.length<2) return;
    grupo.forEach(a=>{
      const outras=grupo.filter(x=>x.id!==a.id);
      const noMesmoProjeto=outras.filter(x=>x.projetoId===a.projetoId).length;
      const outrosProjetosNomes=[...new Set(outras.filter(x=>x.projetoId!==a.projetoId).map(x=>nomeProjetoCod(x.projetoId)))];
      const partes=[];
      if(noMesmoProjeto) partes.push(`${noMesmoProjeto} vez(es) no mesmo cronograma`);
      if(outrosProjetosNomes.length) partes.push("em: "+outrosProjetosNomes.join(", "));
      const proj=getProjeto(a.projetoId);
      const resp=nomesResponsaveisAtividade(a,proj).join(", ");
      out.push({tipo:"duplicada",secao:"duplicidades",sev:"warn",dias:9999, // não é baseado em prazo; sempre aparece por último
        rotulo:"Atividade duplicada", titulo:`Atividade duplicada: ${a.nome}`,
        desc:`${nomeProjetoCod(a.projetoId)} · também aparece ${partes.join(" · ")}`,
        descHtml:`${rotuloProjetoHtml(proj)} · também aparece ${esc(partes.join(" · "))}`,
        responsavel:resp, projetoId:a.projetoId, atividadeId:a.id});
    });
  });
  return out.sort((a,b)=>a.dias-b.dias);
}

/* ============================================================
   OCUPAÇÃO / CAPACIDADE DA EQUIPE
   Motor de cálculo usado pela aba "Ocupação da Equipe" de cada projeto.

   Premissas (definidas com o gestor):
   - Cada atividade tem uma lista opcional "estimativasPessoas": [{colaboradorId,horas}],
     preenchida manualmente ao criar/editar a atividade — um colaborador (interno ou
     parceiro vinculado ao projeto) e a quantidade de horas previstas PARA ELE especificamente.
   - As pessoas "alocadas" numa atividade são exatamente as que aparecem em estimativasPessoas
     (não depende mais de marcação "R" na Matriz RACI).
   - Cada pessoa recebe exatamente a quantidade de horas que foi atribuída A ELA — não é
     dividida nem multiplicada por mais ninguém.
   - Para cada pessoa, essas horas previstas são distribuídas igualmente pelos dias ÚTEIS
     (seg-sex) entre dataInicioPrev e dataFimPrev da atividade.
   - Capacidade padrão: 8h úteis por dia, por pessoa, IGUAL para todas.
   - A ocupação é sempre calculada de forma GLOBAL (todas as atividades de todos os
     projetos), porque uma pessoa pode estar cheia por causa de OUTRO projeto — é
     justamente isso que o gestor precisa enxergar.
   ============================================================ */
const CAPACIDADE_DIARIA_PADRAO=8;

function diasUteisEntre(dataIni,dataFim){
  if(!dataIni||!dataFim) return [];
  const dias=[];
  let cursor=new Date(dataIni+"T00:00:00");
  const fim=new Date(dataFim+"T00:00:00");
  if(cursor>fim) return [];
  while(cursor<=fim){
    const dow=cursor.getDay(); // 0=dom, 6=sáb
    if(dow!==0&&dow!==6){
      dias.push(cursor.getFullYear()+"-"+pad(cursor.getMonth()+1)+"-"+pad(cursor.getDate()));
    }
    cursor.setDate(cursor.getDate()+1);
  }
  return dias;
}

/* pessoas alocadas numa atividade: todas as que têm uma estimativa de horas própria */
function pessoasAlocadasAtividade(a){
  const ids=new Set();
  (a.estimativasPessoas||[]).forEach(e=>{ if(e.colaboradorId) ids.add(e.colaboradorId); });
  return [...ids];
}
/* IDs de quem está marcado como "R" (Responsável) na Matriz RACI de uma atividade */
function responsaveisRaciIds(proj,atividadeId){
  if(!proj || !proj.raci) return [];
  const raci=proj.raci[atividadeId]||{};
  return Object.entries(raci).filter(([,papel])=>papel==="R").map(([pessoaId])=>pessoaId);
}
/* responsável(is) de uma atividade: usa o campo direto "responsaveisIds" (usado em
   sessões sem Matriz RACI, como Rotinas — preenchido automaticamente a partir do
   Apontamento de Horas e/ou editável na própria atividade), com fallback para as
   pessoas alocadas por estimativa de horas e, por fim, para quem está marcado
   como "R" na Matriz RACI (quando a sessão tiver essa aba).
   IMPORTANTE: "responsaveisIds" só é considerado em sessões SEM RACI. Em
   projetos com RACI, esse campo não aparece no formulário "Editar atividade"
   (fica "invisível" para o usuário) — então se ele tiver algum valor antigo
   gravado (ex.: atividade criada a partir de uma saída de reunião, antes desta
   checagem existir), ele nunca poderia ser visto nem corrigido pela tela, e
   ficava sempre "grudado" como responsável, ignorando qualquer ajuste feito em
   "Horas previstas por colaborador" ou na própria Matriz RACI. Por isso, para
   projetos com RACI, ignoramos esse campo aqui e vamos direto para o fallback. */
function responsaveisIdsAtividade(a,proj){
  const usaCampo=sessaoUsaCampoResponsaveis(proj);
  if(usaCampo && Array.isArray(a.responsaveisIds) && a.responsaveisIds.length) return a.responsaveisIds.slice();
  const alocados=pessoasAlocadasAtividade(a);
  if(alocados.length) return alocados;
  // sessões sem RACI e sem o campo (Captação, Rotinas, Articulação): se ainda não
  // há horas por colaborador, mostra o responsável antigo já gravado, se houver
  const semRaci=!!(proj && (cfgSessao(proj.sessaoId).abasOcultas||[]).includes("raci"));
  if(semRaci && !usaCampo && Array.isArray(a.responsaveisIds) && a.responsaveisIds.length) return a.responsaveisIds.slice();
  return responsaveisRaciIds(proj,a.id);
}
/* true quando a sessão do projeto NÃO tem Matriz RACI e usa o campo direto
   "Responsável(is)" na atividade (ex.: Rotinas). Captação não tem RACI, mas
   também não usa esse campo: o responsável vem das horas por colaborador. */
function sessaoUsaCampoResponsaveis(proj){
  if(!proj) return false;
  const cfg=cfgSessao(proj.sessaoId);
  return (cfg.abasOcultas||[]).includes("raci") && !cfg.semCampoResponsaveis;
}
/* nomes dos responsáveis de uma atividade, prontos para exibição */
function nomesResponsaveisAtividade(a,proj){
  return responsaveisIdsAtividade(a,proj).map(nomeColab);
}
/* horas previstas de UMA pessoa específica numa atividade (0 se não estiver na lista) */
function horasPrevistasDaPessoa(a,colaboradorId){
  const item=(a.estimativasPessoas||[]).find(e=>e.colaboradorId===colaboradorId);
  return item ? (+item.horas||0) : 0;
}
/* soma de todas as horas previstas de uma atividade (todas as pessoas somadas) */
function totalHorasPrevistasAtividade(a){
  return (a.estimativasPessoas||[]).reduce((s,e)=>s+(+e.horas||0),0);
}

/* monta o mapa global: { colaboradorId: { "AAAA-MM-DD": horasAlocadas } }
   considerando TODAS as atividades com estimativas e datas válidas. */
function construirMapaOcupacaoGlobal(){
  const mapa={};
  DB.data.atividades.forEach(a=>{
    if(a.status==="Cancelada") return;
    const estimativas=a.estimativasPessoas||[];
    if(!estimativas.length) return;
    const dias=diasUteisEntre(a.dataInicioPrev,a.dataFimPrev);
    if(!dias.length) return;
    estimativas.forEach(e=>{
      const horas=+e.horas||0;
      if(!e.colaboradorId||horas<=0) return;
      const horasPorDia=horas/dias.length;
      mapa[e.colaboradorId]=mapa[e.colaboradorId]||{};
      dias.forEach(d=>{
        mapa[e.colaboradorId][d]=(mapa[e.colaboradorId][d]||0)+horasPorDia;
      });
    });
  });
  return mapa;
}

/* detalha, para um dia e pessoa específicos, quais atividades/projetos
   compõem a ocupação — usado no popover de detalhe do calendário. */
function detalheOcupacaoDia(colaboradorId,dia){
  const out=[];
  DB.data.atividades.forEach(a=>{
    if(a.status==="Cancelada") return;
    const horasPessoa=horasPrevistasDaPessoa(a,colaboradorId);
    if(horasPessoa<=0) return;
    const dias=diasUteisEntre(a.dataInicioPrev,a.dataFimPrev);
    if(!dias.includes(dia)) return;
    const horasDia=horasPessoa/dias.length;
    out.push({projetoId:a.projetoId, projetoNome:nomeProjeto(a.projetoId), atividadeId:a.id, atividadeNome:a.nome, horas:horasDia});
  });
  return out;
}

/* resume, para uma pessoa e um mês (formato "AAAA-MM"), a ocupação DIA A DIA:
   - horasTotalMes: soma de tudo que está alocado no mês (todos os projetos)
   - porProjeto: {projetoId:{nome,horas}} — quebra do total por projeto
   - horasLivres: soma das horas ainda livres na agenda (dias úteis com sobra de capacidade)
   - horasExcedentes: soma do que passa da capacidade diária (sinal de sobrecarga)
   - diasUteisMes / capacidadeTotalMes: contexto para montar indicadores de % ocupado
   Usado pela nova visão "Ocupação da Equipe" (Operação), por colaborador. */
function resumoOcupacaoPessoaMes(colaboradorId,mk,mapa){
  mapa=mapa||construirMapaOcupacaoGlobal();
  const [y,m]=mk.split("-").map(n=>+n);
  const diasNoMes=new Date(y,m,0).getDate();
  const porProjeto={};
  let horasTotalMes=0,horasLivres=0,horasExcedentes=0,diasUteisMes=0;
  for(let d=1; d<=diasNoMes; d++){
    const dow=new Date(y,m-1,d).getDay();
    if(dow===0||dow===6) continue;
    diasUteisMes++;
    const ymd=mk+"-"+pad(d);
    const alocado=(mapa[colaboradorId]&&mapa[colaboradorId][ymd])||0;
    horasTotalMes+=alocado;
    if(alocado<CAPACIDADE_DIARIA_PADRAO) horasLivres+=(CAPACIDADE_DIARIA_PADRAO-alocado);
    else horasExcedentes+=(alocado-CAPACIDADE_DIARIA_PADRAO);
    if(alocado>0){
      detalheOcupacaoDia(colaboradorId,ymd).forEach(x=>{
        porProjeto[x.projetoId]=porProjeto[x.projetoId]||{nome:x.projetoNome,horas:0};
        porProjeto[x.projetoId].horas+=x.horas;
      });
    }
  }
  return {porProjeto,horasTotalMes,horasLivres,horasExcedentes,diasUteisMes,
    capacidadeTotalMes:diasUteisMes*CAPACIDADE_DIARIA_PADRAO};
}

/* a partir de uma data desejada, caminha dia útil a dia útil somando a
   capacidade LIVRE da pessoa (8h - já alocado) até cobrir horasNecessarias.
   Retorna {inicioDisponivel, conclusaoEstimada, diasUteisUsados} ou null
   se não achar em ~2 anos (situação incomum, evita loop infinito). */
function proximaDisponibilidade(colaboradorId,horasNecessarias,dataDesejada,mapa){
  mapa=mapa||construirMapaOcupacaoGlobal();
  let cursor=new Date(Math.max(new Date(dataDesejada+"T00:00:00"), new Date(todayStr()+"T00:00:00")));
  let restante=horasNecessarias;
  let inicioDisponivel=null;
  let ultimoDia=null;
  for(let i=0;i<730 && restante>0.0001;i++){
    const dow=cursor.getDay();
    if(dow!==0&&dow!==6){
      const dia=cursor.getFullYear()+"-"+pad(cursor.getMonth()+1)+"-"+pad(cursor.getDate());
      const jaAlocado=(mapa[colaboradorId]&&mapa[colaboradorId][dia])||0;
      const livre=Math.max(0,CAPACIDADE_DIARIA_PADRAO-jaAlocado);
      if(livre>0){
        if(!inicioDisponivel) inicioDisponivel=dia;
        restante-=livre;
        ultimoDia=dia;
      }
    }
    cursor.setDate(cursor.getDate()+1);
  }
  if(!inicioDisponivel) return null;
  return {inicioDisponivel, conclusaoEstimada:ultimoDia};
}


/* ============================================================
   GRÁFICOS (SVG, sem bibliotecas)
   ============================================================ */
function barChart(data,opts){
  opts=opts||{};
  if(!data.length||data.every(d=>d.value===0))
    return `<div class="empty" style="padding:30px"><span class="ic">▱</span><p>Sem dados para o período.</p></div>`;
  const W=opts.width||620, n=data.length, gap=14;
  const max=Math.max(...data.map(d=>d.value))||1;
  const bw=Math.min(64,(W-gap*(n+1))/n);
  const chartH=180, top=14, labelH=42, H=chartH+top+labelH;
  let bars="";
  data.forEach((d,i)=>{
    const h=Math.max(2,(d.value/max)*chartH);
    const x=gap+i*(bw+gap)+( (W-(gap+n*(bw+gap)))/2 );
    const y=top+chartH-h;
    const col=d.color||PALETTE[i%PALETTE.length];
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${col}"/>`;
    bars+=`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="11" font-weight="700" fill="#1c2b39">${esc(opts.fmt?opts.fmt(d.value):fmtNum(d.value,0))}</text>`;
    const lbl=esc(d.label);
    bars+=`<text x="${x+bw/2}" y="${top+chartH+16}" text-anchor="middle" font-size="10.5" fill="#34507f">${lbl.length>10?lbl.slice(0,9)+"…":lbl}</text>`;
  });
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <line x1="0" y1="${top+chartH}" x2="${W}" y2="${top+chartH}" stroke="#dde3ea" stroke-width="1"/>
    ${bars}</svg>`;
}
function stackedBarChart(data,opts){
  opts=opts||{};
  if(!data.length||data.every(d=>d.total===0))
    return `<div class="empty" style="padding:30px"><span class="ic">▱</span><p>Sem dados para o período.</p></div>`;
  const W=opts.width||620, n=data.length, gap=14;
  const max=Math.max(...data.map(d=>d.total))||1;
  const bw=Math.min(64,(W-gap*(n+1))/n);
  const chartH=180, top=14, labelH=42, H=chartH+top+labelH;
  let bars="";
  data.forEach((d,i)=>{
    const x=gap+i*(bw+gap)+( (W-(gap+n*(bw+gap)))/2 );
    let yCursor=top+chartH;
    (d.segs||[]).forEach(seg=>{
      if(seg.value<=0) return;
      const h=(seg.value/max)*chartH;
      const y=yCursor-h;
      bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,0.5)}" fill="${seg.color}"><title>${esc(seg.nome)}: ${fmtNum(seg.value,1)}h</title></rect>`;
      yCursor=y;
    });
    if(!d.segs||!d.segs.length){
      // sem apontamentos neste período: nenhuma barra desenhada, só o eixo
    }
    const topY=top+chartH-(d.total/max)*chartH;
    if(opts.clicavel){
      // área clicável da coluna inteira (seleciona o período nos gráficos de baixo)
      if(i===opts.selecionado) bars=`<rect x="${x-5}" y="0" width="${bw+10}" height="${top+chartH+24}" rx="6" fill="#34507f" opacity=".08"/>`+bars;
      bars+=`<rect data-bucket="${i}" x="${x-5}" y="0" width="${bw+10}" height="${top+chartH+24}" fill="transparent" style="cursor:pointer"><title>${esc(d.label)}: ${fmtNum(d.total,1)}h — clique para ver este período abaixo</title></rect>`;
    }
    bars+=`<text x="${x+bw/2}" y="${topY-6}" text-anchor="middle" font-size="11" font-weight="700" fill="#1c2b39">${esc(opts.fmt?opts.fmt(d.total):fmtNum(d.total,0))}</text>`;
    const lbl=esc(d.label);
    bars+=`<text x="${x+bw/2}" y="${top+chartH+16}" text-anchor="middle" font-size="10.5" fill="#34507f">${lbl.length>10?lbl.slice(0,9)+"…":lbl}</text>`;
  });
  const legendData=opts.legend||[];
  const legendHtml=legendData.length
    ? `<div class="legend" style="margin-top:14px">${legendData.map(l=>
        `<div class="it"><span class="sw" style="background:${l.color}"></span>${esc(l.label)} · ${fmtH(l.value)}</div>`).join("")}</div>`
    : "";
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <line x1="0" y1="${top+chartH}" x2="${W}" y2="${top+chartH}" stroke="#dde3ea" stroke-width="1"/>
    ${bars}</svg>${legendHtml}`;
}
function donutChart(data,opts){
  opts=opts||{};
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total<=0) return `<div class="empty" style="padding:30px"><span class="ic">◔</span><p>Sem dados para exibir.</p></div>`;
  const cx=90,cy=90,r=70,sw=30;
  let acc=0, segs="";
  data.forEach((d,i)=>{
    const frac=d.value/total;
    if(frac<=0) return;
    const a0=acc*2*Math.PI-Math.PI/2, a1=(acc+frac)*2*Math.PI-Math.PI/2;
    acc+=frac;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const large=frac>0.5?1:0;
    const col=d.color||PALETTE[i%PALETTE.length];
    segs+=`<path d="M${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1}" fill="none" stroke="${col}" stroke-width="${sw}"><title>${esc(d.title||(d.label+": "+fmtNum(d.value,1)))}</title></path>`;
  });
  let leg='<div class="legend">';
  data.forEach((d,i)=>{
    if(d.value<=0) return;
    const pc=Math.round(d.value/total*100);
    leg+=`<div class="it" ${d.title?`title="${esc(d.title)}"`:""}><span class="sw" style="background:${d.color||PALETTE[i%PALETTE.length]}"></span>${esc(d.label)} · ${opts.horas?fmtNum(d.value,1)+" h · ":""}${pc}%</div>`;
  });
  leg+="</div>";
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
    <svg viewBox="0 0 180 180" style="width:170px;flex-shrink:0">${segs}
      <text x="90" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2b39">Total</text>
      <text x="90" y="104" text-anchor="middle" font-size="13" fill="#34507f">${fmtNum(total,total%1?1:0)}</text>
    </svg><div style="flex:1;min-width:160px">${leg}</div></div>`;
}

/* ============================================================
   ESTADO DE NAVEGAÇÃO
   ============================================================ */
const ST = {
  view:"painel",
  projetoId:null,
  projTab:"resumo",
  sessaoAtiva:null,      // sessão do portfólio selecionada no menu (null = "Não classificados")
  dashYear:String(new Date().getFullYear()),
  dashMode:"mensal",

// projeto (ex.: Eixo/Objetivo estratégico em Projetos Estruturantes),
// formatando o valor de acordo com o tipo do campo
function camposExtrasResumoHtml(cfg,p){
  return (cfg.camposExtras||[]).map(f=>{
    if(f.showIf && !f.showIf(p)) return "";
    const val=p[f.key];
    if(val===undefined||val===null||val==="") return "";
    let disp;
    if(f.type==="date") disp=fmtDate(val);
    else if(f.type==="number") disp=/\(R\$\)/.test(f.label)?fmtBRL(+val):fmtNum(+val,0);
    else disp=esc(val);
    return `<div class="mini-stat"><span>${esc(f.label)}</span><span class="v">${disp}</span></div>`;
  }).join("");
}

/* telas da Operação e do Sistema que cada perfil abre */
function podeAbrirView(view){
  if(view==="config") return isGestor();
  if(view==="relatorios"||view==="financeiro"||view==="equipe") return temArea(view);
  return true;
}
function renderNav(){
  let h="";
  const projetoAtivo=ST.view==="projeto"?getProjeto(ST.projetoId):null;
  const sessoesVisiveis=new Set(sessoesComAcesso());
  // esconde o título da seção quando nenhum item dela fica visível
  const itensVisiveis=it=>!it.sec && !it.portfolioSection && podeAbrirView(it.id);
  NAV.forEach((it,i)=>{
    if(it.portfolioSection){
      if(!sessoesVisiveis.size && !isGestor()) return;
      h+=`<div class="nav-label">Portfólio</div>`;
      SESSOES.filter(s=>sessoesVisiveis.has(s.id)).forEach(s=>{
        const active=(ST.view==="portfolio"&&ST.sessaoAtiva===s.id)||
          (!!projetoAtivo && projetoAtivo.sessaoId===s.id);
        h+=`<button class="nav-item ${active?"active":""}" data-nav="portfolio" data-sessao="${s.id}">
          <span class="ic">${s.ic}</span><span>${s.label}</span></button>`;
      });
      if(isGestor() && haProjetosNaoClassificados()){
        const active=(ST.view==="portfolio"&&!ST.sessaoAtiva)||
          (!!projetoAtivo && !projetoSessaoValida(projetoAtivo));
        h+=`<button class="nav-item ${active?"active":""}" data-nav="portfolio" data-sessao="">
          <span class="ic">${ICONS.inbox}</span><span>Não classificados</span></button>`;
      }
      return;
    }
    if(it.sec){
      // pula o título se nenhum item até o próximo título aparece para este perfil
      const seguintes=[];
      for(let j=i+1;j<NAV.length && !NAV[j].sec;j++) seguintes.push(NAV[j]);
      if(seguintes.length && !seguintes.some(x=>x.portfolioSection||itensVisiveis(x))) return;
      h+=`<div class="nav-label">${it.sec}</div>`; return;
    }
    if(!podeAbrirView(it.id)) return;
    const active=(ST.view===it.id);
    h+=`<button class="nav-item ${active?"active":""}" data-nav="${it.id}">
      <span class="ic">${it.ic}</span><span>${it.label}</span></button>`;
  });
  $("#nav").innerHTML=h;
  $("#nav").querySelectorAll("[data-nav]").forEach(b=>{
    b.onclick=()=>{
      ST.view=b.dataset.nav; ST.projetoId=null;
      if(b.dataset.sessao!==undefined) ST.sessaoAtiva=b.dataset.sessao||null;
      render();
    };
  });
}

/* ============================================================
   RENDER PRINCIPAL
   ============================================================ */
// guarda a última "localização" renderizada (view + projeto + sessão + aba)
// para só rolar a página ao topo quando o usuário efetivamente navega para
// outro lugar — e não sempre que render() é chamado (ex.: ao salvar uma
// edição), o que antes fazia a página voltar ao topo mesmo quando o usuário
// estava rolado bem mais abaixo.
let _ultimaLocalizacao=null;
function render(){
  // guarda a posição de rolagem ANTES de recriar o DOM. Recriar o conteúdo
  // de #view (v.innerHTML=...) pode fazer o navegador ajustar a rolagem
  // sozinho — em especial quando o elemento que estava com foco (ex.: o
  // botão "editar" que o usuário acabou de clicar numa lista) é destruído
  // na hora da troca de conteúdo, e o navegador devolve o foco para <body>,
  // o que em alguns navegadores rola a página para o topo. Por isso: tira
  // o foco ANTES de recriar o DOM (evita esse ajuste automático) e a
  // posição também é restaurada explicitamente no final — inclusive num
  // frame seguinte, caso o navegador aplique o ajuste de forma assíncrona.
  const scrollAntes=window.scrollY;
  // Além da rolagem da JANELA (tratada abaixo), alguns blocos têm rolagem
  // PRÓPRIA (overflow-y:auto) — ex.: a barra lateral #nav (quando há muitos
  // projetos) e a lista de Alertas de prazo no Painel Geral. Como esses
  // blocos são recriados do zero a cada render() (innerHTML novo), o
  // scrollTop interno deles sempre volta a 0, mesmo que a página em si não
  // tenha rolado — é isso que dava a impressão de "a visão voltou pro
  // topo" mesmo com a proteção da rolagem da janela já funcionando.
  // Guarda o quanto cada um estava rolado agora, e restaura depois de
  // recriá-los.
  const scrollsInternosAntes={};
  ["nav","alertas-scroll-box-vencidos","alertas-scroll-box-sprint","alertas-scroll-box-reunioes","alertas-scroll-box-duplicidades"].forEach(id=>{
    const el=document.getElementById(id);
    if(el && el.scrollTop>0) scrollsInternosAntes[id]=el.scrollTop;
  });
  if(document.activeElement && document.activeElement!==document.body && document.activeElement.blur){
    document.activeElement.blur();
  }
  // reseta seleção de reunião quando não estamos na aba reuniões
  if(!(ST.view==="projeto" && ST.projTab==="reunioes")) ST.reuniaoId=null;
  renderNav();
  renderUserWidget();
  const titles={painel:"Painel Geral",
    financeiro:"Controle Financeiro",relatorios:"Relatórios",
    equipe:"Equipe",config:"Configurações"};
  const crumbs={painel:"Visão geral",financeiro:"Operação",relatorios:"Operação",equipe:"Operação",config:"Sistema"};
  let title=titles[ST.view]||"Painel", crumb=crumbs[ST.view]||"";
  if(ST.view==="portfolio"){
    title=nomeSessao(ST.sessaoAtiva); crumb="Portfólio";
  }
  if(ST.view==="projeto"){
    const p=getProjeto(ST.projetoId);
    title=p?p.nome:"Projeto"; crumb="Portfólio · "+(p?nomeSessao(p.sessaoId):"");
  }
  $("#page-title").textContent=title;
  $("#crumb").textContent=crumb;
  $("#topbar-actions").innerHTML="";

  // bloqueia acesso indevido por perfil (Operação/Configurações e sessões não liberadas)
  if(!podeAbrirView(ST.view)) ST.view="painel";
  if(ST.view==="portfolio" && !isGestor() && (!ST.sessaoAtiva || !sessoesComAcesso().includes(ST.sessaoAtiva))) ST.view="painel";

  const v=$("#view");
  if(ST.view==="painel") viewPainel(v);
  else if(ST.view==="portfolio") viewPortfolio(v);
  else if(ST.view==="projeto") viewProjeto(v);
  else if(ST.view==="financeiro") viewFinanceiro(v);
  else if(ST.view==="relatorios") viewRelatorios(v);
  else if(ST.view==="equipe") viewEquipe(v);
  else if(ST.view==="config") viewConfig(v);

  const localizacaoAtual=[ST.view,ST.projetoId,ST.sessaoAtiva,ST.projTab].join("|");
  const navegou=localizacaoAtual!==_ultimaLocalizacao;
  _ultimaLocalizacao=localizacaoAtual;
  // navegação real (trocou de tela/projeto/aba) -> sobe ao topo;
  // re-renderização no mesmo lugar (ex.: salvar uma edição, ou uma
  // atualização em tempo real chegando de outro usuário) -> mantém
  // exatamente onde o usuário estava, mesmo que o navegador tenha tentado
  // ajustar a rolagem sozinho ao recriar o DOM. O reforço num frame
  // seguinte cobre o caso do navegador aplicar seu próprio ajuste de forma
  // assíncrona, depois do nosso scrollTo já ter rodado.
  if(navegou){
    window.scrollTo(0,0);
  } else if(window.scrollY!==scrollAntes){
    reforcarScroll(scrollAntes);
  }
  // restaura a rolagem interna da barra lateral e da lista de Alertas de
  // prazo (ver captura no início da função) — só quando a navegação não
  // mudou de tela, senão faz sentido mesmo começar do topo desses blocos.
  if(!navegou){
    Object.keys(scrollsInternosAntes).forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.scrollTop=scrollsInternosAntes[id];
    });
  }
}

/* ============================================================
   BUSCA GLOBAL DE ATIVIDADES (barra superior, atalho "/")
   Digite uma ou mais palavras (sem se preocupar com acentos ou
   maiúsculas): acha pelo nome da atividade, projeto (código ou nome)
   e responsáveis. Ao escolher, abre o Cronograma Físico do projeto,
   rola até a atividade e a destaca.
   ============================================================ */
/* SITUAÇÃO AUTOMÁTICA PELA APROPRIAÇÃO DE HORAS (formulário da atividade)
   - começou a lançar horas executadas e estava "Não iniciada" → "Em andamento";
   - alguma hora lançada com data DEPOIS do Término previsto → "Atrasada".
   Não mexe em atividade Concluída ou Cancelada, nem quando o % chega a 100
   (aí vale a regra de conclusão). Recebe os valores do formulário (v.status,
   v.dataFimPrev, v.progresso, v.estimativasPessoas[].horasExecLog). */
function situacaoPelasHoras(v){
  const st=v.status||"Não iniciada";
  if(st==="Concluída" || st==="Cancelada") return st;
  const lanc=[];
  (Array.isArray(v.estimativasPessoas)?v.estimativasPessoas:[]).forEach(x=>{
    (Array.isArray(x.horasExecLog)?x.horasExecLog:[]).forEach(e=>{ if(e && (parseFloat(e.horas)||0)>0) lanc.push(e); });
    // horas antigas, sem quadro de anotações
    if(!(Array.isArray(x.horasExecLog)&&x.horasExecLog.length) && (parseFloat(x.horasExecutadas)||0)>0) lanc.push({data:"",horas:+x.horasExecutadas});
  });
  if(!lanc.length) return st;
  const fim=v.dataFimPrev||"";
  if(fim && (parseFloat(v.progresso)||0)<100 && lanc.some(e=>e.data && e.data>fim)) return "Atrasada";
  return st==="Não iniciada" ? "Em andamento" : st;
}
function statusEfetivoAtividade(a){
  const prog=+a.progresso||0;
  const atrasada=a.status!=="Cancelada" && a.dataFimPrev && daysBetween(todayStr(),a.dataFimPrev)<0 && prog<100;
  return atrasada ? "Atrasada" : (a.status||"Não iniciada");
}
function irParaAtividade(id){
  const a=getAtividade(id); if(!a) return;
  const p=getProjeto(a.projetoId); if(!p) return;
  // garante que filtros do cronograma não escondam a atividade procurada
  ST.cronoStatusVisiveis.add(statusEfetivoAtividade(a));
  ST.cronoStatusVisiveis.add(a.status||"Não iniciada");
  ST.cronoFiltroData={de:"",ate:""}; ST.cronoFiltroColab="";
  ST.view="projeto"; ST.projetoId=p.id; ST.projTab="cronograma"; ST.sessaoAtiva=p.sessaoId||ST.sessaoAtiva;
  render();
  const btn=document.querySelector(`[data-eda="${a.id}"]`);
