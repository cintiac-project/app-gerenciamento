    tr.scrollIntoView({block:"center"});
    tr.classList.add("gs-flash");
    setTimeout(()=>tr.classList.remove("gs-flash"),2800);
  } else {
    // sessão sem cronograma na tela (aba oculta): abre direto a edição da atividade
    formAtividade(p.id,a);
  }
}
function iniciarBuscaGlobal(){
  const inp=document.getElementById("gsearch-input"), box=document.getElementById("gsearch-results");
  if(!inp||!box) return;
  let itens=[], hl=-1;
  const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  const fechar=()=>{ box.style.display="none"; hl=-1; };
  function destacar(texto,palavras){
    const t=String(texto||""), n=norm(t);
    if(n.length!==t.length) return esc(t);          // segurança: só destaca quando os índices batem
    const marc=new Array(t.length).fill(false);
    palavras.forEach(w=>{ let i=n.indexOf(w); while(i>=0){ for(let k=i;k<i+w.length;k++) marc[k]=true; i=n.indexOf(w,i+w.length); } });
    let out="", aberto=false;
    for(let i=0;i<t.length;i++){
      if(marc[i]&&!aberto){ out+="<mark>"; aberto=true; }
      if(!marc[i]&&aberto){ out+="</mark>"; aberto=false; }
      out+=esc(t[i]);
    }
    return aberto?out+"</mark>":out;
  }
  function marcar(i){
    const els=box.querySelectorAll(".gs-item"); if(!els.length) return;
    hl=(i+els.length)%els.length;
    els.forEach((e,k)=>e.classList.toggle("hl",k===hl));
    els[hl].scrollIntoView({block:"nearest"});
  }
  function buscar(){
    const palavras=norm(inp.value).split(/\s+/).filter(Boolean);
    if(!palavras.length){ fechar(); return; }
    const achados=[];
    (DB.data&&DB.data.atividades||[]).forEach(a=>{
      const p=getProjeto(a.projetoId); if(!p) return;
      let resp=""; try{ resp=nomesResponsaveisAtividade(a,p).join(" "); }catch(_){}
      const hNome=norm(a.nome);
      const hTudo=hNome+" "+norm(a.descricao)+" "+norm(p.codigo)+" "+norm(p.nome)+" "+norm(resp);
      if(!palavras.every(w=>hTudo.includes(w))) return;
      achados.push({a,p,noNome:palavras.every(w=>hNome.includes(w))});
    });
    achados.sort((x,y)=>(y.noNome-x.noNome)||String(x.p.nome).localeCompare(String(y.p.nome),"pt-BR")||String(x.a.nome).localeCompare(String(y.a.nome),"pt-BR"));
    itens=achados.slice(0,40);
    if(!itens.length){ box.innerHTML=`<div class="gs-empty">Nenhuma atividade encontrada para “${esc(inp.value)}”.</div>`; box.style.display="block"; hl=-1; return; }
    box.innerHTML=itens.map(({a,p})=>`
      <div class="gs-item" data-id="${a.id}">
        <div class="gs-t">${destacar(a.nome,palavras)}</div>
        <div class="gs-s">${rotuloProjetoHtml(p)} · ${esc(statusEfetivoAtividade(a))}${a.dataFimPrev?" · prazo "+fmtDate(a.dataFimPrev):""} · ${+a.progresso||0}%</div>
      </div>`).join("")+(achados.length>itens.length?`<div class="gs-more">Mostrando ${itens.length} de ${achados.length} — refine a busca com mais palavras.</div>`:"");
    box.style.display="block"; marcar(0);
  }
  const abrir=id=>{ fechar(); inp.blur(); irParaAtividade(id); };
  inp.addEventListener("input",buscar);
  inp.addEventListener("focus",()=>{ if(inp.value.trim()) buscar(); });
  inp.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); marcar(hl+1); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); marcar(hl-1); }
    else if(e.key==="Enter"){ e.preventDefault(); const it=itens[hl]; if(it) abrir(it.a.id); }
    else if(e.key==="Escape"){ fechar(); inp.blur(); }
  });
  box.addEventListener("mousedown",e=>{
    const it=e.target.closest(".gs-item"); if(!it) return;
    e.preventDefault(); abrir(it.dataset.id);
  });
  document.addEventListener("mousedown",e=>{ if(!e.target.closest("#gsearch")) fechar(); });
  document.addEventListener("keydown",e=>{
    const tag=(e.target&&e.target.tagName||"").toLowerCase();
    const digitando=tag==="input"||tag==="textarea"||tag==="select"||(e.target&&e.target.isContentEditable);
    if((e.key==="/"&&!digitando&&!e.ctrlKey&&!e.metaKey)||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k")){
      if(document.getElementById("app").style.display==="none") return;
      e.preventDefault(); inp.focus(); inp.select();
    }
  });
}
iniciarBuscaGlobal();

/* ============================================================
   QUADROS (KPIs) SEM QUEBRA DE LINHA
   Números, títulos e subtítulos curtos dos quadros ficam sempre numa única
   linha: se o texto não cabe no tamanho normal, a fonte diminui sozinha até
   caber (com um mínimo legível). Só se mesmo no mínimo não couber é que o
   texto volta a quebrar linha. Roda a cada atualização da tela e ao
   redimensionar a janela.
   ============================================================ */
function ajustarQuadros(){
  const regras=[
    [".kpi .val",15,true],[".kpi .lbl",9.5,true],[".kpi .sub",10.5,false],
    [".rp-k .v",14,true],[".rp-k .l",9,true]
  ];
  regras.forEach(([sel,min,sempre])=>{
    document.querySelectorAll(sel).forEach(el=>{
      el.style.fontSize=""; el.style.whiteSpace=""; el.style.letterSpacing="";
      // subtítulos longos (frases) continuam quebrando linha normalmente
      if(!sempre && (el.textContent||"").trim().length>34) return;
      el.style.whiteSpace="nowrap";
      if(el.clientWidth===0) return;                       // elemento oculto: não mede
      // títulos em maiúsculas: primeiro aperta o espaçamento entre letras, depois reduz a fonte
      if(el.scrollWidth>el.clientWidth+1 && /lbl|\bl\b/.test(el.className)) el.style.letterSpacing=".01em";
      let px=parseFloat(getComputedStyle(el).fontSize);
      while(el.scrollWidth>el.clientWidth+1 && px>min){ px-=0.5; el.style.fontSize=px+"px"; }
      if(el.scrollWidth>el.clientWidth+1) el.style.whiteSpace="normal";   // não coube nem no mínimo
    });
  });
}
(function(){
  let t=null; const agendar=()=>{ cancelAnimationFrame(t); t=requestAnimationFrame(ajustarQuadros); };
  const app=document.getElementById("app");
  if(app) new MutationObserver(agendar).observe(app,{childList:true,subtree:true});
  const mr=document.getElementById("modal-root");
  if(mr) new MutationObserver(agendar).observe(mr,{childList:true,subtree:true});
  window.addEventListener("resize",agendar);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(agendar);
})();

/* ============================================================
   LISTAS SUSPENSAS (<select>) PERSONALIZADAS
   A lista nativa do navegador aparecia cortada/em branco quando as opções
   eram longas. Aqui toda lista suspensa do app abre num painel próprio,
   que quebra linha nos textos longos, nunca sai da tela e, quando tem
   muitas opções, ganha um campo de busca. Em celular/tablet (toque) continua
   a lista nativa, que funciona bem. Para um select específico manter a
   lista nativa, use o atributo data-native.
   ============================================================ */
/* ============================================================
   LISTAS SUSPENSAS SEMPRE EM ORDEM ALFABÉTICA
   Toda lista suspensa é ordenada de A a Z (ignorando acentos e maiúsculas),
   mantendo no topo a primeira opção vazia ("Todos", "Selecione…").
   Ficam fora, de propósito, as listas cuja ordem tem significado:
   meses, anos, datas de reunião, status, probabilidade/impacto etc.
   Para excluir um select específico: atributo data-ordem="natural".
   ============================================================ */
const SELECT_ORDEM_NATURAL_IDS=new Set(["dash-year","dash-mes","dash-sem","oh-mes","ord-portfolio","rl-reu","ff-status","ff-tipo"]);
const SELECT_ORDEM_NATURAL_KEYS=new Set(["status","statusCaptacao","probabilidade","impacto","influencia","classificacao","papel","tipo","modalidade","duplicadas"]);
function cmpAlfa(a,b){
  return String(a==null?"":a).normalize("NFKD").localeCompare(String(b==null?"":b).normalize("NFKD"),"pt-BR",{sensitivity:"base",numeric:true});
}
function selectOrdemNatural(sel){
  return sel.hasAttribute("data-ordem")||SELECT_ORDEM_NATURAL_IDS.has(sel.id)||SELECT_ORDEM_NATURAL_KEYS.has(sel.dataset.k)||sel.classList.contains("raci-select");
}
function ordenarSelectAlfabetico(sel){
  if(!sel||sel.multiple||selectOrdemNatural(sel)||sel.querySelector("optgroup")) return;
  const opts=[...sel.children].filter(n=>n.tagName==="OPTION");
  if(opts.length<3) return;
  const resto=opts[0].value===""?opts.slice(1):opts.slice();
  const ord=resto.slice().sort((a,b)=>cmpAlfa(a.textContent.trim(),b.textContent.trim()));
  if(ord.every((o,k)=>o===resto[k])) return;                 // já está em ordem
  const escolhida=sel.selectedIndex>=0?sel.options[sel.selectedIndex]:null;
  ord.forEach(o=>sel.appendChild(o));
  if(escolhida) escolhida.selected=true;
}
function ordenarSelects(){ document.querySelectorAll("select").forEach(ordenarSelectAlfabetico); }
(function(){
  let t=null; const agendar=()=>{ cancelAnimationFrame(t); t=requestAnimationFrame(ordenarSelects); };
  ["app","modal-root"].forEach(id=>{ const el=document.getElementById(id); if(el) new MutationObserver(agendar).observe(el,{childList:true,subtree:true}); });
  agendar();
})();

(function iniciarSelectsPersonalizados(){
  if(!window.matchMedia || !window.matchMedia("(pointer:fine)").matches) return;
  let pop=null, alvo=null, itens=[], hl=-1, listaEl=null, qEl=null;
  const norm=t=>String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  const elegivel=s=>s&&s.tagName==="SELECT"&&!s.disabled&&!s.multiple&&!(s.size>1)&&!s.hasAttribute("data-native");
  function fechar(){ if(pop){ pop.remove(); pop=null; } if(alvo) alvo.classList.remove("sel-open"); alvo=null; itens=[]; hl=-1; }
  function escolher(it){
    if(!alvo||!it||it.dis) return;
    const sel=alvo; fechar();
    if(sel.selectedIndex!==it.idx){
      sel.selectedIndex=it.idx;
      sel.dispatchEvent(new Event("input",{bubbles:true}));
      sel.dispatchEvent(new Event("change",{bubbles:true}));
    }
    sel.focus();
  }
  function marcar(i){
    const vis=itens.filter(x=>!x.oculto&&!x.dis); if(!vis.length) return;
    const pos=Math.max(0,Math.min(vis.length-1,i)); hl=itens.indexOf(vis[pos]);
    itens.forEach(x=>x.el&&x.el.classList.toggle("hl",x===itens[hl]));
    itens[hl].el.scrollIntoView({block:"nearest"});
  }
  function posicionar(sel){
    const r=sel.getBoundingClientRect(), vw=window.innerWidth, vh=window.innerHeight;
    pop.style.minWidth=Math.min(r.width,vw-16)+"px"; pop.style.maxWidth=Math.min(680,vw-16)+"px";
    let left=r.left; const w=pop.offsetWidth;
    if(left+w>vw-8) left=Math.max(8,vw-8-w);
    pop.style.left=left+"px";
    const abaixo=vh-r.bottom-10, acima=r.top-10;
    const cab=qEl?qEl.offsetHeight+12:0;
    if(abaixo<220&&acima>abaixo){ pop.style.top="auto"; pop.style.bottom=(vh-r.top+4)+"px"; listaEl.style.maxHeight=Math.min(340,acima-cab)+"px"; }
    else { pop.style.bottom="auto"; pop.style.top=(r.bottom+4)+"px"; listaEl.style.maxHeight=Math.min(340,abaixo-cab)+"px"; }
  }
  function abrir(sel){
    fechar(); ordenarSelectAlfabetico(sel); alvo=sel; sel.classList.add("sel-open");
    pop=document.createElement("div"); pop.className="sel-pop";
    const total=sel.options.length;
    if(total>10){ qEl=document.createElement("input"); qEl.type="search"; qEl.className="sel-q"; qEl.placeholder="Buscar…"; qEl.autocomplete="off"; pop.appendChild(qEl); }
    else qEl=null;
    listaEl=document.createElement("div"); listaEl.className="sel-list"; pop.appendChild(listaEl);
    itens=[]; let grupoAtual=null;
    [...sel.options].forEach((o,idx)=>{
      const g=o.parentNode&&o.parentNode.tagName==="OPTGROUP"?o.parentNode:null;
      if(g&&g!==grupoAtual){ const gh=document.createElement("div"); gh.className="sel-grp"; gh.textContent=g.label; listaEl.appendChild(gh); itens.push({grupoEl:gh,oculto:false,dis:true,txt:""}); }
      grupoAtual=g;
      const el=document.createElement("div"); const txt=(o.textContent||"").trim();
      el.className="sel-item"+(idx===sel.selectedIndex?" on":"")+(o.disabled?" dis":"")+(o.value===""?" ph":"");
      el.textContent=txt||"—"; el.dataset.i=String(itens.length);
      listaEl.appendChild(el); itens.push({el,idx,dis:o.disabled,txt:norm(txt),oculto:false});
    });
    document.body.appendChild(pop); posicionar(sel);
    const on=itens.findIndex(x=>x.el&&x.idx===sel.selectedIndex);
    if(on>=0){ hl=on; itens[on].el.classList.add("hl"); itens[on].el.scrollIntoView({block:"nearest"}); }
    if(qEl){
      qEl.focus();
      qEl.addEventListener("input",()=>{
        const ws=norm(qEl.value).split(/\s+/).filter(Boolean); let achou=0;
        itens.forEach(x=>{ if(!x.el) return; x.oculto=!ws.every(w=>x.txt.includes(w)); x.el.style.display=x.oculto?"none":""; if(!x.oculto) achou++; });
        itens.forEach(x=>{ if(x.grupoEl) x.grupoEl.style.display=ws.length?"none":""; });
        let v=listaEl.querySelector(".sel-vazio"); if(!achou&&!v){ v=document.createElement("div"); v.className="sel-vazio"; v.textContent="Nada encontrado."; listaEl.appendChild(v); } else if(achou&&v) v.remove();
        marcar(0);
      });
    }
  }
  document.addEventListener("mousedown",e=>{
    const s=e.target.closest&&e.target.closest("select");
    if(elegivel(s)){ e.preventDefault(); if(alvo===s){ fechar(); } else { s.focus(); abrir(s); } return; }
    const it=e.target.closest&&e.target.closest(".sel-item");
    if(it&&pop){ e.preventDefault(); escolher(itens[+it.dataset.i]); return; }
    if(pop&&!(e.target.closest&&e.target.closest(".sel-pop"))) fechar();
  },true);
  document.addEventListener("keydown",e=>{
    if(pop){
      const vis=itens.filter(x=>!x.oculto&&!x.dis), pos=vis.indexOf(itens[hl]);
      if(e.key==="ArrowDown"){ e.preventDefault(); marcar(pos+1); }
      else if(e.key==="ArrowUp"){ e.preventDefault(); marcar(pos-1); }
      else if(e.key==="Enter"){ e.preventDefault(); escolher(itens[hl]); }
      else if(e.key==="Escape"||e.key==="Tab"){ if(e.key==="Escape") e.preventDefault(); const s=alvo; fechar(); if(s) s.focus(); }
      return;
    }
    const s=document.activeElement;
    if(elegivel(s)&&(e.key==="Enter"||e.key===" "||e.key==="F4"||(e.altKey&&e.key==="ArrowDown"))){ e.preventDefault(); abrir(s); }
  },true);
  window.addEventListener("scroll",e=>{ if(pop&&!(e.target&&e.target.closest&&e.target.closest(".sel-pop"))) fechar(); },true);
  window.addEventListener("resize",fechar);
  setInterval(()=>{ if(alvo&&!document.contains(alvo)) fechar(); },400);
})();

/* ---------- BLOCO MCI / METAS MENSAIS / MDS (renderizado no Painel Geral,
   um quadro abaixo do outro: MCI → Metas Mensais → MDS). O nome exibido é
   "MDS — Medidas de Direção Semanal" (chegou a aparecer como "MCS"); os
   identificadores internos (tabela "mds" no Supabase, ids "mds-…") seguem
   o mesmo nome. ---------- */
function mciMdsPainelHtml(){
  const mci=mciAtiva();
  const histMci=mciHistorico();
  const mdsList=mdsAtivas();
  const histMds=mdsHistorico();

  const mciHtml = (mci && !isGestor())

    : `<div class="empty" style="padding:20px 10px">

         <p>Nenhuma MCI ativa no momento.</p>
         <div style="display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap">

         </div>
       </div>`;

  const semAtualMcs=limitesSemanaCorrente();
  const mdsRows = mdsList.length ? mdsList.map(m=>{
      const at=m.atividadeId?getAtividade(m.atividadeId):null;

      // espelho da atividade da sprint (sem campos para preencher)

      const nomes=at?nomesResponsaveisAtividade(at,proj):(m.responsavelId&&getColab(m.responsavelId)?[getColab(m.responsavelId).nome]:[]);
      const info=at?`${rotuloProjetoHtml(proj)} · ${at.dataFimPrev?"prazo "+fmtDate(at.dataFimPrev)+" · ":""}${at.progresso||0}% concluído`:"";
      const ref=semanaDaData(m.criadoEm||todayStr());
      const antiga=ref.ini<semAtualMcs.ini;
      return `
    <div class="mds-row" data-id="${m.id}" style="display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fafbfc">
      <input type="checkbox" class="mds-check" data-id="${m.id}" title="Marcar como concluída (conclui também a atividade da sprint)" style="margin-top:3px;width:16px;height:16px;flex-shrink:0">
      <div style="flex:1;min-width:0">

        ${info?`<div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px">${info}</div>`:""}
        <div style="display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;margin-top:6px;min-width:0;max-width:100%">

          <span class="mds-semana" title="Semana (segunda a domingo) em que esta atividade foi fixada como MDS${antiga?" — ainda não concluída, vem de semana anterior":""}"

    : `<div class="empty" style="padding:16px 10px"><span class="ic">📌</span><p>Nenhuma MDS ativa esta semana.</p><p class="hint">Clique no 📍 de uma atividade da Sprint para trazê-la para cá.</p></div>`;

  const mdsHtml = `
    ${mdsRows}
    <div style="display:flex;justify-content:flex-start;align-items:center;margin-top:6px;flex-wrap:wrap;gap:8px">
      <button class="btn ghost sm" id="mds-hist">🕘 Histórico${histMds.length?` (${histMds.length})`:""}</button>
    </div>`;

  // um quadro abaixo do outro, nesta ordem: MCI → Metas Mensais → MDS
  return `
  ${avisoMigracaoPainelHtml()}
  <div style="display:flex;flex-direction:column;gap:18px;margin-bottom:18px;min-width:0">
    <div class="card">
      <div class="card-head"><h3>🎯 MCI — Meta Crucialmente Importante</h3></div>
      <div class="card-pad">${mciHtml}</div>
    </div>
    ${metasMensaisCardHtml()}
    <div class="card">
      <div class="card-head" style="flex-wrap:wrap;row-gap:4px"><h3>📍 MDS — Medidas de Direção Semanal</h3>
        <span class="hint">semana corrente · ${fmtDate(semAtualMcs.ini)} a ${fmtDate(semAtualMcs.fim)}</span>
        <span class="hint" style="flex-basis:100%">Espelho das atividades da Sprint marcadas com 📍 · concluída → sai da lista e vai pro histórico</span></div>
      <div class="card-pad">${mdsHtml}</div>
    </div>
  </div>`;
}

/* Marca/desmarca uma atividade da SPRINT como MDS. Cria (ou remove) uma linha na
   tabela "mds" ligada à atividade (colunas atividade_id e projeto_id). */
async function alternarAtividadeComoMcs(atividadeId){
  const at=getAtividade(atividadeId); if(!at) return;
  DB.data.mds=DB.data.mds||[];
  const existente=DB.data.mds.find(m=>!m.concluido && m.atividadeId===atividadeId);
  if(existente){
    DB.data.mds=DB.data.mds.filter(m=>m.id!==existente.id);
    try{ await sbDelete("mds", existente.id); toast("Atividade removida do quadro de MDS."); }
    catch(e){ DB.data.mds.push(existente); toast("Erro ao remover MDS: "+e.message); }
    render(); return;
  }
  // se houver um único responsável interno identificável, já preenche
  const nomes=nomesResponsaveisAtividade(at,getProjeto(at.projetoId));
  const interno=nomes.length===1? getInternos().find(c=>c.nome===nomes[0]) : null;
  const novo={id:uid(), texto:at.nome, responsavelId:interno?interno.id:null,
    criadoEm:todayStr(), concluido:false, concluidoEm:null, atividadeId:at.id, projetoId:at.projetoId};
  DB.data.mds.push(novo);
  try{ await sbInsert("mds", toSnake(novo)); toast("Atividade adicionada ao quadro de MDS. 📍"); }
  catch(e){
    DB.data.mds=DB.data.mds.filter(m=>m.id!==novo.id);
    toast("Erro ao criar MDS (confira se as colunas atividade_id e projeto_id existem na tabela mds): "+e.message);
  }
  render();
}

/* textarea que cresce com o texto: o quadro nunca corta o conteúdo (MCI e Metas Mensais) */
function ajustarAlturaTexto(ta){
  if(!ta || !ta.isConnected) return;
  ta.style.height="auto";
  ta.style.height=(ta.scrollHeight+2)+"px";   // +2 = bordas (box-sizing: border-box)
}
function ligarAlturaAutomatica(raiz){
  const tas=[...(raiz||document).querySelectorAll("textarea.auto-altura")];
  tas.forEach(ta=>{ ajustarAlturaTexto(ta); ta.addEventListener("input",()=>ajustarAlturaTexto(ta)); });
  // depois que as fontes carregam a quebra de linha pode mudar
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>tas.forEach(ajustarAlturaTexto));
}
let _alturaAutoResizeTimer=null;
window.addEventListener("resize",()=>{
  clearTimeout(_alturaAutoResizeTimer);
  _alturaAutoResizeTimer=setTimeout(()=>document.querySelectorAll("textarea.auto-altura").forEach(ajustarAlturaTexto),120);
});
function wirePainelMciMds(v){
  const mci=mciAtiva();
  if($("#mci-nova")) $("#mci-nova").onclick=async()=>{
    const novo={id:uid(), texto:"", criadoEm:todayStr(), concluido:false, concluidoEm:null};
    DB.data.mci.push(novo);
    try{ await sbInsert("mci", toSnake(novo)); }
    catch(e){ toast("Erro ao criar MCI: "+e.message); }
    render();
  };
  if($("#mci-texto")) $("#mci-texto").onblur=async(e)=>{
    if(!mci) return;
    mci.texto=e.target.value;
    try{ await sbUpdate("mci", mci.id, {texto:mci.texto}); }
    catch(err){ toast("Erro ao salvar MCI: "+err.message); }
  };
  if($("#mci-concluir")) $("#mci-concluir").onclick=()=>{
    if(!mci) return;
    confirmar("Concluir esta MCI?","Ela será movida para o histórico como alcançada.", async()=>{
      mci.texto=$("#mci-texto")? $("#mci-texto").value : mci.texto;
      mci.concluido=true; mci.concluidoEm=todayStr();
      try{
        await sbUpdate("mci", mci.id, {texto:mci.texto, concluido:true, concluido_em:mci.concluidoEm});
        toast("MCI concluída! 🎉");
      }catch(err){ toast("Erro ao concluir MCI: "+err.message); }
      render();
    });
  };
  if($("#mci-hist")) $("#mci-hist").onclick=abrirHistoricoMci;

  wireMetasMensais(v);
  wirePainelTags(v);
  ligarAlturaAutomatica(v);

  if($("#mds-hist")) $("#mds-hist").onclick=abrirHistoricoMds;
  v.querySelectorAll(".mds-check").forEach(chk=>{
    chk.onchange=async()=>{
      if(!chk.checked) return;
      const item=DB.data.mds.find(m=>m.id===chk.dataset.id); if(!item) return;
      item.concluido=true; item.concluidoEm=todayStr();
      try{
        await sbUpdate("mds", item.id, {concluido:true, concluido_em:item.concluidoEm});
        toast("MDS concluída e arquivada no histórico.");
      }catch(e){ toast("Erro ao concluir MDS: "+e.message); return render(); }
      render();
      // MDS vinda de uma atividade da sprint: conclui também a atividade
      // (abre a confirmação com datas reais e horas executadas)
      const ativ=item.atividadeId?getAtividade(item.atividadeId):null;
      if(ativ && ativ.status!=="Concluída" && (+ativ.progresso||0)<100) marcarAtividadeConcluidaRapido(ativ.id);
    };
  });
  v.querySelectorAll(".mds-rm").forEach(b=>{
    b.onclick=()=>{
      confirmar("Tirar do quadro de MDS?","A atividade continua na Sprint; só deixa de ser uma MDS (não vai para o histórico).", async()=>{
        const id=b.dataset.id;
        DB.data.mds=DB.data.mds.filter(m=>m.id!==id);
        try{ await sbDelete("mds", id); }
        catch(e){ toast("Erro ao remover: "+e.message); }
        render();
      });
    };
  });
}

/* ============================================================
   VIEW: PAINEL GERAL
   ============================================================ */
function viewPainel(v){
  const ps=DB.data.projetos;
  const meuId=USER.current&&USER.current.colabId;
  const verFinanceiro=temArea("financeiro");
  // o Colaborador acompanha só as próprias horas nos dashboards
  if(ehPerfilColaborador()) ST.dashColab=meuId||"";
  const ativos=ps.filter(p=>{ const s=statusCalculado(p); return s==="Em andamento"||s==="Em risco"||s==="Planejado"; });
  // "Captação" é a sessão de propostas/editais em andamento (ainda não
  // ganhos) — assim que um projeto é aprovado, a própria regra de
  // conversao da sessão (ver SESSAO_CONFIG.captacao) o move para "Gestão
  // de Projetos", então tudo que ainda está classificado como "captacao"
  // aqui é, por definição, previsto/pleiteado — ainda não é receita real.
  // Propostas "Não submetido" ou "Reprovado" ficam de fora do previsto: não
  // há mais chance real de virarem receita, então não entram na soma nem
  // no raio-x de Captação (continuam existindo/editáveis normalmente,
  // só não contam para o total previsto do Painel Geral).
  const projetosCaptacao=ps.filter(p=>p.sessaoId==="captacao"
    && !STATUS_CAPTACAO_FORA_PREVISTO.includes(p.statusCaptacao));
  const projetosNaoCaptacao=ps.filter(p=>p.sessaoId!=="captacao");
  const captacaoPrevista=projetosCaptacao.reduce((s,p)=>s+(+p.receita||0),0);
  const receitaCaptada=projetosNaoCaptacao.reduce((s,p)=>s+(+p.receita||0),0);
  const despesaTotal=ps.reduce((s,p)=>s+despesasProjeto(p.id),0);
  const margens=ps.map(margemProjeto).filter(m=>m!=null);
  const margemMedia=margens.length? margens.reduce((a,b)=>a+b,0)/margens.length : null;
  // Colaborador: só os alertas das atividades em que está vinculado (e as reuniões dos seus projetos)
  const alertas=calcularAlertas().filter(a=>!ehPerfilColaborador()
    || a.tipo==="reuniao"
    || (a.tipo==="fisico" && usuarioVinculadoAtividade(getAtividade(a.atividadeId))));
  const horasAno=horasConsolidadas().filter(h=>yearOf(h.data)===ST.dashYear).reduce((s,h)=>s+(+h.horas||0),0);

  // opções de filtro dos Alertas de prazo: apenas projetos e responsáveis que
  // de fato aparecem nos alertas atuais (evita opções "vazias" no filtro).
  // "responsavel" pode conter mais de um nome (ex.: "Fulano, Beltrano"), por
  // isso é separado para virar opções individuais no filtro.
  const projetosComAlerta=[...new Set(alertas.map(a=>a.projetoId))]
    .map(getProjeto).filter(Boolean)
    .sort((a,b)=>rotuloProjeto(a).localeCompare(rotuloProjeto(b),"pt-BR",{sensitivity:"base",numeric:true}));
  const responsaveisComAlerta=[...new Set(
    alertas.flatMap(a=>a.responsavel?a.responsavel.split(",").map(s=>s.trim()).filter(Boolean):[])
  )].sort((a,b)=>a.localeCompare(b,"pt-BR",{sensitivity:"base"}));
  // "__sem__" é um valor especial (não é nome de ninguém) para filtrar
  // alertas de atividade/financeiro sem responsável atribuído. Só aparece
  // no filtro quando existe pelo menos um alerta nessa situação — alertas
  // de reunião não entram aqui, pois não têm o conceito de "responsável".
  const SEM_RESP="__sem__";
  const temAlertaSemResp=alertas.some(a=>a.tipo!=="reuniao" && !a.responsavel);
  // se o valor selecionado deixou de existir (ex.: alerta resolvido), volta para "Todos"
  if(ST.painelAlertaProjeto && !projetosComAlerta.some(p=>p.id===ST.painelAlertaProjeto)) ST.painelAlertaProjeto="";
  if(ST.painelAlertaResp && ST.painelAlertaResp!==SEM_RESP && !responsaveisComAlerta.includes(ST.painelAlertaResp)) ST.painelAlertaResp="";
  if(ST.painelAlertaResp===SEM_RESP && !temAlertaSemResp) ST.painelAlertaResp="";
  const alertasFiltrados=alertas.filter(a=>
    (!ST.painelAlertaProjeto || a.projetoId===ST.painelAlertaProjeto) &&
    (!ST.painelAlertaResp || (
      ST.painelAlertaResp===SEM_RESP
        ? (a.tipo!=="reuniao" && !a.responsavel)
        : (a.responsavel && a.responsavel.split(",").map(s=>s.trim()).includes(ST.painelAlertaResp))
    ))
  );

  if(!ps.length && semAcessoLiberado()){
    v.innerHTML=`<div class="card"><div class="empty">
      <span class="ic">🔒</span>
      <h3>Seu acesso ainda não foi liberado</h3>
      <p>Seu perfil é <b>${esc(rotuloPerfil(perfilAtual()))}</b>. Peça ao Gestor do portfólio para liberar as sessões e os projetos em que você vai trabalhar (Configurações › Perfis e acessos).</p>
    </div></div>`;
    return;
  }
  if(!ps.length){
    v.innerHTML=`
    <div class="help-banner"><span>👋</span><span><b>Bem-vindo!</b> ${isGestor()?"Comece cadastrando a equipe e o primeiro projeto. Os dashboards e alertas são preenchidos automaticamente conforme você registra atividades, horas e lançamentos financeiros.":"Ainda não há projetos cadastrados no portfólio."}</span></div>
    <div class="card"><div class="empty">
      <span class="ic">▦</span>
      <h3>Nenhum projeto cadastrado ainda</h3>
      <p>${isGestor()?"Crie seu primeiro projeto para começar a monitorar prazos, horas e finanças.":"Fale com o gestor do portfólio para que projetos sejam cadastrados."}</p>
      ${podeCriarProjeto()?'<button class="btn" id="go-novo">+ Criar primeiro projeto</button>':""}
    </div></div>`;
    if($("#go-novo")) $("#go-novo").onclick=()=>formProjeto();
    return;
  }

  // valores em R$: só para quem não é Colaborador; margem e despesas, só com Financeiro
  const kpiValores=!ehPerfilColaborador(), kpiMargem=verFinanceiro;
  const nKpis=2+(kpiValores?2:0)+(kpiMargem?1:0);
  const kpis=`
  <div class="grid ${nKpis===5?"g5":nKpis===4?"g4":"g2"}">
    <div class="card kpi"><div class="lbl"><span class="dot" style="background:var(--accent)"></span>Projetos ativos</div>
      <div class="val">${ativos.length}</div><div class="sub">${ps.length} no portfólio</div></div>
    ${kpiValores?`<div class="card kpi" id="kpi-captacao" style="cursor:pointer" title="Ver detalhamento por projeto"><div class="lbl"><span class="dot" style="background:var(--warn)"></span>Captação (previsto)</div>
      <div class="val" title="${fmtBRL(captacaoPrevista)}">${fmtBRLResumo(captacaoPrevista)}</div><div class="sub">Valor pleiteado em propostas/editais · clique para detalhar</div></div>
    <div class="card kpi" id="kpi-receita" style="cursor:pointer" title="Ver detalhamento por projeto"><div class="lbl"><span class="dot" style="background:var(--info)"></span>Receita já captada</div>
      <div class="val" title="${fmtBRL(receitaCaptada)}">${fmtBRLResumo(receitaCaptada)}</div><div class="sub">Valor contratado do portfólio · clique para detalhar</div></div>`:""}
    ${kpiMargem?`<div class="card kpi"><div class="lbl"><span class="dot" style="background:var(--gold)"></span>Margem média</div>
      <div class="val">${margemMedia==null?"—":fmtNum(margemMedia,1)+"%"}</div>
      <div class="sub">Despesas: ${fmtBRL(despesaTotal)}</div></div>`:""}
    <div class="card kpi"><div class="lbl"><span class="dot" style="background:${alertas.some(a=>a.tipo==="fisico"||a.tipo==="financeiro")?"var(--danger)":"var(--ok)"}"></span>Alertas de prazo</div>
      <div class="val">${alertas.filter(a=>a.tipo==="fisico"||a.tipo==="financeiro").length}</div><div class="sub">${alertas.filter(a=>a.sev==="danger").length} vencido(s)</div></div>
  </div>`;

  /* dados dos gráficos por período (mês / semestre / ano escolhido) e colaborador */
  const perDash=periodoDash();
  const dadosHoras=horasDoPeriodo();
  const planPer=horasPlanejadasPeriodo(perDash.ini,perDash.fim);
  /* horas por categoria (executadas e planejadas no período) */
  const catMap={}, catPlan={};
  dadosHoras.forEach(h=>{ catMap[h.categoriaId||""]=(catMap[h.categoriaId||""]||0)+(+h.horas||0); });
  planPer.filter(x=>!ST.dashColab||x.colaboradorId===ST.dashColab).forEach(x=>{ catPlan[x.categoriaId||""]=(catPlan[x.categoriaId||""]||0)+x.horas; });
  const catData=DB.data.categorias.map(c=>({label:c.nome,value:catMap[c.id]||0,color:c.cor,
      title:`${c.nome}\nExecutadas: ${fmtH(catMap[c.id]||0)}\nPlanejadas no período: ${fmtH(catPlan[c.id]||0)}`}))
    .filter(d=>d.value>0);
  /* série temporal por categoria (para as barras empilhadas) */
  const serieCat=serieHorasPorCategoria();

  // Antes havia um corte fixo em "alertas.slice(0,7)" que escondia qualquer
  // alerta além do 7º — o "7" era do rótulo "próximos 7 dias" (janela de
  // tempo), não deveria limitar a QUANTIDADE de itens exibidos. Removido:
  // agora mostra todos os alertas encontrados, com rolagem interna quando
  // a lista fica longa, para não estourar o layout da página.
  const alertaRowHtml=a=>{
    const col=a.sev==="danger"?"var(--danger)":a.sev==="info"?"var(--info)":"var(--warn)";
    const respHtml=a.tipo==="reuniao"
      ? ""
      : a.responsavel
        ? `<div class="alert-resp"><span class="rl">Responsável:</span> <b>${esc(a.responsavel)}</b></div>`
        : `<div class="alert-resp sem"><span class="rl">Responsável:</span> <i>não atribuído</i></div>`;
    // anotações de progresso da atividade (preenchidas em "Editar atividade",
    // logo abaixo de "% Concluído"), exibidas aqui para dar contexto rápido
    // do andamento sem precisar abrir a atividade.
    // ITEM 3: botão "marcar como MDS" nas atividades da SPRINT
    const mcsAtiva=(a.tipo==="fisico" && a.secao==="sprint")
      ? (DB.data.mds||[]).find(m=>!m.concluido && m.atividadeId===a.atividadeId) : null;
    const mcsBtnHtml=(a.tipo==="fisico" && a.secao==="sprint" && veQuadrosEstrategicos())
      ? `<div class="alert-acoes"><button class="btn-icon ${mcsAtiva?"mcs-on":""}" data-alerta-mcs="${a.atividadeId}"
           title="${mcsAtiva?"Já é uma MDS desta semana — clique para remover do quadro de MDS":"Escolher esta atividade como MDS (aparece no quadro de MDS)"}">📍</button></div>` : "";
    const notasHtml=(a.tipo==="fisico" && a.notasProgresso)
      ? `<div class="alert-resp" style="white-space:pre-line"><span class="rl">Anotações:</span> ${esc(a.notasProgresso)}</div>`
      : "";
    // ações rápidas: permitem concluir/marcar como realizado ou editar o
    // item (atividade/lançamento) direto a partir do alerta, sem precisar
    // navegar até o projeto e procurar o item na lista. Para reuniões, um
    // atalho direto para a tela da reunião (preparar pauta/resumo).
    const acoesHtml=a.tipo==="reuniao"
      ? `<div class="alert-acoes">
            <button class="btn-icon" data-alerta-ir-reuniao="${a.reuniaoId}" data-proj="${a.projetoId}" title="Ir para a reunião">↗</button>
            ${podeEditarDados()?`<button class="btn-icon" data-alerta-ok-reuniao="${a.reuniaoId}" data-proj="${a.projetoId}" title="OK — reunião concluída, remover deste painel">✓</button>`:""}
          </div>`
      : a.tipo==="duplicada"
      ? (podeEditarDados()? `<div class="alert-acoes">
            <button class="btn-icon" data-alerta-editar-ativ="${a.atividadeId}" data-proj="${a.projetoId}" title="Editar atividade">✎</button>
            <button class="btn-icon" data-alerta-ignorar-dup="${a.atividadeId}" title="Ignorar — não é duplicata, não avisar de novo para esta atividade">🙈</button>
            ${podeExcluirDados()?`<button class="btn-icon del" data-alerta-excluir-ativ="${a.atividadeId}" data-proj="${a.projetoId}" title="Excluir esta atividade duplicada">🗑</button>`:""}
          </div>` : "")
      : a.tipo==="fisico"
        ? (podeEditarDados()? `<div class="alert-acoes">
            ${a.secao==="vencidos"?`<button class="btn-icon" data-alerta-sprint="${a.atividadeId}" title="Retornar esta atividade para a sprint desta semana (o prazo previsto não é alterado)">📅</button>`:""}
            <button class="btn-icon" data-alerta-concluir-ativ="${a.atividadeId}" title="Marcar atividade como concluída">✓</button>
            <button class="btn-icon" data-alerta-editar-ativ="${a.atividadeId}" data-proj="${a.projetoId}" title="Editar atividade (ex.: novo prazo)">✎</button>
            ${podeExcluirDados()?`<button class="btn-icon del" data-alerta-excluir-ativ="${a.atividadeId}" data-proj="${a.projetoId}" title="Excluir atividade">🗑</button>`:""}
          </div>`
          : podeEditarAtividade(getAtividade(a.atividadeId))? `<div class="alert-acoes">
            <button class="btn-icon" data-alerta-editar-ativ="${a.atividadeId}" data-proj="${a.projetoId}" title="Lançar horas e anotações, datas reais ou concluir">✎</button>
          </div>` : "")
        : (podeEditarDados() && verFinanceiro)? `<div class="alert-acoes">
            <button class="btn-icon" data-alerta-realizar-fin="${a.financeiroId}" title="Marcar como realizado">✓</button>
            <button class="btn-icon" data-alerta-editar-fin="${a.financeiroId}" data-proj="${a.projetoId}" title="Editar lançamento (ex.: nova data)">✎</button>
          </div>` : "";
    const faltaHtml=(a.faltando&&a.faltando.length)
      ? `<div class="alert-resp sem"><span class="rl">Faltam dados:</span> ${esc(a.faltando.join(", "))}</div>` : "";
    return `<div class="alert-row"><div class="ab" style="background:${col}"></div>
      <div class="at">${a.rotulo?`<div class="alert-head"><span class="alert-tag ${a.sev==="danger"?"danger":a.sev==="info"?"info":"warn"}">${esc(a.rotulo)}</span>${a.meta?`<span class="alert-meta">${esc(a.meta)}</span>`:""}</div>`:""}
        <div class="t">${esc(a.rotulo&&String(a.titulo).startsWith(a.rotulo+": ")?String(a.titulo).slice(a.rotulo.length+2):a.titulo)}</div>
        <div class="d">${a.descHtml||esc(a.desc)}</div>
        ${respHtml}${notasHtml}${faltaHtml}</div>
      <span class="badge ${a.sev==="danger"?"b-danger":a.sev==="info"?"b-info":"b-warn"}">${a.tipo==="fisico"?"Físico":a.tipo==="financeiro"?"Financeiro":a.tipo==="duplicada"?"Duplicada":"Reunião"}</span>
      ${mcsBtnHtml}${acoesHtml}</div>`;
  };

  const alertasFiltroHtml=`
    <div class="alertas-filtros">
      <div class="field-inline">Projeto
        <select class="select" id="painel-alerta-proj">
          <option value="">Todos</option>
          ${projetosComAlerta.map(p=>`<option value="${p.id}" ${p.id===ST.painelAlertaProjeto?"selected":""}>${esc(rotuloProjetoSelect(p))}</option>`).join("")}
        </select>
      </div>
      <div class="field-inline">Responsável
        <select class="select" id="painel-alerta-resp">
          <option value="">Todos</option>
          ${temAlertaSemResp?`<option value="${SEM_RESP}" ${ST.painelAlertaResp===SEM_RESP?"selected":""}>Não atribuído</option>`:""}
          ${responsaveisComAlerta.map(r=>`<option value="${esc(r)}" ${r===ST.painelAlertaResp?"selected":""}>${esc(r)}</option>`).join("")}
        </select>
      </div>
    </div>`;

  // ---- Sessões do painel de alertas (ordem: vencidos → sprint → reuniões → duplicidades)
  const sem=limitesSemanaCorrente();
  const dosec=k=>alertasFiltrados.filter(a=>a.secao===k);
  const secVencidos=dosec("vencidos");
  const secSprint=dosec("sprint");
  const secReunioes=dosec("reunioes");
  const secDup=dosec("duplicidades");
  const reuProx=secReunioes.filter(a=>a.dias>=0).sort((a,b)=>a.dias-b.dias);
  const reuAberto=secReunioes.filter(a=>a.dias<0).sort((a,b)=>b.dias-a.dias);
  const vazioHtml=msg=>`<div class="empty" style="padding:26px"><span class="ic">✓</span><p>${msg}</p></div>`;
  const subTitulo=t=>`<div style="font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);margin:6px 2px 8px">${t}</div>`;
  const secaoCard=(id,titulo,hint,qtd,sev,corpo,extra="")=>`
    <div class="card" style="margin-bottom:18px">
      <div class="card-head" style="flex-wrap:wrap;gap:10px">
        <h3>${titulo} <span class="badge ${qtd?sev:"b-ok"}" style="margin-left:6px">${qtd}</span></h3>
        <span class="hint">${hint}</span>
      </div>
      <div class="card-pad" id="alertas-scroll-box-${id}" style="${qtd>5?"max-height:440px;overflow-y:auto":""}">${corpo}</div>
      ${extra}
    </div>`;
  const reunioesCorpo=secReunioes.length
    ? (reuProx.length? subTitulo("Próximas reuniões (até 7 dias)")+reuProx.map(alertaRowHtml).join("") : "")
      +(reuAberto.length? subTitulo("Reuniões em aberto (já realizadas, sem OK)")+reuAberto.map(alertaRowHtml).join("") : "")
    : vazioHtml(alertas.some(a=>a.secao==="reunioes")?"Nenhuma reunião para o filtro selecionado.":"Nenhuma reunião próxima ou em aberto.");
  const semOcupIni=addDays(sem.ini,7*(ST.sprintSemanaOffset||0));
  const sprintOcupHtml=!veOcupacao()?"":`
    <div class="card-pad" style="border-top:1px solid var(--line)">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
        <h4 style="font-size:14px">📊 Ocupação semanal da equipe</h4>
        <button class="btn ghost sm" id="sprint-sem-prev" title="Semana anterior">◀</button>
        <span style="font-size:12.5px;font-weight:600">${fmtDate(semOcupIni)} a ${fmtDate(addDays(semOcupIni,6))}${ST.sprintSemanaOffset?"":" (semana atual)"}</span>
        <button class="btn ghost sm" id="sprint-sem-next" title="Próxima semana">▶</button>
        ${ST.sprintSemanaOffset?`<button class="btn ghost sm" id="sprint-sem-hoje">Semana atual</button>`:""}
      </div>
      <div style="font-size:12px;color:var(--ink-faint);margin-bottom:8px">
        Horas <b>restantes</b> (ainda não executadas) de cada atividade, <b>divididas pelos dias úteis</b> de hoje até o término previsto — cada semana mostra só a parte dos seus dias; as <b>atrasadas</b> entram inteiras na semana atual — mais as horas <b>já executadas</b> na semana (barra azul), em todos os projetos${isGestor()?"":" — os que você não acessa aparecem como “Outros projetos”, sem nomes"}. O <b>limite</b> (│) é <b>80% da carga semanal</b> (${fmtNum(CAPACIDADE_SEMANAL_PADRAO*OCUP_LIMITE,0)} h de ${CAPACIDADE_SEMANAL_PADRAO} h): de 70% a 80% fica laranja e de 80% em diante, vermelho.
        ${isGestor()?"Edite o campo à direita para ajustar a carga semanal de uma pessoa (feriado, licença, férias).":""}
        ${CAPSEM.remoto?"":"<br><span style='color:var(--warn)'>⚠ Tabela <b>capacidade_semanal</b> não encontrada no Supabase: os ajustes ficam salvos só neste navegador.</span>"}
      </div>
      ${ocupacaoSemanalHtml(semOcupIni)}
    </div>`;
  const alertasSecoesHtml=`
    <div class="card" style="margin-bottom:18px">
      <div class="card-head" style="flex-wrap:wrap;gap:10px">
        <h3>⚠ Central de alertas</h3>
        <div style="display:flex;flex-direction:column;align-items:stretch;gap:10px;width:100%;min-width:0;box-sizing:border-box">
          <span class="hint">${alertasFiltrados.length} de ${alertas.length} alerta(s)</span>
          ${alertasFiltroHtml}
        </div>
      </div>
    </div>
    ${secaoCard("vencidos","1. Alertas de prazos vencidos","atividades e lançamentos financeiros com prazo anterior a hoje",secVencidos.length,"b-danger",
      secVencidos.length? secVencidos.map(alertaRowHtml).join("") : vazioHtml(alertas.some(a=>a.secao==="vencidos")?"Nenhum alerta para o filtro selecionado.":"Nenhum prazo vencido. 🎉"))}
    ${secaoCard("sprint","2. SPRINT","vencem (ou venceram) na semana corrente · "+fmtDate(sem.ini)+" a "+fmtDate(sem.fim),secSprint.length,"b-warn",
      secSprint.length? secSprint.map(alertaRowHtml).join("") : vazioHtml(alertas.some(a=>a.secao==="sprint")?"Nenhum alerta para o filtro selecionado.":"Nada vence no restante desta semana."),sprintOcupHtml)}
    ${secaoCard("reunioes","3. Próximas reuniões / reuniões em aberto","reuniões dos próximos 7 dias e as já realizadas que ainda não receberam OK",secReunioes.length,"b-info",reunioesCorpo)}
    ${ehPerfilColaborador()?"":secaoCard("duplicidades","4. Duplicidades","atividades com o mesmo nome em um ou mais cronogramas",secDup.length,"b-warn",
      secDup.length? secDup.map(alertaRowHtml).join("") : vazioHtml(alertas.some(a=>a.secao==="duplicidades")?"Nenhum alerta para o filtro selecionado.":"Nenhuma duplicidade encontrada."))}
  `;

  v.innerHTML=`
  ${kpis}
  <div style="height:18px"></div>
  ${alertasSecoesHtml}

  ${veQuadrosEstrategicos()?mciMdsPainelHtml():""}

  <div class="toolbar">
    <span class="section-title" style="margin:0">${ehPerfilColaborador()?"Minhas horas":"Dashboards de horas"}</span>
    <div class="spacer"></div>
    ${editaAtividadeCompleta()?`<button class="btn ghost sm" id="btn-imp-pend" title="Envie a planilha de pendências preenchida para gravar as datas reais e as horas executadas de uma vez">⬆ Importar pendências preenchidas</button>`:""}
    <button class="btn ghost sm" id="btn-pend-conc" title="Planilha com as atividades concluídas que estão sem datas reais ou horas executadas, uma aba por projeto">⬇ Pendências de conclusão (.xlsx)</button>
    <div class="field-inline">Ano
      <select class="select" id="dash-year">${anosDisponiveis().map(y=>`<option ${y===ST.dashYear?"selected":""}>${y}</option>`).join("")}</select>
    </div>
    <div class="pill-toggle" id="dash-mode">
      <button data-m="mensal" class="${ST.dashMode==="mensal"?"on":""}">Mensal</button>
      <button data-m="semestral" class="${ST.dashMode==="semestral"?"on":""}">Semestral</button>
      <button data-m="anual" class="${ST.dashMode==="anual"?"on":""}">Anual</button>
    </div>
    ${ST.dashMode==="mensal"?`<div class="field-inline">Mês
      <select class="select" id="dash-mes">${MONTHS.map((m,i)=>`<option value="${i+1}" ${i+1===+ST.dashMes?"selected":""}>${m}</option>`).join("")}</select></div>`
    :ST.dashMode==="semestral"?`<div class="field-inline">Semestre
      <select class="select" id="dash-sem"><option value="1" ${+ST.dashSem===1?"selected":""}>1º</option><option value="2" ${+ST.dashSem===2?"selected":""}>2º</option></select></div>`:""}
    ${ehPerfilColaborador()?"":`<div class="field-inline">Colaborador
      <select class="select" id="dash-colab"><option value="">Todos</option>${colaboradoresDash().map(c=>`<option value="${esc(c.id)}" ${c.id===ST.dashColab?"selected":""}>${esc(c.nome)}</option>`).join("")}</select>
    </div>`}
  </div>

  <div class="card" style="margin-bottom:18px">
    <div class="card-head"><h3>Horas executadas — visão ${ST.dashMode}</h3>
      <button class="btn ghost sm" id="btn-origem-horas" title="Lista cada lançamento que compõe as horas executadas: de onde veio, atividade, pessoa e data">🔍 Ver origem das horas</button>
      <span class="hint">${ST.dashMode==="anual"?"Todos os anos":"Ano "+ST.dashYear}${ST.dashColab?" · "+esc(nomeColab(ST.dashColab)):""} · total ${fmtH(serieCat.reduce((s,d)=>s+d.total,0))}${ST.dashMode!=="anual"?" · clique numa coluna para ver o período nos gráficos abaixo":""}</span></div>
    <div class="card-pad">${stackedBarChart(serieCat,{fmt:v=>fmtNum(v,0)+"h",legend:legendDeBuckets(serieCat),clicavel:ST.dashMode!=="anual",selecionado:ST.dashMode==="mensal"?+ST.dashMes-1:ST.dashMode==="semestral"?+ST.dashSem-1:-1})}</div>
  </div>

  <div class="grid g2">
    <div class="card">
      <div class="card-head"><h3>Horas por categoria de atividade</h3><span class="hint">${esc(perDash.label)}${ST.dashColab?" · "+esc(nomeColab(ST.dashColab)):""}</span></div>
      <div class="card-pad">${donutChart(catData,{horas:true})}</div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Horas por projeto</h3><span class="hint">${esc(perDash.label)}${ST.dashColab?" · "+esc(nomeColab(ST.dashColab)):""}</span></div>
      <div class="card-pad">${horasPorProjetoHtml(dadosHoras,planPer)}</div>
    </div>
  </div>

  ${veOcupacao()?`<div class="card" style="margin-top:18px">
    <div class="card-head"><h3>Ocupação por colaborador</h3><span class="hint">${esc(perDash.label)} · executado × planejado × capacidade (${CAPACIDADE_DIARIA_PADRAO} h por dia útil) · clique no nome para filtrar os gráficos</span></div>
    <div class="card-pad">${comOutrosProjetos(()=>ocupacaoColabPeriodoHtml(perDash,horasPlanejadasPeriodo(perDash.ini,perDash.fim)))}</div>
  </div>`:""}`;

  if(podeCriarProjeto()) setTopAction(`<button class="btn">+ Novo projeto</button>`,()=>formProjeto());
  if(veQuadrosEstrategicos()) wirePainelMciMds(v);
  $("#btn-origem-horas").onclick=()=>abrirOrigemHoras();
  $("#painel-alerta-proj").onchange=e=>{ ST.painelAlertaProjeto=e.target.value; render(); };
  $("#painel-alerta-resp").onchange=e=>{ ST.painelAlertaResp=e.target.value; render(); };
  $("#dash-year").onchange=e=>{ ST.dashYear=e.target.value; render(); };
  if($("#dash-mes")) $("#dash-mes").onchange=e=>{ ST.dashMes=+e.target.value; render(); };
  if($("#dash-sem")) $("#dash-sem").onchange=e=>{ ST.dashSem=+e.target.value; render(); };
  if($("#dash-colab")) $("#dash-colab").onchange=e=>{ ST.dashColab=e.target.value; render(); };
  v.querySelectorAll("[data-bucket]").forEach(el=>{
    el.onclick=()=>{ const i=+el.dataset.bucket; if(ST.dashMode==="mensal") ST.dashMes=i+1; else if(ST.dashMode==="semestral") ST.dashSem=i+1; render(); };
  });
  v.querySelectorAll("[data-dash-proj]").forEach(el=>{ el.onclick=()=>abrirDetalheProjetoDash(el.dataset.dashProj); });
  v.querySelectorAll("[data-dash-colab]").forEach(el=>{
    el.onclick=()=>{ ST.dashColab=(ST.dashColab===el.dataset.dashColab?"":el.dataset.dashColab); render(); };
  });
  // gráfico de ocupação semanal (SPRINT): navegação de semana e ajuste de horas por pessoa
  if($("#sprint-sem-prev")) $("#sprint-sem-prev").onclick=()=>{ ST.sprintSemanaOffset=(ST.sprintSemanaOffset||0)-1; render(); };
  if($("#sprint-sem-next")) $("#sprint-sem-next").onclick=()=>{ ST.sprintSemanaOffset=(ST.sprintSemanaOffset||0)+1; render(); };
  if($("#sprint-sem-hoje")) $("#sprint-sem-hoje").onclick=()=>{ ST.sprintSemanaOffset=0; render(); };
  v.querySelectorAll("[data-capsem-colab]").forEach(inp=>{
    inp.onchange=async()=>{
      const h=inp.value===""?null:Math.max(0,+inp.value);
      await salvarCapacidadeSemanal(inp.dataset.capsemColab,inp.dataset.capsemSemana,h); render();
    };
  });
  v.querySelectorAll("[data-capsem-reset]").forEach(b=>{
    b.onclick=async()=>{ await salvarCapacidadeSemanal(b.dataset.capsemReset,b.dataset.capsemSemana,null); render(); };
  });
  $("#btn-pend-conc").onclick=exportarPendenciasConclusao;
  if($("#btn-imp-pend")) $("#btn-imp-pend").onclick=importarPendenciasConclusao;
  $("#dash-mode").querySelectorAll("button").forEach(b=>{
    b.onclick=()=>{ ST.dashMode=b.dataset.m; render(); };
  });

  // ações rápidas dos alertas de prazo (ver calcularAlertas/alertasHtml acima)
  v.querySelectorAll("[data-alerta-mcs]").forEach(b=>{
    b.onclick=()=>alternarAtividadeComoMcs(b.dataset.alertaMcs);
  });
  v.querySelectorAll("[data-alerta-sprint]").forEach(b=>{
    b.onclick=()=>moverAtividadeParaSprint(b.dataset.alertaSprint);
  });
  v.querySelectorAll("[data-alerta-concluir-ativ]").forEach(b=>{
    b.onclick=()=>marcarAtividadeConcluidaRapido(b.dataset.alertaConcluirAtiv);
  });
  v.querySelectorAll("[data-alerta-editar-ativ]").forEach(b=>{
    b.onclick=()=>formAtividade(b.dataset.proj, getAtividade(b.dataset.alertaEditarAtiv), {semPredecessoras:true});
  });
  v.querySelectorAll("[data-alerta-excluir-ativ]").forEach(b=>{
    b.onclick=()=>excluirAtividadeComConfirmacao(getAtividade(b.dataset.alertaExcluirAtiv));
  });
  v.querySelectorAll("[data-alerta-ignorar-dup]").forEach(b=>{
    b.onclick=()=>ignorarDuplicataAtividade(b.dataset.alertaIgnorarDup);
  });
  v.querySelectorAll("[data-alerta-realizar-fin]").forEach(b=>{
    b.onclick=()=>marcarFinanceiroRealizadoRapido(b.dataset.alertaRealizarFin);
  });
  v.querySelectorAll("[data-alerta-editar-fin]").forEach(b=>{

/* Ação rápida do Painel Geral: marca a atividade atrasada/próxima do prazo
   como concluída (100%) direto da lista de alertas, sem precisar abrir o
   projeto e procurar a atividade no cronograma.
   Quando a atividade tem "Horas previstas por colaborador" preenchidas,
   este mesmo passo já pede para confirmar (ou corrigir) as horas realmente
   executadas por cada pessoa — em vez de precisar abrir a atividade depois
   só para isso: um botão "OK" preenche a horas executadas igual à prevista,
   e quem gastou tempo diferente do previsto pode digitar o valor real. */
/* REGRA DE CONCLUSÃO: uma atividade só pode ser concluída se tiver
   Início real, Término real e as Horas executadas de TODOS os colaboradores
   listados em "Horas previstas por colaborador". Devolve o texto do erro
   ("" quando está tudo certo). Usada pelo formulário de atividade e pela
   conclusão rápida do Painel Geral. */
function erroConclusaoAtividade(d){
  const pend=[];
  if(!d.dataInicioReal) pend.push("Início real");
  if(!d.dataFimReal) pend.push("Término real");
  (Array.isArray(d.estimativasPessoas)?d.estimativasPessoas:[])
    .filter(x=>x && x.colaboradorId)
    .forEach(x=>{
      const h=x.horasExecutadas;
      const ok=h!==null && h!==undefined && h!=="" && isFinite(+h) && +h>=0;
      if(!ok){
        const c=getColab(x.colaboradorId);
        pend.push("Horas executadas de "+(c?c.nome:"colaborador removido"));
      }
    });
  if(pend.length)
    return "Não é possível concluir a atividade. Preencha: "+pend.join("; ")+".";
  if(d.dataFimReal<d.dataInicioReal)
    return "O Término real não pode ser anterior ao Início real.";
  return "";
}

/* Ação rápida do Painel Geral (Alertas de prazos vencidos): retorna uma
   atividade atrasada para a SPRINT da semana corrente SEM recalcular o prazo.
   O Início/Término PREVISTOS ficam como estavam (rastreabilidade do atraso);
   a atividade só ganha a marca "sprintSemana" (segunda-feira da semana), que
   a faz aparecer na SPRINT e puxa o saldo de horas para esta semana. O atraso
   passa a ser lido no Início real / Término real. Se a semana virar sem a
   conclusão, ela volta para "Alertas de prazos vencidos".
   Requer a coluna atividades.sprint_semana (ver SQL_SPRINT_SEMANA). */
const SQL_SPRINT_SEMANA="alter table atividades add column if not exists sprint_semana date; notify pgrst, 'reload schema';";
function atividadeNaSprint(a){ return !!a && !!a.sprintSemana && a.sprintSemana===limitesSemanaCorrente().ini; }
function moverAtividadeParaSprint(atividadeId){
  const a=getAtividade(atividadeId);
  if(!a) return;
  const hoje=todayStr(), sem=limitesSemanaCorrente();
  const lblStyle="display:block;margin-bottom:5px;font-size:12.5px;font-weight:600;color:var(--ink-soft)";
  $("#modal-root").innerHTML=`
  <div class="overlay"><div class="modal" style="max-width:500px">
    <div class="modal-head"><h3>Retornar para a sprint desta semana</h3></div>
    <div class="modal-body">
      <p style="color:var(--ink-soft);font-size:13px">"${esc(a.nome)}" venceu em ${fmtDate(a.dataFimPrev)}.
        Ela entra na sprint da semana (${fmtDate(sem.ini)} a ${fmtDate(sem.fim)}) <b>sem alterar o prazo previsto</b>:
        o atraso fica registrado no Início real e no Término real.</p>
      <div style="margin-top:12px">
        <label style="${lblStyle}">Início real</label>
        <input type="date" id="sp-ini" value="${esc(a.dataInicioReal||"")}" max="${hoje}">
        <span class="help" style="display:block;margin-top:4px">Preencha se a atividade já começou (deixe em branco se ainda não começou).</span>
      </div>
      <div id="sp-err" style="display:none;margin-top:12px;padding:9px 12px;border-radius:8px;
        background:var(--danger-bg);color:var(--danger);font-size:12.5px;line-height:1.5;word-break:break-word"></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="sp-no">Cancelar</button>
      <button class="btn" id="sp-yes">Retornar para a sprint</button>
    </div></div></div>`;
  $("#sp-no").onclick=closeModal;
  $("#sp-yes").onclick=async()=>{
    const ini=$("#sp-ini").value||null;
    const err=$("#sp-err");
    if(ini && ini>hoje){ err.textContent="O Início real não pode ser uma data futura."; err.style.display="block"; return; }
    // registra o histórico nas anotações de progresso
    const linha=`[${fmtDate(hoje)}] Retornada para a sprint da semana ${fmtDate(sem.ini)} a ${fmtDate(sem.fim)} (prazo previsto mantido: ${fmtDate(a.dataFimPrev)}).`;
    const patch={sprintSemana:sem.ini,notasProgresso:a.notasProgresso?(a.notasProgresso+"\n"+linha):linha};
    if(ini!==(a.dataInicioReal||null)){ patch.dataInicioReal=ini; patch.inicioRealMesmo=!!ini && ini===a.dataInicioPrev; }
    try{
      await sbUpdate("atividades", a.id, toSnake(patch));
      Object.assign(a,patch);
      closeModal();
      toast("Atividade retornada para a sprint desta semana (prazo previsto mantido).");
      render();
    }catch(e){
      const m=String(e.message||e);
      err.innerHTML=/sprint_semana|PGRST204/.test(m)
        ? `O banco ainda não tem a coluna <b>sprint_semana</b>. Peça ao administrador para rodar no SQL Editor do Supabase:<br><code style="user-select:all">${esc(SQL_SPRINT_SEMANA)}</code>`
        : "Erro ao atualizar a atividade: "+esc(m);
      err.style.display="block";
    }
  };
}

async function marcarAtividadeConcluidaRapido(atividadeId){
  const a=getAtividade(atividadeId);
  if(!a) return;
  const pessoas=(Array.isArray(a.estimativasPessoas)?a.estimativasPessoas:[]).filter(x=>x.colaboradorId);

  const lblStyle='display:block;margin-bottom:5px;font-size:12.5px;font-weight:600;color:var(--ink-soft)';
  $("#modal-root").innerHTML=`
  <div class="overlay"><div class="modal" style="max-width:540px">
    <div class="modal-head"><h3>Marcar atividade como concluída?</h3></div>
    <div class="modal-body">
      <p style="color:var(--ink-soft);font-size:13px">"${esc(a.nome)}" será marcada como 100% concluída.
        Para concluir, informe as datas reais${pessoas.length?" e as horas executadas de cada colaborador":""}.</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:14px">
        <div style="flex:1;min-width:150px">
          <label style="${lblStyle}">Início real <span class="req">*</span></label>
          <input type="date" id="c-ini" value="${esc(a.dataInicioReal||"")}">
        </div>
        <div style="flex:1;min-width:150px">
          <label style="${lblStyle}">Término real <span class="req">*</span></label>
          <input type="date" id="c-fim" value="${esc(a.dataFimReal||todayStr())}">

      </div>

      <div id="c-err" style="display:none;margin-top:12px;padding:9px 12px;border-radius:8px;

async function salvarConclusaoAtividade(a,novasEstimativas,dataInicioReal,dataFimReal){
  try{
    // Além de status e progresso, grava as datas reais informadas. O Término
    // PREVISTO é preservado (antes era trocado pela data de hoje, o que
    // apagava o atraso); só é preenchido se estiver vazio. O atraso fica
    // visível comparando previsto × real. Só aplica no objeto em memória
    // depois que o servidor confirmar (evita a tela mostrar "concluída" sem ter salvado).
    const prevFim=editaAtividadeCompleta()?(a.dataFimPrev||dataFimReal||todayStr()):(a.dataFimPrev||null);
    const patch={status:"Concluída",progresso:100,
      dataInicioReal:dataInicioReal||null,dataFimReal:dataFimReal||null,
      inicioRealMesmo:!!dataInicioReal && dataInicioReal===a.dataInicioPrev,
      fimRealMesmo:!!dataFimReal && dataFimReal===prevFim};
    if(prevFim!==(a.dataFimPrev||null)) patch.dataFimPrev=prevFim;
    if(novasEstimativas) patch.estimativasPessoas=novasEstimativas;
    await sbUpdate("atividades", a.id, toSnake(patch));
    Object.assign(a,patch);
    toast("Atividade marcada como concluída.");
    render();
  }catch(e){
    toast("Erro ao atualizar a atividade: "+(e.message||e));
  }
}

function anosDisponiveis(){
  const set=new Set([String(new Date().getFullYear())]);
  horasConsolidadas().forEach(h=>{ if(h.data) set.add(yearOf(h.data)); });
  return [...set].sort();
}
/* horas executadas que entram nos dashboards: hora executada não existe no
   futuro, então registros com data depois de hoje (ex.: apontamentos antigos
   criados com "Repetir em vários dias" até o fim do ano) ficam de fora — e
   aparecem em "Ver origem das horas" como "data futura (não contada)". */
function horasExecutadasDashboard(){
  const hoje=todayStr();
  return horasConsolidadas().filter(h=>h.data && h.data<=hoje);
}
/* período dos gráficos de categoria, projeto e colaborador:
   mensal → mês escolhido; semestral → semestre escolhido; anual → ano escolhido */
function periodoDash(){
  const y=ST.dashYear;
  if(ST.dashMode==="mensal"){
    const m=pad(+ST.dashMes||1), ult=new Date(+y,+ST.dashMes,0).getDate();
    return {ini:`${y}-${m}-01`,fim:`${y}-${m}-${pad(ult)}`,label:MONTHS[(+ST.dashMes||1)-1]+"/"+y};
  }
  if(ST.dashMode==="semestral")
    return +ST.dashSem===2?{ini:`${y}-07-01`,fim:`${y}-12-31`,label:"2º semestre/"+y}:{ini:`${y}-01-01`,fim:`${y}-06-30`,label:"1º semestre/"+y};
  return {ini:`${y}-01-01`,fim:`${y}-12-31`,label:"Ano "+y};
}
/* horas executadas do período escolhido, filtradas pelo colaborador (se houver) */
function horasDoPeriodo(){
  const per=periodoDash();
  return horasExecutadasDashboard().filter(h=>h.data>=per.ini && h.data<=per.fim && (!ST.dashColab || h.colaboradorId===ST.dashColab));
}
/* horas PLANEJADAS que caem no período: as horas previstas de cada pessoa em
   cada atividade (não cancelada) são distribuídas igualmente pelos dias úteis
   entre o Início e o Término previstos; entra a fatia dos dias do período. */
function horasPlanejadasPeriodo(ini,fim){
  const out=[];
  DB.data.atividades.forEach(a=>{
    if(a.status==="Cancelada") return;
    const di=a.dataInicioPrev||a.dataFimPrev, df=a.dataFimPrev||a.dataInicioPrev;
    if(!di||!df) return;
    let dias=diasUteisEntre(di<=df?di:df,df>=di?df:di); if(!dias.length) dias=[df];
    const n=dias.filter(d=>d>=ini&&d<=fim).length;
    if(!n) return;
    (a.estimativasPessoas||[]).forEach(e=>{
      const h=(+e.horas||0)*n/dias.length;
      if(e.colaboradorId && h>0) out.push({atividadeId:a.id,projetoId:a.projetoId,categoriaId:a.categoriaId||"",colaboradorId:e.colaboradorId,horas:h});
    });
  });
  return out;
}
/* colaboradores que aparecem nos dashboards (com horas executadas ou previstas) */
function colaboradoresDash(){
  const ids=new Set();
  horasConsolidadas().forEach(h=>{ if(h.colaboradorId) ids.add(h.colaboradorId); });
  DB.data.atividades.forEach(a=>(a.estimativasPessoas||[]).forEach(e=>{ if(e.colaboradorId) ids.add(e.colaboradorId); }));
  return [...ids].map(getColab).filter(Boolean).sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
}
/* horas planejadas (total, todas as datas) de um projeto, opcionalmente de um colaborador */
function horasPlanejadasProjeto(pid,colabId){
  let t=0;

/* "Ocupação por colaborador": no período, executado e planejado de cada pessoa
   contra a capacidade (dias úteis do período × 8 h). Para períodos futuros
   ou o mês corrente, o planejado mostra a carga prevista. */
function ocupacaoColabPeriodoHtml(per,planPer){
  const cap=diasUteisEntre(per.ini,per.fim).length*CAPACIDADE_DIARIA_PADRAO;
  const execTodos=horasExecutadasDashboard().filter(h=>h.data>=per.ini&&h.data<=per.fim);
  const ex={}, pl={};
  execTodos.forEach(h=>{ if(h.colaboradorId) ex[h.colaboradorId]=(ex[h.colaboradorId]||0)+(+h.horas||0); });
  planPer.forEach(x=>{ pl[x.colaboradorId]=(pl[x.colaboradorId]||0)+x.horas; });
  const ids=[...new Set([...Object.keys(ex),...Object.keys(pl)])].filter(id=>getColab(id))
    .filter(id=>!ehPerfilColaborador() || id===(USER.current&&USER.current.colabId))
    .sort((a,b)=>Math.max(pl[b]||0,ex[b]||0)-Math.max(pl[a]||0,ex[a]||0));
  if(!ids.length) return `<div class="empty" style="padding:22px"><p>Sem horas no período.</p></div>`;
  const escala=Math.max(cap,...ids.map(id=>Math.max(ex[id]||0,pl[id]||0)))||1;
  return ids.map(id=>{
    const e=ex[id]||0, p=pl[id]||0, oc=cap?p/cap*100:0;
    const cor=oc>100.01?"var(--danger)":oc>=80?"var(--warn)":"var(--ok)";
    const sel=ST.dashColab===id;
    return `<div style="display:grid;grid-template-columns:minmax(120px,200px) 1fr auto;gap:6px 14px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--line-soft);${sel?"background:var(--accent-soft)":""}">
      <a data-dash-colab="${esc(id)}" style="cursor:pointer;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${sel?"Remover o filtro":"Filtrar os gráficos por "+esc(nomeColab(id))}">${sel?"✓ ":""}${esc(nomeColab(id))}</a>
      <div style="position:relative;height:14px;background:var(--line-soft);border-radius:5px;overflow:hidden" title="Executado: ${fmtH(e)}\nPlanejado: ${fmtH(p)}\nCapacidade: ${fmtH(cap)}">
        <div style="position:absolute;left:0;top:0;bottom:0;width:${p/escala*100}%;background:${cor};opacity:.35"></div>
        <div style="position:absolute;left:0;top:3px;bottom:3px;width:${e/escala*100}%;background:var(--info);border-radius:3px"></div>
        <div style="position:absolute;top:0;bottom:0;left:calc(${cap/escala*100}% - 1px);width:2px;background:var(--ink)"></div>
      </div>
      <div style="font-size:11.5px;color:var(--ink-soft);white-space:nowrap"><b style="color:var(--info)">${fmtNum(e,1)} h</b> exec. · ${fmtNum(p,1)} h plan. · <b style="color:${cor}">${fmtNum(oc,0)}%</b> ocupação</div>
    </div>`;
  }).join("")+`<div style="font-size:11.5px;color:var(--ink-faint);margin-top:8px">Azul = executado · barra clara = planejado · │ capacidade do período (${fmtH(cap)}) · ocupação = planejado ÷ capacidade</div>`;
}

function serieHorasPorCategoria(){
  function catColor(cid){ const c=getCategoria(cid); return c?c.cor:"#c7cfd6"; }
  function catNome(cid){ return cid?nomeCategoria(cid):"Sem categoria"; }
  function buildBuckets(labels, bucketOfFn){
    const buckets=labels.map(l=>({label:l,total:0,map:{}}));
    horasExecutadasDashboard().forEach(h=>{
      if(ST.dashColab && h.colaboradorId!==ST.dashColab) return;
      const idx=bucketOfFn(h);
      if(idx==null||idx<0||idx>=buckets.length) return;
      const cid=h.categoriaId||"";
      const val=+h.horas||0;
      buckets[idx].total+=val;
      buckets[idx].map[cid]=(buckets[idx].map[cid]||0)+val;
    });
    buckets.forEach(b=>{
      b.segs=Object.keys(b.map).map(cid=>({
        value:b.map[cid], color:catColor(cid), nome:catNome(cid)
      })).sort((a,b)=>b.value-a.value);
    });
    return buckets;
  }
  if(ST.dashMode==="mensal"){
    return buildBuckets(MONTHS, h=>{
      if(yearOf(h.data)!==ST.dashYear) return -1;
      return parseInt((h.data||"").slice(5,7),10)-1;
    });
  }
  if(ST.dashMode==="semestral"){
    return buildBuckets(["1º Semestre","2º Semestre"], h=>{
      if(yearOf(h.data)!==ST.dashYear) return -1;
      const mi=parseInt((h.data||"").slice(5,7),10);
      return mi<=6?0:1;
    });
  }
  // anual
  const years=anosDisponiveis();
  if(!years.length) return [{label:ST.dashYear,total:0,segs:[]}];
  return buildBuckets(years, h=>years.indexOf(yearOf(h.data)));
}
function legendDeBuckets(buckets){
  const totais={};
  buckets.forEach(b=>(b.segs||[]).forEach(s=>{
    if(!totais[s.nome]) totais[s.nome]={label:s.nome,color:s.color,value:0};
    totais[s.nome].value+=s.value;
  }));
  return Object.values(totais).sort((a,b)=>b.value-a.value);
}

const ORDEM_STATUS_PORTFOLIO={"Em andamento":0,"Em risco":1,"Planejado":2,"Concluído":3,"Cancelado":4};
function ordenarProjetos(lista, criterio){
  const arr=lista.slice();
  if(criterio==="nome"){
    arr.sort((a,b)=>(a.nome||"").localeCompare(b.nome||"","pt-BR",{sensitivity:"base"}));
  } else if(criterio==="data"){
    // mais recentes primeiro; sem data definida vai para o final
    arr.sort((a,b)=>(b.dataInicio||"").localeCompare(a.dataInicio||""));
  } else { // status
    arr.sort((a,b)=>{
      const sa=ORDEM_STATUS_PORTFOLIO[statusCalculado(a)]??99;
      const sb=ORDEM_STATUS_PORTFOLIO[statusCalculado(b)]??99;
      return sa-sb || (a.nome||"").localeCompare(b.nome||"","pt-BR",{sensitivity:"base"});
    });
  }
  return arr;
}

function delProjeto(id){
  const p=getProjeto(id);
  const nAt=DB.data.atividades.filter(x=>x.projetoId===id).length;
  const nH=DB.data.horas.filter(x=>x.projetoId===id).length;
  const nF=DB.data.financeiro.filter(x=>x.projetoId===id).length;
  const nStk=(p.stakeholders||[]).length, nRsk=(p.riscos||[]).length, nReu=(p.reunioes||[]).length;
  confirmar(`Excluir o projeto "${p.nome}"?`,
    `Isso apaga definitivamente do banco de dados (não é reversível): ${nAt} atividade(s), `+
    `${nH} apontamento(s) de horas, ${nF} lançamento(s) financeiro(s), ${nStk} stakeholder(s), `+
    `${nRsk} risco(s) e ${nReu} reunião(ões) vinculados a este projeto.`,
    async()=>{
    DB.data.projetos=DB.data.projetos.filter(x=>x.id!==id);
    DB.data.atividades=DB.data.atividades.filter(x=>x.projetoId!==id);
    DB.data.horas=DB.data.horas.filter(x=>x.projetoId!==id);
    DB.data.financeiro=DB.data.financeiro.filter(x=>x.projetoId!==id);
    await sbDelete("projetos", id); // ON DELETE CASCADE no banco remove de verdade todo o resto (atividades, horas, financeiro, stakeholders, riscos, reuniões, raci)
    toast("Projeto e todos os dados vinculados excluídos definitivamente."); render();
  });
}

function converterEmProjeto(p, destinoSessaoId){
  confirmar(`Converter "${p.nome}" em projeto?`,
    `O registro vai passar da sessão "${nomeSessao(p.sessaoId)}" para "${nomeSessao(destinoSessaoId)}", `+
    `mantendo todos os dados já cadastrados (atividades, horas, documentos, reuniões etc.).`,
    async()=>{
      p.sessaoId=destinoSessaoId;
      await sbUpdate("projetos", p.id, {sessao_id:destinoSessaoId});
      toast("Projeto convertido para "+nomeSessao(destinoSessaoId)+".");
      render();
    });
}

// atalho rápido para corrigir um projeto lançado na sessão errada — sem
// precisar abrir o formulário completo de edição.
function moverSessao(p){
  openForm({
    title:"Mover projeto de sessão",
    values:{sessaoId:p.sessaoId||""},
    fields:[
      {key:"sessaoId",label:"Nova sessão",type:"select",required:true,
        options:SESSOES.map(s=>({value:s.id,label:s.label})),
        help:`"${p.nome}" está hoje em "${nomeSessao(p.sessaoId)}".`}
    ],
    onSave:async(v)=>{
      if(v.sessaoId===p.sessaoId){ toast("O projeto já está nessa sessão."); return; }
      p.sessaoId=v.sessaoId;
      await sbUpdate("projetos", p.id, {sessao_id:v.sessaoId});
      toast("Projeto movido para "+nomeSessao(v.sessaoId)+".");
      render();
    }
  });
}

/* ============================================================
   VIEW: DETALHE DO PROJETO
   ============================================================ */
function viewProjeto(v){
  const p=getProjeto(ST.projetoId);
  if(!p){ ST.view="portfolio"; render(); return; }
  $("#topbar-actions").innerHTML=`
    ${projetoAberturaDireta(p.sessaoId)?"":`<button class="btn ghost" id="proj-back">← Voltar ao portfólio</button>`}
    ${isGestor()?`<button class="btn ghost" id="proj-move" style="margin-left:8px">⇄ Mover de sessão</button>`:""}
    <button class="btn ghost" id="proj-export" style="margin-left:8px">📤 Exportar relatório</button>`;
  if($("#proj-back")) $("#proj-back").onclick=()=>{ ST.view="portfolio"; render(); };
  if($("#proj-move")) $("#proj-move").onclick=()=>moverSessao(p);
  $("#proj-export").onclick=()=>exportarRelatorioProjeto(p);

  let tabs=[
    ["resumo","Resumo"],["documentos","📎 Documentos"],["cronograma","Cronograma Físico"]
  ];
  if(veOcupacao()) tabs.push(["ocupacao","👥 Ocupação da Equipe"]);
  tabs.push(["reunioes","Reuniões"]);
  // financeiro só para quem tem a área Financeiro liberada
  if(temArea("financeiro")) tabs.push(["financeiro","Financeiro"]);
  tabs.push(["stakeholders","Stakeholders"],["raci","Matriz RACI"],["riscos","Riscos"]);
  // esconde as abas que essa sessão não usa (ex.: Financeiro/RACI em Captação)
  const abasOcultas=new Set(cfgSessao(p.sessaoId).abasOcultas||[]);
  tabs=tabs.filter(t=>!abasOcultas.has(t[0]));
  // valida aba atual
  if(!tabs.some(t=>t[0]===ST.projTab)) ST.projTab="resumo";

  let h=`<div class="field-inline" style="margin-bottom:10px;color:var(--ink-faint);font-size:12.5px">
      Sessão: <b style="color:var(--ink-soft)">${esc(nomeSessao(p.sessaoId))}</b></div>
    <div class="tabs">`;
  tabs.forEach(t=>h+=`<button class="tab ${ST.projTab===t[0]?"active":""}" data-pt="${t[0]}">${t[1]}</button>`);
  h+=`</div><div id="proj-tab"></div>`;
  v.innerHTML=h;
  v.querySelectorAll("[data-pt]").forEach(b=>b.onclick=()=>{ ST.projTab=b.dataset.pt; viewProjeto(v); });

  const c=$("#proj-tab");
  if(ST.projTab==="resumo") projResumo(c,p);
  else if(ST.projTab==="documentos") projDocumentos(c,p);
  else if(ST.projTab==="cronograma") projCronograma(c,p);
  else if(ST.projTab==="ocupacao") projOcupacao(c,p);
  else if(ST.projTab==="reunioes") projReunioes(c,p);
  else if(ST.projTab==="financeiro") projFinanceiro(c,p);
  else if(ST.projTab==="stakeholders") projStakeholders(c,p);
  else if(ST.projTab==="raci") projRaci(c,p);
  else if(ST.projTab==="riscos") projRiscos(c,p);
}

function projResumo(c,p){
  const prog=progressoProjeto(p.id);
  const horas=horasProjeto(p.id);
  const despPrev=despesasProjeto(p.id,"previsto");
  const despReal=despesasProjeto(p.id,"realizado");
  const despTotal=despPrev+despReal;
  const receita=+p.receita||0;
  const margem=margemProjeto(p);
  const ats=DB.data.atividades.filter(a=>a.projetoId===p.id && a.status!=="Cancelada"); // canceladas não contam
  const concl=ats.filter(a=>(+a.progresso||0)>=100).length;
  const riscosAltos=(p.riscos||[]).filter(r=>severidadeRisco(r)==="Alta").length;
  /* horas por categoria neste projeto */
  const catMapP={};
  horasConsolidadas(p.id).forEach(h=>{
    if(!h.categoriaId) return;
    catMapP[h.categoriaId]=(catMapP[h.categoriaId]||0)+(+h.horas||0);
  });
  const totalHCat=Object.values(catMapP).reduce((s,v)=>s+v,0);
  const catProjData=Object.keys(catMapP).map(cid=>{
    const cat=getCategoria(cid);
    return {label:cat?cat.nome:"—",value:catMapP[cid],color:cat?cat.cor:"#8a98a6"};
  }).sort((a,b)=>b.value-a.value);

  const catProjTabela = catProjData.length ? `
    <table style="width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px">
      <thead><tr style="background:#f4f6fb">
        <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)">Categoria</th>
        <th style="text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)">Horas</th>
        <th style="text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)">%</th>
      </tr></thead>
      <tbody>${catProjData.map(d=>{
        const pct=totalHCat>0?(d.value/totalHCat*100):0;
        return `<tr>
          <td style="padding:6px 8px;border-bottom:1px solid var(--line-soft)"><span class="sw" style="background:${d.color};display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:middle"></span>${esc(d.label)}</td>
          <td style="padding:6px 8px;text-align:right;border-bottom:1px solid var(--line-soft);font-weight:600">${fmtH(d.value)}</td>
          <td style="padding:6px 8px;text-align:right;border-bottom:1px solid var(--line-soft);color:var(--ink-soft)">${fmtNum(pct,1)}%</td>
        </tr>`;
      }).join("")}</tbody>
    </table>` : "";

  const cfgAtual=cfgSessao(p.sessaoId);
  const podeConverter = podeEditarDados() && cfgAtual.conversao && [].concat(cfgAtual.conversao.statusGatilho).includes(p[cfgAtual.conversao.statusField]);
  const verFinResumo=temArea("financeiro");
  const bannerConversao = podeConverter ? `<div class="card" style="margin-bottom:16px;border-color:var(--ok)">
      <div class="card-pad" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div><b>Captação aprovada!</b><div style="font-size:12.5px;color:var(--ink-faint)">
          Converta este registro em projeto na sessão "${esc(nomeSessao(cfgAtual.conversao.destino))}", mantendo todo o histórico (atividades, horas, documentos, reuniões).</div></div>
        <button class="btn" id="btn-converter-projeto">Converter em projeto</button>
      </div></div>` : "";

  c.innerHTML=`
  ${bannerConversao}
  ${cfgAtual.ocultarKpisResumo?"":`
  <div class="grid ${verFinResumo?"g4":"g2"}">
    <div class="card kpi"><div class="lbl">Valor do projeto</div>
      <div class="val" style="font-size:21px">${fmtBRL(receita)}</div>
      <div class="sub">${campoOcultoSessao(p,"cliente")?"":esc(p.cliente||"Sem cliente definido")}</div></div>
    ${verFinResumo?`<div class="card kpi"><div class="lbl">Despesas (total)</div>
      <div class="val" style="font-size:21px">${fmtBRL(despTotal)}</div>
      <div class="sub">Realizado ${fmtBRL(despReal)} · Previsto ${fmtBRL(despPrev)}</div></div>
    <div class="card kpi"><div class="lbl">Margem de lucro</div>
      <div class="val" style="color:${margem==null?"var(--ink)":margem<0?"var(--danger)":"var(--ok)"}">${margem==null?"—":fmtNum(margem,1)+"%"}</div>
      <div class="sub">Resultado ${fmtBRL(receita-despTotal)}</div></div>`:""}
    <div class="card kpi"><div class="lbl">Andamento físico</div>
      <div class="val">${prog}%</div><div class="sub">${concl}/${ats.length} atividades concluídas</div></div>
  </div>
  <div style="height:18px"></div>`}
  <div class="card">
    <div class="card-head"><h3>${esc(cfgAtual.tituloCardInformacoes||"Informações")}</h3>
      ${podeEditarDados()?'<button class="btn ghost sm" id="edit-p">✎ Editar</button>':""}</div>
    <div class="card-pad">
      <div class="mini-stat"><span>Código</span><span class="v"><b>${esc(p.codigo||"—")}</b></span></div>

        ${podeEditarDados()&&!(p.status!=="Cancelado"&&motivoCancelamentoAuto(p))?`<button class="btn-icon" id="btn-cancelar-proj" title="${statusCalculado(p)==='Cancelado'?'Reativar projeto':'Marcar como cancelado'}" style="margin-left:6px;font-size:11px">${statusCalculado(p)==='Cancelado'?'↺':'✕'}</button>`:""}</span></div>

      ${campoOcultoResumo(p,"dataFim")?"":`<div class="mini-stat"><span>Término previsto</span><span class="v">${fmtDate(p.dataFim)}</span></div>`}
      ${campoOcultoResumo(p,"gerente")?"":`<div class="mini-stat"><span>Gerente responsável</span><span class="v">${esc(p.gerente||"—")}</span></div>`}
      <div class="mini-stat"><span>Horas executadas</span><span class="v">${fmtH(horas)}</span></div>
      <div class="mini-stat"><span>Riscos de alta severidade</span><span class="v" style="color:${riscosAltos?"var(--danger)":"inherit"}">${riscosAltos}</span></div>
      ${camposExtrasResumoHtml(cfgAtual,p)}
      ${p.descricao?`<div style="margin-top:12px;font-size:12.5px;color:var(--ink-soft);line-height:1.6">${esc(p.descricao)}</div>`:""}
    </div>
  </div>
  <div style="height:18px"></div>
  <div class="card">
    <div class="card-head"><h3>Horas dedicadas por categoria — neste projeto</h3>

        toast("Projeto reativado."); render();

    } else {
      confirmar("Marcar este projeto como cancelado?","Esta é a única situação que não é calculada automaticamente, já que nenhum dado indica cancelamento — é uma decisão sua. Pode reverter quando quiser.",async()=>{
