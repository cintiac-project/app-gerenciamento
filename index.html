      });
    }
  };
}

/* ---- DOCUMENTOS DO PROJETO (ex.: documento de contratação — permite vários anexos) ---- */
const DOCUMENTOS_BUCKET="documentos-projeto";
function fmtBytes(n){
  n=+n||0;
  if(n<1024) return n+" B";
  if(n<1024*1024) return (n/1024).toFixed(1)+" KB";
  return (n/(1024*1024)).toFixed(1)+" MB";
}
function projDocumentos(c,p){
  p.documentos=p.documentos||[];
  const podeEditar=podeEditarDados();
  const rows=p.documentos.map(d=>`<tr>
      <td style="font-weight:600">📄 ${esc(d.nomeArquivo)}</td>
      <td style="font-size:12px;color:var(--ink-soft)">${fmtBytes(d.tamanhoBytes)}</td>
      <td style="font-size:12px;color:var(--ink-soft)">${d.criadoEm?fmtDate(d.criadoEm.slice(0,10)):"—"}</td>
      <td class="actions">
        <button class="btn-icon" data-verdoc="${d.id}" title="Visualizar / baixar">👁</button>
        ${podeExcluirDados()?`<button class="btn-icon del" data-dldoc="${d.id}" title="Remover">🗑</button>`:""}
      </td></tr>`).join("");
  c.innerHTML=`
  <div class="help-banner"><span>ℹ️</span><span>Anexe aqui o(s) documento(s) de contratação do projeto (contrato, termo de referência, edital, etc.). Pode anexar mais de um arquivo.</span></div>
  <div class="toolbar"><span class="section-title" style="margin:0">Documentos anexados</span><div class="spacer"></div>
    ${podeEditar?`<input type="file" id="doc-input" multiple style="display:none">
    <button class="btn" id="add-doc">+ Anexar documento(s)</button>`:""}</div>
  ${p.documentos.length?`<div class="card table-wrap"><table><thead><tr>
      <th>Arquivo</th><th>Tamanho</th><th>Enviado em</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>`
    :`<div class="card"><div class="empty"><span class="ic">📎</span><h3>Nenhum documento anexado</h3>
      <p>${podeEditar?"Anexe o documento de contratação (ou outros arquivos relevantes) deste projeto.":"Nenhum documento anexado ainda."}</p></div></div>`}`;

  if($("#add-doc")){
    $("#add-doc").onclick=()=>$("#doc-input").click();
    $("#doc-input").onchange=(e)=>uploadDocumentosProjeto(p, e.target.files);
  }
  c.querySelectorAll("[data-verdoc]").forEach(b=>b.onclick=()=>abrirDocumentoProjeto(p.documentos.find(d=>d.id===b.dataset.verdoc)));
  c.querySelectorAll("[data-dldoc]").forEach(b=>b.onclick=()=>{
    const doc=p.documentos.find(d=>d.id===b.dataset.dldoc);
    confirmar(`Remover "${doc.nomeArquivo}"?`,"O arquivo será apagado definitivamente do armazenamento.",async()=>{
      await removerDocumentoProjeto(p, doc);
      toast("Documento removido."); render();
    });
  });
}

async function uploadDocumentosProjeto(p, fileList){
  const arquivos=[...(fileList||[])];
  if(!arquivos.length) return;
  toast(`Enviando ${arquivos.length} arquivo(s)...`);
  for(const file of arquivos){
    try{
      const caminho=`${p.id}/${uid()}_${file.name}`.replace(/\s+/g,"_");
      const { error:erroUpload } = await sb.storage.from(DOCUMENTOS_BUCKET).upload(caminho, file, { upsert:false });
      if(erroUpload) throw erroUpload;
      const registro={
        id:uid(), projetoId:p.id, nomeArquivo:file.name, caminhoStorage:caminho,
        tamanhoBytes:file.size, tipoArquivo:file.type||"", criadoEm:new Date().toISOString()
      };
      await sbInsert("documentos_projeto", toSnake(registro));
      p.documentos.unshift(registro);
    }catch(e){
      toast(`Erro ao enviar "${file.name}": `+(e.message||e));
    }
  }
  toast("Envio concluído."); render();
}

async function abrirDocumentoProjeto(doc){
  if(!doc) return;
  try{
    const { data, error } = await sb.storage.from(DOCUMENTOS_BUCKET).createSignedUrl(doc.caminhoStorage, 120);
    if(error) throw error;
    window.open(data.signedUrl, "_blank");
  }catch(e){
    toast("Não foi possível abrir o documento: "+(e.message||e));
  }
}

async function removerDocumentoProjeto(p, doc){
  try{
    await sb.storage.from(DOCUMENTOS_BUCKET).remove([doc.caminhoStorage]);
  }catch(e){ /* segue removendo o registro mesmo se o arquivo físico já não existir */ }
  await sbDelete("documentos_projeto", doc.id);
  p.documentos=p.documentos.filter(d=>d.id!==doc.id);
}

function responsaveisRaci(p,atividadeId){
  if(!p || !p.raci) return [];
  const raci=(p.raci[atividadeId])||{};
  return Object.entries(raci)
    .filter(([,papel])=>papel==="R")
    .map(([pessoaId])=>nomeColab(pessoaId));
}
function projCronograma(c,p){
  const podeEditar=podeEditarDados();
  const podeExcluir=podeExcluirDados();
  // filtro de período: uma atividade "passa" se o intervalo dela
  // [dataInicioPrev, dataFimPrev] cruza com o período escolhido — não exige
  // que ela caiba 100% dentro, senão uma atividade longa que só começa
  // antes do período (mas ainda está em andamento nele) desapareceria.
  // Atividades sem nenhuma data cadastrada sempre aparecem (não dá pra
  // filtrar o que não tem data).
  const cronoDataOk=(a)=>{
    const fd=ST.cronoFiltroData;
    if(!fd.de && !fd.ate) return true;
    const ini=a.dataInicioPrev, fim=a.dataFimPrev;
    if(!ini && !fim) return true;
    if(fd.de && fim && fim<fd.de) return false;
    if(fd.ate && ini && ini>fd.ate) return false;
    return true;
  };
  const todasAts=DB.data.atividades.filter(a=>a.projetoId===p.id)
    .sort((a,b)=>(a.dataInicioPrev||"").localeCompare(b.dataInicioPrev||""));
  // status "efetivo" de cada atividade para fins de filtro — usa o mesmo
  // critério do badge exibido na tabela: se está atrasada, conta como
  // "Atrasada" mesmo que o campo status guardado ainda diga outra coisa.
  const statusEfetivo=(a)=>{
    const prog=+a.progresso||0;
    const atrasada=a.status!=="Cancelada" && a.dataFimPrev && daysBetween(todayStr(),a.dataFimPrev)<0 && prog<100;
    return atrasada ? "Atrasada" : (a.status||"Não iniciada");
  };
  // filtro por colaborador: usa o mesmo critério do "Resp.:" mostrado na lista
  // (horas previstas por colaborador, RACI ou campo de responsáveis da sessão)
  const respIdsDe=a=>responsaveisIdsAtividade(a,p);
  const idsNoProjeto=new Set(); let haSemResp=false;
  todasAts.forEach(a=>{ const r=respIdsDe(a); if(!r.length) haSemResp=true; r.forEach(id=>idsNoProjeto.add(id)); });
  const colabOpcoes=[...idsNoProjeto].map(id=>({id,nome:nomeColab(id)}))
    .sort((x,y)=>String(x.nome).localeCompare(String(y.nome),"pt-BR"));
  let fColab=ST.cronoFiltroColab||"";
  if(fColab && fColab!=="__nenhum" && !idsNoProjeto.has(fColab)) fColab="";   // não existe neste projeto
  const cronoColabOk=a=>{
    if(!fColab) return true;
    const r=respIdsDe(a);
    return fColab==="__nenhum" ? r.length===0 : r.includes(fColab);
  };
  const ats=todasAts.filter(a=>ST.cronoStatusVisiveis.has(statusEfetivo(a)) && cronoDataOk(a) && cronoColabOk(a));
  const ocultas=todasAts.length-ats.length;
  // seleção para mover em lote: mantém só as atividades visíveis neste cronograma
  ST.cronoSelecionadas=new Set([...ST.cronoSelecionadas].filter(id=>ats.some(a=>a.id===id)));
  const fd=ST.cronoFiltroData;
  const filtroDataAtivo=!!(fd.de||fd.ate);
  const filtroHtml=`
  <div class="toolbar" style="margin-bottom:12px;flex-wrap:wrap">
    <span class="field-inline" style="font-weight:600;color:var(--ink)">Status:</span>
    <div class="status-filter" id="crono-status-filter">
      ${STATUS_ATIV.map(s=>{
        const on=ST.cronoStatusVisiveis.has(s);
        return `<button class="status-chip ${on?"on":""}" data-st="${esc(s)}">
          <span class="ck">${on?"✓":""}</span>${esc(s)}</button>`;
      }).join("")}
    </div>
    <span class="field-inline" style="font-weight:600;color:var(--ink);margin-left:14px">Período:</span>
    <input type="date" id="crono-data-de" value="${esc(fd.de||"")}" style="width:auto" title="De (mostra atividades que terminam a partir desta data)">
    <span style="color:var(--ink-faint)">até</span>
    <input type="date" id="crono-data-ate" value="${esc(fd.ate||"")}" style="width:auto" title="Até (mostra atividades que começam até esta data)">
    ${filtroDataAtivo?`<button class="btn ghost sm" id="crono-data-limpar">✕ Limpar período</button>`:""}
    <span class="field-inline" style="font-weight:600;color:var(--ink);margin-left:14px">Colaborador:</span>
    <select id="crono-colab" style="width:auto;min-width:190px" title="Mostra só as atividades em que a pessoa é responsável (tem horas previstas ou consta como responsável)">
      <option value="">Todos</option>
      ${colabOpcoes.map(o=>`<option value="${esc(o.id)}" ${fColab===o.id?"selected":""}>${esc(o.nome)}</option>`).join("")}
      ${haSemResp?`<option value="__nenhum" ${fColab==="__nenhum"?"selected":""}>— Sem responsável —</option>`:""}
    </select>
    ${fColab?`<button class="btn ghost sm" id="crono-colab-limpar">✕ Limpar</button>`:""}
    <div class="spacer"></div>
    ${ocultas>0?`<span class="hint">${ocultas} atividade(s) oculta(s) pelo filtro</span>`:""}
  </div>`;
  const rows=ats.map(a=>{
    const prog=+a.progresso||0;
    const atrasada=a.status!=="Cancelada" && a.dataFimPrev && daysBetween(todayStr(),a.dataFimPrev)<0 && prog<100;
    const pcls=prog>=100?"ok":atrasada?"danger":prog<40?"warn":"";
    const horasAtiv=horasAtividade(a);
    const dIni=a.dataInicioPrev?fmtDate(a.dataInicioPrev):"Indeterminada";
    const dFim=a.dataFimPrev?fmtDate(a.dataFimPrev):"Indeterminada";

        <div style="font-size:11px;color:var(--ink-faint)">${atividadeSemCampo(p.sessaoId,"categoriaId")?"":esc(nomeCategoria(a.categoriaId))+" · "}Resp.: ${responsaveis.join(", ")||"—"}${horasAtiv?` · ${fmtNum(horasAtiv,1)}h executadas`:""}${totalHorasPrevistasAtividade(a)>0?` · ${fmtNum(totalHorasPrevistasAtividade(a),1)}h previstas (${pessoasAlocadasAtividade(a).length} pessoa(s))`:""}</div></td>

  }).join("");

  c.innerHTML=`
  <div class="toolbar">
    <span class="section-title" style="margin:0">Atividades do cronograma</span>
    <div class="spacer"></div>
    ${todasAts.length?`<button class="btn ghost sm" id="xlsx-crono" title="Exporta as atividades exibidas (respeita os filtros de status e período)">📊 Exportar Excel</button>`:""}
    ${podeEditar?`
    <button class="btn" id="add-ativ">+ Nova atividade</button>
    <button class="btn ghost sm" id="csv-modelo-crono">📋 Modelo CSV</button>
    <button class="btn ghost sm" id="csv-import-crono">📥 Importar CSV</button>
    <input type="file" id="csv-file-crono" accept=".csv" style="display:none">

  </div>
  ${todasAts.length?filtroHtml:""}
  ${ats.length?`
  ${cfgSessao(p.sessaoId).linhaDoTempo===false?"":`
  <div class="card" style="margin-bottom:18px">
    <div class="card-head"><h3>Curva S — avanço físico</h3><span class="hint">Previsto x realizado, acumulado</span></div>

  <div class="card table-wrap">

      <th style="min-width:150px">Progresso</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div>`:todasAts.length?`<div class="card"><div class="empty"><span class="ic">◷</span>
    <h3>Nenhuma atividade com esse filtro</h3><p>${ocultas} atividade(s) está(ão) oculta(s) pelo filtro de status e/ou período acima. Ajuste os filtros para visualizá-las.</p>
    </div></div>`:`<div class="card"><div class="empty"><span class="ic">◷</span>
    <h3>Sem atividades</h3><p>${podeEditar?"Cadastre as atividades para montar o cronograma físico.":"Nenhuma atividade cadastrada ainda."}</p>
    ${podeEditar?'<button class="btn" id="add-ativ2">+ Nova atividade</button>':""}</div></div>`}`;
  if(ats.length) ajustarMesesGantt(c);

  if(todasAts.length){
    c.querySelectorAll("#crono-status-filter [data-st]").forEach(b=>{
      b.onclick=()=>{
        const s=b.dataset.st;
        if(ST.cronoStatusVisiveis.has(s)) ST.cronoStatusVisiveis.delete(s);
        else ST.cronoStatusVisiveis.add(s);
        render();
      };
    });
    $("#crono-colab").onchange=(e)=>{ ST.cronoFiltroColab=e.target.value; render(); };
    if($("#crono-colab-limpar")) $("#crono-colab-limpar").onclick=()=>{ ST.cronoFiltroColab=""; render(); };
    $("#crono-data-de").onchange=(e)=>{ ST.cronoFiltroData.de=e.target.value; render(); };
    $("#crono-data-ate").onchange=(e)=>{ ST.cronoFiltroData.ate=e.target.value; render(); };
    if($("#crono-data-limpar")) $("#crono-data-limpar").onclick=()=>{
      ST.cronoFiltroData={de:"",ate:""}; render();
    };
  }

  // Colaborador: só abre as atividades em que está vinculado
  if(!podeEditar){
    c.querySelectorAll("[data-eda]").forEach(b=>b.onclick=()=>formAtividade(p.id,getAtividade(b.dataset.eda)));
    return;
  }
  if(!podeExcluir && $("#crono-excluir-sel")) $("#crono-excluir-sel").style.display="none";
  if($("#crono-bulk")){
    const sel=ST.cronoSelecionadas, todos=$("#crono-sel-all");
    const boxes=[...c.querySelectorAll("[data-sel]")];
    const atualizaBarra=()=>{
      const k=sel.size;
      $("#crono-bulk").style.display=k?"flex":"none";
      $("#crono-sel-n").textContent=k+" selecionada(s)";
      todos.checked=k>0&&k===boxes.length; todos.indeterminate=k>0&&k<boxes.length;
    };
    boxes.forEach(b=>b.onchange=()=>{ if(b.checked) sel.add(b.dataset.sel); else sel.delete(b.dataset.sel); atualizaBarra(); });
    todos.onchange=()=>{ boxes.forEach(b=>{ b.checked=todos.checked; if(todos.checked) sel.add(b.dataset.sel); else sel.delete(b.dataset.sel); }); atualizaBarra(); };
    $("#crono-sel-limpar").onclick=()=>{ sel.clear(); boxes.forEach(b=>b.checked=false); atualizaBarra(); };
    $("#crono-mover-sel").onclick=()=>moverAtividadesProjeto([...sel].map(getAtividade));
    $("#crono-excluir-sel").onclick=()=>excluirAtividadesEmLote([...sel].map(getAtividade));
    atualizaBarra();
  }
  const open=()=>formAtividade(p.id);
  $("#add-ativ").onclick=open;
  if($("#add-ativ2")) $("#add-ativ2").onclick=open;
  if($("#xlsx-crono")) $("#xlsx-crono").onclick=()=>exportarCronogramaExcel(p,ats,todasAts.length);
  $("#csv-modelo-crono").onclick=baixarModeloCronograma;
  $("#csv-import-crono").onclick=()=>$("#csv-file-crono").click();
  $("#csv-file-crono").onchange=async (e)=>{
    await importarCSVCronograma(e, p.id);
    render();
  };
  c.querySelectorAll("[data-eda]").forEach(b=>b.onclick=()=>formAtividade(p.id,getAtividade(b.dataset.eda)));
  c.querySelectorAll("[data-mva]").forEach(b=>b.onclick=()=>moverAtividadeProjeto(getAtividade(b.dataset.mva)));
  c.querySelectorAll("[data-dla]").forEach(b=>b.onclick=()=>{
    excluirAtividadeComConfirmacao(getAtividade(b.dataset.dla));

}
function ganttHtml(p,ats){
  let min=p.dataInicio, max=p.dataFim;
  ats.forEach(a=>{
    if(a.dataInicioPrev&&(!min||a.dataInicioPrev<min)) min=a.dataInicioPrev;
    if(a.dataFimPrev&&(!max||a.dataFimPrev>max)) max=a.dataFimPrev;
  });
  if(!min||!max){ return `<div style="color:var(--ink-faint);font-size:12.5px;padding:10px">Defina datas nas atividades (e no projeto) para ver a linha do tempo.</div>`; }
  let span=daysBetween(min,max); if(span<=0) span=1;
  const today=todayStr();
  const todayPct=Math.max(0,Math.min(100,(daysBetween(min,today)/span)*100));
  let rows="";
  ats.forEach(a=>{
    let bar="";
    if(a.dataInicioPrev&&a.dataFimPrev){
      const left=Math.max(0,(daysBetween(min,a.dataInicioPrev)/span)*100);
      let w=(daysBetween(a.dataInicioPrev,a.dataFimPrev)/span)*100;
      w=Math.max(1.5,w);
      const tituloBar=`${a.nome} · ${fmtDate(a.dataInicioPrev)} a ${fmtDate(a.dataFimPrev)}${a.marco?" · Marco de entrega":""}`;
      // marcos ganham cor dourada (mesma do selo "🚩 Marco" na tabela) para
      // se destacarem na linha do tempo como pontos críticos do projeto.
      bar=`<div class="gantt-bar${a.marco?" marco":""}" style="left:${left}%;width:${w}%" title="${esc(tituloBar)}">
        <div style="width:${+a.progresso||0}%"></div></div>`;
    }
    rows+=`<div class="gantt-row"><div class="gantt-name" title="${esc(a.nome)}">${a.marco?"🚩 ":""}${esc(a.nome)}</div>
      <div class="gantt-track">${bar}</div></div>`;
  });
  // cabeçalho com os meses cobertos pela linha do tempo, cada um posicionado
  // proporcionalmente ao seu 1º dia dentro do intervalo [min,max]
  const meses=[]; // {key, label, pct}
  let cursor=monthKey(min)+"-01";
  const fimChave=monthKey(max);
  while(monthKey(cursor)<=fimChave){
    const [y,m]=monthKey(cursor).split("-").map(n=>+n);
    const inicioMes=y+"-"+pad(m)+"-01";
    const pctBruto=(daysBetween(min,inicioMes)/span)*100;
    meses.push({label:MONTHS[m-1]+"/"+y, pct:Math.max(0,Math.min(100,pctBruto))});
    const prox=new Date(y,m,1); // dia 1 do mês seguinte
    cursor=prox.getFullYear()+"-"+pad(prox.getMonth()+1)+"-01";
  }
  // cada rótulo leva a classe "gantt-month" e um separador (exceto o 1º);
  // a sobreposição real de texto é corrigida depois via JS (ajustarMesesGantt),
  // que mede a largura renderizada e esconde os rótulos que colidiriam —
  // posicionar só por % não é suficiente porque a largura do texto é fixa
  // em pixels e o espaço entre meses vizinhos pode ser bem menor que isso.
  const mesesHtml=meses.map((mm,i)=>`<div class="gantt-month" style="position:absolute;left:${mm.pct}%;top:0;
      font-size:10.5px;color:var(--ink-faint);white-space:nowrap;border-left:1px solid var(--line-soft);
      padding-left:4px;${i===0?"border-left:none;padding-left:0":""}">${esc(mm.label)}</div>`).join("");
  return `<div style="min-width:560px">
    <div style="display:flex;font-size:11px;color:var(--ink-faint);padding:0 0 4px">
      <div style="width:200px;flex-shrink:0"></div>
      <div class="gantt-months" style="flex:1;position:relative;height:16px">${mesesHtml}</div></div>
    <div style="position:relative">
      <div class="gantt-today" style="left:calc(200px + (100% - 200px) * ${(todayPct/100).toFixed(4)})" title="Hoje: ${esc(fmtDate(today))}"></div>
      ${rows}</div></div>`;
}
/* esconde rótulos de mês que colidiriam visualmente com o anterior (o
   posicionamento é feito em %, então em linhas do tempo longas dois meses
   vizinhos podem cair muito próximos e o texto de um cobre o do outro).
   Mede as posições já renderizadas no DOM e vai escondendo, da esquerda
   para a direita, qualquer rótulo cuja borda esquerda invada o rótulo
   anterior ainda visível (com uma margem mínima de 6px). */
function ajustarMesesGantt(container){
  const grupos=container.querySelectorAll(".gantt-months");
  grupos.forEach(grupo=>{
    const labels=[...grupo.querySelectorAll(".gantt-month")];
    let ultimoDireita=null;
    labels.forEach((el,i)=>{
      el.style.display="";
      const rect=el.getBoundingClientRect();
      if(i>0 && ultimoDireita!==null && rect.left < ultimoDireita+6){
        el.style.display="none";
        return;
      }
      ultimoDireita=rect.right;
    });
  });
}

/* ------------------------------------------------------------------
   CURVA S — acompanhamento do avanço físico previsto x realizado
   ------------------------------------------------------------------
   Cada atividade entra na curva com um "peso" (as horas previstas
   somadas de todos os colaboradores nela — ver totalHorasPrevistasAtividade;
   atividades sem nenhuma hora estimada entram com peso 1, só para não
   ficarem de fora do cálculo). O peso de cada atividade é distribuído
   igualmente pelos dias úteis do seu período — previsto (Início/Término
   previstos) para a curva de baseline, e real (Início/Término reais,
   com fallback para o previsto/hoje quando faltar alguma data) para a
   curva de realizado, ponderada pelo "% Concluído" already lançado.
   A curva de realizado nunca é projetada além de hoje. */
function pesoAtividade(a){
  const h=totalHorasPrevistasAtividade(a);
  return h>0?h:1;
}
function curvaSDados(p,ats){
  let min=p.dataInicio, max=p.dataFim;
  ats.forEach(a=>{
    if(a.dataInicioPrev&&(!min||a.dataInicioPrev<min)) min=a.dataInicioPrev;
    if(a.dataFimPrev&&(!max||a.dataFimPrev>max)) max=a.dataFimPrev;
    if(a.dataFimReal&&(!max||a.dataFimReal>max)) max=a.dataFimReal;
  });
  if(!min||!max) return null;
  const totalPeso=ats.reduce((s,a)=>s+pesoAtividade(a),0);
  if(!totalPeso) return null;
  const hoje=todayStr();
  if(hoje>max) max=hoje; // garante que "hoje" sempre cabe na linha do tempo
  const span=Math.max(1,daysBetween(min,max));
  const incPrev=new Array(span+1).fill(0), incReal=new Array(span+1).fill(0);
  ats.forEach(a=>{
    const peso=pesoAtividade(a);
    // ---- baseline (previsto) ----
    if(a.dataInicioPrev&&a.dataFimPrev){
      const dias=diasUteisEntre(a.dataInicioPrev,a.dataFimPrev);
      if(dias.length){
        const inc=peso/dias.length;
        dias.forEach(d=>{ const idx=daysBetween(min,d); if(idx>=0&&idx<=span) incPrev[idx]+=inc; });
      }else{
        const idx=daysBetween(min,a.dataFimPrev);
        if(idx>=0&&idx<=span) incPrev[idx]+=peso;
      }
    }
    // ---- realizado (ponderado pelo % concluído) ----
    const realizado=peso*(Math.min(100,Math.max(0,+a.progresso||0))/100);
    if(realizado>0){
      const iniReal=a.dataInicioReal||a.dataInicioPrev;
      const fimReal=a.dataFimReal||(a.status==="Concluída"?(a.dataFimPrev||hoje):hoje);
      if(iniReal&&fimReal&&fimReal>=iniReal){
        const diasR=diasUteisEntre(iniReal,fimReal);
        if(diasR.length){
          const incR=realizado/diasR.length;
          diasR.forEach(d=>{ const idx=daysBetween(min,d); if(idx>=0&&idx<=span) incReal[idx]+=incR; });
        }else{
          const idx=daysBetween(min,fimReal);
          if(idx>=0&&idx<=span) incReal[idx]+=realizado;
        }
      }
    }
  });
  const idxHoje=Math.max(0,Math.min(span,daysBetween(min,hoje)));
  let accP=0, accR=0;
  const curvaPrev=[], curvaReal=[];
  for(let i=0;i<=span;i++){
    accP+=incPrev[i]; curvaPrev.push(accP/totalPeso*100);
    accR+=incReal[i];
    curvaReal.push(i<=idxHoje?accR/totalPeso*100:null); // não projeta o realizado no futuro
  }
  return {min,max,span,curvaPrev,curvaReal,idxHoje};
}
function curvaSHtml(p,ats){
  const d=curvaSDados(p,ats);
  if(!d) return `<div style="color:var(--ink-faint);font-size:12.5px;padding:10px">
    Defina datas nas atividades (Início/Término previstos) para calcular a Curva S.</div>`;
  const W=760,H=210,padL=36,padR=12,padT=10,padB=22;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const x=i=>padL+(i/d.span)*plotW;
  const y=v=>padT+plotH-(Math.max(0,Math.min(100,v))/100)*plotH;
  function pathFrom(arr){
    let s="",aberto=false;
    arr.forEach((v,i)=>{
      if(v==null){ aberto=false; return; }
      s+=(aberto?" L ":"M ")+x(i).toFixed(1)+" "+y(v).toFixed(1);
      aberto=true;
    });
    return s;
  }
  const pathPrev=pathFrom(d.curvaPrev), pathReal=pathFrom(d.curvaReal);
  const hojeX=x(d.idxHoje);
  const grid=[0,25,50,75,100].map(v=>`<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-soft)" stroke-width="1"/>
    <text x="${padL-6}" y="${y(v)+3}" font-size="10" text-anchor="end" fill="var(--ink-faint)">${v}%</text>`).join("");
  // rótulos de mês no eixo X (mesmo critério de espaçamento mínimo do Gantt,
  // mas calculado direto em coordenadas do SVG, sem precisar medir o DOM)
  const meses=[]; let cursor=monthKey(d.min)+"-01"; const fimChave=monthKey(d.max);
  while(monthKey(cursor)<=fimChave){
    const [y2,m2]=monthKey(cursor).split("-").map(n=>+n);
    const idx=Math.max(0,daysBetween(d.min,y2+"-"+pad(m2)+"-01"));
    meses.push({label:MONTHS[m2-1]+"/"+String(y2).slice(2),px:x(Math.min(d.span,idx))});
    const prox=new Date(y2,m2,1);
    cursor=prox.getFullYear()+"-"+pad(prox.getMonth()+1)+"-01";
  }
  const mesesFiltrados=[]; let ultimoPx=-999;
  meses.forEach(mm=>{ if(mm.px-ultimoPx>=34){ mesesFiltrados.push(mm); ultimoPx=mm.px; } });
  const mesesHtml=mesesFiltrados.map(mm=>`<text x="${mm.px}" y="${H-6}" font-size="10" fill="var(--ink-faint)">${mm.label}</text>`).join("");
  const pctPrevHoje=d.curvaPrev[d.idxHoje]||0;
  const pctRealHoje=d.curvaReal[d.idxHoje]!=null?d.curvaReal[d.idxHoje]:0;
  const gap=pctPrevHoje-pctRealHoje; // >0 = atraso físico; <0 = adiantado
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${grid}${mesesHtml}
      <line x1="${hojeX.toFixed(1)}" x2="${hojeX.toFixed(1)}" y1="${padT}" y2="${H-padB}" stroke="var(--danger)" stroke-width="1.5" stroke-dasharray="3,3"/>
      <path d="${pathPrev}" fill="none" stroke="var(--accent)" stroke-width="2.4"/>
      ${pathReal?`<path d="${pathReal}" fill="none" stroke="var(--gold)" stroke-width="2.4"/>`:""}
    </svg>
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12px;color:var(--ink-soft)">
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:2px;margin-right:5px;vertical-align:-1px"></span>Previsto (baseline)</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--gold);border-radius:2px;margin-right:5px;vertical-align:-1px"></span>Realizado</span>
      <span style="margin-left:auto">Hoje: <b>${fmtNum(pctPrevHoje,0)}%</b> previsto vs <b>${fmtNum(pctRealHoje,0)}%</b> realizado
        ${Math.abs(gap)>=1?`<b style="color:${gap>0?"var(--danger)":"var(--ok)"}">(${gap>0?"atraso":"adiantamento"} físico de ${fmtNum(Math.abs(gap),0)} p.p.)</b>`:"<b style=\"color:var(--ok)\">(em linha com o previsto)</b>"}</span>
    </div>`;
}

/* ---- OCUPAÇÃO DA EQUIPE (calendário de alocação, gestor) ---- */
function projOcupacao(c,p){
  const ats=DB.data.atividades.filter(a=>a.projetoId===p.id);
  const pessoaIdsSet=new Set();
  ats.forEach(a=>pessoasAlocadasAtividade(a).forEach(id=>pessoaIdsSet.add(id)));
  const pessoas=[...pessoaIdsSet].map(id=>getColab(id)).filter(Boolean)
    .sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR",{sensitivity:"base"}));

  const explicacao=`<div class="help-banner"><span>ℹ️</span><span>
    Calculado a partir das <b>horas previstas por colaborador</b> de cada atividade (informadas ao criar/editar
    atividades no Cronograma). Cada pessoa recebe exatamente a quantidade de horas atribuída a ela, distribuída
    ao longo dos dias úteis entre início e término previstos. Capacidade considerada:
    <b>${CAPACIDADE_DIARIA_PADRAO}h/dia por pessoa</b>. O cálculo é <b>global</b> — um conflito pode vir de
    outro projeto em que a pessoa também esteja alocada, não só deste.</span></div>`;

  if(!pessoas.length){
    c.innerHTML=`${explicacao}<div class="card"><div class="empty"><span class="ic">👥</span>
      <h3>Ninguém alocado ainda neste projeto</h3>
      <p>Edite as atividades do Cronograma Físico e informe as horas previstas por colaborador.</p></div></div>`;
    return;
  }
  if(!ats.some(a=>totalHorasPrevistasAtividade(a)>0)){
    c.innerHTML=`${explicacao}<div class="card"><div class="empty"><span class="ic">🕐</span>
      <h3>Nenhuma atividade tem horas previstas informadas</h3>
      <p>Edite as atividades do Cronograma Físico e informe "Horas previstas por colaborador" para que o
      calendário de ocupação possa ser calculado.</p></div></div>`;
    return;
  }

  const mapa=construirMapaOcupacaoGlobal();
  ST.ocupMes=ST.ocupMes||todayStr().slice(0,7);
  ST.ocupPessoaId=(ST.ocupPessoaId&&pessoas.some(pe=>pe.id===ST.ocupPessoaId))?ST.ocupPessoaId:pessoas[0].id;

  const cardsHtml=pessoas.map(pe=>{
    const atsPessoa=ats.filter(a=>horasPrevistasDaPessoa(a,pe.id)>0);
    const totalHoras=atsPessoa.reduce((s,a)=>s+horasPrevistasDaPessoa(a,pe.id),0);
    let minIni=null,maxFim=null;
    atsPessoa.forEach(a=>{
      if(a.dataInicioPrev&&(!minIni||a.dataInicioPrev<minIni)) minIni=a.dataInicioPrev;
      if(a.dataFimPrev&&(!maxFim||a.dataFimPrev>maxFim)) maxFim=a.dataFimPrev;
    });
    let diasConflito=0,diasUteisTotal=0;
    const diasVistos=new Set();
    atsPessoa.forEach(a=>diasUteisEntre(a.dataInicioPrev,a.dataFimPrev).forEach(d=>diasVistos.add(d)));
    diasVistos.forEach(d=>{
      diasUteisTotal++;
      const alocado=(mapa[pe.id]&&mapa[pe.id][d])||0;
      if(alocado>=CAPACIDADE_DIARIA_PADRAO-0.01) diasConflito++;
    });
    const temConflito=diasConflito>0;
    return `<div class="card" style="padding:14px 16px;${temConflito?"border-color:#e7b98c":""}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div><div style="font-weight:700">${esc(pe.nome)}</div>
          <div style="font-size:11.5px;color:var(--ink-faint)">${esc(pe.cargo||"")}</div></div>
        <span class="badge ${temConflito?"b-danger":"b-ok"}">${temConflito?"⚠ Conflito":"✓ Disponível"}</span>
      </div>
      <div style="margin-top:10px;font-size:12.5px;color:var(--ink-soft)">
        <div>${fmtH(totalHoras)} previstas neste projeto</div>
        <div>${minIni?fmtDate(minIni):"—"} → ${maxFim?fmtDate(maxFim):"—"}</div>
        ${temConflito?`<div style="color:var(--danger);font-weight:600;margin-top:4px">${diasConflito} de ${diasUteisTotal} dia(s) úteis com agenda cheia</div>`:""}
      </div>
      <button class="btn ghost sm" style="margin-top:10px;width:100%;justify-content:center" data-verpessoa="${pe.id}">📅 Ver calendário</button>
    </div>`;
  }).join("");

  const decisoes=[];
  ats.forEach(a=>{
    const pessoasAt=pessoasAlocadasAtividade(a);
    const dias=diasUteisEntre(a.dataInicioPrev,a.dataFimPrev);
    pessoasAt.forEach(pid=>{
      const pe=getColab(pid); if(!pe) return;
      const horasPessoa=horasPrevistasDaPessoa(a,pid);
      if(horasPessoa<=0) return;
      const temConflito=dias.some(d=>((mapa[pid]&&mapa[pid][d])||0)>=CAPACIDADE_DIARIA_PADRAO-0.01);
      if(temConflito){
        const prox=proximaDisponibilidade(pid,horasPessoa,a.dataInicioPrev||todayStr(),mapa);
        decisoes.push({atividade:a,pessoa:pe,horasPessoa,prox});
      }
    });
  });
  const decisoesHtml=decisoes.length?decisoes.map(d=>`
    <div class="alert-row">
      <div class="ab" style="background:var(--warn)"></div>
      <div class="at"><div class="t">${esc(d.pessoa.nome)} está com a agenda cheia durante "${esc(d.atividade.nome)}"</div>
        <div class="d">Precisa de ${fmtH(d.horasPessoa)} entre ${fmtDate(d.atividade.dataInicioPrev)} e ${fmtDate(d.atividade.dataFimPrev)}.
        ${d.prox?` Próxima janela livre: a partir de <b>${fmtDate(d.prox.inicioDisponivel)}</b>, concluiria por volta de <b>${fmtDate(d.prox.conclusaoEstimada)}</b> — considere adiar ou trocar de responsável.`:" Não foi encontrada disponibilidade nos próximos ~2 anos com a carga atual."}</div></div>
      <button class="btn ghost sm" data-editar-ativ="${d.atividade.id}">✎ Ajustar</button>
    </div>`).join("")
    :`<div class="empty" style="padding:20px"><span class="ic">✓</span><p>Nenhum conflito de agenda detectado para as pessoas alocadas neste projeto.</p></div>`;

  // "equipe" (padrão): calendário agrupado com todas as pessoas alocadas,
  // em barras coloridas por colaborador em cada dia. "pessoa": calendário
  // individual de antes, útil para investigar o conflito de uma pessoa só.
  ST.ocupModo=ST.ocupModo||"equipe";
  const pessoaSel=getColab(ST.ocupPessoaId);
  const calendarHtml = ST.ocupModo==="pessoa"
    ? calendarioOcupacaoHtml(pessoaSel,ST.ocupMes,mapa)
    : calendarioOcupacaoEquipeHtml(pessoas,ST.ocupMes,mapa);

  c.innerHTML=`
  ${explicacao}
  <div class="section-title">Pessoas alocadas neste projeto</div>
  <div class="grid g3" style="margin-bottom:20px">${cardsHtml}</div>

  <div class="section-title">Alertas de conflito de agenda</div>
  <div class="card" style="margin-bottom:20px"><div class="card-pad">${decisoesHtml}</div></div>

  <div class="toolbar">
    <span class="section-title" style="margin:0">Calendário de ocupação</span>
    <div class="spacer"></div>
    <div class="pill-toggle" id="ocup-modo">
      <button data-modo="equipe" class="${ST.ocupModo==="equipe"?"on":""}">👥 Equipe (agrupado)</button>
      <button data-modo="pessoa" class="${ST.ocupModo==="pessoa"?"on":""}">🙋 Uma pessoa</button>
    </div>
    ${ST.ocupModo==="pessoa"?`<div class="field-inline">Pessoa
      <select class="select" id="ocup-pessoa">${pessoas.map(pe=>`<option value="${pe.id}" ${ST.ocupPessoaId===pe.id?"selected":""}>${esc(pe.nome)}</option>`).join("")}</select></div>`:""}
  </div>
  <div class="card"><div class="card-pad">${calendarHtml}</div></div>`;

  if($("#ocup-pessoa")) $("#ocup-pessoa").onchange=e=>{ ST.ocupPessoaId=e.target.value; projOcupacao(c,p); };
  c.querySelectorAll("[data-modo]").forEach(b=>b.onclick=()=>{ ST.ocupModo=b.dataset.modo; projOcupacao(c,p); });
  c.querySelectorAll("[data-verpessoa]").forEach(b=>b.onclick=()=>{ ST.ocupPessoaId=b.dataset.verpessoa; ST.ocupModo="pessoa"; projOcupacao(c,p); });
  c.querySelectorAll("[data-editar-ativ]").forEach(b=>b.onclick=()=>{
    const a=getAtividade(b.dataset.editarAtiv);
    if(a) formAtividade(p.id,a);
  });
  if(ST.ocupModo==="pessoa"){
    c.querySelectorAll("[data-ocup-day]").forEach(el=>{
      el.onclick=()=>mostrarDetalheOcupacaoDia(pessoaSel,el.dataset.ocupDay);
    });
  } else {
    c.querySelectorAll("[data-ocup-day-eq]").forEach(el=>{
      el.onclick=()=>mostrarDetalheOcupacaoDiaEquipe(pessoas,el.dataset.ocupDayEq);
    });
  }
  if($("#ocal-prev")) $("#ocal-prev").onclick=()=>{ ST.ocupMes=mesShift(ST.ocupMes,-1); projOcupacao(c,p); };
  if($("#ocal-next")) $("#ocal-next").onclick=()=>{ ST.ocupMes=mesShift(ST.ocupMes,1); projOcupacao(c,p); };
}

/* calendário AGRUPADO: mostra, para cada dia do mês, uma barra dividida por
   colaborador (proporcional às horas alocadas de cada um naquele dia) — dá
   pra ver de relance quem está alocado e quanto, sem trocar de pessoa. */
function calendarioOcupacaoEquipeHtml(pessoas,mk,mapa){
  const [y,m]=mk.split("-").map(n=>+n);
  const primeiro=new Date(y,m-1,1);
  const diasNoMes=new Date(y,m,0).getDate();
  const startDow=primeiro.getDay();
  const hojeMk=todayStr().slice(0,7), hojeDia=+todayStr().slice(8,10);
  const cores={}; pessoas.forEach((pe,i)=>cores[pe.id]=PALETTE[i%PALETTE.length]);
  let h=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <button class="btn-icon" id="ocal-prev" title="Mês anterior">‹</button>
    <div style="font-weight:700">${esc(mesLabelLong(mk))} — equipe (${pessoas.length})</div>
    <button class="btn-icon" id="ocal-next" title="Próximo mês">›</button></div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;color:var(--ink-faint);font-weight:600;margin-bottom:5px">`;
  ["D","S","T","Q","Q","S","S"].forEach(d=>h+=`<div>${d}</div>`);
  h+=`</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">`;
  for(let i=0;i<startDow;i++) h+=`<div></div>`;
  for(let d=1;d<=diasNoMes;d++){
    const ymd=mk+"-"+pad(d);
    const dow=new Date(y,m-1,d).getDay();
    const isWeekend=(dow===0||dow===6);
    const isToday=mk===hojeMk&&d===hojeDia;
    const porPessoa=pessoas.map(pe=>({pe,horas:(mapa[pe.id]&&mapa[pe.id][ymd])||0})).filter(x=>x.horas>0.001);
    const totalDia=porPessoa.reduce((s,x)=>s+x.horas,0);
    const borda=isToday?"outline:2px solid var(--accent);":"";
    const clique=(!isWeekend&&totalDia>0)?`data-ocup-day-eq="${ymd}"`:"";
    const cursor=(!isWeekend&&totalDia>0)?"cursor:pointer":"";
    const barras=(!isWeekend&&porPessoa.length)
      ?`<div style="display:flex;width:100%;height:6px;border-radius:3px;overflow:hidden;margin-top:3px">`+
        porPessoa.map(x=>`<div style="flex:${x.horas} 0 0;background:${cores[x.pe.id]}" title="${esc(x.pe.nome)}: ${fmtNum(x.horas,1)}h"></div>`).join("")+
        `</div>`
      :"";
    const bg=isWeekend?"#f4f6fb":"#fff";
    const tit=isWeekend?"Fim de semana":(totalDia>0?`${fmtNum(totalDia,1)}h no dia, ${porPessoa.length} pessoa(s)`:"Sem alocação");
    h+=`<div ${clique} style="aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;background:${bg};border:1px solid var(--line-soft);${borda}${cursor};font-size:11px;padding:2px" title="${esc(tit)}">
      <div style="font-weight:700;color:var(--ink-soft)">${d}</div>
      ${barras}
      ${!isWeekend&&totalDia>0?`<div style="font-size:8.5px;color:var(--ink-faint);margin-top:1px">${fmtNum(totalDia,0)}h</div>`:""}
    </div>`;
  }
  h+=`</div>`;
  h+=`<div class="legend" style="margin-top:14px">`+
    pessoas.map(pe=>`<div class="it"><span class="sw" style="background:${cores[pe.id]}"></span>${esc(pe.nome)}</div>`).join("")+
    `</div>`;
  h+=`<div style="margin-top:10px;font-size:11.5px;color:var(--ink-faint)">Cada barra é dividida proporcionalmente às horas de cada colaborador naquele dia. Clique num dia com alocação para ver o detalhamento.</div>`;
  return h;
}

function calendarioOcupacaoHtml(pessoa,mk,mapa){
  const [y,m]=mk.split("-").map(n=>+n);
  const primeiro=new Date(y,m-1,1);
  const diasNoMes=new Date(y,m,0).getDate();
  const startDow=primeiro.getDay();
  const hojeMk=todayStr().slice(0,7), hojeDia=+todayStr().slice(8,10);
  let h=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <button class="btn-icon" id="ocal-prev" title="Mês anterior">‹</button>
    <div style="font-weight:700">${esc(mesLabelLong(mk))} — ${esc(pessoa.nome)}</div>
    <button class="btn-icon" id="ocal-next" title="Próximo mês">›</button></div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;color:var(--ink-faint);font-weight:600;margin-bottom:5px">`;
  ["D","S","T","Q","Q","S","S"].forEach(d=>h+=`<div>${d}</div>`);
  h+=`</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">`;
  for(let i=0;i<startDow;i++) h+=`<div></div>`;
  for(let d=1;d<=diasNoMes;d++){
    const ymd=mk+"-"+pad(d);
    const dow=new Date(y,m-1,d).getDay();
    const isWeekend=(dow===0||dow===6);
    const horas=(mapa[pessoa.id]&&mapa[pessoa.id][ymd])||0;
    const isToday=mk===hojeMk&&d===hojeDia;
    let bg="#f4f6fb", color="var(--ink-soft)";
    if(!isWeekend){
      const pct=horas/CAPACIDADE_DIARIA_PADRAO;
      if(horas<=0){ bg="#eef2fa"; color="var(--ink-faint)"; }
      else if(pct<0.7){ bg="#e3ebf8"; color="#2f8f4e"; }
      else if(pct<1){ bg="#fbefdb"; color="#c67a12"; }
      else { bg="#fbe6e5"; color="#c2362f"; }
    }
    const borda=isToday?"outline:2px solid var(--accent);":"";
    const clique=(!isWeekend&&horas>0)?`data-ocup-day="${ymd}"`:"";
    const cursor=(!isWeekend&&horas>0)?"cursor:pointer":"";
    const tit=isWeekend?"Fim de semana":(horas>0?fmtH(horas)+" de "+CAPACIDADE_DIARIA_PADRAO+"h":"Sem alocação");
    h+=`<div ${clique} style="aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;background:${bg};color:${color};${borda}${cursor};font-size:11px" title="${esc(tit)}">
      <div style="font-weight:700">${d}</div>
      ${!isWeekend&&horas>0?`<div style="font-size:9.5px">${fmtNum(horas,1)}h</div>`:""}
    </div>`;
  }
  h+=`</div>
  <div class="legend" style="margin-top:14px">
    <div class="it"><span class="sw" style="background:#eef2fa"></span>Sem alocação</div>
    <div class="it"><span class="sw" style="background:#e3ebf8"></span>Livre (&lt;70%)</div>
    <div class="it"><span class="sw" style="background:#fbefdb"></span>Quase cheio</div>

  </div>
  <div style="margin-top:10px;font-size:11.5px;color:var(--ink-faint)">Clique num dia com alocação para ver o detalhamento por projeto/atividade.</div>`;
  return h;
}

/* ---- FINANCEIRO DO PROJETO ---- */
function projFinanceiro(c,p){
  const lanc=DB.data.financeiro.filter(f=>f.projetoId===p.id)
    .sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  const receitaLanc=lanc.filter(f=>f.tipo==="receita").reduce((s,f)=>s+(+f.valor||0),0);
  const despReal=despesasProjeto(p.id,"realizado");
  const despPrev=despesasProjeto(p.id,"previsto");
  /* despesa por rubrica */
  const rubMap={};
  DB.data.financeiro.filter(f=>f.projetoId===p.id&&f.tipo==="despesa").forEach(f=>{
    rubMap[f.rubricaId]=(rubMap[f.rubricaId]||0)+(+f.valor||0);
  });
  const rubData=Object.keys(rubMap).map((rid,i)=>({label:nomeRubrica(rid),value:rubMap[rid],color:PALETTE[i%PALETTE.length]}));
  const rows=lanc.map(f=>{
    const venc=f.status==="previsto"&&f.data&&daysBetween(todayStr(),f.data)<0;
    return `<tr>
      <td style="font-size:12px">${fmtDate(f.data)}</td>
      <td><span class="badge ${f.tipo==="receita"?"b-ok":"b-danger"}">${f.tipo==="receita"?"Receita":"Despesa"}</span></td>
      <td>${esc(f.descricao||"—")}<div style="font-size:11px;color:var(--ink-faint)">${esc(nomeRubrica(f.rubricaId))}</div></td>
      <td>${venc?`<span class="badge b-danger">Vencido</span>`:statusBadge(f.status==="realizado"?"Realizado":"Previsto")}</td>
      <td class="num" style="color:${f.tipo==="receita"?"var(--ok)":"var(--danger)"};font-weight:600">${f.tipo==="receita"?"+":"−"}${fmtBRL(f.valor)}${detalheQtdValor(f)}</td>
      <td class="actions"><button class="btn-icon" data-edf="${f.id}">✎</button>
        ${podeExcluirDados()?`<button class="btn-icon del" data-dlf="${f.id}">🗑</button>`:""}</td></tr>`;
  }).join("");

  c.innerHTML=`
  <div class="grid g4">
    <div class="card kpi"><div class="lbl">Receita contratada</div><div class="val" style="font-size:20px">${fmtBRL(p.receita)}</div></div>
    <div class="card kpi"><div class="lbl">Receita lançada</div><div class="val" style="font-size:20px;color:var(--ok)">${fmtBRL(receitaLanc)}</div></div>
    <div class="card kpi"><div class="lbl">Despesa realizada</div><div class="val" style="font-size:20px;color:var(--danger)">${fmtBRL(despReal)}</div></div>
    <div class="card kpi"><div class="lbl">Despesa prevista</div><div class="val" style="font-size:20px;color:var(--warn)">${fmtBRL(despPrev)}</div></div>
  </div>
  <div style="height:18px"></div>
  <div class="card">
    <div class="card-head"><h3>Despesas por rubrica</h3></div>
    <div class="card-pad">${donutChart(rubData)}</div>
  </div>
  <div style="height:18px"></div>
  <div class="toolbar">
    <span class="section-title" style="margin:0">Lançamentos financeiros</span>
    <div class="spacer"></div>
    <button class="btn" id="add-fin">+ Novo lançamento</button>
  </div>
  ${lanc.length?`<div class="card table-wrap"><table><thead><tr>
    <th>Data</th><th>Tipo</th><th>Descrição / Rubrica</th><th>Situação</th>
    <th class="num">Valor</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
   :`<div class="card"><div class="empty"><span class="ic">₿</span><h3>Sem lançamentos</h3>
     <p>Registre receitas e despesas para acompanhar a margem do projeto.</p>
     <button class="btn" id="add-fin2">+ Novo lançamento</button></div></div>`}`;

  const open=()=>formFinanceiro(p.id);
  $("#add-fin").onclick=open;
  if($("#add-fin2")) $("#add-fin2").onclick=open;
  c.querySelectorAll("[data-edf]").forEach(b=>b.onclick=()=>formFinanceiro(p.id,DB.data.financeiro.find(x=>x.id===b.dataset.edf)));
  c.querySelectorAll("[data-dlf]").forEach(b=>b.onclick=()=>{
    confirmar("Excluir este lançamento financeiro?","",async()=>{
      const fid=b.dataset.dlf;
      // só remove da lista em memória DEPOIS de confirmar que o servidor
      // apagou de verdade — antes disso, se sbDelete falhasse (rede, RLS,
      // etc.), o lançamento sumia da tela na hora mas continuava existindo
      // no banco; ao recarregar a página ele reaparecia, como se a exclusão
      // "não tivesse pegado".
      await sbDelete("financeiro", fid);
      DB.data.financeiro=DB.data.financeiro.filter(x=>x.id!==fid);
      toast("Lançamento excluído."); render();
    });
  });
}

/* ---- MATRIZ RACI ---- */
/* Retorna somente os parceiros externos vinculados a ESTE projeto — não a base toda.
   Um parceiro é considerado vinculado ao projeto p se:
   (a) o próprio cadastro do parceiro marcou este projeto em "Projeto(s) vinculado(s)"; ou
   (b) ele é o colaborador vinculado a um stakeholder classificado como "Primário" deste projeto. */
function getParceirosDoProjeto(p){
  return getParceiros().filter(co=>
    (co.projetosIds||[]).includes(p.id) ||
    (p.stakeholders||[]).some(s=>s.classificacao==="Primário" && s.colaboradorVinculadoId===co.id)
  );
}
/* Nome a exibir na Matriz RACI para uma pessoa: se for parceiro vinculado a um
   stakeholder Primário deste projeto, usa o nome cadastrado no stakeholder do
   próprio projeto (pode variar de projeto para projeto); senão usa o nome do cadastro geral. */
function nomeParaRaci(co,p){
  const stk=(p.stakeholders||[]).find(s=>s.classificacao==="Primário" && s.colaboradorVinculadoId===co.id);
  return stk ? stk.nome : co.nome;
}
function projRaci(c,p){
  const ats=DB.data.atividades.filter(a=>a.projetoId===p.id)
    .sort((a,b)=>(a.dataInicioPrev||"").localeCompare(b.dataInicioPrev||""));
  // ordena: internos primeiro (globais), depois só os parceiros vinculados a ESTE projeto
  const colabs=[...getInternos(),...getParceirosDoProjeto(p)];
  p.raci=p.raci||{};
  if(!ats.length||!colabs.length){
    c.innerHTML=`<div class="help-banner"><span>ℹ️</span><span>A matriz RACI cruza <b>atividades</b> com <b>pessoas</b> (colaboradores internos e parceiros externos vinculados a este projeto). Cadastre ao menos uma atividade (aba Cronograma) e uma pessoa vinculada a este projeto (menu Equipe ou aba Stakeholders) para montá-la.</span></div>
    <div class="card"><div class="empty"><span class="ic">▦</span><h3>Matriz indisponível</h3>
      <p>${!ats.length?"Faltam atividades no cronograma. ":""}${!colabs.length?"Falta cadastrar pessoas vinculadas a este projeto (parceiros: marque este projeto no cadastro, ou registre-o como stakeholder Primário).":""}</p></div></div>`;
    return;
  }
  let head=`<th style="min-width:180px">Atividade</th>`;
  colabs.forEach(co=>{
    const isP=co.tipo==="parceiro";
    const nomeExibido=nomeParaRaci(co,p);
    head+=`<th style="text-align:center;font-size:10px;${isP?"background:#fff6e0":""}" title="${esc(nomeExibido)}${isP?" (parceiro externo)":""}">${esc(nomeExibido.split(" ")[0])}${isP?'<div style="font-size:9px;color:#9a5b00;font-weight:700;margin-top:2px">PARCEIRO</div>':""}</th>`;
  });
  let body="";
  ats.forEach(a=>{
    let tds=`<td style="font-weight:600;font-size:12.5px">${esc(a.nome)}</td>`;
    colabs.forEach(co=>{
      const val=(p.raci[a.id]&&p.raci[a.id][co.id])||"";
      const opcoesSelect=["","R","A","C","I"].map(o=>
        `<option value="${o}" ${o===val?"selected":""}>${o||"—"}</option>`).join("");
      tds+=`<td class="raci-cell ${val?"raci-"+val:""}" style="padding:0">
        <select class="raci-select" data-ra="${a.id}" data-rc="${co.id}" ${podeEditarDados()?"":"disabled"}>${opcoesSelect}</select>
      </td>`;
    });
    body+=`<tr>${tds}</tr>`;
  });
  c.innerHTML=`
  <div class="help-banner"><span>ℹ️</span><span>${podeEditarDados()?"Escolha o papel na lista suspensa de cada célula: <b>R</b> Responsável (executa), <b>A</b> Autoridade (aprova), <b>C</b> Consultado, <b>I</b> Informado, ou deixe em branco.":"Visualização da matriz RACI deste projeto."} Parceiros externos aparecem destacados.</span></div>
  <div class="card table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
  <div class="legend" style="margin-top:14px">
    <div class="it"><span class="sw raci-R" style="border-radius:3px"></span>R — Responsável</div>
    <div class="it"><span class="sw raci-A" style="border-radius:3px"></span>A — Autoridade/Aprovador</div>
    <div class="it"><span class="sw raci-C" style="border-radius:3px"></span>C — Consultado</div>
    <div class="it"><span class="sw raci-I" style="border-radius:3px"></span>I — Informado</div>
  </div>`;
  if(!podeEditarDados()) return; // o perfil Colaborador visualiza a matriz, mas não edita
  c.querySelectorAll(".raci-select").forEach(sel=>{
    sel.onchange=async()=>{
      const aid=sel.dataset.ra, cid=sel.dataset.rc;
      const novoVal=sel.value;
      p.raci[aid]=p.raci[aid]||{};
      if(novoVal) p.raci[aid][cid]=novoVal; else delete p.raci[aid][cid];
      await DB.salvarRaciCelula(p.id, aid, cid, novoVal);
      projRaci(c,p);
    };
  });
}

/* ---- RISCOS ---- */
function severidadeRisco(r){
  const m={"Baixa":1,"Baixo":1,"Média":2,"Médio":2,"Alta":3,"Alto":3};
  const score=(m[r.probabilidade]||1)*(m[r.impacto]||1);
  return score>=6?"Alta":score>=3?"Média":"Baixa";
}
function projRiscos(c,p){
  p.riscos=p.riscos||[];
  const podeEditar=podeEditarDados();
  const rows=p.riscos.map((r,i)=>{
    const sev=severidadeRisco(r);
    const sb=sev==="Alta"?"b-danger":sev==="Média"?"b-warn":"b-ok";
    return `<tr>
      <td style="max-width:280px"><div style="font-weight:600">${esc(r.descricao)}</div>
        ${r.mitigacao?`<div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px">Mitigação: ${esc(r.mitigacao)}</div>`:""}</td>
      <td>${esc(r.probabilidade||"—")}</td>
      <td>${esc(r.impacto||"—")}</td>
      <td><span class="badge ${sb}">${sev}</span></td>
      <td>${statusBadge(r.status||"Identificado")}</td>
      <td style="font-size:12px">${esc(r.responsavel||"—")}</td>
      <td class="actions">${podeEditar?`<button class="btn-icon" data-er="${i}">✎</button>
        ${podeExcluirDados()?`<button class="btn-icon del" data-dr="${i}">🗑</button>`:""}`:""}</td></tr>`;
  }).join("");
  c.innerHTML=`
  <div class="toolbar"><span class="section-title" style="margin:0">Registro de riscos</span>
    <div class="spacer"></div>${podeEditar?'<button class="btn" id="add-rsk">+ Novo risco</button>':""}</div>
  ${p.riscos.length?`<div class="card table-wrap"><table><thead><tr>
    <th>Risco / Mitigação</th><th>Probabilidade</th><th>Impacto</th><th>Severidade</th>
    <th>Status</th><th>Responsável</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
   :`<div class="card"><div class="empty"><span class="ic">⚠</span><h3>Sem riscos registrados</h3>
     <p>${podeEditar?"Identifique riscos, classifique probabilidade/impacto e defina mitigações.":"Nenhum risco registrado ainda."}</p>
     ${podeEditar?'<button class="btn" id="add-rsk2">+ Adicionar risco</button>':""}</div></div>`}`;
  if(!podeEditar) return;
  const open=(idx)=>formRisco(p,idx);
  $("#add-rsk").onclick=()=>open(null);
  if($("#add-rsk2")) $("#add-rsk2").onclick=()=>open(null);
  c.querySelectorAll("[data-er]").forEach(b=>b.onclick=()=>open(+b.dataset.er));
  c.querySelectorAll("[data-dr]").forEach(b=>b.onclick=()=>{
    confirmar("Remover este risco?","",async()=>{
      const idx=+b.dataset.dr, item=p.riscos[idx];
      p.riscos.splice(idx,1);
      if(item && item.id) await DB.excluir("riscos", item.id);
      toast("Risco removido."); render();
    });
  });
}

/* ============================================================
   REUNIÕES DO PROJETO (com calendário e ata por IA)

function projReunioes(c,p){
  p.reunioes=p.reunioes||[];
  if(ST.reuniaoId){
    const r=p.reunioes.find(x=>x.id===ST.reuniaoId);
    if(r) return reuniaoDetalhe(c,p,r);
    ST.reuniaoId=null;
  }

/* exclui uma reunião (lista ou tela da reunião). Só tira da tela depois que o
   servidor confirmar a exclusão. */
function excluirReuniao(p,rid){
  const r=(p.reunioes||[]).find(x=>x.id===rid);
  confirmar("Excluir esta reunião?",`"${r&&r.titulo||"(sem título)"}"${r&&r.data?" de "+fmtDate(r.data):""} será excluída, com a ata, a transcrição e a lista de entregas. Atividades já criadas no cronograma a partir dessas entregas continuam lá. Esta ação não pode ser desfeita.`,async()=>{
    try{
      await DB.excluir("reunioes", rid);
      p.reunioes=(p.reunioes||[]).filter(x=>x.id!==rid);
      if(ST.reuniaoId===rid) ST.reuniaoId=null;
      toast("Reunião excluída."); render();
    }catch(e){ toast("Erro ao excluir a reunião: "+(e.message||e)); }
  });
}
function reunioesLista(c,p){
  ST.reunFiltroDe=ST.reunFiltroDe||"";
  ST.reunFiltroAte=ST.reunFiltroAte||"";
  ST.reunMes=ST.reunMes||todayStr().slice(0,7);

  let lista=(p.reunioes||[]).slice().sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  if(ST.reunFiltroDe) lista=lista.filter(r=>r.data>=ST.reunFiltroDe);
  if(ST.reunFiltroAte) lista=lista.filter(r=>r.data<=ST.reunFiltroAte);

  const linhas=lista.map(r=>{
    const nSaidas=(r.ata&&r.ata.saidas||[]).length;
    const temAta=r.ata&&(r.ata.objetivo||(r.ata.topicos&&r.ata.topicos.length)||nSaidas);
    return `<tr class="clickable" data-r="${r.id}">
      <td style="font-size:12.5px;white-space:nowrap"><b>${fmtDate(r.data)}</b>${r.hora?` <span style="color:var(--ink-faint)">${esc(r.hora)}</span>`:""}</td>
      <td><div style="font-weight:600">${esc(r.titulo||"(sem título)")}</div>
        <div style="font-size:11.5px;color:var(--ink-faint);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden" title="${esc((r.participantes||[]).join(", "))}">${esc((r.participantes||[]).join(", ")||"Sem participantes")}</div></td>
      <td>${temAta?'<span class="badge b-ok">Ata pronta</span>':r.transcricao?'<span class="badge b-warn">Transcrição</span>':'<span class="badge b-mute">Pendente</span>'}</td>
      <td class="num">${nSaidas?nSaidas:'<span style="color:var(--ink-faint)">—</span>'}</td>
      <td class="actions" style="width:44px">${podeExcluirDados()?`<button class="btn-icon del" data-dr="${r.id}" title="Excluir reunião">🗑</button>`:""}</td></tr>`;
  }).join("");

  c.innerHTML=`
  <div class="grid g2" style="grid-template-columns:1fr 360px;gap:18px">
    <div>
      <div class="toolbar">
        <span class="section-title" style="margin:0">Reuniões de follow-up</span>
        <div class="spacer"></div>
        <div class="field-inline">De
          <input type="date" class="select" id="fr-de" value="${ST.reunFiltroDe}"></div>
        <div class="field-inline">Até
          <input type="date" class="select" id="fr-ate" value="${ST.reunFiltroAte}"></div>
        <button class="btn ghost sm" id="fr-clr">Limpar</button>
        ${podeEditarDados()?`<button class="btn" id="add-reu">+ Nova reunião</button>`:""}
      </div>
      ${lista.length?`<div class="card table-wrap"><table>
        <thead><tr><th style="width:130px">Data</th><th>Reunião</th><th>Status</th>
          <th class="num">Entregas</th><th></th></tr></thead>
        <tbody>${linhas}</tbody></table></div>`
        :`<div class="card"><div class="empty">

  });
  c.querySelectorAll("[data-dr]").forEach(b=>b.onclick=()=>excluirReuniao(p,b.dataset.dr));
  // clique em dia do calendário filtra a lista

function mesLabelLong(mk){
  if(!mk) return "";
  const p=mk.split("-"); const i=(+p[1])-1;
  const nomes=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  return nomes[i]+" "+p[0];
}
function mesShift(mk,delta){
  const [y,m]=mk.split("-").map(n=>+n);
  const d=new Date(y,m-1+delta,1);
  return d.getFullYear()+"-"+pad(d.getMonth()+1);
}
/* lista de meses (AAAA-MM) centrada no mês atual: 2 meses para trás e o
   restante para a frente — usada no seletor de mês da Ocupação da Equipe,
   já que a ocupação é essencialmente um planejamento futuro. */
function ultimosMeses(n){
  n=n||12;
  const out=[];
  for(let i=-2;i<=n-3;i++) out.push(mesShift(todayStr().slice(0,7), i));
  return out;
}
/* intervalo de meses (AAAA-MM) para o seletor de "Ocupação da Equipe":
   cobre desde o mês mais antigo com atividade prevista (com horas previstas
   por colaborador informadas no Cronograma) até alguns meses à frente do mês
   atual. Corrige o caso em que o calendário "começava" num mês recente (ex.:
   sempre 2 meses antes de hoje) mesmo havendo atividades com dados desde
   meses bem anteriores (ex.: fevereiro) — essas ficavam fora da lista e
   pareciam não existir. */
function mesesOcupacaoDisponiveis(){
  const hojeMk=todayStr().slice(0,7);
  let minMk=hojeMk, maxMk=mesShift(hojeMk,9);
  DB.data.atividades.forEach(a=>{
    if(totalHorasPrevistasAtividade(a)<=0) return;
    if(a.dataInicioPrev && a.dataInicioPrev.slice(0,7)<minMk) minMk=a.dataInicioPrev.slice(0,7);
    if(a.dataFimPrev && a.dataFimPrev.slice(0,7)>maxMk) maxMk=a.dataFimPrev.slice(0,7);
  });
  minMk=mesShift(minMk,-1); // uma margem de 1 mês antes do primeiro dado
  const out=[];
  let cursor=minMk, guard=0;
  while(cursor<=maxMk && guard<240){ out.push(cursor); cursor=mesShift(cursor,1); guard++; }
  return out;
}
function miniCalendar(reunioes,mk){
  const [y,m]=mk.split("-").map(n=>+n);
  const primeiro=new Date(y,m-1,1);
  const diasNoMes=new Date(y,m,0).getDate();
  const startDow=primeiro.getDay(); // 0=dom
  const reunMap={};
  reunioes.forEach(r=>{
    if(r.data && r.data.startsWith(mk)){
      const dia=+r.data.slice(8,10);
      reunMap[dia]=(reunMap[dia]||0)+1;
    }
  });
  const hojeMk=todayStr().slice(0,7), hojeDia=+todayStr().slice(8,10);
  let h=`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:11px;color:var(--ink-faint);font-weight:600;margin-bottom:5px">`;
  ["D","S","T","Q","Q","S","S"].forEach(d=>h+=`<div>${d}</div>`);
  h+=`</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">`;
  for(let i=0;i<startDow;i++) h+=`<div></div>`;
  for(let d=1;d<=diasNoMes;d++){
    const n=reunMap[d]||0;
    const isToday=mk===hojeMk && d===hojeDia;
    const ymd=mk+"-"+pad(d);
    const style=n?`background:var(--accent);color:#fff;font-weight:700`:isToday?`outline:2px solid var(--accent);color:var(--accent);font-weight:700`:`background:#f4f6fb;color:var(--ink-soft)`;
    const cursor=n?"cursor:pointer":"";
    h+=`<div ${n?`data-cal-day="${ymd}"`:""} style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:12px;${style};${cursor}" title="${n?n+' reunião(ões)':''}">${d}</div>`;
  }
  h+=`</div>
  <div style="margin-top:12px;font-size:11.5px;color:var(--ink-faint);text-align:center">
    Dias destacados têm reuniões. Clique para filtrar.</div>`;
  return h;
}

/* ---- RESUMO AUTOMÁTICO DO PERÍODO (entre a última reunião e a próxima) ----
   "Atividades realizadas": atividades CONCLUÍDAS no período (Término real
   dentro dele), anotações de progresso lançadas no período (quadro de cada
   colaborador) e, por compatibilidade, os apontamentos antigos de horas. "Próximas atividades": vem tanto das
   Saídas e entregas combinadas na ata da reunião anterior (que ainda não
   viraram atividade concluída no cronograma) quanto das atividades do
   cronograma do projeto com janela prevista dentro do período. */
function ultimaReuniaoAntesDe(p,dataRef){
  return (p.reunioes||[])
    .filter(r=>r.data && r.data<dataRef)
    .sort((a,b)=>(b.data||"").localeCompare(a.data||""))[0] || null;
}
function gerarResumoAutomatico(p,dataAte){
  const anterior=ultimaReuniaoAntesDe(p,dataAte);
  const dataDe=(anterior&&anterior.data) ? anterior.data : (p.dataInicio||null);

  /* --- Atividades realizadas --- */
  const noPeriodo=d=>!!d && (!dataDe || d>=dataDe) && d<=dataAte;
  const porAtividade={};
  const item=key=>porAtividade[key]||(porAtividade[key]={horas:0,descricoes:[],concluidaEm:null,ordem:""});
  // 1) atividades concluídas no período (Término real dentro do período)
  DB.data.atividades.forEach(a=>{
    if(a.projetoId!==p.id || a.status==="Cancelada") return;
    const concluida=a.status==="Concluída" || (+a.progresso||0)>=100;
    if(concluida && noPeriodo(a.dataFimReal)){ const it=item(a.id); it.concluidaEm=a.dataFimReal; it.ordem=a.dataFimReal; }
    // 2) anotações de progresso lançadas no período, com as horas
    (a.estimativasPessoas||[]).forEach(x=>{
      ordenarLogExecucao(x.horasExecLog||[]).forEach(e=>{
        if(!e || !noPeriodo(e.data)) return;
        const it=item(a.id);
        it.horas+=(+e.horas||0);
        if(e.nota && String(e.nota).trim()){
          const c=getColab(x.colaboradorId);
          it.descricoes.push(`${fmtDate(e.data).slice(0,5)} ${c?String(c.nome).split(" ")[0]+": ":""}${String(e.nota).trim()}`);
        }
        if(!it.ordem || e.data>it.ordem) it.ordem=e.data;
      });
    });
  });
  // 3) apontamentos antigos de horas (tabela "horas")
  DB.data.horas.filter(h=>h.projetoId===p.id && noPeriodo(h.data)).forEach(h=>{
    const it=item(h.atividadeId||"__sem_atividade__");
    it.horas+=(+h.horas||0);
    if(h.descricao && h.descricao.trim() && !it.descricoes.includes(h.descricao.trim())) it.descricoes.push(h.descricao.trim());
    if(!it.ordem || h.data>it.ordem) it.ordem=h.data;
  });
  const realizadas=Object.keys(porAtividade).map(key=>{
    const ativ=key!=="__sem_atividade__"?getAtividade(key):null;
    const info=porAtividade[key];
    const nome=ativ?ativ.nome:"Apontamentos diversos";
    const resp=ativ?nomesResponsaveisAtividade(ativ,p):[];
    return {ordem:info.ordem, txt:`${info.concluidaEm?"✔ ":""}${nome}${info.concluidaEm?" — concluída em "+fmtDate(info.concluidaEm):""}`
      +`${info.horas>0.04?" ("+fmtNum(info.horas,1)+"h)":""}${resp.length?" — Responsável: "+resp.join(", "):""}`
      +`${info.descricoes.length?": "+info.descricoes.join("; "):""}`};
  }).sort((a,b)=>(a.ordem||"").localeCompare(b.ordem||"")||a.txt.localeCompare(b.txt,"pt-BR",{sensitivity:"base"})).map(x=>x.txt);

  /* --- Próximas atividades: entregas pendentes da ata anterior --- */
  const proximas=[];
  if(anterior && anterior.ata && Array.isArray(anterior.ata.saidas)){
    anterior.ata.saidas.forEach(s=>{
      const ativ=s.atividadeId?getAtividade(s.atividadeId):null;
      const concluida=ativ && (ativ.status==="Concluída" || (+ativ.progresso||0)>=100);
      if(!concluida && s.descricao && s.descricao.trim()){
        proximas.push(`${s.descricao.trim()}${s.responsavel?" — Responsável: "+s.responsavel:""}${s.dataEntrega?" (prevista para "+fmtDate(s.dataEntrega)+")":""}`);
      }
    });
  }
  /* --- Próximas atividades: cronograma planejado dentro do período --- */
  const ativsCronograma=DB.data.atividades.filter(a=>a.projetoId===p.id &&
    a.status!=="Concluída" && a.status!=="Cancelada" &&
    a.dataInicioPrev && a.dataInicioPrev<=dataAte &&
    (!a.dataFimPrev || !dataDe || a.dataFimPrev>=dataDe));
  ativsCronograma.forEach(a=>{
    const resp=(a.responsavelId&&getColab(a.responsavelId))?[getColab(a.responsavelId).nome]:nomesResponsaveisAtividade(a,p);
    proximas.push(`${a.nome} — previsto de ${fmtDate(a.dataInicioPrev)} a ${a.dataFimPrev?fmtDate(a.dataFimPrev):"—"}${resp.length?" (Responsável: "+resp.join(", ")+")":""}`);
  });

  return {de:dataDe, ate:dataAte, realizadas, proximas:[...new Set(proximas)]};
}

/* ---- FORMULÁRIO de NOVA REUNIÃO ---- */
function formReuniao(p){
  openForm({
    title:"Nova reunião",
    wide:true,
    values:{data:todayStr(),hora:"",titulo:"",participantes:""},
    fields:[
      {key:"data",label:"Data da reunião",type:"date",required:true},
      {key:"hora",label:"Horário (opcional)",type:"time"},
      {key:"titulo",label:"Título / Assunto",required:true,full:true,
        placeholder:"Ex.: Follow-up semanal de andamento"},
      {key:"participantes",label:"Participantes",type:"textarea",full:true,
        placeholder:"Separe por vírgulas ou por linhas. Pode usar nomes da equipe ou nomes livres.",
        help:"Você poderá editar depois e a IA pode preencher a partir da transcrição."}
    ],
    onSave:async(v)=>{
      const parts=String(v.participantes||"").split(/[,\n;]/).map(s=>s.trim()).filter(Boolean);
      // resumo automático: atividades realizadas (apontamento de horas) e
      // próximas atividades (saídas pendentes da reunião anterior +
      // cronograma), cobrindo o período entre a última reunião e esta.
      const resumo=gerarResumoAutomatico(p, v.data);
      const r={
        id:uid(), projetoId:p.id, data:v.data, hora:v.hora||"", titulo:v.titulo,
        participantes:parts, transcricao:"",

        resumoRealizadas:resumo.realizadas,
        resumoProximas:resumo.proximas,
        resumoDe:resumo.de, resumoAte:resumo.ate,
        anotacoes:"",
        criadaEm:todayStr()
      };
      p.reunioes.push(r);
      await sbInsert("reunioes", toSnake(r));
      toast("Reunião criada. Resumo do período gerado automaticamente.");
      ST.reuniaoId=r.id; render();
    }
  });
}
