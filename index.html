/* ---------- PLANILHA DE PENDÊNCIAS DE CONCLUSÃO (.xlsx) ----------
   Lista as atividades CONCLUÍDAS que estão sem Início real, Término real ou
   horas executadas de algum colaborador. Uma aba por projeto + aba "Resumo".
   Uma linha por atividade × colaborador, para preencher as horas de cada
   pessoa. As células a preencher saem em amarelo. */
async function exportarPendenciasConclusao(){
  toast("Gerando planilha de pendências…");
  try{
    await carregarExcelJS();
    const dt=v=>{ if(!v) return null; const [y,m,d]=String(v).slice(0,10).split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
    const hoje=todayStr();
    const COR={navy:"FF164194",verde:"FF164194",dourado:"FFE84910",creme:"FFF4F6FA",linha:"FFDDE3EE",tinta:"FF0F1F3D",pend:"FFFFF1B8",cinza:"FF8A97A3"};
    const fT="Segoe UI", fB="Segoe UI";
    const fill=c=>({type:"pattern",pattern:"solid",fgColor:{argb:c}});
    const horaOk=v=>v!==null&&v!==undefined&&v!==""&&isFinite(+v)&&+v>=0;

    // 1) levanta as pendências por projeto
    const grupos=[];
    DB.data.projetos.slice().sort((a,b)=>(a.nome||"").localeCompare(b.nome||"","pt-BR",{sensitivity:"base"})).forEach(proj=>{
      const concl=DB.data.atividades.filter(a=>a.projetoId===proj.id && a.status!=="Cancelada" &&
        (a.status==="Concluída"||(+a.progresso||0)>=100));
      const pend=[];
      concl.forEach(a=>{
        const pessoas=(Array.isArray(a.estimativasPessoas)?a.estimativasPessoas:[]).filter(x=>x&&x.colaboradorId);
        const faltas=[];
        if(!a.dataInicioReal) faltas.push("Início real");
        if(!a.dataFimReal) faltas.push("Término real");
        const semHoras=pessoas.filter(x=>!horaOk(x.horasExecutadas));
        if(semHoras.length) faltas.push("Horas executadas");
        if(!pessoas.length) faltas.push("Sem equipe listada");
        if(faltas.length) pend.push({a,pessoas,faltas});
      });
      if(concl.length) grupos.push({proj,totalConcl:concl.length,pend});
    });
    const comPend=grupos.filter(g=>g.pend.length);
    if(!comPend.length){ toast("Nenhuma atividade concluída com pendências. Tudo preenchido!"); return; }

    const wb=new ExcelJS.Workbook(); wb.creator="Gestão de Portfólio"; wb.created=new Date();

    // 2) aba Resumo
    const rs=wb.addWorksheet("Resumo",{views:[{showGridLines:false}]});
    rs.columns=[{width:46},{width:22},{width:16},{width:16},{width:14}];
    rs.mergeCells(1,1,1,5);
    const t=rs.getCell(1,1); t.value="Pendências de conclusão — atividades concluídas sem dados";
    t.font={name:fT,size:15,bold:true,color:{argb:"FFFFFFFF"}}; t.alignment={vertical:"middle",indent:1};
    for(let c=1;c<=5;c++) rs.getCell(1,c).fill=fill(COR.navy);
    rs.getRow(1).height=30;

      c2.font={name:fB,size:10,color:{argb:"FFD6E2FA"}}; c2.alignment={vertical:"middle",indent:1};

      ws.getRow(1).height=30; ws.getRow(2).height=20; ws.getRow(3).height=6;
      const hr=ws.getRow(4); hr.height=30;

        x.alignment={vertical:"middle",horizontal:i>=3&&i!==7?"center":"left",wrapText:true}; });
      let r=5, zebra=0;
      g.pend.forEach(item=>{

          const vals=[a.id,primeira?a.nome:"",primeira?nomeCategoria(a.categoriaId):"",primeira?dt(a.dataInicioPrev):null,primeira?dt(a.dataFimPrev):null,

            x&&x.horas!=null&&x.horas!==""?+x.horas:null, x&&horaOk(x.horasExecutadas)?+x.horasExecutadas:null, falt.join("; ")];
          const row=ws.getRow(r);
          vals.forEach((v,i)=>{
            const c=row.getCell(i+1); c.value=v;

            c.border={bottom:{style:"thin",color:{argb:idx===linhas.length-1?COR.linha:"FFE8EEF9"}}};
            if(zebra%2===1) c.fill=fill(COR.creme);

          if(faltaHora) row.getCell(10).fill=fill(COR.pend);
          row.getCell(11).font={name:fT,size:10,bold:true,color:{argb:"FFB83232"}};
          r++;
        });
        zebra++;
      });
      ws.autoFilter={from:{row:4,column:1},to:{row:r-1,column:n}};
    });

    const buf=await wb.xlsx.writeBuffer();
    const a=document.createElement("a");

    a.download="pendencias-conclusao-"+hoje+".xlsx"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast("Planilha gerada: "+totP+" atividade(s) com pendência em "+comPend.length+" projeto(s).");
  }catch(e){ console.error(e); toast("Erro ao gerar a planilha: "+(e.message||e)); }
}

/* ---------- IMPORTAR A PLANILHA DE PENDÊNCIAS PREENCHIDA ----------
   Lê o .xlsx gerado por exportarPendenciasConclusao() depois de preenchido:
   - Início real / Término real (primeira linha de cada atividade);
   - Horas executadas de cada colaborador (uma linha por pessoa).
   A atividade é identificada pela coluna "ID da atividade" e o colaborador
   pelo nome. Células em branco NÃO apagam o que já existe no app. */
function normNomeImp(s){ return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase(); }
function valorCelulaImp(cell){
  let v=cell?cell.value:null;
  if(v && typeof v==="object" && !(v instanceof Date)){
    if(Array.isArray(v.richText)) v=v.richText.map(t=>t.text).join("");
    else if("result" in v) v=v.result;
    else if("text" in v) v=v.text;
  }
  return v===undefined?null:v;
}
function parseDataImp(v){
  if(v===null||v===undefined||(typeof v==="string"&&!v.trim())) return {vazio:true};
  const iso=d=>d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());
  if(v instanceof Date && !isNaN(v)) return {val:iso(v)};
  if(typeof v==="number" && v>20000 && v<80000) return {val:iso(new Date(Math.round((v-25569)*86400000)))};
  if(typeof v==="string"){
    const t=v.trim(); let m;
    if((m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))){ const d=new Date(Date.UTC(+m[3],+m[2]-1,+m[1])); if(d.getUTCMonth()===+m[2]-1) return {val:iso(d)}; }
    if((m=t.match(/^(\d{4})-(\d{2})-(\d{2})/))) return {val:m[1]+"-"+m[2]+"-"+m[3]};
  }
  return {invalido:true};
}
function parseHoraImp(v){
  if(v===null||v===undefined||(typeof v==="string"&&!v.trim())) return {vazio:true};
  const n=typeof v==="number"?v:parseFloat(String(v).trim().replace(",","."));
  return (isFinite(n)&&n>=0)?{val:n}:{invalido:true};
}
function montarPlanoPendencias(wb){
  const plano={itens:[],avisos:[],abas:0,linhas:0,restantes:0,ndatas:0,nhoras:0};
  const grupos=new Map();
  wb.worksheets.forEach(ws=>{
    let hdr=0;
    for(let r=1;r<=Math.min(ws.rowCount,10);r++){ if(normNomeImp(valorCelulaImp(ws.getCell(r,1)))==="id da atividade"){ hdr=r; break; } }
    if(!hdr) return;
    plano.abas++;
    for(let r=hdr+1;r<=ws.rowCount;r++){
      const id=String(valorCelulaImp(ws.getCell(r,1))||"").trim();
      if(!id) continue;
      plano.linhas++;
      let g=grupos.get(id); if(!g){ g={id,aba:ws.name,ini:null,fim:null,horas:[]}; grupos.set(id,g); }
      [[6,"ini","Início real"],[7,"fim","Término real"]].forEach(([col,k,rot])=>{
        const d=parseDataImp(valorCelulaImp(ws.getCell(r,col)));
        if(d.invalido) plano.avisos.push(`${ws.name}, linha ${r}: ${rot} inválido (use dd/mm/aaaa). Ignorado.`);
        else if(d.val && !g[k]) g[k]=d.val;
      });
      g.horas.push({nome:String(valorCelulaImp(ws.getCell(r,8))||"").trim(),raw:valorCelulaImp(ws.getCell(r,10)),linha:r,aba:ws.name});
    }
  });
  grupos.forEach(g=>{
    const a=getAtividade(g.id);
    if(!a){ plano.avisos.push(`Atividade com ID ${g.id} (aba "${g.aba}") não existe mais no app. Ignorada.`); return; }
    const patch={}; let nd=0,nh=0;
    let ini=g.ini||a.dataInicioReal||null, fim=g.fim||a.dataFimReal||null;
    if(ini&&fim&&fim<ini){
      plano.avisos.push(`"${a.nome}": Término real anterior ao Início real. Datas ignoradas.`);
      ini=a.dataInicioReal||null; fim=a.dataFimReal||null;
    }
    if(ini!==(a.dataInicioReal||null)){ patch.dataInicioReal=ini; patch.inicioRealMesmo=(ini===a.dataInicioPrev); nd++; }
    if(fim!==(a.dataFimReal||null)){ patch.dataFimReal=fim; patch.fimRealMesmo=(fim===a.dataFimPrev); nd++; }
    const pessoas=(Array.isArray(a.estimativasPessoas)?a.estimativasPessoas:[]).map(x=>Object.assign({},x));
    const usados=new Set();
    g.horas.forEach(h=>{
      const hv=parseHoraImp(h.raw);
      if(hv.vazio) return;
      if(normNomeImp(h.nome).includes("sem equipe")) return;
      if(hv.invalido){ plano.avisos.push(`${h.aba}, linha ${h.linha}: horas executadas inválidas. Ignorado.`); return; }
      const idx=pessoas.findIndex((x,j)=>!usados.has(j)&&x.colaboradorId&&normNomeImp((getColab(x.colaboradorId)||{}).nome)===normNomeImp(h.nome));
      if(idx<0){ plano.avisos.push(`${h.aba}, linha ${h.linha}: colaborador "${h.nome}" não encontrado em "${a.nome}". Ignorado.`); return; }
      usados.add(idx);
      const atual=pessoas[idx].horasExecutadas;
      if(atual!==null&&atual!==undefined&&atual!==""&&+atual===hv.val) return;
      pessoas[idx].horasExecLog=atualizarLogExecucao(pessoas[idx],hv.val,{semData:true,nota:"Importado da planilha de pendências"});
      pessoas[idx].horasExecutadas=hv.val; nh++;
    });
    if(nh) patch.estimativasPessoas=pessoas;
    if(!Object.keys(patch).length) return;
    const concluida=a.status==="Concluída"||(+a.progresso||0)>=100;
    const falta=concluida?erroConclusaoAtividade({dataInicioReal:ini,dataFimReal:fim,estimativasPessoas:pessoas}):"";
    if(falta) plano.restantes++;
    plano.ndatas+=nd; plano.nhoras+=nh;
    plano.itens.push({a,patch,nd,nh});
  });
  return plano;
}
async function importarPendenciasConclusao(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".xlsx";
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    try{
      toast("Lendo a planilha…");
      await carregarExcelJS();
      const wb=new ExcelJS.Workbook();
      await wb.xlsx.load(await f.arrayBuffer());
      const plano=montarPlanoPendencias(wb);
      if(!plano.abas){ toast("Arquivo não reconhecido: use a planilha gerada pelo botão “Pendências de conclusão”."); return; }
      mostrarPreviaImportacaoPendencias(plano);
    }catch(e){ console.error(e); toast("Erro ao ler a planilha: "+(e.message||e)); }
  };
  inp.click();
}

  $("#modal-root").innerHTML=`
  <div class="overlay"><div class="modal" style="max-width:560px">

      <p style="font-size:13px;color:var(--ink-soft)">Foram lidas ${plano.linhas} linha(s) em ${plano.abas} aba(s).</p>
      ${plano.itens.length?`<ul style="font-size:13.5px;line-height:1.7;margin:10px 0 0 18px">
        <li><b>${plano.itens.length}</b> atividade(s) serão atualizadas</li>
        <li><b>${plano.ndatas}</b> data(s) real(is) a gravar</li>
        <li><b>${plano.nhoras}</b> lançamento(s) de horas executadas a gravar</li>
        ${plano.restantes?`<li>${plano.restantes} atividade(s) ainda ficarão com pendência após a importação</li>`:""}
      </ul>
      <p style="font-size:12px;color:var(--ink-faint);margin-top:8px">Células em branco não apagam dados já existentes.</p>`
      :`<p style="font-size:13.5px;margin-top:10px">Nada novo para gravar: as células amarelas ainda estão em branco ou os valores já estão no app.</p>`}
      ${av?`<div style="margin-top:12px;padding:9px 12px;border-radius:8px;background:var(--danger-bg);color:var(--danger);font-size:12.5px">
        <b>Avisos (${plano.avisos.length})</b><ul style="margin:6px 0 0 18px;line-height:1.5">${av}</ul></div>`:""}
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="imp-no">${plano.itens.length?"Cancelar":"Fechar"}</button>
      ${plano.itens.length?'<button class="btn" id="imp-yes">Gravar no app</button>':""}
    </div></div></div>`;
  $("#imp-no").onclick=closeModal;
  if(!plano.itens.length) return;
  $("#imp-yes").onclick=async()=>{
    const btn=$("#imp-yes"); btn.disabled=true; btn.textContent="Gravando…";
    let ok=0; const falhas=[];
    for(const it of plano.itens){
      try{
        await sbUpdate("atividades", it.a.id, toSnake(it.patch));
        Object.assign(it.a,it.patch); ok++;
      }catch(e){ falhas.push(`"${it.a.nome}": ${e.message||e}`); }
    }
    closeModal();
    toast(`${ok} atividade(s) atualizada(s).`+(falhas.length?` ${falhas.length} falha(s): ${falhas.slice(0,2).join(" | ")}`:""));
    render();
  };
}

async function importarCSVCronograma(event, projetoId){
  const file=event.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=async (e)=>{
    try{
      const { texto:textoDecodificado, encoding } = decodeCsvBuffer(e.target.result);
      console.log("[PMO] CSV cronograma decodificado como", encoding);
      const texto=textoDecodificado.replace(/^\uFEFF/,"");
      const linhas=texto.split(/\r?\n/).filter(l=>l.trim());
      if(linhas.length<2){ alert("CSV vazio ou sem dados."); return; }
      const sep=linhas[0].includes(";")?";":",";
      const cabecalho=parseCSVLine(linhas[0],sep).map(s=>s.trim().toLowerCase());
      const cols={
        nome: cabecalho.findIndex(c=>c==="nome"||c==="atividade"||c==="descrição"||c==="descricao"),
        categoria: cabecalho.findIndex(c=>c==="categoria"),
        inicio: cabecalho.findIndex(c=>c==="início previsto"||c==="inicio previsto"||c==="início"||c==="inicio"||c==="data início"||c==="data inicio"),
        fim: cabecalho.findIndex(c=>c==="término previsto"||c==="termino previsto"||c==="término"||c==="termino"||c==="data fim"||c==="data fim"||c==="fim"),
        status: cabecalho.findIndex(c=>c==="status"||c==="situação"||c==="situacao")
      };
      const obrigatorias=["nome","categoria"];
      const faltando=obrigatorias.filter(k=>cols[k]<0);
      if(faltando.length){
        alert("CSV inválido. Faltando coluna(s): "+faltando.join(", ")+".\n\nO cabeçalho deve ter: Nome; Categoria; Início previsto; Término previsto; Status.");
        return;
      }
      const resultado={ok:0, erro:0, mensagens:[]};
      const novasAtividades=[];
      linhas.slice(1).forEach((linha,idx)=>{
        const lnNum=idx+2;
        if(!linha.trim()) return;
        const c=parseCSVLine(linha,sep);
        const nomeRaw=(c[cols.nome]||"").trim();
        const catRaw=(c[cols.categoria]||"").trim();
        const inicioRaw=(cols.inicio>=0?(c[cols.inicio]||"").trim():"").trim();
        const fimRaw=(cols.fim>=0?(c[cols.fim]||"").trim():"").trim();
        const statusRaw=(cols.status>=0?(c[cols.status]||"").trim():"").trim();

        if(!nomeRaw){ resultado.erro++; resultado.mensagens.push(`Linha ${lnNum}: nome da atividade vazio.`); return; }
        const cat=DB.data.categorias.find(x=>(x.nome||"").trim().toLowerCase()===catRaw.toLowerCase());
        if(!cat){ resultado.erro++; resultado.mensagens.push(`Linha ${lnNum}: categoria "${catRaw}" não cadastrada.`); return; }

        // datas no formato DD/MM/YYYY ou YYYY-MM-DD
        function parseData(dataRaw){
          const m1=dataRaw.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
          const m2=dataRaw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
          if(m1) return `${m1[3]}-${m1[2]}-${m1[1]}`;
          if(m2) return dataRaw;
          return null;
        }
        const dataInicio=inicioRaw?parseData(inicioRaw):null;
        const dataFim=fimRaw?parseData(fimRaw):null;
        if(inicioRaw && !dataInicio){ resultado.erro++; resultado.mensagens.push(`Linha ${lnNum}: data de início inválida "${inicioRaw}"`); return; }
        if(fimRaw && !dataFim){ resultado.erro++; resultado.mensagens.push(`Linha ${lnNum}: data de término inválida "${fimRaw}"`); return; }

        let status=statusRaw;
        if(status && !STATUS_ATIV.includes(status)) status="Não iniciada";
        // REGRA: concluir exige datas reais e horas executadas, que o CSV não
        // traz — então a atividade entra como "Em andamento" e deve ser
        // concluída depois, pelo próprio app.
        if(status==="Concluída"){ status="Em andamento"; resultado.rebaixadas=(resultado.rebaixadas||0)+1; }

        const nova={id:uid(), projetoId, nome:nomeRaw, categoriaId:cat.id,
          dataInicioPrev:dataInicio||null, dataFimPrev:dataFim||null,
          estimativasPessoas:[], status:status||"Não iniciada", progresso:0};
        DB.data.atividades.push(nova);
        novasAtividades.push(nova);
        resultado.ok++;
      });
      if(novasAtividades.length){
        await sbInsert("atividades", novasAtividades.map(toSnake));
        toast(`${novasAtividades.length} atividade(s) importada(s).`+
          (resultado.rebaixadas?` ${resultado.rebaixadas} marcada(s) como "Concluída" entraram como "Em andamento" (conclua no app informando datas reais e horas executadas).`:""));
      }
      event.target.value="";
      const detalhes=resultado.mensagens.length
        ? `\n\nProblemas (${resultado.mensagens.length}):\n${resultado.mensagens.slice(0,15).join("\n")}${resultado.mensagens.length>15?"\n…":""}`
        : "";
      if(resultado.erro) alert(`Importação concluída.\n\n✓ ${resultado.ok} atividade(s) importada(s).\n✗ ${resultado.erro} linha(s) com erro (não importadas).`+detalhes);
      render();
    }catch(err){
      alert("Erro ao ler o CSV: "+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

/* Importa um backup .json exportado pelo próprio app.
   Diferente do app local original, aqui os dados são compartilhados em
   nuvem, então a importação ADICIONA o que estiver faltando (por id),
   em vez de sobrescrever tudo — assim não corre o risco de apagar dados
   que a equipe já tenha criado depois do backup. */
function importarBackup(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async()=>{
    let obj;
    try{
      obj=JSON.parse(reader.result);
      if(!obj||typeof obj!=="object") throw 0;
    }catch(err){
      toast("Arquivo inválido. Verifique o backup.");
      e.target.value=""; return;
    }

    confirmar(
      "Importar este backup?",
      "Projetos, categorias, rubricas, atividades, horas e lançamentos que ainda não existirem serão adicionados. Nada que já existe será sobrescrito ou removido.",
      async()=>{
        try{
          let novosTotal=0;
          const tabelasSimples=[
            ["categorias", obj.categorias],
            ["rubricas", obj.rubricas],
            ["projetos", (obj.projetos||[]).map(p=>{
              const {stakeholders,riscos,reunioes,raci,documentos,...rest}=p; return rest;
            })],
            ["atividades", obj.atividades],
            ["horas", obj.horas],
            ["financeiro", obj.financeiro]
          ];
          for(const [tabela, registros] of tabelasSimples){
            if(!Array.isArray(registros) || !registros.length) continue;
            const idsExistentes=new Set(DB.data[tabela].map(r=>r.id));
            const novos=registros.filter(r=>r.id && !idsExistentes.has(r.id));
            if(novos.length){
              await sbInsert(tabela, novos.map(toSnake));
              novosTotal+=novos.length;
            }
          }
          // sub-listas de projeto (stakeholders, riscos, reuniões)
          for(const p of (obj.projetos||[])){
            for(const [tabela, lista] of [["stakeholders",p.stakeholders],["riscos",p.riscos],["reunioes",p.reunioes]]){
              if(!Array.isArray(lista) || !lista.length) continue;
              const existentesDoProjeto=DB.data.projetos.find(x=>x.id===p.id);
              const idsExistentes=new Set((existentesDoProjeto?existentesDoProjeto[tabela]:[])?.map(r=>r.id)||[]);
              const novos=lista.filter(r=>r.id && !idsExistentes.has(r.id));
              if(novos.length){
                await sbInsert(tabela, novos.map(r=>toSnake(Object.assign({projetoId:p.id},r))));
                novosTotal+=novos.length;
              }
            }
          }
          await DB.load();
          toast(novosTotal? `${novosTotal} registro(s) importado(s).` : "Nada novo para importar — backup já estava sincronizado.");
          render();
        }catch(err){
          console.error(err);
          toast("Erro ao importar: "+(err.message||err));
        }
      }
    );
    e.target.value="";
  };
  reader.readAsText(file);
}

// fecha o modal preservando a posição de rolagem da página por trás dele.
// Ao remover o modal do DOM, se o botão/campo que estava com foco (ex.: o
// próprio botão "Salvar" que acabou de ser clicado) for destruído junto,
// alguns navegadores devolvem o foco para <body> e, ao fazer isso, rolam a
// página para o topo — mesmo que render() já tenha restaurado a posição
// certa um instante antes. Por isso: 1) tira o foco do elemento ANTES de
// remover o modal (evita o navegador "decidir" mover a rolagem sozinho) e
// 2) reforça a posição depois, inclusive num frame seguinte, caso o
// navegador aplique o ajuste de forma assíncrona.
function closeModal(){
  const y=window.scrollY;
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  $("#modal-root").innerHTML="";
  reforcarScroll(y);
}
function confirmar(titulo,texto,onOk){
  $("#modal-root").innerHTML=`
  <div class="overlay"><div class="modal" style="max-width:420px">
    <div class="modal-head"><h3>${esc(titulo)}</h3></div>
    <div class="modal-body"><p style="color:var(--ink-soft);font-size:13px">${esc(texto||"")}</p></div>
    <div class="modal-foot">
      <button class="btn ghost" id="c-no">Cancelar</button>
      <button class="btn danger" id="c-yes">Confirmar</button>
    </div></div></div>`;
  $("#c-no").onclick=closeModal;
  $("#c-yes").onclick=()=>{ closeModal(); onOk(); };
}
