/* construtor de formulários genérico.
   campos: {key,label,type,required,options,help,dynamic,optionsFn} */
function openForm(cfg){
  const fields=cfg.fields, vals=Object.assign({},cfg.values||{});
  // renderiza <option>s de um select; quando as opções carregam "group",
  // agrupa em <optgroup> (uma optgroup por bloco de opções consecutivas
  // com o mesmo grupo). "marcarSelecionado"=false omite o atributo
  // "selected" (usado ao reconstruir um select dinâmico, cujo valor é
  // reaplicado depois via sel.value).
  function renderOptionsAgrupadas(opts,valorAtual,marcarSelecionado){
    let html="", grupoAberto=null;
    (opts||[]).forEach(o=>{
      const g=o.group||null;
      if(g!==grupoAberto){
        if(grupoAberto!==null) html+="</optgroup>";
        if(g!==null) html+=`<optgroup label="${esc(g)}">`;
        grupoAberto=g;
      }
      const sel=(marcarSelecionado!==false)&&String(valorAtual)===String(o.value)?"selected":"";
      html+=`<option value="${esc(o.value)}" ${sel}>${esc(o.label)}</option>`;
    });
    if(grupoAberto!==null) html+="</optgroup>";
    return html;
  }
  function fieldHtml(f){
    const v=(f.computed&&f.computeFn)?f.computeFn(vals):vals[f.key];
    const req=f.required?'<span class="req"> *</span>':"";
    const dis=(f.disabled||f.computed)?"disabled":"";
    let input="";
    if(f.type==="select"){
      const opts=(f.dynamic?f.optionsFn(vals):f.options)||[];
      input=`<select data-k="${f.key}" ${dis} ${f.dynamic?'data-dyn="1"':""}>
        <option value="">${f.placeholder||"Selecione…"}</option>
        ${renderOptionsAgrupadas(opts,v)}</select>`;
    }else if(f.type==="checklist"){
      // multi-seleção via checkboxes (ex.: vincular um parceiro a vários projetos)
      const opts=(f.dynamic?f.optionsFn(vals):f.options)||[];
      const selecionados=Array.isArray(v)?v.map(String):[];
      input=`<div class="checklist" data-k="${f.key}" style="display:flex;flex-direction:column;gap:2px;
          border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-height:160px;overflow:auto">
        ${opts.length?opts.map(o=>`<label style="display:flex;align-items:center;gap:8px;font-weight:400;
            font-size:13px;padding:3px 0;cursor:pointer">
            <input type="checkbox" value="${esc(o.value)}" ${selecionados.includes(String(o.value))?"checked":""}
              style="width:auto;margin:0"> ${esc(o.label)}
          </label>`).join(""):`<span style="font-size:12.5px;color:var(--ink-faint)">Nenhum projeto cadastrado ainda.</span>`}
      </div>`;
    }else if(f.type==="estimativas"){
      // lista repetível de {colaboradorId,horas} — ex.: horas previstas por pessoa numa atividade.
      // O container leva data-k mas as linhas internas são geridas por wireEstimativasField(),
      // fora do fluxo genérico de collect()/refreshDynamic().
      input=`<div data-k="${f.key}" style="border:1px solid var(--line);border-radius:8px;padding:10px 12px">
        <div class="estim-head" style="display:flex;gap:8px;font-size:11px;color:var(--ink-faint);
          font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:0 0 6px;flex-wrap:wrap">
          <span style="flex:1;min-width:150px">Colaborador</span>
          <span style="width:90px;flex-shrink:0">Prevista</span>
          <span style="width:76px;flex-shrink:0"></span>
          <span style="width:100px;flex-shrink:0" title="Soma das horas lançadas nas anotações de cada colaborador">Executada (soma)</span>
          <span style="width:30px;flex-shrink:0"></span>
        </div>
        <div class="estim-rows"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
          <button type="button" class="btn ghost sm estim-add">+ Adicionar pessoa</button>
          ${f.prefillButton?`<button type="button" class="btn ghost sm estim-prefill">${esc(f.prefillButton.label)}</button>`:""}
        </div>
      </div>`;
    }else if(f.type==="buscaSelect"){
      // campo de busca (autocomplete): digita e filtra por qualquer termo em
      // f.busca (ex.: código OU nome do projeto) — ao clicar num resultado,
      // guarda o value real (ex.: o id do projeto) e mostra o label escolhido.
      // Ver wireBuscaSelectField() logo abaixo, que cuida de toda a interação.
      const opts0=(f.dynamic?f.optionsFn(vals):f.options)||[];
      const atual=opts0.find(o=>String(o.value)===String(v));
      input=`<div class="busca-select" data-k="${f.key}">
        <input type="text" class="bs-input" autocomplete="off" value="${esc(atual?atual.label:"")}"
          placeholder="${esc(f.placeholder||"Digite para buscar…")}">
        <div class="bs-results"></div>
      </div>`;
    }else if(f.type==="textarea"){
      input=`<textarea data-k="${f.key}" ${dis} placeholder="${esc(f.placeholder||"")}">${esc(v||"")}</textarea>`;
    }else if(f.type==="date" && f.allowIndeterminate){
      const indet=(v==null||v==="");
      input=`<input type="date" data-k="${f.key}" ${dis} ${indet?"disabled":""} value="${esc(indet?"":v)}">
        <label style="display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;color:var(--ink-soft);font-weight:400;cursor:pointer">
          <input type="checkbox" data-k-indet="${f.key}" ${indet?"checked":""} style="width:auto;margin:0"> Data indeterminada
        </label>`;
    }else if(f.type==="dateSameAs"){
      // data "real" que pode replicar automaticamente a data "prevista"
      // correspondente (f.sameAsKey) enquanto a caixa "mesmo do previsto"
      // (guardada em vals[f.flagKey]) estiver marcada. Ver wireDateSameAsField().
      const mesmo=!!vals[f.flagKey];
      const val=mesmo?(vals[f.sameAsKey]||""):(v||"");
      input=`<input type="date" data-k="${f.key}" ${mesmo?"disabled":""} value="${esc(val)}">
        <label style="display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;color:var(--ink-soft);font-weight:400;cursor:pointer">
          <input type="checkbox" data-k-sameas="${f.key}" data-sameas-src="${f.sameAsKey}" data-sameas-flag="${f.flagKey}"
            ${mesmo?"checked":""} style="width:auto;margin:0"> ${esc(f.sameAsLabel||"Mesmo do previsto")}
        </label>`;
    }else if(f.type==="checkbox"){
      // campo booleano simples (ex.: marcar uma atividade como marco/entrega).
      input=`<label style="display:flex;align-items:center;gap:8px;font-weight:400;cursor:pointer;min-height:44px">
          <input type="checkbox" data-k="${f.key}" ${dis} ${v?"checked":""} style="width:auto;margin:0">
          ${esc(f.checkboxLabel||"")}
        </label>`;
    }else{
      const t=f.type||"text";
      const extra=t==="number"?`step="${f.step||"any"}" min="${f.min!=null?f.min:""}"`:"";
      input=`<input type="${t}" data-k="${f.key}" ${dis} value="${esc(v==null?"":v)}" placeholder="${esc(f.placeholder||"")}" ${extra}>`;
    }
    return `<div class="fld ${f.full?"full":""}">
      <label>${esc(f.label)}${req}</label>${input}
      ${f.help?`<span class="help">${esc(f.help)}</span>`:""}</div>`;
  }
  const grid=fields.length>1?"two":"";
  $("#modal-root").innerHTML=`
  <div class="overlay"><div class="modal ${cfg.wide?"wide":""}">
    <div class="modal-head"><h3>${esc(cfg.title)}</h3>
      <button class="btn-icon" id="m-x">✕</button></div>
    <div class="modal-body">
      <div class="form-err" id="f-err"></div>
      <div class="form-grid ${grid} ${cfg.buscaEmLinha?"bs-inline":""}" id="f-grid">${fields.map(fieldHtml).join("")}</div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="m-cancel">${cfg.somenteLeitura?"Fechar":"Cancelar"}</button>
      ${cfg.somenteLeitura?"":`<button class="btn" id="m-save">Salvar</button>`}
    </div></div></div>`;
  if(cfg.aviso){
    const av=document.createElement("div");
    av.className="help-banner"; av.style.marginBottom="12px";
    av.innerHTML=`<span>🔒</span><span>${esc(cfg.aviso)}</span>`;
    $("#f-grid").before(av);
  }

  function wireEstimativasField(f){
    const container=()=>$("#f-grid").querySelector(`[data-k="${f.key}"]`);
    // Cada colaborador tem seu quadro de anotações: [{data,horas,nota}]. A
    // "Executada" é sempre a SOMA das horas desse quadro. Horas que já existiam
    // antes deste quadro (sem data) viram uma linha "sem data" editável.
    function normLog(x){
      const log=(Array.isArray(x.horasExecLog)?x.horasExecLog:[]).filter(e=>e)
        .map(e=>({data:e.data||"",horas:(e.horas==null?"":e.horas),nota:e.nota||""}));
      const total=parseFloat(x.horasExecutadas)||0;
      const soma=log.reduce((t,e)=>t+(parseFloat(e.horas)||0),0);
      if(total>soma+0.0001) log.unshift({data:"",horas:Math.round((total-soma)*100)/100,nota:"Horas lançadas antes do quadro de anotações (sem data)"});
      return ordenarLogExecucao(log);
    }
    const somaLog=it=>(it.horasExecLog||[]).reduce((t,e)=>t+(parseFloat(e.horas)||0),0);
    function sincronizarTotal(it){ const t=Math.round(somaLog(it)*100)/100; it.horasExecutadas=t>0?t:""; }
    vals[f.key]=Array.isArray(vals[f.key])?vals[f.key].map(x=>{ const c=Object.assign({},x); c.horasExecLog=normLog(x); return c; }):[];
    // f.somenteColab = id da pessoa logada: só o quadro dela é editável
    // f.podeSeIncluir (Equipe): também edita as próprias horas previstas e pode se incluir
    // f.semExcluirLancamentos: lançamentos já salvos não podem ser removidos (perfis sem exclusão)
    const ehMinhaLinha=item=>!f.somenteColab || String(item.colaboradorId)===String(f.somenteColab);
    function boardHtml(item,idx){
      const log=item.horasExecLog||[];
      const tot=somaLog(item);
      const travado=!ehMinhaLinha(item);
      return `<details class="estim-board" data-idx="${idx}" ${item._open||log.length?"open":""} style="margin:-2px 0 10px 0;padding:6px 10px;background:#f6f8fd;border:1px solid var(--line-soft);border-radius:8px">
        <summary style="cursor:pointer;font-size:12px;font-weight:600;color:var(--ink-soft)">📝 Anotações de progresso <span data-erole="boardinfo">· ${log.length} lançamento(s) · ${fmtNum(tot,1)} h executadas</span></summary>
        <div style="margin-top:8px">
          ${log.length?`<div style="display:flex;gap:6px;font-size:10.5px;color:var(--ink-faint);font-weight:600;text-transform:uppercase;margin-bottom:4px">
            <span style="width:128px;flex-shrink:0">Data</span><span style="flex:1">Anotação</span><span style="width:78px;flex-shrink:0">Horas exec.</span><span style="width:26px;flex-shrink:0"></span></div>`:""}
          ${log.map((e,j)=>`<div class="estim-log" data-j="${j}" style="display:flex;gap:6px;align-items:flex-start;margin-bottom:6px">
            <input type="date" data-lrole="data" value="${esc(e.data||"")}" style="width:128px;flex-shrink:0" ${travado?"disabled":""}
              class="${e._novo&&!e.data?"falta-data":""}" title="${e._novo&&!e.data?"Informe a data em que as horas foram executadas (pode ser retroativa)":"Data do lançamento"}">
            <textarea data-lrole="nota" rows="2" placeholder="O que foi feito, pendências, próximos passos…" style="flex:1;min-width:0;resize:vertical" ${travado?"disabled":""}>${esc(e.nota||"")}</textarea>
            <input type="number" min="0" step="0.5" data-lrole="horas" placeholder="h" value="${e.horas!==""&&e.horas!=null?e.horas:""}" style="width:78px;flex-shrink:0" ${travado?"disabled":""}>
            ${(!travado && (!f.semExcluirLancamentos || e._novo))
              ? `<button type="button" class="btn-icon del" data-lrole="rm" title="Remover lançamento" style="width:26px;flex-shrink:0">✕</button>`
              : `<span style="width:26px;flex-shrink:0"></span>`}
          </div>`).join("")}
          ${travado?"":`<button type="button" class="btn ghost sm" data-erole="addlog">+ Anotação</button>`}
        </div>
      </details>`;
    }
    function rowHtml(item,idx){
      const opts=(f.dynamic?f.optionsFn(vals):f.options)||[];
      const horasExec=item.horasExecutadas!=null&&item.horasExecutadas!==""?item.horasExecutadas:"";
      const soMinhas=!!f.somenteColab, minha=ehMinhaLinha(item);
      const previstaLivre=!soMinhas || (f.podeSeIncluir && minha);
      const removivel=!soMinhas || (f.podeSeIncluir && minha && item._novaLinha);
      return `<div class="estim-row" data-idx="${idx}" style="display:flex;gap:8px;align-items:center;margin-bottom:7px;flex-wrap:wrap">
        <select data-erole="colab" style="flex:1;min-width:150px" ${soMinhas?"disabled":""}>
          <option value="">Selecione o colaborador…</option>
          ${opts.map(o=>`<option value="${esc(o.value)}" ${String(item.colaboradorId||"")===String(o.value)?"selected":""}>${esc(o.label)}</option>`).join("")}
        </select>
        <input type="number" min="0" step="0.5" data-erole="horas" placeholder="Horas" value="${item.horas!=null&&item.horas!==""?item.horas:""}" style="width:90px;flex-shrink:0" title="Horas previstas" ${previstaLivre?"":"disabled"}>
        <button type="button" class="btn ghost sm" data-erole="ok" style="width:76px;flex-shrink:0;justify-content:center;${minha?"":"visibility:hidden"}"
          title="Lança no quadro as horas que faltam para completar as previstas — depois informe a data em que foram executadas" ${minha?"":"disabled"}>✓ OK</button>
        <input type="number" data-erole="horasExec" placeholder="0" value="${horasExec}" readonly tabindex="-1" style="width:100px;flex-shrink:0;background:#f1f4fa" title="Soma das horas lançadas no quadro de anotações abaixo">
        ${removivel?`<button type="button" class="btn-icon del" data-erole="rm" title="Remover">✕</button>`:`<span style="width:30px;flex-shrink:0"></span>`}
      </div>${boardHtml(item,idx)}`;
    }
    function bindRows(){
      const el=container(); if(!el) return;
      el.querySelectorAll(".estim-row").forEach(row=>{
        const idx=+row.dataset.idx;
        const selColab=row.querySelector('[data-erole="colab"]');
        const inpHoras=row.querySelector('[data-erole="horas"]');
        const inpExec=row.querySelector('[data-erole="horasExec"]');
        const btnOk=row.querySelector('[data-erole="ok"]');
        const btnRm=row.querySelector('[data-erole="rm"]');
        selColab.onchange=()=>{ vals[f.key][idx].colaboradorId=selColab.value; };
        const avisar=()=>{ if(cfg.onEstimativasChange) cfg.onEstimativasChange(vals,$("#f-grid")); };
        inpHoras.oninput=()=>{ vals[f.key][idx].horas=inpHoras.value; avisar(); };
        const it=vals[f.key][idx];
        const board=el.querySelector(`.estim-board[data-idx="${idx}"]`);
        const atualizarTotais=()=>{
          sincronizarTotal(it);
          inpExec.value=it.horasExecutadas===""?"":it.horasExecutadas;
          const info=board&&board.querySelector('[data-erole="boardinfo"]');
          if(info) info.textContent=`· ${(it.horasExecLog||[]).length} lançamento(s) · ${fmtNum(somaLog(it),1)} h executadas`;
          avisar();
        };
        if(board){
          board.addEventListener("toggle",()=>{ it._open=board.open; });
          board.querySelectorAll(".estim-log").forEach(lr=>{
            const j=+lr.dataset.j;
            lr.querySelector('[data-lrole="data"]').oninput=ev=>{
              it.horasExecLog[j].data=ev.target.value;
              ev.target.classList.toggle("falta-data", !!it.horasExecLog[j]._novo && !ev.target.value);
              avisar();   // a data pode tornar a atividade "Atrasada" (depois do Término previsto)
            };
            // ao sair do campo de data, reposiciona a anotação na ordem cronológica
            // (só redesenha se a ordem mudou, para não atrapalhar a digitação)
            lr.querySelector('[data-lrole="data"]').onblur=()=>{
              if(!it.horasExecLog[j] || !it.horasExecLog[j].data) return;   // sem data: fica onde está
              const ord=ordenarLogExecucao(it.horasExecLog);
              if(ord.some((e,k)=>e!==it.horasExecLog[k])){ it.horasExecLog=ord; it._open=true; renderRows(); }
            };
            lr.querySelector('[data-lrole="nota"]').oninput=ev=>{ it.horasExecLog[j].nota=ev.target.value; };
            lr.querySelector('[data-lrole="horas"]').oninput=ev=>{ it.horasExecLog[j].horas=ev.target.value; atualizarTotais(); };
            const rmLog=lr.querySelector('[data-lrole="rm"]');
            if(rmLog) rmLog.onclick=()=>{ it.horasExecLog.splice(j,1); it._open=true; sincronizarTotal(it); renderRows(); avisar(); };
          });
          const addLog=board.querySelector('[data-erole="addlog"]');
          if(addLog) addLog.onclick=()=>{
            // a data NÃO é mais preenchida com hoje: o lançamento pode ser retroativo,
            // e uma data automática induzia ao erro. É obrigatória ao salvar.
            it.horasExecLog.push({data:"",horas:"",nota:"",_novo:true}); it._open=true; renderRows();
            const novoIdx=it.horasExecLog.length-1;
            const campo=container().querySelector(`.estim-board[data-idx="${idx}"] .estim-log[data-j="${novoIdx}"] [data-lrole="data"]`); if(campo) campo.focus();
          };
        }
        // "OK": entende que a pessoa cumpriu exatamente as horas previstas —
        // copia o valor de "Horas" (previstas) para "Executada". Se depois o
        // tempo realmente gasto for diferente, basta editar o campo
        // "Executada" manualmente (o OK só preenche, não trava o campo).
        btnOk.onclick=()=>{
          const falta=Math.round(((parseFloat(inpHoras.value)||0)-somaLog(it))*100)/100;
          if(!(falta>0)){ toast(parseFloat(inpHoras.value)>0?"As horas previstas já foram todas lançadas.":"Informe antes as horas previstas."); return; }
          it.horasExecLog.push({data:"",horas:falta,nota:"Conforme previsto",_novo:true});
          it._open=true; sincronizarTotal(it); renderRows(); avisar();
          const novoIdx=it.horasExecLog.length-1;
          const campo=container().querySelector(`.estim-board[data-idx="${idx}"] .estim-log[data-j="${novoIdx}"] [data-lrole="data"]`); if(campo) campo.focus();
          toast("Horas lançadas. Informe a data em que foram executadas.");
        };
        if(btnRm) btnRm.onclick=()=>{ vals[f.key].splice(idx,1); renderRows(); avisar(); };
      });
    }
    function renderRows(){
      const el=container(); if(!el) return;
      const lista=vals[f.key];
      el.querySelector(".estim-rows").innerHTML=lista.length
        ? lista.map(rowHtml).join("")
        : `<div style="font-size:12.5px;color:var(--ink-faint);padding:4px 0 2px">Nenhuma pessoa adicionada ainda.</div>`;
      bindRows();
    }
    const el=container();
    if(el){
      const btnAdd=el.querySelector(".estim-add");
      const estouNaLista=()=>vals[f.key].some(x=>String(x.colaboradorId)===String(f.somenteColab));
      if(f.somenteColab && f.podeSeIncluir){
        // Equipe: o botão inclui só a própria pessoa (e some quando ela já está na lista)
        btnAdd.textContent="+ Me incluir nesta atividade";
        btnAdd.title="Inclui você em Horas previstas — as outras pessoas são incluídas pelo Gestor ou pela Liderança";
        const sincBtn=()=>{ btnAdd.style.display=estouNaLista()?"none":""; };
        const renderAntes=renderRows;
        renderRows=()=>{ renderAntes(); sincBtn(); };
        btnAdd.onclick=()=>{
          if(estouNaLista()) return;
          vals[f.key].push({colaboradorId:f.somenteColab,horas:"",horasExecutadas:"",horasExecLog:[],_novaLinha:true});
          renderRows();
          const novo=container().querySelector(`.estim-row[data-idx="${vals[f.key].length-1}"] [data-erole="horas"]`); if(novo) novo.focus();
        };
      }else if(f.somenteColab){
        btnAdd.style.display="none";
        if(!estouNaLista()){
          btnAdd.insertAdjacentHTML("afterend",`<span class="hint">Você não está em "Horas previstas" desta atividade. Para lançar horas, peça para incluírem você aqui.</span>`);
        }
      }else{
        btnAdd.onclick=()=>{ vals[f.key].push({colaboradorId:"",horas:"",horasExecutadas:"",horasExecLog:[]}); renderRows(); };
      }
      const btnPrefill=el.querySelector(".estim-prefill");
      if(btnPrefill && f.somenteColab) btnPrefill.style.display="none";
      if(btnPrefill && f.prefillButton && !f.somenteColab){
        btnPrefill.onclick=()=>{
          const idsExistentes=new Set(vals[f.key].map(x=>x.colaboradorId).filter(Boolean));
          const novosIds=(f.prefillButton.getIds(vals)||[]).filter(id=>id && !idsExistentes.has(id));
          if(!novosIds.length){ toast(f.prefillButton.msgVazio||"Nada novo para adicionar."); return; }
          novosIds.forEach(id=>vals[f.key].push({colaboradorId:id, horas:"", horasExecutadas:"", horasExecLog:[]}));
          renderRows();
          toast(`${novosIds.length} pessoa(s) adicionada(s). Falta só informar as horas de cada uma.`);
        };
      }
      renderRows();
    }
  }
  fields.forEach(f=>{ if(f.type==="estimativas") wireEstimativasField(f); });

  // campo de busca (autocomplete) — ver o tipo "buscaSelect" em fieldHtml().
  // Guarda o valor de verdade (ex.: o id do projeto) em vals[f.key]; o
  // <input> de texto só existe para digitar/exibir o que a pessoa está
  // procurando (por código ou nome) — por isso ele é tratado à parte em
  // collect() (não tem ".value" equivalente ao id escolhido).
  function wireBuscaSelectField(f){
    const wrap=$("#f-grid").querySelector(`[data-k="${f.key}"]`);
    if(!wrap) return;
    const input=wrap.querySelector(".bs-input");
    const results=wrap.querySelector(".bs-results");
    function opts(){ return (f.dynamic?f.optionsFn(vals):f.options)||[]; }
    function labelDoValor(val){
      const o=opts().find(o=>String(o.value)===String(val));
      return o?o.label:"";
    }
    function normaliza(s){
      return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
    }
    function mostrarResultados(lista){
      results.innerHTML = lista.length
        ? lista.slice(0,30).map(o=>`<div class="bs-item" data-val="${esc(o.value)}">${o.html||esc(o.label)}</div>`).join("")
        : `<div class="bs-empty">Nenhum resultado encontrado.</div>`;
      results.style.display="block";
    }
    function buscar(q){
      const nq=normaliza(q);
      mostrarResultados(!nq ? opts() : opts().filter(o=>normaliza(o.busca||o.label).includes(nq)));
    }
    input.addEventListener("focus",()=>buscar(vals[f.key]?"":input.value));
    input.addEventListener("input",()=>{
      // ao editar o texto, a seleção anterior deixa de valer até escolher
      // de novo um resultado da lista — evita salvar algo que não bate
      // mais com o que está escrito no campo.
      vals[f.key]="";
      buscar(input.value);
    });
    input.addEventListener("blur",()=>{
      // pequeno atraso: sem isso, o "blur" esconderia a lista antes do
      // clique no resultado (mousedown) ser processado.
      setTimeout(()=>{
        results.style.display="none";
        if(!vals[f.key]) input.value="";
      },150);
    });
    results.addEventListener("mousedown",(e)=>{
      const item=e.target.closest(".bs-item");
      if(!item) return;
      e.preventDefault();
      const val=item.dataset.val;
      vals[f.key]=val;
      input.value=labelDoValor(val);
      results.style.display="none";
      refreshDynamic(); recomputeComputed();
      if(cfg.onFieldChange) cfg.onFieldChange(vals, f.key, $("#f-grid"));
    });
  }
  fields.forEach(f=>{ if(f.type==="buscaSelect") wireBuscaSelectField(f); });

  function collect(){
    $("#f-grid").querySelectorAll("[data-k]").forEach(el=>{
      if(el.disabled) return; // não sobrescreve valor de campo bloqueado
      const fdef=fields.find(f=>f.key===el.dataset.k);
      if(fdef && fdef.type==="checklist"){
        // junta os checkboxes marcados dentro do wrapper num array de valores
        vals[el.dataset.k]=[...el.querySelectorAll("input[type=checkbox]:checked")].map(c=>c.value);
        return;
      }
      if(fdef && fdef.type==="estimativas"){
        // vals[el.dataset.k] já é mantido em dia por wireEstimativasField() —
        // não sobrescrever aqui (o container <div> não tem .value).
        return;
      }
      if(fdef && fdef.type==="buscaSelect"){
        // idem: vals[el.dataset.k] já é mantido em dia por wireBuscaSelectField()
        return;
      }
      if(fdef && fdef.type==="checkbox"){
        vals[el.dataset.k]=el.checked;
        return;
      }
      // campos de data vazios devem virar null, nunca "" — o Postgres rejeita
      // string vazia em coluna do tipo date com o erro 22007.
      if(fdef && (fdef.type==="date"||fdef.type==="dateSameAs") && el.value===""){
        vals[el.dataset.k]=null;
      } else {
        vals[el.dataset.k]=el.value;
      }
    });
  }
  function refreshDynamic(){
    fields.forEach(f=>{
      if(f.type==="select"&&f.dynamic){
        const sel=$("#f-grid").querySelector(`[data-k="${f.key}"]`);
        if(!sel) return;
        const cur=sel.value;
        const opts=f.optionsFn(vals)||[];
        sel.innerHTML=`<option value="">${f.placeholder||"Selecione…"}</option>`+
          renderOptionsAgrupadas(opts,null,false);
        if(opts.some(o=>String(o.value)===String(cur))) sel.value=cur;
        else vals[f.key]="";
      }
    });
  }
  // recalcula campos "computed" (ex.: valor total = quantidade × valor unitário)
  // a partir dos valores atuais e reflete no input desabilitado correspondente.
  function recomputeComputed(){
    fields.forEach(f=>{
      if(!(f.computed&&f.computeFn)) return;
      const el=$("#f-grid").querySelector(`[data-k="${f.key}"]`);
      if(!el) return;
      const val=f.computeFn(vals);
      vals[f.key]=val;
      el.value=(val==null||isNaN(val))?"":val;
    });
  }
  // campos "dateSameAs" (ex.: Início/Término real com "mesmo do previsto"):
  // sempre que a caixa estiver marcada, o valor acompanha automaticamente o
  // campo previsto correspondente — inclusive se o previsto for alterado
  // depois de a caixa já estar marcada.
  function syncDateSameAsFields(){
    fields.forEach(f=>{
      if(f.type!=="dateSameAs" || !vals[f.flagKey]) return;
      vals[f.key]=vals[f.sameAsKey]||null;
      const el=$("#f-grid").querySelector(`input[type="date"][data-k="${f.key}"]`);
      if(el) el.value=vals[f.key]||"";
    });
  }
  $("#f-grid").addEventListener("input",()=>{ collect(); recomputeComputed(); });
  $("#f-grid").addEventListener("change",(e)=>{
    collect(); refreshDynamic(); recomputeComputed(); syncDateSameAsFields();
    const key=e.target && e.target.dataset ? e.target.dataset.k : null;
    if(key && cfg.onFieldChange) cfg.onFieldChange(vals, key, $("#f-grid"));
  });
  $("#f-grid").querySelectorAll("[data-k-indet]").forEach(chk=>{
    chk.onchange=()=>{
      const key=chk.dataset.kIndet;
      const dateInput=$("#f-grid").querySelector(`input[type="date"][data-k="${key}"]`);
      if(chk.checked){
        dateInput.value=""; dateInput.disabled=true; vals[key]=null;
      }else{
        dateInput.disabled=false; vals[key]=dateInput.value||null;
      }
    };
  });
  $("#f-grid").querySelectorAll("[data-k-sameas]").forEach(chk=>{
    chk.onchange=()=>{
      const key=chk.dataset.kSameas, srcKey=chk.dataset.sameasSrc, flagKey=chk.dataset.sameasFlag;
      const dateInput=$("#f-grid").querySelector(`input[type="date"][data-k="${key}"]`);
      vals[flagKey]=chk.checked;
      if(chk.checked){
        vals[key]=vals[srcKey]||null;
        dateInput.value=vals[key]||""; dateInput.disabled=true;
      }else{
        dateInput.disabled=false; vals[key]=dateInput.value||null;
      }
    };
  });
  // campos travados (disabled) de qualquer tipo: trava também as caixinhas
  // auxiliares (ex.: "Data indeterminada", listas de seleção)
  fields.forEach(f=>{
    if(!f.disabled || f.type==="estimativas") return;
    const el=$("#f-grid").querySelector(`[data-k="${f.key}"]`);
    const fld=el&&el.closest(".fld");
    if(fld) fld.querySelectorAll("input,select,textarea,button").forEach(x=>{ x.disabled=true; });
  });
  // f.somenteOpcao (lista de pessoas): só a caixinha dessa pessoa pode mudar
  fields.forEach(f=>{
    if(f.type!=="checklist" || f.somenteOpcao==null || f.disabled) return;
    const el=$("#f-grid").querySelector(`[data-k="${f.key}"]`);
    if(el) el.querySelectorAll("input[type=checkbox]").forEach(x=>{
      if(String(x.value)!==String(f.somenteOpcao)){ x.disabled=true; x.closest("label").title="Só o Gestor ou a Liderança altera as outras pessoas"; }
    });
  });
  if(cfg.somenteLeitura){
    $("#f-grid").querySelectorAll("input,select,textarea,button").forEach(x=>{ x.disabled=true; });
  }
  $("#m-x").onclick=closeModal;
  $("#m-cancel").onclick=closeModal;
  if($("#m-save")) $("#m-save").onclick=async()=>{
    collect();
    const faltando=fields.filter(f=>f.required&&!f.disabled&&!f.computed&&!String(vals[f.key]||"").trim());
    if(faltando.length){
      const err=$("#f-err");
      err.textContent="Preencha os campos obrigatórios: "+faltando.map(f=>f.label).join(", ")+".";
      err.style.display="block";
      return;
    }
    const btn=$("#m-save");
    btn.disabled=true; btn.textContent="Salvando...";
    try{
      await cfg.onSave(vals);
      closeModal();
    }catch(e){
      console.error(e);
      const err=$("#f-err");
      err.textContent=(e && e.validacao)?e.message:"Erro ao salvar: "+(e.message||e);
      err.style.display="block";
      err.scrollIntoView({block:"nearest"});
      btn.disabled=false; btn.textContent="Salvar";
    }
  };
}

/* ---- FORM: PROJETO ---- */
function formProjeto(p,sessaoIdDefault){
  const edit=!!p;
  if(edit ? !podeEditarDados() : !podeCriarProjeto(sessaoIdDefault||null)){ avisoSemPermissao(); return; }
  // Liderança cria projetos só nas sessões em que tem acesso
  const sessoesDoForm=(edit||isGestor()) ? SESSOES : SESSOES.filter(s=>sessoesComAcesso().includes(s.id));

  // monta os campos do formulário a partir da sessão atual: campos padrão
  // menos os que essa sessão esconde, mais os campos extras dela.
  function camposParaSessao(sessaoId,valsAtuais){
    const cfg=cfgSessao(sessaoId);
    const ocultos=new Set(cfg.camposOcultosForm||[]);
    // campos extras podem depender de outro campo já preenchido no formulário
    // (ex.: "Local do curso" só faz sentido quando a Modalidade é Presencial/Híbrido)
    const extras=(cfg.camposExtras||[]).filter(f=>!f.showIf || f.showIf(valsAtuais||{}));
    const base=[
      {key:"nome",label:"Nome do projeto",required:true,full:true,placeholder:"Ex.: Implantação do Sistema X"},
      {key:"sessaoId",label:"Sessão",type:"select",required:true,
        options:sessoesDoForm.map(s=>({value:s.id,label:s.label})),
        help:"Área do portfólio onde este projeto vai aparecer no menu."},
      {key:"codigo",label:"Código / Sigla",placeholder:"Ex.: PRJ-2026-01"},
      {key:"cliente",label:"Cliente / Área demandante",placeholder:"Ex.: Diretoria Comercial"},
      {key:"gerente",label:"Gerente responsável",placeholder:"Nome do gestor do projeto"},
      {key:"dataInicio",label:"Data de início",type:"date"},
      cfg.dataFimIndeterminada
        ? {key:"dataFim",label:"Data de término prevista",type:"date",allowIndeterminate:true,
            help:"Marque \"Data indeterminada\" para rotinas sem previsão de término."}
        : {key:"dataFim",label:"Data de término prevista",type:"date"},
      {key:"receita",label:"Receita / Valor do projeto (R$)",type:"number",min:0,
        placeholder:"0,00",help:"Valor total contratado do projeto"},
      {key:"descricao",label:"Descrição / Escopo",type:"textarea",full:true,
        placeholder:"Objetivo e escopo resumido do projeto"}
    ].filter(f=>!ocultos.has(f.key));
    return [...base, ...extras];
  }

  // reabre o formulário com os campos certos sempre que a sessão muda (ou um
  // campo do qual outro depende, ex.: Modalidade), preservando o que já foi
  // digitado nos demais campos.
  function abrir(valsAtuais){
    const fields=camposParaSessao(valsAtuais.sessaoId||null,valsAtuais);
    openForm({
      title:edit?"Editar projeto":"Novo projeto",
      wide:true,
      values:valsAtuais,
      fields,
      onFieldChange:(vv,key)=>{ if(key==="sessaoId"||key==="modalidade") abrir(vv); },
      onSave:async(v)=>{
        v.receita=parseFloat(v.receita)||0;
        // demais campos numéricos do formulário (ex.: valorEdital, cargaHoraria,
        // vagas, publicoEstimado) são opcionais: se vierem vazios ("") o Postgres
        // rejeita com "invalid input syntax for type numeric", então aqui eles
        // viram null (campo vazio) ou Number válido antes de seguir para o Supabase.
        fields.forEach(f=>{
          if(f.type==="number" && f.key!=="receita"){
            v[f.key]=(v[f.key]===""||v[f.key]==null)?null:Number(v[f.key]);
          }
        });
        if(edit){
          // envia só os campos deste formulário — o objeto 'p' em memória também
          // carrega raci/stakeholders/riscos/reunioes, que não são colunas da
          // tabela 'projetos' (ficam em tabelas próprias) e não podem ir no update.
          const payload={};
          fields.forEach(f=>{ payload[f.key]=v[f.key]; });
          // IMPORTANTE: só aplica a mudança no objeto 'p' em memória (usado por
          // TODAS as telas, inclusive o Painel Geral) depois que o servidor
          // confirmar o sucesso. Antes disso, Object.assign(p,v) rodava ANTES do
          // await: se o PATCH falhasse (erro de validação, rede, RLS etc.), a
          // tela atual até parava de refletir a mudança (pois render() nunca
          // era chamado no catch), mas o objeto em memória já tinha sido
          // alterado — daí em diante, qualquer outro re-render (real-time,
          // navegação) mostrava o valor "novo" nunca salvo de fato. E pior:
          // se a pessoa recarregasse a página depois, DB.load() buscava a
          // verdade do servidor — que nunca recebeu a mudança — e o valor
          // antigo/errado voltava a aparecer (ex.: no Painel Geral), dando a
          // impressão de que a correção "sumiu".
          await sbUpdate("projetos", p.id, toSnake(payload));
          Object.assign(p,v);
          toast("Projeto atualizado.");
        } else {
          const novo=Object.assign({id:uid(),stakeholders:[],riscos:[],raci:{}},v);
          const {stakeholders,riscos,raci,...rest}=novo;
          // mesmo motivo do 'edit' acima: só entra na lista em memória (e some
          // do Painel Geral, contagens etc.) depois que o insert for confirmado.
          await sbInsert("projetos", toSnake(rest));
          DB.data.projetos.push(novo);
          // quem cria continua vendo o projeto (o banco já registrou o acesso)
          if(!isGestor() && !ACESSOS.meus.some(a=>a.tipo==="sessao"&&a.valor===novo.sessaoId))
            ACESSOS.meus.push({tipo:"projeto", valor:novo.id, pessoaId:USER.current&&USER.current.colabId});
          ST.view="projeto"; ST.projetoId=novo.id; ST.projTab="resumo";
          toast("Projeto criado.");
        }
        render();
      }
    });
  }
  abrir(p||Object.assign({status:"Planejado",dataInicio:todayStr(),sessaoId:sessaoIdDefault||null},
    sessaoIdDefault==="captacao"?{statusCaptacao:STATUS_CAPTACAO[0]}:{}));
}

/* ---- FORM: ATIVIDADE (removido campo responsavelId) ---- */
/* Perfil Colaborador, numa atividade em que está vinculado: lança as próprias
   horas e anotações, as datas reais, a situação e o % concluído. O resto fica
   travado (o banco também ignora qualquer outra alteração dele).
   Perfil Equipe: edita a atividade, mas não as datas previstas (só ao criar)
   nem as horas das outras pessoas — só se inclui e edita o próprio quadro. */
const CAMPOS_ATIVIDADE_TRAVADOS_COLAB=new Set(["nome","categoriaId","marco","responsaveisIds","predecessorasIds","dataInicioPrev","dataFimPrev"]);
const CAMPOS_ATIVIDADE_PREVISTOS=new Set(["dataInicioPrev","dataFimPrev"]);
function ajustarCamposAtividade(fields,modo,edit){
  const me=USER.current&&USER.current.colabId;
  if(modo==="colaborador"){
    fields.forEach(f=>{
      if(CAMPOS_ATIVIDADE_TRAVADOS_COLAB.has(f.key)) f.disabled=true;
      if(f.key==="status") f.options=(f.options||[]).filter(o=>o.value!=="Cancelada");
      if(f.type==="estimativas"){ f.somenteColab=me; f.prefillButton=null; }
    });
  }
  if(modo==="equipe"){
    fields.forEach(f=>{
      if(edit && CAMPOS_ATIVIDADE_PREVISTOS.has(f.key)){
        f.disabled=true;
        f.help="Definida pelo Gestor ou pela Liderança.";
      }
      if(f.key==="responsaveisIds") f.somenteOpcao=me;
      if(f.type==="estimativas"){ f.somenteColab=me; f.podeSeIncluir=true; f.prefillButton=null; }
    });
  }
  // quem não exclui não remove lançamentos de horas já salvos
  if(!podeExcluirDados()) fields.forEach(f=>{ if(f.type==="estimativas") f.semExcluirLancamentos=true; });
  return fields;
}
function formAtividade(projetoId,a,opts){
  const edit=!!a;
  const modo=editaAtividadeCompleta() ? "total"
    : podeEditarDados() ? "equipe"
    : (edit && ehPerfilColaborador() && usuarioVinculadoAtividade(a)) ? "colaborador" : "leitura";
  if(!edit && modo!=="total" && modo!=="equipe"){ avisoSemPermissao(); return; }
  const meuId=USER.current&&USER.current.colabId;
  // opts.semPredecessoras: usado quando o formulário abre pelo Painel Geral,
  // onde não faz sentido definir "Depende de" (isso fica só no cronograma do
  // projeto). As predecessoras já salvas são preservadas.
  const proj=getProjeto(projetoId);
  const semPred=!!(opts&&opts.semPredecessoras) || (proj&&atividadeSemCampo(proj.sessaoId,"predecessorasIds"));
  const semCat=!!(proj&&atividadeSemCampo(proj.sessaoId,"categoriaId"));
  const semMarco=!!(proj&&atividadeSemCampo(proj.sessaoId,"marco"));
  // sessões sem Matriz RACI (ex.: Rotinas) precisam de um jeito direto de
  // marcar quem é responsável pela atividade, já que não têm a aba RACI
  // para isso. Nessas sessões, o campo abaixo aparece no próprio formulário
  // da atividade e aceita mais de uma pessoa.
  const semRaci = !!(proj && (cfgSessao(proj.sessaoId).abasOcultas||[]).includes("raci"));
  const usaCampoResp = sessaoUsaCampoResponsaveis(proj);
  const campoResponsaveis = {
    key:"responsaveisIds",label:"Responsável(is)",type:"checklist",full:true,dynamic:true,
    optionsFn:()=>[...getInternos(),...getParceirosDoProjeto(proj)]
      .map(co=>({value:co.id,label:co.nome+(co.tipo==="parceiro"?" (parceiro)":"")})),
    help:"Pessoa(s) responsável(is) por esta atividade. É preenchido automaticamente com quem aponta horas nela, e pode ser ajustado aqui a qualquer momento — inclusive marcando mais de uma pessoa."
  };
  // situação "de base" escolhida pela pessoa (ou a gravada); a situação exibida é
  // ela ajustada pelas horas lançadas — ver situacaoPelasHoras(). Assim, se a
  // data de um lançamento for corrigida, a situação automática também volta.
  let situacaoBase=(a&&a.status)||"Não iniciada";
  const aplicarSituacaoPelasHoras=(vv,gridEl)=>{
    const nova=situacaoPelasHoras(Object.assign({},vv,{status:situacaoBase}));
    if(nova===vv.status) return;
    vv.status=nova;
    const sel=gridEl&&gridEl.querySelector('[data-k="status"]'); if(sel) sel.value=nova;
    toast(nova==="Atrasada"?"Situação: Atrasada — há horas lançadas depois do Término previsto."
      :`Situação ajustada para "${nova}" pelas horas lançadas.`);
  };
  openForm({
    title:modo==="leitura"?"Atividade (somente leitura)":edit?"Editar atividade":"Nova atividade",
    wide:true,
    somenteLeitura:modo==="leitura",
    aviso:modo==="colaborador"?"Perfil Colaborador: você pode lançar as suas horas e anotações, as datas reais, a situação e o % concluído. Os demais campos ficam com o Gestor, a Liderança ou a Equipe."
      :modo==="equipe"?(edit?"Perfil Equipe: as datas previstas e as horas das outras pessoas ficam com o Gestor e a Liderança. Você pode se incluir na atividade e lançar as suas horas.":"Perfil Equipe: em “Horas previstas por colaborador” você pode incluir só a si mesmo.")
      :modo==="leitura"?"Você não está vinculado a esta atividade, por isso ela abre só para leitura.":"",
    values:a||{projetoId,status:"Não iniciada",progresso:0,dataInicioPrev:todayStr(),marco:false},
    fields:ajustarCamposAtividade([
      {key:"nome",label:"Nome da atividade",required:true,full:true,placeholder:"Ex.: Levantamento de requisitos"},
      ...(semCat?[]:[{key:"categoriaId",label:"Categoria",type:"select",required:true,
        options:categoriasParaSelect(a&&a.categoriaId)}]),
      ...(semMarco?[]:[{key:"marco",label:"Marco de entrega",type:"checkbox",
        checkboxLabel:"Esta atividade é um marco (deliverable) do projeto",
        help:"Marcos aparecem destacados no cronograma e na linha do tempo."}]),
      ...(usaCampoResp?[campoResponsaveis]:[]),
      ...(semPred?[]:[{key:"predecessorasIds",label:"Depende de (atividades predecessoras)",type:"checklist",full:true,dynamic:true,
        optionsFn:()=>{
          // exclui a própria atividade e quem já depende dela (evita dependência circular)
          const bloqueadas=edit?sucessorasTransitivas(a.id,projetoId):new Set();
          return DB.data.atividades
            .filter(x=>x.projetoId===projetoId && (!edit || (x.id!==a.id && !bloqueadas.has(x.id))))
            .sort((p,q)=>(p.dataInicioPrev||"9999").localeCompare(q.dataInicioPrev||"9999"))
            .map(x=>({value:x.id,label:x.nome}));
        },
        help:"Marque as atividades que precisam terminar/começar antes desta. Quando uma predecessora atrasar, o app sugere deslocar automaticamente as que dependem dela."}]),
      {key:"dataInicioPrev",label:"Início previsto",type:"date",allowIndeterminate:true},
      {key:"dataFimPrev",label:"Término previsto",type:"date",allowIndeterminate:true},
      {key:"dataInicioReal",label:"Início real",type:"dateSameAs",
        sameAsKey:"dataInicioPrev",flagKey:"inicioRealMesmo",sameAsLabel:"Mesmo do previsto",
        help:"Data em que a atividade de fato começou. Marque \"Mesmo do previsto\" para replicar automaticamente o Início previsto."},
      {key:"dataFimReal",label:"Término real",type:"dateSameAs",
        sameAsKey:"dataFimPrev",flagKey:"fimRealMesmo",sameAsLabel:"Mesmo do previsto",
        help:"Data em que a atividade de fato terminou. Marque \"Mesmo do previsto\" para replicar automaticamente o Término previsto."},
      {key:"status",label:"Situação",type:"select",
        options:STATUS_ATIV.map(s=>({value:s,label:s})),
        help:"Marcar como \"Concluída\" preenche automaticamente 100% em % Concluído. Ao lançar horas executadas, passa sozinha para \"Em andamento\"; se alguma hora for lançada com data depois do Término previsto, vira \"Atrasada\"."},
      {key:"progresso",label:"% Concluído",type:"number",min:0,
        help:"Valor de 0 a 100. Preenchido automaticamente pelas horas executadas ÷ previstas (você pode ajustar à mão).",placeholder:"0"},
      ...((a&&a.notasProgresso&&String(a.notasProgresso).trim())?[{key:"notasProgresso",label:"Anotações anteriores (texto único)",type:"textarea",full:true,
        help:"Texto das anotações feitas antes do quadro por colaborador. Apague o que já não precisar; as novas anotações ficam no quadro de cada colaborador, em \"Horas previstas por colaborador\"."}]:[]),
      {key:"estimativasPessoas",label:"Horas previstas por colaborador (estimativa de esforço)",
        type:"estimativas",full:true,dynamic:true,
        optionsFn:()=>[...getInternos(),...getParceirosDoProjeto(getProjeto(projetoId))]
          .map(co=>({value:co.id,label:co.nome+(co.tipo==="parceiro"?" (parceiro)":"")})),
        help:"Escolha cada colaborador (interno ou parceiro vinculado a este projeto) e a quantidade de horas previstas para ele nesta atividade. Usado para calcular a ocupação da equipe no calendário, distribuída ao longo dos dias úteis entre início e término previstos. Em cada colaborador, abra \"Anotações de progresso\" e lance data, anotação e horas executadas: a \"Executada\" é a soma desses lançamentos. O botão \"OK\" lança de uma vez as horas que faltam para completar as previstas. A data de cada lançamento não é preenchida sozinha: informe a data em que as horas foram de fato executadas (pode ser retroativa).",
        prefillButton: (a && !semRaci) ? {
          label:"↺ Puxar quem está em \"R\" na RACI",
          msgVazio:"Ninguém novo marcado como \"R\" na RACI desta atividade (ou já foram todos adicionados aqui).",
          getIds:()=>{
            const proj=getProjeto(projetoId);
            const raciAtiv=(proj&&proj.raci&&proj.raci[a.id])||{};
            return Object.entries(raciAtiv).filter(([,papel])=>papel==="R").map(([pid])=>pid);
          }
        } : null}
    ], modo, edit),
    // % Concluído acompanha as horas: soma executada ÷ soma prevista de todos os
    // colaboradores, atualizada a cada digitação/clique em OK (limitada a 100%).
    // Só calcula quando há horas previstas e ao menos uma executada informada;
    // o campo continua editável à mão (o próximo ajuste de horas recalcula).
    onEstimativasChange:(vv,gridEl)=>{
      const lista=Array.isArray(vv.estimativasPessoas)?vv.estimativasPessoas:[];
      const prev=lista.reduce((t,x)=>t+(parseFloat(x.horas)||0),0);
      const algumaExec=lista.some(x=>x.horasExecutadas!==""&&x.horasExecutadas!=null);
      if(prev>0 && algumaExec){
        const exec=lista.reduce((t,x)=>t+(parseFloat(x.horasExecutadas)||0),0);
        const pct=Math.max(0,Math.min(100,Math.round(exec/prev*100)));
        vv.progresso=pct;
        const inp=gridEl.querySelector('[data-k="progresso"]');
        if(inp) inp.value=pct;
      }
      // horas lançadas → "Em andamento"; lançadas depois do Término previsto → "Atrasada"
      aplicarSituacaoPelasHoras(vv,gridEl);
    },
    onFieldChange:(vv,key,gridEl)=>{
      if(key==="status"){
        situacaoBase=vv.status||"Não iniciada";   // escolha manual da pessoa
        if(vv.status==="Concluída"){
          vv.progresso=100;
          const inp=gridEl.querySelector('[data-k="progresso"]');
          if(inp) inp.value=100;
        }
        return;
      }
      if(key==="dataFimPrev" || key==="progresso") aplicarSituacaoPelasHoras(vv,gridEl);
    },
    onSave:async(v)=>{
      // lançamentos de horas/anotações NOVOS precisam de data (não é mais preenchida
      // automaticamente com hoje, porque o trabalho pode ter sido feito antes)
      const semDataNovos=[];
      (Array.isArray(v.estimativasPessoas)?v.estimativasPessoas:[]).forEach(x=>{
        const n=(Array.isArray(x.horasExecLog)?x.horasExecLog:[])
          .filter(e=>e && e._novo && !e.data && ((parseFloat(e.horas)||0)>0 || String(e.nota||"").trim())).length;
        if(n){ const c=getColab(x.colaboradorId); semDataNovos.push(`${c?c.nome:"colaborador sem nome"} (${n})`); }
      });
      if(semDataNovos.length){
        const eData=new Error("Informe a data de cada lançamento novo nas Anotações de progresso — ela não é mais preenchida automaticamente, "+
          "porque as horas podem ter sido executadas em outro dia. Faltando data: "+semDataNovos.join(", ")+".");
        eData.validacao=true; throw eData;
      }
      // Equipe/Colaborador: a própria linha precisa de horas previstas (sem elas a
      // linha seria descartada ao salvar, junto com os lançamentos)
      if(modo!=="total"){
        const minha=(Array.isArray(v.estimativasPessoas)?v.estimativasPessoas:[]).find(x=>String(x.colaboradorId)===String(meuId));
        if(minha && !(parseFloat(minha.horas)>0)){
          const eH=new Error("Informe as suas horas previstas nesta atividade (maiores que zero)."+
            (edit && (a.estimativasPessoas||[]).some(x=>String(x.colaboradorId)===String(meuId))?" Para sair da atividade, fale com o Gestor ou a Liderança.":""));
          eH.validacao=true; throw eH;
        }
      }
      v.status=situacaoPelasHoras(v);
      // o banco aceita só UM nome de atividade por projeto: avisa antes de tentar gravar
      const nomeNovo=String(v.nome||"").trim();
      const colide=DB.data.atividades.find(x=>x.projetoId===projetoId && (!a||x.id!==a.id) && String(x.nome||"").trim()===nomeNovo);
      if(colide){ const eDup=new Error(`Já existe uma atividade chamada "${nomeNovo}" neste projeto — o banco só aceita um nome por projeto. `+
        `Use um nome diferente (ex.: "${nomeNovo} – 2" ou com a data/rodada) ou edite a atividade que já existe.`); eDup.validacao=true; throw eDup; }
      v.marco=semMarco?!!(a&&a.marco):!!v.marco;
      if(semCat && !v.categoriaId){
        // sem classificação no formulário: usa a categoria "C. Articulação Institucional" (se existir)
        const catC=DB.data.categorias.find(c=>{ const pd=categoriaPadraoDe(c); return pd&&pd.cod==="C"; });
        v.categoriaId=catC?catC.id:null;
      }
      v.inicioRealMesmo=!!v.inicioRealMesmo;
      v.fimRealMesmo=!!v.fimRealMesmo;
      if(v.inicioRealMesmo) v.dataInicioReal=v.dataInicioPrev||null;
      if(v.fimRealMesmo) v.dataFimReal=v.dataFimPrev||null;
      // guarda o Início real ANTES desta edição, para depois decidir se o
      // recálculo em cascata do cronograma deve ser oferecido (só quando o
      // valor é novo/mudou nesta gravação — não a cada simples reabertura).
      const inicioRealAntes=edit?(a.dataInicioReal||null):null;
      v.progresso=Math.max(0,Math.min(100,parseFloat(v.progresso)||0));
      // filtra linhas incompletas e normaliza os números
      v.estimativasPessoas=(Array.isArray(v.estimativasPessoas)?v.estimativasPessoas:[])
        .filter(x=>x.colaboradorId && parseFloat(x.horas)>0)
        .map(x=>({
          colaboradorId:x.colaboradorId, horas:parseFloat(x.horas),
          // horas realmente executadas por esta pessoa (preenchidas pelo botão
          // "OK" — igual à prevista — ou digitadas manualmente quando o tempo
          // gasto foi diferente do previsto). Fica null enquanto não informado.
          // a "Executada" é a soma das horas do quadro de anotações do colaborador
          horasExecutadas:(()=>{ const t=(Array.isArray(x.horasExecLog)?x.horasExecLog:[]).reduce((s2,e)=>s2+(parseFloat(e.horas)||0),0); return t>0?Math.round(t*100)/100:null; })(),
          horasExecLog:ordenarLogExecucao((Array.isArray(x.horasExecLog)?x.horasExecLog:[])
            .map(e=>({data:e.data||"",horas:parseFloat(e.horas)||0,nota:String(e.nota||"").trim()}))
            .filter(e=>e.horas>0 || e.nota))
        }));
      if(usaCampoResp) v.responsaveisIds=Array.isArray(v.responsaveisIds)?v.responsaveisIds:[];
      else delete v.responsaveisIds; // sem o campo no formulário: não mexe no valor antigo
      v.predecessorasIds=Array.isArray(v.predecessorasIds)?v.predecessorasIds:[];
      if(v.status==="Concluída") v.progresso=100;
      else if(v.progresso>=100) v.status="Concluída";
      // REGRA: não deixa concluir sem Início real, Término real e as horas
      // executadas de cada colaborador listado (ver erroConclusaoAtividade).
      if(v.status==="Concluída"){
        const erroConc=erroConclusaoAtividade(v);
        if(erroConc){ const e=new Error(erroConc); e.validacao=true; throw e; }
      }
      // Quando a atividade é marcada como Concluída e o campo "Término
      // previsto" não foi preenchido manualmente neste salvamento, usa como
      // data final a data mais recente entre as horas já apontadas nesta
      // atividade (e não a data de hoje) — é a data em que o trabalho de
      // fato aconteceu. Só serve de fallback: se a pessoa digitou uma data
      // no formulário, essa data é respeitada e não é sobrescrita.
      if(edit && modo==="total" && v.status==="Concluída" && !v.dataFimPrev){
        const datasApontadas=DB.data.horas
          .filter(h=>h.atividadeId===a.id && h.data)
          .map(h=>h.data)
          .sort();
        if(datasApontadas.length) v.dataFimPrev=datasApontadas[datasApontadas.length-1];
      }
      if(edit){
        // se o nome mudou, o "ignorar duplicata" anterior valia para o nome
        // antigo — deixa o alerta livre para reavaliar o nome novo.
        if(a.duplicataIgnorada && v.nome && normTxt(v.nome)!==normTxt(a.nome)) v.duplicataIgnorada=false;
        // CORREÇÃO: mesmo problema já corrigido no formulário de projeto (ver
        // comentário em formProjeto/onSave) — aqui ainda estava faltando.
        // Object.assign(a,v) rodava ANTES do await sbUpdate: se o PATCH
        // falhasse (ex.: ao mudar a situação para "Cancelada" e a gravação
        // falhar por erro de rede/RLS/validação), a tela local já mostrava a
        // atividade cancelada mesmo sem ter sido salva no banco — e no
        // próximo recarregamento (ou re-render por outra origem, ex.
        // realtime) o status antigo voltava, dando a impressão de que a
        // alteração "não salvou" ou "sumiu". Agora só aplica no objeto em
        // memória depois que o servidor confirmar.
        await sbUpdate("atividades", a.id, toSnake(v));
        Object.assign(a,v);
        toast("Atividade atualizada.");
      } else {
        const nova=Object.assign({id:uid(),projetoId},v);
        DB.data.atividades.push(nova);
        await sbInsert("atividades", toSnake(nova));
        toast("Atividade criada.");
      }
      render();
      // Recálculo em cascata do cronograma: só faz sentido em sessões com
      // linha do tempo (Gantt) habilitada, ao editar (não ao criar) e quando
      // o Início real informado é novo/mudou nesta gravação e ficou atrasado
      // em relação ao Início previsto. O modal é aberto com um pequeno atraso
      // (setTimeout) para não ser fechado junto pelo closeModal() deste form.
      if(edit && modo==="total" && v.dataInicioReal && v.dataInicioReal!==inicioRealAntes && v.dataInicioPrev){
        const atrasoDias=daysBetween(v.dataInicioPrev,v.dataInicioReal);
        const temGantt=cfgSessao(proj.sessaoId).linhaDoTempo!==false;
        if(temGantt && atrasoDias>0){
          setTimeout(()=>avaliarRecalculoCronograma(getProjeto(projetoId), a, atrasoDias), 80);
        }
      }
    }
  });
  // atalho para consultar a legenda das categorias sem fechar o formulário
  // (mesmo recurso que existia no antigo Apontamento de Horas, agora vinculado
  // ao campo "Categoria" do registro de atividade no cronograma do projeto)
  const catSelect=document.querySelector('#f-grid [data-k="categoriaId"]');
  if(catSelect){
    const fld=catSelect.closest(".fld");
    if(fld){
      const wrap=document.createElement("div");
      wrap.innerHTML=`<button type="button" id="toggle-legenda-inline" style="margin-top:6px;background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;padding:0;text-align:left">ℹ️ O que significa cada categoria?</button>
        <div id="legenda-inline-box" style="display:none;margin-top:8px;padding:10px 12px;background:var(--bg);border-radius:8px;max-height:220px;overflow-y:auto"></div>`;
      fld.appendChild(wrap);
      const toggleBtn=document.getElementById("toggle-legenda-inline");
      const box=document.getElementById("legenda-inline-box");
      toggleBtn.onclick=(e)=>{
        e.preventDefault();
        const showing=box.style.display!=="none";
        box.style.display=showing?"none":"block";
        if(!showing && !box.innerHTML) box.innerHTML=legendaCategoriasHtml();
      };
    }
  }
}


/* ---- FORM: FINANCEIRO ---- */
function formFinanceiro(projetoId,f){
  const edit=!!f;
  // compatibilidade com lançamentos antigos (só tinham "valor"): assume
  // quantidade 1 e valor unitário = valor total, então o cálculo automático
  // não muda nada do que já estava salvo.
  const initial=f
    ? Object.assign({},f,{
        quantidade: f.quantidade!=null && f.quantidade!=="" ? f.quantidade : 1,
        valorUnitario: f.valorUnitario!=null && f.valorUnitario!=="" ? f.valorUnitario : (+f.valor||0)
      })
    : {projetoId:projetoId||"",tipo:"despesa",status:"previsto",data:todayStr(),quantidade:1,valorUnitario:""};
  openForm({
    title:edit?"Editar lançamento":"Novo lançamento financeiro",
    wide:true,
    values:initial,
    fields:[
      {key:"projetoId",label:"Projeto",type:"select",required:true,
        options:DB.data.projetos.map(p=>({value:p.id,label:rotuloProjetoSelect(p)}))},
      {key:"tipo",label:"Tipo",type:"select",required:true,
        options:[{value:"receita",label:"Receita"},{value:"despesa",label:"Despesa"}]},
      {key:"rubricaId",label:"Rubrica",type:"select",required:true,
        options:DB.data.rubricas.map(r=>({value:r.id,label:r.nome}))},
      {key:"status",label:"Situação",type:"select",required:true,
        options:[{value:"previsto",label:"Previsto (a realizar)"},{value:"realizado",label:"Realizado"}]},
      {key:"data",label:"Data / Vencimento",type:"date",required:true,
        help:"Usada para alertas de prazo financeiro"},
      {key:"quantidade",label:"Quantidade",type:"number",required:true,min:0,step:"any",
        placeholder:"1",help:"Ex.: nº de licenças, diárias, itens…"},
      {key:"valorUnitario",label:"Valor unitário (R$)",type:"number",required:true,min:0,
        placeholder:"0,00"},
      {key:"valor",label:"Valor total (R$)",type:"number",computed:true,
        computeFn:vv=>Math.round(((parseFloat(vv.quantidade)||0)*(parseFloat(vv.valorUnitario)||0))*100)/100,
        help:"Calculado automaticamente: quantidade × valor unitário"},
      {key:"descricao",label:"Descrição",full:true,placeholder:"Ex.: Pagamento fornecedor de licenças"}
    ],
    onSave:async(v)=>{
      v.quantidade=parseFloat(v.quantidade)||0;
      v.valorUnitario=parseFloat(v.valorUnitario)||0;
      v.valor=Math.round(v.quantidade*v.valorUnitario*100)/100;
      // mesmo cuidado do formulário de projeto: só reflete a mudança na
      // memória (usada por Painel Geral, Controle Financeiro etc.) depois
      // que o servidor confirmar — evita reaparecer um valor antigo/errado
      // após um recarregamento se o salvamento tiver falhado.
      if(edit){
        await sbUpdate("financeiro", f.id, toSnake(v));
        Object.assign(f,v);
        toast("Lançamento atualizado.");
      } else {
        const novo=Object.assign({id:uid()},v);
        await sbInsert("financeiro", toSnake(novo));
        DB.data.financeiro.push(novo);
        toast("Lançamento registrado.");
      }
      render();
    }
  });
}

/* ---- FORM: COLABORADOR / PARCEIRO ---- */
function formColab(c){
  const edit=!!c;
  const ehInterno = edit && c.tipo!=="parceiro";
  openForm({
    title:edit?"Editar pessoa":"Novo parceiro externo",
    wide:true,
    values:c||{tipo:"parceiro"},
    fields:[
      {key:"nome",label:"Nome completo",required:true,full:true,
        help: ehInterno?"Corrige o nome exibido no app (a conta de login não muda).":""},
      ...(ehInterno ? [
        {key:"papel",label:"Perfil de acesso",type:"select",required:true,
          options:PERFIS.map(x=>({value:x.id,label:x.label+" — "+x.desc})),
          help:"O que cada perfil enxerga (sessões, projetos e áreas da Operação) é liberado em Configurações › Perfis e acessos."}
      ] : [
        {key:"tipo",label:"Tipo de pessoa",type:"select",required:true,
          options:[{value:"parceiro",label:"Parceiro externo (sem remuneração / sem acesso ao app)"}],
          help:"Para adicionar um colaborador interno (com acesso ao app), peça que ele crie a própria conta na tela de login."},
        {key:"projetosIds",label:"Projeto(s) vinculado(s)",type:"checklist",full:true,
          dynamic:true, optionsFn:()=>DB.data.projetos.map(pr=>({value:pr.id,label:pr.nome})),
          help:"Selecione em quais projetos este parceiro participa. Ele só aparecerá na Matriz RACI dos projetos marcados aqui (pode marcar mais de um)."}
      ]),
      {key:"organizacao",label:"Organização / Empresa",placeholder:"Para parceiros: empresa parceira"},
      {key:"cargo",label:"Cargo / Função",placeholder:"Ex.: Analista de Projetos"},
      {key:"email",label:"E-mail",type:"email",
        help: ehInterno?"E-mail de contato exibido no app (diferente do e-mail de login).":""},
      ...(temArea("financeiro")?[{key:"custoHora",label:"Custo por hora (R$)",type:"number",min:0,
        placeholder:"Opcional — só para internos",help:"Deixe 0 para parceiros. Visível só para quem tem acesso ao Financeiro."}]:[])
    ],
    onSave:async(v)=>{
      v.custoHora=parseFloat(v.custoHora)||0;
      const projetosIds = ehInterno ? undefined : (Array.isArray(v.projetosIds)?v.projetosIds:[]);
      if(edit){
        Object.assign(c,v);
        if(ehInterno){
          // atualiza profile existente (nome, perfil, cargo e e-mail); o custo/hora
          // vai para custos_pessoa (só quem tem Financeiro lê) quando a migração já foi rodada
          await sbUpdate("profiles", c.id, toSnake(Object.assign({
            nome:v.nome, papel:v.papel, cargo:v.cargo, organizacao:v.organizacao, email:v.email||null
          }, CUSTOS.ok===true?{custoHora:0}:{custoHora:v.custoHora})));
          if(CUSTOS.ok===true) await sbUpsert("custos_pessoa",
            {pessoa_id:String(c.id), custo_hora:v.custoHora||0, atualizado_em:new Date().toISOString()}, {onConflict:"pessoa_id"});
        } else {
          c.projetosIds=projetosIds;
          await sbUpdate("profiles", c.id, toSnake({
            nome:v.nome, organizacao:v.organizacao, cargo:v.cargo, email:v.email, custoHora:0,
            projetosIds
          }));
        }
        toast("Atualizado.");
      } else {
        // novo parceiro: não tem login, é só um registro de profile "solto"
        // (sem vínculo com auth.users) -- exige id manual
        const novoId=uid();
        await sbInsert("profiles", toSnake({
          id:novoId, nome:v.nome, tipoPessoa:"parceiro", papel:"colaborador",
          organizacao:v.organizacao, cargo:v.cargo, email:v.email||null, custoHora:0,
          projetosIds
        }));
        toast("Parceiro adicionado.");
      }
      await DB.load(); render();
    }
  });
}

/* ---- FORM: TAG DOS PAINÉIS (MCI · Metas Mensais · MDS) ---- */
function formPainelTag(t){
  const edit=!!t;
  const usadas=new Set(painelTags().map(x=>corPainelTag(x).toLowerCase()));
  const corLivre=PALETTE.find(c=>!usadas.has(c.toLowerCase()))||PALETTE[painelTags().length%PALETTE.length];
  openForm({
    title:edit?"Editar TAG":"Nova TAG dos painéis",
    values:t?{nome:t.nome,cor:corPainelTag(t)}:{cor:corLivre},
    fields:[
      {key:"nome",label:"Nome da TAG",required:true,full:true,placeholder:"Ex.: Captação"},
      {key:"cor",label:"Cor",type:"color",full:true}
    ],
    onSave:async(v)=>{
      const nome=String(v.nome||"").trim();
      if(!nome){ const e=new Error("Informe o nome da TAG."); e.validacao=true; throw e; }
      const repetida=painelTags().find(x=>(!t||x.id!==t.id) && normTxt(x.nome)===normTxt(nome));
      if(repetida){ const e=new Error(`Já existe a TAG "${repetida.nome}".`); e.validacao=true; throw e; }

        toast("TAG atualizada.");

        const nova={id:uid(), nome, cor, ordem:painelTags().reduce((mx,x)=>Math.max(mx,+x.ordem||0),0)+1};
        await sbInsert("painel_tags", toSnake(nova));

/* ---- FORM: STAKEHOLDER (com classificação Primário/Secundário) ---- */
function formStakeholder(p,idx){
  const edit=idx!=null;
  const s=edit?p.stakeholders[idx]:{classificacao:"Secundário"};
  openForm({
    title:edit?"Editar stakeholder":"Novo stakeholder",
    values:s,
    fields:[
      {key:"nome",label:"Nome",required:true,full:true},
      {key:"papel",label:"Papel no projeto",placeholder:"Ex.: Patrocinador, Usuário-chave"},
      {key:"organizacao",label:"Organização / Setor"},
      {key:"influencia",label:"Nível de influência",type:"select",
        options:["Baixa","Média","Alta"].map(x=>({value:x,label:x}))},
      {key:"contato",label:"Contato (e-mail/telefone)",full:true},
      {key:"classificacao",label:"Classificação",type:"select",required:true,
        options:[{value:"Secundário",label:"Secundário"},{value:"Primário",label:"Primário"}]}
    ],
    onSave:async(v)=>{
      // verifica se é Primário e cria parceiro correspondente se não existir
      let colabVinculadoId = s.colaboradorVinculadoId || null;
      if(v.classificacao==="Primário"){
        const nomePessoa=v.nome.trim();
        if(nomePessoa){
          // busca por colaborador/parceiro existente com este nome
          const existente=DB.data.colaboradores.find(c=>
            (c.nome||"").trim().toLowerCase()===nomePessoa.toLowerCase()
          );
          if(!existente){
            // cria um novo parceiro
            const novoId=uid();
            await sbInsert("profiles", toSnake({
              id:novoId, nome:v.nome, tipoPessoa:"parceiro", papel:"colaborador",
              organizacao:v.organizacao||"", cargo:v.papel||"", email:"", custoHora:0
            }));
            colabVinculadoId=novoId;
            // recarrega DB para incluir o novo parceiro
            await DB.load();
            toast(`Parceiro "${v.nome}" criado automaticamente.`);
          } else {
            colabVinculadoId=existente.id;
          }
        }
      } else {
        // reclassificando de Primário para Secundário
        if(s.classificacao==="Primário" && v.classificacao==="Secundário" && s.colaboradorVinculadoId){
          const vinculoAtual=s.colaboradorVinculadoId;
          confirmar(
            "Remover vínculo com parceiro?",
            `Este stakeholder era "Primário" e tinha um parceiro vinculado. Deseja manter o parceiro "${nomeColab(vinculoAtual)}" cadastrado na equipe ou removê-lo?`,
            async(removerParceiro)=>{
              if(removerParceiro){
                // remove o parceiro da lista
                DB.data.colaboradores=DB.data.colaboradores.filter(c=>c.id!==vinculoAtual);
                await sbDelete("profiles", vinculoAtual);
                toast("Parceiro removido.");
              } else {
                toast("Parceiro mantido na equipe.");
              }
              colabVinculadoId=null;
              // recarrega
              await DB.load();
              render();
            },
            "Manter parceiro na equipe (se desmarcar, ele será removido)"
          );
          // Aguarda a confirmação — o fluxo é assíncrono
          return;
        }
      }

      // salva o stakeholder
      if(edit){
        Object.assign(p.stakeholders[idx], v);
        if(colabVinculadoId) p.stakeholders[idx].colaboradorVinculadoId = colabVinculadoId;
        await sbUpdate("stakeholders", s.id, toSnake(v));
      } else {
        const novo=Object.assign({id:uid(),projetoId:p.id}, v);
        if(colabVinculadoId) novo.colaboradorVinculadoId = colabVinculadoId;
        p.stakeholders.push(novo);
        await sbInsert("stakeholders", toSnake(novo));
      }
      toast("Stakeholder salvo."); render();
    }
  });
}
